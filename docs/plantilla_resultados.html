<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estado de resultados</title>

<!--
  ==========================================================================
  PLANTILLA · Estado de resultados                                      v1
  ==========================================================================
  El tablero deja aquí el documento YA RESUELTO, en sessionStorage, antes de
  abrir esta pestaña (armarPayloadResultados() / abrirDocumentoResultados()
  en index.html). Esta plantilla solo FORMATEA Y CONCATENA: los montos y los
  rankings ya vienen calculados, nada se recalcula aquí.

  Mismo criterio que plantilla_ruta_visitas.html: es un documento OPERATIVO
  (para junta interna o reporte a dueños/inversionistas), no uno que se le
  entrega a un cliente — tipografía del sistema, mismo azul de marca.
  ==========================================================================
-->

<style>
  :root{
    --navy:#002369; --ink:#14181D; --muted:#6B7280; --line:#E3E7EF; --bg:#F5F7FB;
    --ok:#1A7A4C; --ok-bg:#E4F5EC; --error:#a5322e; --error-bg:#FBE7E6;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:13px; line-height:1.5;}
  .page{max-width:860px; margin:0 auto; padding:28px 26px 60px;}
  .marca{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .marca .nombre{font-size:19px; font-weight:800; color:var(--navy); letter-spacing:.01em;}
  .marca .sub{font-size:11px; color:var(--muted);}
  h1{font-size:17px; margin:0 0 4px; color:var(--navy);}
  .resumen{font-size:12.5px; color:var(--muted); margin-bottom:22px;}

  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px;}
  .kpi{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:#fff;}
  .kpi .k-label{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .kpi .k-valor{font-size:19px; font-weight:800; color:var(--navy); margin-top:3px;}
  .kpi .k-pie{font-size:11px; color:var(--muted); margin-top:2px;}
  .kpi.neg .k-valor{color:var(--error);}

  .seccion{margin-bottom:24px; page-break-inside:avoid;}
  .seccion-tit{font-size:13.5px; font-weight:700; color:var(--navy); border-bottom:2px solid var(--navy);
    padding-bottom:5px; margin-bottom:10px;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th, td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  td.neg{color:var(--error);}
  .vacio{padding:12px 0; color:var(--muted); font-size:12px; font-style:italic;}
  .pie{margin-top:26px; font-size:9.5px; color:#9AA2B1; text-align:center;}

  .aviso-impresion{position:fixed; top:0; left:0; right:0; z-index:50;
    background:#0E1116; color:#fff; font-size:12.5px; line-height:1.5;
    padding:9px 18px; box-shadow:0 6px 18px rgba(0,0,0,.35);
    display:flex; gap:8px 16px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .aviso-impresion button{font-size:13px; font-weight:700; color:#06281a;
    background:#54C682; border:none; border-radius:8px; padding:7px 16px; cursor:pointer; font-family:inherit;}
  .aviso-impresion button:hover{background:#7EE2A8;}
  .aviso-impresion .pista{color:#9FB3DC;}
  .error-doc{max-width:480px; margin:90px auto; text-align:center; font-size:14px; color:#7a2c28;}

  @media print{
    body{background:#fff; padding-top:0;}
    .page{max-width:none; margin:0;}
    .aviso-impresion{display:none;}
    .seccion{page-break-inside:avoid;}
    @page{size:letter; margin:.6in;}
  }
</style>
</head>
<body>
<div class="aviso-impresion" id="avisoImpresion">
  <button type="button" onclick="window.print()">Guardar como PDF</button>
  <span class="pista">si sale una impresora, cambia el destino a «Guardar como PDF»</span>
</div>
<div id="raiz"></div>

<script>
const LLAVE_DOC = 'forguard.documento.resultados';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pintarError(msg){
  document.getElementById('avisoImpresion').style.display = 'none';
  document.getElementById('raiz').innerHTML = '<div class="error-doc"><b>No se pudo abrir el documento.</b><br>' + esc(msg) + '<br><br>Regresa al tablero e inténtalo de nuevo.</div>';
}

function fechaLarga(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return iso || '';
  const [a,m,d] = iso.split('-').map(Number);
  const fecha = new Date(Date.UTC(a, m-1, d));
  return d + '/' + m + '/' + a;
}

function esNegativo(monto){ return /^-|\(.*\)|-\$/.test(String(monto || '')); }

function tablaRanking(titulo, columnas, filas, celda){
  return '<div class="seccion"><div class="seccion-tit">' + esc(titulo) + '</div>'
    + (filas && filas.length
        ? '<table><thead><tr>' + columnas.map(c => '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.etiqueta) + '</th>').join('') + '</tr></thead>'
          + '<tbody>' + filas.map(f => '<tr>' + columnas.map(c => celda(f, c.campo, c.num)).join('') + '</tr>').join('') + '</tbody></table>'
        : '<div class="vacio">Sin movimientos en este período.</div>')
    + '</div>';
}
function celdaDefault(fila, campo, num){
  const v = fila[campo];
  return '<td class="' + (num ? 'num' : '') + (num && esNegativo(v) ? ' neg' : '') + '">' + esc(v) + '</td>';
}

function render(payload){
  document.title = 'Estado de resultados';
  let h = '<div class="page">'
    +   '<div class="marca"><div class="nombre">FORGUARD</div><div class="sub">Estado de resultados</div></div>'
    +   '<h1>' + esc(fechaLarga(payload.desde)) + ' – ' + esc(fechaLarga(payload.hasta)) + '</h1>'
    +   '<div class="resumen">Cruce de Forpass, pólizas y cotizaciones aprobadas</div>'

    +   '<div class="kpis">'
    +     '<div class="kpi"><div class="k-label">Ingresos totales</div><div class="k-valor">' + esc(payload.ingresoTotal) + '</div></div>'
    +     '<div class="kpi"><div class="k-label">Costo capturado</div><div class="k-valor">' + esc(payload.costoTotal) + '</div></div>'
    +     '<div class="kpi' + (esNegativo(payload.utilidadBruta) ? ' neg' : '') + '"><div class="k-label">Utilidad bruta</div>'
    +       '<div class="k-valor">' + esc(payload.utilidadBruta) + '</div><div class="k-pie">' + esc(payload.margenPct) + '% de margen</div></div>'
    +   '</div>'

    +   tablaRanking('Ranking de clientes',
          [{etiqueta:'Cliente', campo:'nombre'}, {etiqueta:'Ingreso', campo:'ingreso', num:true},
           {etiqueta:'Costo', campo:'costo', num:true}, {etiqueta:'Utilidad', campo:'utilidad', num:true}],
          payload.rankingClientes, celdaDefault)

    +   tablaRanking('Ranking de sitios',
          [{etiqueta:'Sitio', campo:'nombre'}, {etiqueta:'Cliente', campo:'clienteNombre'},
           {etiqueta:'Ingreso', campo:'ingreso', num:true}, {etiqueta:'Costo', campo:'costo', num:true}, {etiqueta:'Utilidad', campo:'utilidad', num:true}],
          payload.rankingSitios, celdaDefault)

    +   tablaRanking('Técnicos por reportes resueltos',
          [{etiqueta:'Técnico', campo:'nombre'}, {etiqueta:'Reportes resueltos', campo:'resueltos', num:true}],
          payload.rankingTecnicos, celdaDefault)

    +   '<div class="pie">Generado el ' + esc(new Date(payload.generado || Date.now()).toLocaleString('es-MX')) + '</div>'
    + '</div>';
  document.getElementById('raiz').innerHTML = h;
}

try{
  const crudo = sessionStorage.getItem(LLAVE_DOC);
  if(!crudo) throw new Error('No hay ningún documento preparado. Ábrelo desde el botón "PDF" en Resultados.');
  const payload = JSON.parse(crudo);
  render(payload);
}catch(e){
  pintarError(e && e.message ? e.message : 'Error inesperado leyendo el documento.');
}
</script>
</body>
</html>
