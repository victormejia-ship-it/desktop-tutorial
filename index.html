               signoDescuento: c.esAumento ? '+' : '−',
               descuento: c.descuento ? c.descuentoAbs + '%' : '',
               montoDescuento: c.descuento ? dineroCent(c.montoDescuentoAbs) : '',
               crudo:   { anual: c.precioAnual, mensual: c.precioMensual,
                          subtotal: c.base, descuento: c.descuento,
                          montoDescuento: c.montoDescuentoAbs } },

    /* Lo que el vendedor/analyst haya anotado en "Notas" del formulario de la
       póliza (condiciones, accesos, contacto en sitio…). Se imprime como su
       propia sección en Consideraciones Relevantes — ver pageConsideraciones()
       en la plantilla — para que no se quede solo en el tablero. */
    notas: (p.notas || '').trim(),

    pie: { iva: 'Precio más Iva.', tagline: 'Sostenemos a los que sostienen todo.' }
  };
}

/* Abre el documento en pestaña nueva con los datos en sessionStorage.

   SIN 'noopener'. No es descuido y no se debe "arreglar": con noopener la pestaña
   nueva estrena un contexto y NO HEREDA el sessionStorage, así que llegaría vacía
   y la plantilla pintaría «Sin datos». El riesgo que noopener mitiga —que la
   pestaña abierta manipule a la que la abrió— aquí no aplica: el destino es un
   archivo nuestro, del mismo origen. */
const LLAVE_DOC_POLIZA = 'forguard.documento.poliza';

function abrirDocumentoPoliza(id){
  const p = polizaPorId(id);
  if(!p) return;
  let payload;
  try{
    payload = armarPayloadPoliza(p);
    sessionStorage.setItem(LLAVE_DOC_POLIZA, JSON.stringify(payload));
  }catch(e){
    aviso('No se pudo preparar el documento: ' + (e && e.message ? e.message : 'error'), true);
    return;
  }
  /* Ruta relativa: la plantilla vive junto al index.html en docs/ de Pages.
     Con ?v= del momento, SIEMPRE fresca. GitHub Pages manda
     `cache-control: max-age=600` en la plantilla, y como se abre en pestaña
     nueva el refresco forzado del tablero no la alcanza: el navegador seguía
     sirviendo la copia vieja: se arreglaba un defecto del documento, se
     desplegaba, y el papel salía igual de roto durante diez minutos. Pesa 78 KB
     y se abre de vez en cuando — volver a bajarla no le cuesta nada a nadie, y
     un documento que va al cliente no se imprime de una copia rancia. */
  const w = window.open('docs/plantilla_poliza_forguard.html?v=' + Date.now(), '_blank');
  if(!w) aviso('El navegador bloqueó la pestaña. Permite las ventanas emergentes de este sitio.', true);
  return payload;
}

/* --------------------- Documento imprimible de cotización ---------------------
   UNA sola plantilla para las dos caras (costo/cliente): el payload lleva
   `lado` y ella decide título y columnas. Es más chico que mantener dos
   archivos casi iguales, y evita que se desalineen entre sí. */
/* Antes decía "Plato Express" con la dirección de la Hoja de datos original.
   Cambiado el 21-ago-2026 a pedido de Victor: el documento impreso de
   Cotizaciones debe verse como el de Pólizas —logo, tipografía, colores y
   pie de Forguard—, no con una identidad propia. Mismos datos de contacto
   que ya usa el módulo de pólizas (TEL_OFICINA/OFICINAS, arriba). */

function armarPayloadCotizacion(q, lado){
  const c = calcularCotizacion(q);
  const s = sitioPorId(q.sitioId);
  const cli = clientePorId(q.clienteId);
  const l = lado === 'cliente' ? 'cliente' : 'costo';

  return {
    meta: { generado: new Date().toISOString(), origen: 'control-forpass', version: 1 },
    lado: l,
    /* Mismo contacto que imprime la póliza: una oficina, un teléfono. El
       correo es el de quien está en sesión —si hay— porque la cotización no
       captura uno propio, a diferencia del vendedor de una póliza. */
    contacto: { telOficina: TEL_OFICINA, oficinas: OFICINAS.slice(), correo: (sesion && sesion.correo) || '' },
    folio: q.folio || '',
    fecha: fechaDocumento(q.fecha),
    realizo: q.realizo || '',
    departamento: q.departamento || '',
    comedor: s ? s.nombre : '',
    cliente: cli ? cli.nombre : '',
    zona: s ? s.zona : '',
    tipoMtto: q.tipoMtto || '',
    cargoA: q.cargoA === 'comedor' ? 'Comedor' : 'Cliente',
    solicitud: q.solicitud || '',
    vigenciaDias: q.vigenciaDias,
    fechaVence: fechaDocumento(c.fechaVence),
    noReporte: q.noReporte || 'NA',
    fechaReporte: q.fechaReporte ? fechaDocumento(q.fechaReporte) : 'NA',
    ordenCompra: q.ordenCompra || '',
    tipoPago: q.tipoPago || '',
    tiempoEntrega: q.tiempoEntrega || '',
    notas: q.notas || '',
    renglones: c.filas.map(x => ({
      numPart: x.numPart,
      seccion: x.seccion || '',
      cantidad: numero(x.cantidad),
      um: x.um || '',
      concepto: x.concepto,
      precio: dineroCent(l === 'costo' ? x.precioCosto : x.precioCliente),
      importe: dineroCent(l === 'costo' ? x.importeCosto : x.importeCliente)
    })),
    instalacion: c.incluyeInstalacion ? {
      numPart: c.instalacionNumPart,
      importe: dineroCent(l === 'costo' ? c.instalacionCosto : c.instalacionCliente)
    } : null,
    totales: {
      subtotal: dineroCent(l === 'costo' ? c.subtotalCosto : c.subtotalCliente),
      iva: dineroCent(l === 'costo' ? c.ivaCosto : c.ivaCliente),
      total: dineroCent(l === 'costo' ? c.totalCosto : c.totalCliente)
    }
  };
}

const LLAVE_DOC_COTIZACION = 'forguard.documento.cotizacion';

/* Mismo molde que abrirDocumentoPoliza(): SIN 'noopener' (la pestaña nueva
   necesita heredar el sessionStorage) y con ?v=Date.now() para que Pages
   nunca sirva una copia vieja de la plantilla. */
/* Deja el documento listo en sessionStorage para que la plantilla lo lea,
   sea que la vaya a abrir en pestaña nueva o dentro de un iframe de vista
   previa — un solo lugar que arma el payload y avisa si algo salió mal. */
function prepararDocumentoCotizacion(id, lado){
  const q = cotizacionPorId(id);
  if(!q) return null;
  try{
    const payload = armarPayloadCotizacion(q, lado);
    sessionStorage.setItem(LLAVE_DOC_COTIZACION, JSON.stringify(payload));
    return payload;
  }catch(e){
    aviso('No se pudo preparar el documento: ' + (e && e.message ? e.message : 'error'), true);
    return null;
  }
}

function abrirDocumentoCotizacion(id, lado){
  if(!prepararDocumentoCotizacion(id, lado)) return;
  const w = window.open('docs/plantilla_cotizacion.html?v=' + Date.now(), '_blank');
  if(!w) aviso('El navegador bloqueó la pestaña. Permite las ventanas emergentes de este sitio.', true);
}

/* Vista previa SIN pestaña nueva: el mismo documento, dentro de un iframe en
   un modal. Sirve donde el navegador bloquea ventanas emergentes —o donde,
   como en un artifact, no hay una segunda página que abrir— y de paso deja
   ver el documento sin perder de vista el tablero. El botón "Guardar como
   PDF" de la propia plantilla sigue funcionando adentro: window.print()
   desde dentro de un iframe imprime SOLO ese iframe. */
function modalPreviaCotizacion(id, lado){
  if(!prepararDocumentoCotizacion(id, lado)) return;
  const cuerpo = '<iframe class="iframe-previa" src="docs/plantilla_cotizacion.html?v=' + Date.now() + '" title="Vista previa del documento"></iframe>';
  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>';
  abrirModal('Vista previa · ' + (lado === 'cliente' ? 'Cotización cliente' : 'Costo interno'), cuerpo, pie);
  $('modal').classList.add('doc-previa');
}

/* -------------------- Documento imprimible de un levantamiento --------------------
   Mismo criterio que armarPayloadPoliza()/armarPayloadCotizacion(): esta función
   entrega TODO ya resuelto (el % de calcularFuncionamientoLevantamiento(), las
   etiquetas de cada catálogo) — la plantilla solo formatea y concatena. Las
   fotos de evidencia viajan como dataURL tal cual (ya vienen comprimidas a
   ~90 KB cada una desde el propio módulo), así que un levantamiento con muchos
   hallazgos con foto puede pesar varios MB en sessionStorage; es el mismo
   límite que ya acepta el resto del tablero para evidencia embebida. */
function armarPayloadLevantamiento(l){
  const cli = clientePorId(l.clienteId);
  const an = calcularFuncionamientoLevantamiento(l);
  return {
    meta: { generado: new Date().toISOString(), origen: 'control-forpass', version: 1 },
    contacto: { telOficina: TEL_OFICINA, oficinas: OFICINAS.slice(), correo: (sesion && sesion.correo) || '' },
    folio: l.folio || '',
    fecha: fechaDocumento(l.fecha),
    cliente: cli ? cli.nombre : '',
    sitio: l.sitioNombre || '',
    realizo: l.realizoNombre || '',
    notasGenerales: l.notasGenerales || '',
    analisis: an ? {
      pct: an.pct,
      equipos: an.equipos.map(eq => ({
        nombre: eq.nombre,
        pesoEtiqueta: ETIQUETA_PONDERACION[eq.peso],
        puntosPosibles: eq.puntosPosibles,
        puntosActuales: eq.puntosActuales,
        puntosFaltan: eq.puntosFaltan,
        severidadTexto: eq.severidadTexto,
        severidadTono: eq.severidadTono
      })),
      sinEquipo: l.hallazgos.filter(h => !h.equipoCatalogoId && !h.equipoNombre).length
    } : null,
    hallazgos: l.hallazgos.map(h => ({
      ubicacion: h.ubicacion || '',
      equipoNombre: h.equipoNombre || '',
      hallazgo: h.hallazgo,
      accionEtiqueta: ETIQUETA_ACCION_HALLAZGO[h.accion],
      prioridadEtiqueta: ETIQUETA_PRIORIDAD[h.prioridad],
      esCorrectivo: h.accion === 'correctivo',
      estatusEtiqueta: ETIQUETA_ESTATUS_HALLAZGO[h.estatus],
      resuelto: h.estatus === 'resuelto',
      accionSugerida: h.accionSugerida || '',
      resueltoNota: h.resueltoNota || '',
      cotizar: h.cotizar || '',
      evidencias: h.evidencias.map(e => e.dataUrl)
    }))
  };
}

/* Documento de un proyecto de Imagen/Aperturas: mismo criterio exacto que
   armarPayloadLevantamiento() — solo strings ya formateados, ninguna cuenta
   se hace en la plantilla. */
function armarPayloadProyectoImagen(p){
  const desglose = desgloseConceptosProyecto(p);
  const total = desglose.total;
  return {
    meta: { generado: new Date().toISOString(), origen: 'control-forpass', version: 1 },

    folio: p.folio || '',
    fecha: fechaDocumento(p.fecha),
    cliente: p.clienteNombre || 'Prospecto',
    sitio: p.sitioNombre || '',
    nombreProyecto: p.nombreProyecto || '',
    tipoEtiqueta: ETIQUETA_TIPO_PROYECTO_IMAGEN[p.tipo],
    estatusEtiqueta: ETIQUETA_ESTATUS_PROYECTO_IMAGEN[p.estatus],
    estatusTono: TONO_ESTATUS_PROYECTO_IMAGEN[p.estatus],
    fechaObjetivo: p.fechaObjetivo ? fechaDocumento(p.fechaObjetivo) : '',
    fechaEntrada: p.fechaEntrada ? fechaDocumento(p.fechaEntrada) : '',
    fechaSalida: p.fechaSalida ? fechaDocumento(p.fechaSalida) : '',
    duracionDias: (p.fechaEntrada && p.fechaSalida) ? (diasEntre(p.fechaEntrada, p.fechaSalida) + 1) : null,
    responsable: p.responsable || '',
    notas: p.notas || '',
    conceptos: p.conceptos.map(c => ({
      proveedor: c.proveedor || '',
      concepto: c.concepto,
      cantidad: numero(c.cantidad),
      precioUnitario: dineroCent(c.precioUnitario),
      subtotal: dineroCent(c.cantidad * c.precioUnitario),
      esManoDeObra: esConceptoManoDeObra(c)
    })),
    totalConceptos: dineroCent(total),
    /* Informativo para el estado de resultados: gasto en un rubro aparte,
       nunca resta de la utilidad — ver calcularResultados(). */
    costoMateriales: dineroCent(desglose.materiales),
    costoManoObra: dineroCent(desglose.manoObra),
    imagenes: p.imagenes.map(im => ({
      dataUrl: im.dataUrl,

      nombre: im.nombre || '',
      nota: im.nota || '',
      tipoEtiqueta: ETIQUETA_TIPO_IMAGEN_PROYECTO[im.tipo],
      tipoTono: im.tipo === 'plano' ? 'alerta' : im.tipo === 'foto' ? 'ok' : 'info'
    }))
  };
}

/* Gemelos de sitiosDe() / sitioPorId(): join en memoria, sin consulta. */
function polizasDe(clienteId){ return datos.polizas.filter(p => p.clienteId === clienteId); }
function polizaPorId(id){ return datos.polizas.find(p => p.id === id); }

/* =============================== VISTAS =============================== */
/* "modulo" decide QUÉ producto se está viendo; "vista" decide en qué pantalla de
   ese producto se está. Son dos ejes distintos a propósito: el panel de admin es
   de la app entera y vive fuera de los dos módulos. */
const estado = { modulo:'forpass', vista:'clientes', clienteId:null, polizaId:null, cotizacionId:null, reporteId:null,
                 levantamientoId:null, proyectoImagenId:null,
                 ladoCotizacion:'costo',
                 periodoResultados:'mes', resultadosDesde:'', resultadosHasta:'',
                 /* Qué fuentes de ingreso están "apagadas" en las gráficas de
                    Resultados (clic en su leyenda) — es una preferencia de
                    pantalla, no dato, así que no se sube a la nube. */
                 fuentesOcultasResultados:[],
                 busca:'', filtro:'todos', sitioFiltro:'', encargadoFiltro:'',
                 /* Cómo se ve cada lista: en tarjetas (el default de siempre) o en
                    tabla, más compacta para revisar muchas de un vistazo. Es
                    preferencia de pantalla, no dato — por eso vive aquí y no en
                    `datos`, y se reinicia como `busca` o `filtro`. Cada módulo
                    guarda la suya para que cambiar una no cambie las otras. */
                 vistaForpass:'tarjetas', vistaPolizas:'tarjetas', vistaCotizaciones:'tarjetas', vistaReportes:'tarjetas',
                 vistaLevantamientos:'tarjetas', vistaProyectosImagen:'tarjetas',
                 /* Cuántos meses adelante enseña la agenda. Hace falta un tope:
                    MXGT01 sola son ~108 servicios al año, y cinco pólizas activas
                    llenarían la pantalla de trabajo que no es de ahora. */
                 horizonte:2 };

/* Se recuerda el último módulo para abrir donde te quedaste. Es preferencia de
   pantalla, no información: va en localStorage y no viaja al servidor. */
const LLAVE_MODULO = 'forguard_forpass_modulo_v1';
const MODULOS = ['resultados', 'clientes', 'forpass', 'reportes', 'levantamientos', 'polizas', 'cotizaciones', 'imagen'];
function cargarModulo(){
  try{
    const m = localStorage.getItem(LLAVE_MODULO);
    if(MODULOS.includes(m)) estado.modulo = m;
  }catch(e){}
  estado.vista = inicioDelModulo();
}
function guardarModulo(){ try{ localStorage.setItem(LLAVE_MODULO, estado.modulo); }catch(e){} }

/* Qué pestañas ve cada quien. `reportero` sigue acotado a Reportes y
   Levantamientos (ver ROLES): a alguien que nada más levanta tickets o hace
   recorridos de sitio no le hace falta ver nada más. `tecnico` además de eso
   puede VER Pólizas y Cotizaciones —le sirve saber qué equipos cubre una
   póliza o qué se cotizó en un sitio—, pero solo para consultar:
   puedeEditar() no incluye a `tecnico`, así que esos dos módulos se le siguen
   abriendo en modo lectura, igual que a un Viewer. Levantamientos es distinto
   a propósito: es "para todos los perfiles" (owner/admin/analyst/viewer/
   tecnico/reportero, y el modo local), no solo consulta — ver
   puedeGestionarLevantamiento() más abajo, que es igual de abierta. El resto
   de los módulos sigue viendo todo, como siempre. */
function modulosPermitidos(){
  if(HAY_NUBE && haySesion() && sesion.rol === 'reportero') return ['reportes', 'levantamientos'];
  if(HAY_NUBE && haySesion() && sesion.rol === 'tecnico') return ['reportes', 'levantamientos', 'polizas', 'cotizaciones'];
  /* Imagen/Aperturas, al revés de Levantamientos: cerrado a quien no puede
     editar precios (ver el comentario arriba de normalizarProyectoImagen())
     — un Viewer sigue viendo Pólizas de solo lectura, pero este módulo ni
     se le enseña. */
  return puedeEditar() ? MODULOS : MODULOS.filter(m => m !== 'imagen');
}

/* La pantalla de arranque de cada módulo. Una sola función para que el logo, el
   selector y el arranque no se desincronicen. */
function inicioDelModulo(){
  return estado.modulo === 'polizas' ? 'polizas'
       : estado.modulo === 'cotizaciones' ? 'cotizaciones'
       : estado.modulo === 'reportes' ? 'reportes'
       : estado.modulo === 'levantamientos' ? 'levantamientos'
       : estado.modulo === 'imagen' ? 'imagen'
       : estado.modulo === 'clientes' ? 'resumen'
       : estado.modulo === 'resultados' ? 'resultados'
       : 'clientes';
}

/* Salto de la póliza a su kiosco en Forpass, y de regreso. Es la única razón
   por la que los dos módulos comparten la colección de clientes: cuando la misma
   dirección tiene kiosco Y póliza, poder verlas juntas. Antes `sitioId` solo
   pintaba un «(con kiosco Forpass)» en gris — un selector completo a cambio de un
   paréntesis— y ahora es el puente.

   Se arma a mano en vez de reusar irAModulo(): esa función limpia clienteId y
   sitioFiltro para no arrastrar filtros entre módulos, que es justo lo que aquí
   hace falta conservar. UN solo render, como manda la casa. */
function irAlSitioDeForpass(sitioId){
  const s = sitioPorId(sitioId);
  if(!s){ aviso('Ese kiosco ya no existe en Forpass.', true); return; }
  estado.modulo = 'forpass';
  guardarModulo();
  estado.vista = 'cliente';
  estado.clienteId = s.clienteId;
  estado.polizaId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = sitioId;          /* se abre en SU kiosco, no en toda la lista */
  estado.encargadoFiltro = '';
  animarTarjetas = true;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
  aviso('Este es el kiosco Forpass de ' + s.nombre + '. Su póliza está en el otro módulo.');
}

/* El camino de regreso: del kiosco a la póliza que lo cubre. */
function irALaPolizaDelSitio(sitioId){
  const pol = datos.polizas.find(q => q.sitioId === sitioId);
  if(!pol){ aviso('Ese kiosco no tiene póliza de mantenimiento ligada.', true); return; }
  estado.modulo = 'polizas';
  guardarModulo();
  estado.clienteId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = ''; estado.encargadoFiltro = '';
  entrarPoliza(pol.id);
}

function irAModulo(m){
  if(!MODULOS.includes(m) || m === estado.modulo) return;   /* clic en la que ya está: nada */
  estado.modulo = m;
  guardarModulo();
  /* Se limpia lo del módulo anterior: una búsqueda de sitios no tiene por qué
     seguir filtrando pólizas. */
  estado.vista = inicioDelModulo();
  estado.clienteId = null; estado.polizaId = null; estado.cotizacionId = null; estado.reporteId = null; estado.levantamientoId = null; estado.proyectoImagenId = null;
  estado.busca = ''; estado.filtro = 'todos';
  estado.sitioFiltro = ''; estado.encargadoFiltro = '';
  animarTarjetas = true;      /* lista nueva: sí anima */
  render();                   /* UN render, no dos */
  window.scrollTo({ top:0, behavior:'smooth' });
}

function irACotizaciones(){
  animarTarjetas = true;
  estado.vista = 'cotizaciones';
  estado.cotizacionId = null;
  estado.busca = '';
  render();
}
/* Scroll de la lista de cotizaciones justo antes de entrar al detalle de una,
   para que "Regresar a cotizaciones" pueda dejar la pantalla donde estaba en
   vez de saltar arriba del todo. */
let scrollPrevioCotizaciones = 0;
/* El botón "← Regresar a cotizaciones" del detalle: a diferencia de
   irACotizaciones() (que es un salto "a inicio" y por eso limpia búsqueda y
   filtro), este solo tiene que deshacer el paso de entrar al detalle, así
   que conserva la búsqueda/filtro que ya estaban activos y repone el scroll. */
function regresarACotizaciones(){
  animarTarjetas = false;
  estado.vista = 'cotizaciones';
  estado.cotizacionId = null;
  render();
  window.scrollTo({ top: scrollPrevioCotizaciones || 0 });
}
/* Salta al módulo Cotizaciones ya filtrado por el nombre de un cliente o un
   sitio — así se pueden consultar sus cotizaciones desde la ficha de
   Forpass, en vez de tener que ir a buscarlas aparte. Reaprovecha el mismo
   buscador de texto de vistaCotizaciones(), que ya compara contra folio,
   sitio y cliente. */
function verCotizacionesDe(texto){
  if(estado.modulo !== 'cotizaciones'){ estado.modulo = 'cotizaciones'; guardarModulo(); }
  estado.vista = 'cotizaciones';
  estado.cotizacionId = null;
  estado.filtro = 'todos';
  estado.busca = texto || '';
  animarTarjetas = true;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function entrarCotizacion(id){
  /* Sin esto, el puente "Ver cotización →" desde un reporte se quedaba en
     el módulo Reportes: cambiaba `vista` y `cotizacionId`, pero como
     `modulo` seguía en 'reportes', render() dibujaba la lista de reportes
     en vez de la cotización. */
  if(estado.modulo !== 'cotizaciones'){ estado.modulo = 'cotizaciones'; guardarModulo(); }
  if(estado.vista === 'cotizaciones') scrollPrevioCotizaciones = window.scrollY;
  animarTarjetas = true;
  estado.vista = 'cotizacion'; estado.cotizacionId = id;
  estado.ladoCotizacion = 'costo';
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* Botón para volver a la lista de clientes, arriba de cada vista interna. */
function botonRegresar(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-clientes">'

function iniciales(nombre){
  const p = String(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '—';
  return (p.length === 1 ? p[0].slice(0,2) : p[0][0] + p[1][0]).toUpperCase();
}

function tarjetaKpi(label, valor, pie, clase, accion){
  const cuerpo = '<div class="k-label">' + esc(label) + '</div>'
               + '<div class="k-valor">' + valor + '</div>'
               + (pie ? '<div class="k-pie">' + esc(pie) + '</div>' : '');
  /* Algunos indicadores se pueden abrir para ver el detalle. */
  return accion
    ? '<button type="button" class="kpi kpi-clic ' + (clase||'') + '" data-accion="' + esc(accion) + '">'
      + cuerpo + '<span class="k-mas">Ver cuáles →</span></button>'
    : '<div class="kpi ' + (clase||'') + '">' + cuerpo + '</div>';
}

function resumenGeneralCliente(c){
  const sitios = sitiosDe(c.id);
  const pol = polizasDe(c.id);
  const cot = datos.cotizaciones.filter(q => q.clienteId === c.id);
  const rep = reportesDeCliente(c.id);
  return { sitios, pol, cot, rep, rSitios:resumir(sitios), rPol:resumirPolizas(pol), rCot:resumirCotizaciones(cot), rRep:resumirReportes(rep) };

/* ==================== Módulo Resultados: estado de resultados ejecutivo ====================
   Cruce de dinero de los tres módulos, por periodo. Nada de esto se CAPTURA
   aquí ni se guarda: son puras lecturas de lo que ya existe, igual que el
   resumen por cliente. El "ingreso" de una cotización es la que ya se
   aprobó (el cliente la autorizó) fechada dentro del periodo — es lo más
   cercano a "ingreso realizado" que el estatus de cotización distingue hoy.
   El costo solo existe capturado para cotizaciones: Forpass y pólizas no
   traen un costo interno en su modelo de datos, así que ahí solo se ve el
   ingreso, nunca un margen inventado. */
function rangoPeriodoResultados(modo, desde, hasta){
  const hoy = hoyISO();
  if(modo === 'anio'){
    const anio = hoy.slice(0,4);
    return { inicio: anio + '-01-01', fin: anio + '-12-31' };
  }
  if(modo === 'personalizado'){
    const i = /^\d{4}-\d{2}-\d{2}$/.test(desde) ? desde : hoy;
    const f = /^\d{4}-\d{2}-\d{2}$/.test(hasta) ? hasta : hoy;
    return i <= f ? { inicio:i, fin:f } : { inicio:f, fin:i };
  }
  /* Mes actual, por omisión. */
  const anioMes = hoy.slice(0,7);
  const ultimoDia = new Date(Number(hoy.slice(0,4)), Number(hoy.slice(5,7)), 0).getDate();
  return { inicio: anioMes + '-01', fin: anioMes + '-' + String(ultimoDia).padStart(2,'0') };
}

/* ============================================================================
   Gráficas del estado de resultados — para dirección, que necesita ver la
   tendencia de un vistazo y no solo la tabla de un periodo a la vez.
   Todo en SVG inline, sin librería externa: es una app de un solo archivo.
   ========================================================================= */

/* Orden y color FIJOS de las tres fuentes de ingreso: el mismo Forpass/
   Pólizas/Cotizaciones en todas las gráficas de esta vista, sin importar el
   periodo o el filtro — que el color cambie según qué tan grande salió cada
   quien confundiría más de lo que ayuda. Verificado con el validador de
   paleta del proyecto (contraste CVD y sobre fondo blanco). */
const COLOR_INGRESO_FORPASS = '#2456a8';
const COLOR_INGRESO_POLIZAS = '#54C682'; /* = var(--accent) */
const COLOR_INGRESO_COTIZACIONES = '#8C5FBF';
const COLOR_UTILIDAD_GRAFICA = '#00143D'; /* = var(--navy-oscuro) */
const FUENTES_INGRESO = [
  { clave:'ingresoForpass', etiqueta:'Forpass', color:COLOR_INGRESO_FORPASS },
  { clave:'ingresoPolizas', etiqueta:'Pólizas', color:COLOR_INGRESO_POLIZAS },
  { clave:'ingresoCotizaciones', etiqueta:'Cotizaciones', color:COLOR_INGRESO_COTIZACIONES }
];
/* 'ingresoForpass' -> 'ingreso-forpass': un atributo data-* tiene que nacer en
   kebab-case en el HTML para que el navegador lo mapee de vuelta al mismo
   nombre en camelCase de `dataset` — si se escribe con mayúsculas el propio
   parser de HTML las aplana y el dataset ya no coincide. */
function claveKebab(s){ return s.replace(/[A-Z]/g, c => '-' + c.toLowerCase()); }

/* "$1,284,000" ocupa demasiado en un eje: "$1.3M" dice lo mismo en la mitad
   del espacio. */
function abrevMoneda(n){
  const signo = n < 0 ? '-' : '';
  const v = Math.abs(Number(n) || 0);
  if(v >= 1000000) return signo + '$' + (Math.round(v/100000)/10) + 'M';
  if(v >= 1000) return signo + '$' + Math.round(v/1000) + 'k';
  return signo + '$' + Math.round(v);
}

/* Blanco o tinta navy sobre un color de relleno, el que de verdad se lea
   mejor — el verde de marca es demasiado claro para texto blanco encima. */
function luminanciaRelativa(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16)/255, g = parseInt(c.substr(2,2),16)/255, b = parseInt(c.substr(4,2),16)/255;
  const lin = x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}
function colorTextoSobre(hexFondo){
  const L = luminanciaRelativa(hexFondo);
  const contrasteBlanco = 1.05 / (L + 0.05);
  const contrasteNavy = (L + 0.05) / (luminanciaRelativa(COLOR_UTILIDAD_GRAFICA) + 0.05);
  return contrasteBlanco >= contrasteNavy ? '#fff' : COLOR_UTILIDAD_GRAFICA;
}

/* Camino de una barra VERTICAL con las esquinas de arriba redondeadas y la
   base cuadrada (nace del cero) — para no tener que redondear los 4 lados
   de cada segmento de una barra apilada. */
function pathBarraTope(x, y, w, h, r){
  if(h <= 0 || w <= 0) return '';
  r = Math.max(0, Math.min(r, w/2, h));
  if(r <= 0.01) return 'M' + x + ',' + (y+h) + ' L' + x + ',' + y + ' L' + (x+w) + ',' + y + ' L' + (x+w) + ',' + (y+h) + ' Z';
  return 'M' + x + ',' + (y+h)
       + ' L' + x + ',' + (y+r)
       + ' Q' + x + ',' + y + ' ' + (x+r) + ',' + y
       + ' L' + (x+w-r) + ',' + y
       + ' Q' + (x+w) + ',' + y + ' ' + (x+w) + ',' + (y+r)
       + ' L' + (x+w) + ',' + (y+h)
       + ' Z';
}
/* Lo mismo pero para una barra HORIZONTAL, redondeando solo el lado
   derecho (el "extremo con datos"; el izquierdo es la base, en cero). */
function pathBarraDerechaRedonda(x, y, w, h, r){
  if(h <= 0 || w <= 0) return '';
  r = Math.max(0, Math.min(r, w, h/2));
  if(r <= 0.01) return 'M' + x + ',' + y + ' L' + (x+w) + ',' + y + ' L' + (x+w) + ',' + (y+h) + ' L' + x + ',' + (y+h) + ' Z';
  return 'M' + x + ',' + y
       + ' L' + (x+w-r) + ',' + y
       + ' Q' + (x+w) + ',' + y + ' ' + (x+w) + ',' + (y+r)
       + ' L' + (x+w) + ',' + (y+h-r)
       + ' Q' + (x+w) + ',' + (y+h) + ' ' + (x+w-r) + ',' + (y+h)
       + ' L' + x + ',' + (y+h)
       + ' Z';
}

/* Los últimos `n` meses completos (incluye el actual), cada uno con el
   mismo calcularResultados() que ya usa el resto de esta vista — así la
   tendencia no depende de qué periodo tenga elegido el selector de arriba. */
function tendenciaMensualResultados(n){
  const anclaMes = hoyISO().slice(0,7) + '-01';
  const meses = [];
  for(let i = n - 1; i >= 0; i--){
    const inicioMes = sumarMeses(anclaMes, -i);
    const anioMes = inicioMes.slice(0,7);
    const ultimoDia = new Date(Number(anioMes.slice(0,4)), Number(anioMes.slice(5,7)), 0).getDate();
    const finMes = anioMes + '-' + String(ultimoDia).padStart(2,'0');
    meses.push({ anio:Number(anioMes.slice(0,4)), mesNum:Number(anioMes.slice(5,7)), r:calcularResultados(inicioMes, finMes) });
  }
  return meses;
}

function leyendaFuentesIngreso(incluirUtilidad){
  let h = '<div class="grafica-leyenda">';
  FUENTES_INGRESO.forEach(f => {
    const apagada = estado.fuentesOcultasResultados.includes(f.clave);
    h += '<button type="button" class="' + (apagada?'apagada':'') + '" data-accion="toggle-fuente-resultado" data-fuente="' + f.clave + '" '
       +   'aria-pressed="' + (!apagada) + '" title="Clic para ' + (apagada ? 'volver a mostrar' : 'aislar') + ' ' + esc(f.etiqueta) + '">'
       +   '<i style="background:' + f.color + '"></i>' + esc(f.etiqueta)
       + '</button>';
  });
  if(incluirUtilidad) h += '<span><i class="linea" style="background:' + COLOR_UTILIDAD_GRAFICA + '"></i>Utilidad bruta</span>';
  return h + '</div>';
}

/* La gráfica principal: barras apiladas (ingreso por fuente) + una línea
   (utilidad bruta) en la MISMA escala de pesos — no son dos ejes distintos,
   es la misma unidad, así que compartirlo es válido y es justo lo que
   dirección necesita ver junto: de dónde vino el ingreso y si al final quedó
   ganancia. Interactiva: clic en la leyenda aísla una fuente (y reescala), y
   pasar el mouse por cualquier mes muestra su detalle completo con una línea
   guía — el mismo mecanismo de "columna completa como blanco de mouse" que
   usan las gráficas de verdad, no solo un punto de 4px que hay que acertar. */
function graficaTendenciaResultados(meses){
  if(!meses.length) return '<p class="svg-vacio">Sin datos suficientes todavía.</p>';

  const W = 900, H = 300, mI = 58, mD = 14, mA = 22, mB = 34;
  const anchoPlot = W - mI - mD, altoPlot = H - mA - mB;
  const fuentesVisibles = FUENTES_INGRESO.filter(f => !estado.fuentesOcultasResultados.includes(f.clave));
  const ingresoVisible = m => fuentesVisibles.reduce((s,f) => s + (m.r[f.clave]||0), 0);

  let yMax = Math.max(1, ...meses.map(m => Math.max(ingresoVisible(m), m.r.utilidadBruta))) * 1.12;
  let yMin = Math.min(0, ...meses.map(m => m.r.utilidadBruta));
  if(yMin < 0) yMin *= 1.12;

  const escY = v => mA + altoPlot - ((v - yMin) / (yMax - yMin)) * altoPlot;
  const n = meses.length;
  const anchoGrupo = anchoPlot / n;
  const anchoBarra = Math.min(26, anchoGrupo * 0.56);
  const GAP = 2;

  /* Cuadrícula: líneas limpias y parejas entre el mínimo y el máximo — nunca
     punteadas (eso se lee como "proyección" y aquí todo es real). */
  let svg = '';
  const pasos = 4;
  for(let i = 0; i <= pasos; i++){
    const v = yMin + (yMax - yMin) * (i / pasos);
    const y = escY(v);
    svg += '<line x1="' + mI + '" y1="' + y.toFixed(1) + '" x2="' + (W-mD) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>'
         + '<text x="' + (mI-8) + '" y="' + (y+3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--gray)">' + esc(abrevMoneda(v)) + '</text>';
  }
  /* El cero, si hay meses en números rojos, se marca un poco más firme: es
     la única línea que de verdad separa "ganó" de "perdió". */
  if(yMin < 0){
    const y0 = escY(0);
    svg += '<line x1="' + mI + '" y1="' + y0.toFixed(1) + '" x2="' + (W-mD) + '" y2="' + y0.toFixed(1) + '" stroke="var(--gray-claro)" stroke-width="1.3"/>';
  }

  let svgEjeX = '', svgHits = '';
  meses.forEach((m,i) => {
    const x0 = mI + i*anchoGrupo + (anchoGrupo-anchoBarra)/2;
    let cum = 0;
    const activos = fuentesVisibles.filter(f => (m.r[f.clave]||0) > 0);
    activos.forEach((f,k) => {
      const v = m.r[f.clave] || 0;
      const yTop = escY(cum+v), yBottom = escY(cum);
      const esUltimo = k === activos.length-1;
      const alto = (yBottom - yTop) - (esUltimo ? 0 : GAP);
      if(alto > 0) svg += '<path d="' + pathBarraTope(x0, yTop, anchoBarra, alto, 4) + '" fill="' + f.color + '"/>';
      cum += v;
    });
    const mostrarAnio = i === 0 || m.mesNum === 1;
    const etiqueta = MES_CORTO[m.mesNum-1] + (mostrarAnio ? " '" + String(m.anio).slice(2) : '');
    svgEjeX += '<text x="' + (x0+anchoBarra/2).toFixed(1) + '" y="' + (H-mB+16) + '" text-anchor="middle" font-size="10" fill="var(--gray)">' + esc(etiqueta) + '</text>';
    /* Un blanco de mouse por mes, del ancho de todo su grupo y del alto de
       toda la gráfica: acertarle a una barra angosta o a un punto de 4px es
       frustrante, esto se puede tocar en cualquier parte de la columna. */
    svgHits += '<rect class="grafica-hit" data-tt-tipo="mes" x="' + (mI+i*anchoGrupo).toFixed(1) + '" y="' + mA + '" width="' + anchoGrupo.toFixed(1) + '" height="' + altoPlot + '" '
             +   'data-mes="' + m.mesNum + '" data-anio="' + m.anio + '" data-costo="' + Math.round(m.r.costoTotal) + '" '
             +   'data-utilidad="' + Math.round(m.r.utilidadBruta) + '" data-margen="' + m.r.margenPct.toFixed(1) + '" '
             +   'data-cruce-x="' + (mI+i*anchoGrupo+anchoGrupo/2).toFixed(1) + '" '
             +   FUENTES_INGRESO.map(f => 'data-' + claveKebab(f.clave) + '="' + Math.round(m.r[f.clave]||0) + '"').join(' ')
             + '/>';
  });
  svg += svgEjeX;

  const puntos = meses.map((m,i) => ({ x: mI + i*anchoGrupo + anchoGrupo/2, y: escY(m.r.utilidadBruta), m }));
  svg += '<path d="' + puntos.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')
       + '" fill="none" stroke="' + COLOR_UTILIDAD_GRAFICA + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  puntos.forEach(p => {
    svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="' + COLOR_UTILIDAD_GRAFICA + '" stroke="#fff" stroke-width="2"/>';
  });
  /* Etiqueta directa solo en el mes más reciente: es el que de verdad le
     importa a dirección de un vistazo; el resto queda en la cuadrícula y el
     detalle al pasar el mouse. */
  const u = puntos[puntos.length-1];
  const arriba = u.y > mA + 14;
  svg += '<text x="' + u.x.toFixed(1) + '" y="' + (arriba ? u.y-10 : u.y+18).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="' + COLOR_UTILIDAD_GRAFICA + '">' + esc(dinero(u.m.r.utilidadBruta)) + '</text>';

  /* La línea guía y los blancos de mouse van AL FINAL: tienen que quedar
     encima de todo para que un mismo mouseover cubra la barra, la línea y
     el punto sin importar cuál esté debajo. */
  svg += '<line class="eje-cruce" y1="' + mA + '" y2="' + (H-mB) + '" x1="0" x2="0"/>' + svgHits;

  return '<div class="rodillo"><svg viewBox="0 0 ' + W + ' ' + H + '" style="min-width:640px; width:100%; height:auto; display:block" '
       + 'role="img" aria-label="Ingreso por fuente y utilidad bruta, mes a mes, de los últimos ' + n + ' meses">' + svg + '</svg></div>';
}

/* Una sola barra horizontal apilada: de qué tamaño es cada fuente dentro del
   ingreso de ESTE periodo (el que tenga elegido el selector de arriba). Es
   la forma recomendada para "parte del todo" — más segura de leer que un
   pastel para comparar tres tamaños. Aislar una fuente aquí no la quita ni
   reacomoda el resto (seguirían sin sumar 100% del total real, que es justo
   lo que este dibujo promete): solo la apaga visualmente en su mismo lugar. */
function graficaComposicionIngreso(r){
  if(!r.ingresoTotal) return '<p class="svg-vacio">Sin ingresos capturados en este periodo.</p>';

  const W = 900, H = 76, mI = 10, mD = 10, altoBarra = 42;
  const anchoPlot = W - mI - mD, y = (H-altoBarra)/2, GAP = 2;
  const activos = FUENTES_INGRESO.map(f => ({ ...f, valor: r[f.clave]||0 })).filter(f => f.valor > 0);

  let x = mI, svg = '';
  activos.forEach((f,k) => {
    const w = (f.valor / r.ingresoTotal) * anchoPlot;
    const esUltimo = k === activos.length-1;
    const wSeg = w - (esUltimo ? 0 : GAP);
    if(wSeg > 0){
      const pct = f.valor / r.ingresoTotal * 100;
      const apagada = estado.fuentesOcultasResultados.includes(f.clave);
      const d = esUltimo
        ? pathBarraDerechaRedonda(x, y, wSeg, altoBarra, 6)
        : 'M'+x+','+y+' L'+(x+wSeg)+','+y+' L'+(x+wSeg)+','+(y+altoBarra)+' L'+x+','+(y+altoBarra)+' Z';
      svg += '<path class="grafica-hit" d="' + d + '" fill="' + f.color + '" opacity="' + (apagada?0.22:1) + '" '
           +   'data-tt-tipo="segmento" data-etiqueta="' + esc(f.etiqueta) + '" data-valor="' + Math.round(f.valor) + '" data-pct="' + pct.toFixed(1) + '"/>';
      /* Etiqueta adentro solo si de verdad cabe con aire a los lados —
         nunca recortada — y solo si la fuente sigue encendida. */
      if(pct >= 12 && !apagada){
        svg += '<text x="' + (x+wSeg/2).toFixed(1) + '" y="' + (y+altoBarra/2+4.5).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + colorTextoSobre(f.color) + '" style="pointer-events:none">' + Math.round(pct) + '%</text>';
      }
    }
    x += w;
  });

  return '<div class="rodillo"><svg viewBox="0 0 ' + W + ' ' + H + '" style="min-width:380px; width:100%; height:auto; display:block" '
       + 'role="img" aria-label="Composición del ingreso del periodo por fuente">' + svg + '</svg></div>';
}

/* Línea sencilla del margen bruto %, mes a mes — un solo color basta (un
   solo indicador no necesita leyenda: el título de la tarjeta ya dice qué
   es). Eje propio en porcentaje: mezclarlo con la gráfica de pesos de arriba
   sería el error clásico de doble eje. No se ve afectada por aislar una
   fuente arriba: el margen es de toda la empresa, no de una sola fuente. */
function graficaMargenTendencia(meses){
  if(!meses.length) return '<p class="svg-vacio">Sin datos suficientes todavía.</p>';

  const W = 900, H = 160, mI = 46, mD = 14, mA = 16, mB = 30;
  const anchoPlot = W-mI-mD, altoPlot = H-mA-mB;
  const valores = meses.map(m => m.r.margenPct);
  let yMax = Math.max(10, ...valores), yMin = Math.min(0, ...valores);
  const rango = (yMax - yMin) || 10;
  yMax += rango*0.15; yMin -= rango*0.15;

  const escY = v => mA + altoPlot - ((v-yMin)/(yMax-yMin)) * altoPlot;
  const escX = i => mI + (i / (meses.length-1 || 1)) * anchoPlot;
  const y0 = escY(0);
  const anchoBanda = anchoPlot / meses.length;

  let svg = '<line x1="' + mI + '" y1="' + y0.toFixed(1) + '" x2="' + (W-mD) + '" y2="' + y0.toFixed(1) + '" stroke="var(--gray-claro)" stroke-width="1"/>'
          + '<text x="' + (mI-8) + '" y="' + (y0+3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="var(--gray)">0%</text>';

  const puntos = meses.map((m,i) => ({ x:escX(i), y:escY(m.r.margenPct), m }));
  svg += '<path d="' + puntos.map((p,i) => (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')
       + '" fill="none" stroke="' + COLOR_UTILIDAD_GRAFICA + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

  const pasoEtiquetaX = Math.ceil(meses.length / 6);
  let svgHits = '';
  puntos.forEach((p,i) => {
    const primero = i === 0, ultimo = i === puntos.length-1;
    svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (ultimo ? 4.5 : 3) + '" fill="' + COLOR_UTILIDAD_GRAFICA + '" stroke="#fff" stroke-width="2"/>';
    if(primero || ultimo){
      const arriba = p.y > mA+14;
      svg += '<text x="' + (p.x + (primero?4:-4)).toFixed(1) + '" y="' + (arriba ? p.y-9 : p.y+17).toFixed(1) + '" text-anchor="' + (primero?'start':'end') + '" font-size="11" font-weight="700" fill="' + COLOR_UTILIDAD_GRAFICA + '">' + p.m.r.margenPct.toFixed(1) + '%</text>';
    }
    if(i % pasoEtiquetaX === 0 || ultimo){
      svg += '<text x="' + p.x.toFixed(1) + '" y="' + (H-mB+16) + '" text-anchor="middle" font-size="10" fill="var(--gray)">' + MES_CORTO[p.m.mesNum-1] + '</text>';
    }
    svgHits += '<rect class="grafica-hit" data-tt-tipo="margen" x="' + (p.x-anchoBanda/2).toFixed(1) + '" y="' + mA + '" width="' + anchoBanda.toFixed(1) + '" height="' + altoPlot + '" '
             +   'data-mes="' + p.m.mesNum + '" data-anio="' + p.m.anio + '" data-margen="' + p.m.r.margenPct.toFixed(1) + '" data-cruce-x="' + p.x.toFixed(1) + '"/>';
  });
  svg += '<line class="eje-cruce" y1="' + mA + '" y2="' + (H-mB) + '" x1="0" x2="0"/>' + svgHits;

  return '<div class="rodillo"><svg viewBox="0 0 ' + W + ' ' + H + '" style="min-width:520px; width:100%; height:auto; display:block" '
       + 'role="img" aria-label="Margen bruto porcentual, mes a mes, de los últimos ' + meses.length + ' meses">' + svg + '</svg></div>';
}

function calcularResultados(inicio, fin){
  const r = { ingresoForpass:0, ingresoPolizas:0, ingresoCotizaciones:0, costoCotizaciones:0, costoPolizas:0,
              numPagosForpass:0, numCobrosPolizas:0, numServiciosPolizas:0, numCotizaciones:0 };

  /* Forpass: cada mensualidad YA MARCADA COMO PAGADA cuenta como ingreso en
     el mes al que corresponde (fechaInicio + su número de mes), no en el mes
     en que se haya dado clic en "Marcar pagada". */
  datos.sitios.forEach(s=>{
    const c = calcular(s);
    s.pagos.forEach((pagado, i)=>{
      if(!pagado) return;
      const fecha = sumarMeses(s.fechaInicio, i);
      if(fecha >= inicio && fecha <= fin){ r.ingresoForpass += c.montos[i]; r.numPagosForpass++; }
    });
  });

  /* Pólizas: el INGRESO se cuenta cuando se COBRA (uno solo si es anual,
     doce si es mensual) — cargoA==='interno' NO entra: ese cobro marcado no
     es dinero que haya puesto un cliente, es un gasto que absorbimos
     nosotros mismos (ver normalizarPoliza()).

     El COSTO en cambio se cuenta cuando se HACE el servicio, no cuando se
     cobra: son dos calendarios distintos —facturación vs. mantenimiento
     real— y mezclarlos dejaba meses sin costo (nada cobrado ese mes) al
     lado de meses con el costo del año completo (cobro anual de golpe). El
     costo de cada equipo se reconoce en CADA mes de su calendario que caiga
     dentro del período, multiplicado por su cantidad — es lo que de verdad
     se gasta ese mes en mantenerlo. Y SÍ entra aunque la póliza sea
     cargoA='interno': el gasto de mandar al técnico es real aunque no se le
     esté cobrando a un cliente. */
  datos.polizas.forEach(p=>{
    if(p.cargoA !== 'interno'){
      const c = calcularPoliza(p);
      p.cobros.forEach((cobrado, i)=>{
        if(!cobrado) return;
        const fecha = p.facturacion === 'mensual' ? sumarMeses(p.fechaInicio, i) : p.fechaInicio;
        if(fecha >= inicio && fecha <= fin){ r.ingresoPolizas += c.montos[i]; r.numCobrosPolizas++; }
      });
    }
    p.partidas.forEach(x=>{
      const costoServicio = (x.costoUnitario || 0) * x.cantidad;
      if(!costoServicio) return;
      x.mesesServicio.forEach(m=>{
        const fecha = sumarMeses(p.fechaInicio, m);
        if(fecha >= inicio && fecha <= fin){ r.costoPolizas += costoServicio; r.numServiciosPolizas++; }
      });
    });
  });

  /* Cotizaciones: la fecha de la cotización, no la de sus pagos — el módulo
     no lleva cobranza propia, a diferencia de Forpass y pólizas.

     Cuenta como ingreso "aprobada" (una cotización normal, de toda la vida)
     o cualquier etapa del pipeline de 13 pasos desde que el servicio ya se
     REALIZÓ en adelante (decisión de Victor, 28-ago-2026, al fusionar el
     tablero de Servicios Extras con este módulo): no hace falta esperar a
     que se facture, basta con que el trabajo ya se hizo — lo cotizado,
     compartido o pendiente de liberación todavía puede cancelarse o
     expirar, así que eso no cuenta. Ver ESTATUS_COTIZACION_INGRESO.

     El costo interno solo se suma si la cotización TRAE uno capturado: las
     del tablero llegan con costo $0 (el origen no lo trae), así que no se
     les inventa un margen — mismo criterio que ya tiene Forpass. */
  datos.cotizaciones.forEach(q=>{
    if(!ESTATUS_COTIZACION_INGRESO.includes(q.estatus)) return;
    if(!(q.fecha >= inicio && q.fecha <= fin)) return;
    const c = calcularCotizacion(q);
    r.ingresoCotizaciones += c.totalCliente;
    r.costoCotizaciones += c.totalCosto;
    r.numCotizaciones++;
  });

  r.ingresoTotal = r.ingresoForpass + r.ingresoPolizas + r.ingresoCotizaciones;
  r.costoTotal = r.costoCotizaciones + r.costoPolizas;
  r.utilidadBruta = r.ingresoTotal - r.costoTotal;
  r.margenPct = r.ingresoTotal ? (r.utilidadBruta / r.ingresoTotal * 100) : 0;

  /* Imagen/Aperturas (remodelaciones, aperturas, cambio de imagen): SÍ es un
     gasto para efectos del estado de resultados, pero Victor pidió (28-ago-
     2026) que viva en un RUBRO APARTE, puramente informativo — por eso no
     entra a r.costoTotal ni mueve r.utilidadBruta arriba. Un proyecto
     cancelado no cuenta: no se invirtió nada de verdad. Se separa además en
     materiales vs. mano de obra (ver esConceptoManoDeObra). */
  r.imagenMateriales = 0; r.imagenManoObra = 0; r.numProyectosImagen = 0;
  datos.proyectosImagen.forEach(p=>{
    if(p.estatus === 'cancelado') return;
    if(!(p.fecha >= inicio && p.fecha <= fin)) return;
    const d = desgloseConceptosProyecto(p);
    r.imagenMateriales += d.materiales;
    r.imagenManoObra += d.manoObra;
    r.numProyectosImagen++;
  });
  r.imagenTotal = r.imagenMateriales + r.imagenManoObra;

  return r;
}

function vistaResultados(){
  const modo = estado.periodoResultados;
  const { inicio, fin } = rangoPeriodoResultados(modo, estado.resultadosDesde, estado.resultadosHasta);
  const r = calcularResultados(inicio, fin);

  let h = '<div class="titulo-zona"><div>'
        +   '<h2>Estado de resultados</h2>'
        +   '<p>' + fmtFecha(inicio) + ' – ' + fmtFecha(fin)
        +   ' · cruce de Forpass, pólizas y cotizaciones aprobadas</p>'
        + '</div></div>';

  h += '<div class="barra-busca">'
     +   '<select id="selPeriodoResultados">'
     +     '<option value="mes"' + (modo === 'mes' ? ' selected' : '') + '>Mes actual</option>'
     +     '<option value="anio"' + (modo === 'anio' ? ' selected' : '') + '>Año actual</option>'
     +     '<option value="personalizado"' + (modo === 'personalizado' ? ' selected' : '') + '>Rango personalizado</option>'
     +   '</select>'
     +   (modo === 'personalizado'
        ? '<input type="date" id="resultadosDesde" value="' + esc(estado.resultadosDesde || inicio) + '">'
          + '<input type="date" id="resultadosHasta" value="' + esc(estado.resultadosHasta || fin) + '">'
        : '')
     + '</div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Ingresos totales', dineroCent(r.ingresoTotal), 'Forpass + pólizas + cotizaciones', 'k-ok')
     + tarjetaKpi('Costo capturado', dineroCent(r.costoTotal), 'Pólizas (costo por equipo) + cotizaciones')
     + tarjetaKpi('Utilidad bruta', dineroCent(r.utilidadBruta), r.margenPct.toFixed(1) + '% de margen sobre el ingreso',
         r.utilidadBruta >= 0 ? 'k-ok' : 'k-error')
     + '</div>';

  /* Gráficas para dirección: la tendencia no depende del selector de arriba
     (siempre son los últimos 12 meses cerrados), la composición sí — es la
     de ESTE periodo, para leerse junto con las tarjetas y la tabla de abajo. */
  const tendencia12m = tendenciaMensualResultados(12);
  const hayTendencia = tendencia12m.some(m => m.r.ingresoTotal || m.r.costoTotal);

  if(hayTendencia){
    h += '<div class="bloque">'
       +   '<div class="bloque-cabeza"><div>'
       +     '<h3>Ingresos y utilidad — últimos 12 meses</h3>'
       +     '<p>Cada barra es el ingreso del mes por fuente; la línea es la utilidad bruta de ese mes.</p>'
       +   '</div></div>'
       +   leyendaFuentesIngreso(true)
       +   graficaTendenciaResultados(tendencia12m)
       + '</div>';

    h += '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:18px">'
       +   '<div class="bloque" style="margin-bottom:0">'
       +     '<div class="bloque-cabeza"><div>'
       +       '<h3>De dónde viene el ingreso de este periodo</h3>'
       +       '<p>' + dineroCent(r.ingresoTotal) + ' en total</p>'
       +     '</div></div>'
       +     leyendaFuentesIngreso(false)
       +     graficaComposicionIngreso(r)
       +   '</div>'
       +   '<div class="bloque" style="margin-bottom:0">'
       +     '<div class="bloque-cabeza"><div>'
       +       '<h3>Margen bruto — últimos 12 meses</h3>'
       +       '<p>Utilidad bruta como % del ingreso, mes con mes</p>'
       +     '</div></div>'
       +     graficaMargenTendencia(tendencia12m)
       +   '</div>'
       + '</div>';
  }

  h += '<div class="tabla-pyl">'
     +   '<div class="tp-seccion">Ingresos</div>'
     +   '<div class="tp-fila"><span>Forpass · mensualidades cobradas (' + numero(r.numPagosForpass) + ')</span>'
     +     '<span class="tp-monto">' + dineroCent(r.ingresoForpass) + '</span></div>'
     +   '<div class="tp-fila"><span>Pólizas · cobros facturados (' + numero(r.numCobrosPolizas) + ')</span>'
     +     '<span class="tp-monto">' + dineroCent(r.ingresoPolizas) + '</span></div>'
     +   '<div class="tp-fila"><span>Cotizaciones · aprobadas o ya realizadas (' + numero(r.numCotizaciones) + ')</span>'
     +     '<span class="tp-monto">' + dineroCent(r.ingresoCotizaciones) + '</span></div>'
     +   '<div class="tp-fila tp-total"><span>Total de ingresos</span><span class="tp-monto">' + dineroCent(r.ingresoTotal) + '</span></div>'

     +   '<div class="tp-seccion">Costos</div>'
     +   '<div class="tp-fila tp-negativo"><span>Pólizas · servicios programados este período (' + numero(r.numServiciosPolizas) + ')</span>'
     +     '<span class="tp-monto">' + dineroCent(r.costoPolizas) + '</span></div>'
     +   '<div class="tp-fila tp-negativo"><span>Costo de las cotizaciones contadas arriba</span>'
     +     '<span class="tp-monto">' + dineroCent(r.costoCotizaciones) + '</span></div>'
     +   '<div class="tp-fila tp-total"><span>Total de costos</span><span class="tp-monto">' + dineroCent(r.costoTotal) + '</span></div>'
     + '</div>';

  h += '<div class="tp-final">'
     +   '<span class="tp-label">Utilidad bruta del periodo</span>'
     +   '<span class="tp-monto" style="color:' + (r.utilidadBruta >= 0 ? 'var(--ok)' : 'var(--error)') + '">' + dineroCent(r.utilidadBruta) + '</span>'
     + '</div>';

  /* Imagen/Aperturas: gasto real, pero en un rubro APARTE, meramente
     informativo — nunca entra a r.costoTotal ni mueve la utilidad de
     arriba (ver calcularResultados). Tarjeta separada, con borde
     punteado, para que a simple vista se note que no es parte del cálculo
     de utilidad. */
  if(r.numProyectosImagen){
    h += '<div class="tabla-pyl" style="border-style:dashed; margin-top:16px">'
       +   '<div class="tp-seccion">Imagen / remodelaciones — informativo, no afecta la utilidad</div>'
       +   '<div class="tp-fila"><span>Costo de materiales</span><span class="tp-monto">' + dineroCent(r.imagenMateriales) + '</span></div>'
       +   '<div class="tp-fila"><span>Costo de mano de obra</span><span class="tp-monto">' + dineroCent(r.imagenManoObra) + '</span></div>'
       +   '<div class="tp-fila tp-total"><span>Monto de inversión total (' + numero(r.numProyectosImagen) + ' ' + plural(r.numProyectosImagen,'proyecto','proyectos') + ')</span>'
       +     '<span class="tp-monto">' + dineroCent(r.imagenTotal) + '</span></div>'
       + '</div>';
  }

  h += '<p class="pista" style="margin-top:14px">Forpass no tiene un costo interno capturado en el sistema, así que aquí '
     + 'solo aporta ingreso — no se le inventa un margen. El costo de pólizas se cuenta por el calendario de '
     + 'mantenimiento —cada equipo, en cada mes que le toca servicio dentro del período— y no por lo cobrado: son '
     + 'calendarios distintos, y por eso puede haber costo en un mes sin ingreso de pólizas, o al revés. Viene del costo '
     + 'de cada equipo en su renglón (ver Lista de precios); si un equipo quedó en $0 de costo, esa parte del margen '
     + 'sale de más. Imagen/remodelaciones se cuenta por su fecha de alta (los proyectos cancelados no cuentan); dentro '
     + 'de sus conceptos, un proveedor capturado como "Servicios" o "Servicios / IT" se toma como mano de obra y '
     + 'cualquier otro como material. Una cotización cuenta como ingreso al quedar <b>Aprobada</b>, o —para las que '
     + 'siguen el pipeline de 13 etapas del tablero de servicios— desde que el trabajo ya se <b>Realizó</b> en '
     + 'adelante: no hace falta esperar a que se facture, basta con que ya se haya hecho. Lo cotizado, compartido o '
     + 'pendiente de liberación todavía puede cancelarse o expirar, así que eso no cuenta como dinero.</p>';

  return h;
}
