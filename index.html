/* ===================== COTIZACIONES DE SERVICIO =====================
   Tercer módulo, independiente de Forpass y Pólizas: cotizar un trabajo de
   mantenimiento (correctivo, preventivo, revisión…) en un sitio ya dado de
   alta. Reusa la MISMA colección de clientes y sitios — sin catálogo aparte,
   igual que decidió el proyecto para pólizas ("un solo `clientes`, cada
   módulo filtra el suyo"): aquí el "comedor" del formato original es un
   sitio, y la "razón social" que factura es un dato del sitio (se captura
   como parámetro personalizado, no aquí — ver Admin → Segmentos y parámetros).

   Cada cotización es UN documento con DOS caras, igual que el Excel de
   origen (hojas COTI y "Cot. Cliente"):
     · costo   — lo que cuesta hacer el trabajo, para saber qué cargarle al
                 sitio o al cliente.
     · cliente — lo que se le cobra al cliente final: costo + margen, más
                 instalación/mano de obra si aplica.
   calcularCotizacion() es el ÚNICO lugar que hace esta cuenta — nunca se
   guarda un total, igual que en pólizas y en Forpass.

   Modelo: cotizaciones: { id, folio, fecha, realizo, clienteId, sitioId,
     tipoMtto, cargoA, solicitud, vigenciaDias, noReporte, fechaReporte,
     departamento, margen, instalacion:{incluir,porcentaje,fijo},
     ordenCompra, tipoPago, tiempoEntrega, notas, estatus,
     partidas:[{id, seccion, cantidad, um, concepto, precioCosto,
                precioClienteManual}] }

   El margen y la fórmula de instalación son POR COTIZACIÓN, a propósito
   (decisión de Victor, 21-ago-2026): cada trabajo puede negociarse distinto,
   así que no hay un % fijo de la app — 15 y 20%+$750 son solo los valores de
   arranque al crear una nueva. */
const IVA_COTIZACION = 0.16;

/* Sugeridos de la "Hoja de datos" original. Son solo sugerencias en un campo
   de texto libre —como la zona—, así que un tipo o una solicitud nueva no
   necesitan tocar código. */
const TIPOS_MTTO_SUGERIDOS = ['CORRECTIVO','EQUIPO','IMAGEN','INFRAESTRUCTURA','POLIZA','PREVENTIVO','REVISION'];
const SOLICITUD_SUGERIDA = ['COTI. INICIAL','RECOTIZACION 1','RECOTIZACION 2','RECOTIZACION 3'];
const TIPO_PAGO_SUGERIDO = ['Crédito','Contado'];

/* Las 13 etapas reales del tablero de Monday.com ("Servicios Pendientes -
   Cargo al Cliente", compartido por Victor el 28-ago-2026): nacieron como el
   estatus de un módulo aparte ("Servicios Extras"), pero Victor pidió
   fusionarlo con Cotizaciones (28-ago-2026) — una cotización YA vive un
   pipeline real cuando pasa por el tablero, así que sus etapas se agregan
   aquí en vez de mantener un segundo estatus paralelo. */
const ETAPAS_TABLERO_COTIZACION = [
  'trabajo_oc', 'trabajo_interno', 'pendiente_liberacion', 'pendiente',
  'solicitud_comercial', 'solicitud_soporte', 'compartida', 'realizado',
  'realizado_comedor', 'proceso_facturacion', 'cancelado', 'facturado', 'expirado'
];
const ETIQUETA_ETAPA_TABLERO_COTIZACION = {
  trabajo_oc: 'Trabajos con Orden de Compra',
  trabajo_interno: 'Trabajo interno Plato',
  pendiente_liberacion: 'Trabajos Internos - Pendientes por liberación',
  pendiente: 'Servicios Pendientes',
  solicitud_comercial: 'Solicitud de cotización a cliente (Comercial)',
  solicitud_soporte: 'Solicitud de cotización a cliente (Soporte)',
  compartida: 'Compartida al cliente',
  realizado: 'Servicios Realizados',
  realizado_comedor: 'Servicios Realizados / Cargo a Comedor',
  proceso_facturacion: 'Proceso de facturación',
  cancelado: 'Cancelado',
  facturado: 'Facturado',
  expirado: 'Expirado'
};
const TONO_ETAPA_TABLERO_COTIZACION = {
  trabajo_oc: 'info', trabajo_interno: 'info', pendiente_liberacion: 'alerta', pendiente: 'alerta',
  solicitud_comercial: 'info', solicitud_soporte: 'info', compartida: 'alerta',
  realizado: 'ok', realizado_comedor: 'ok', proceso_facturacion: 'alerta',
  cancelado: 'neutro', facturado: 'ok', expirado: 'neutro'
};

const ESTATUS_COTIZACION = ['borrador','enviada','aprobada','rechazada','cancelada'].concat(ETAPAS_TABLERO_COTIZACION);
const ETIQUETA_ESTATUS_COTIZACION = Object.assign({
  borrador:'Borrador', enviada:'Enviada', aprobada:'Aprobada', rechazada:'Rechazada', cancelada:'Cancelada'
}, ETIQUETA_ETAPA_TABLERO_COTIZACION);

/* Perdida para siempre (ni ingreso ni por cobrar): las dos de siempre, más
   las dos terminales del tablero que nunca se van a facturar. */
const ESTATUS_COTIZACION_PERDIDA = ['rechazada', 'cancelada', 'cancelado', 'expirado'];
/* "Abierta" en el sentido de vigencia/vencida: solo mientras se sigue
   esperando una DECISIÓN (aprobar, liberar, compartir…). En cuanto el
   servicio ya se realizó, se facturó, se perdió o se aprobó de entrada, la
   vigencia de la cotización deja de tener sentido — no hay nada que "vencer". */
const ESTATUS_COTIZACION_ABIERTA = ['borrador', 'enviada',
  'trabajo_oc', 'trabajo_interno', 'pendiente_liberacion', 'pendiente',
  'solicitud_comercial', 'solicitud_soporte', 'compartida'];
/* Ingreso real para el estado de resultados (decisión de Victor, 28-ago-
   2026): "aprobada" para una cotización normal, y para las del tablero desde
   que el servicio se REALIZÓ — no hace falta esperar a que se facture. Lo
   facturado sigue siendo una etapa más del pipeline, no el único requisito;
   se puede seguir viendo/filtrando aparte para dar seguimiento a cobranza. */
const ESTATUS_COTIZACION_INGRESO = ['aprobada', 'realizado', 'realizado_comedor', 'proceso_facturacion', 'facturado'];

/* Sigue esperando una decisión (ver ESTATUS_COTIZACION_ABIERTA): úsese en vez
   de repetir el arreglo a mano en cada vista, para que las tres no se
   desalineen entre sí. */
function cotizacionAbierta(cot){ return ESTATUS_COTIZACION_ABIERTA.includes(cot.estatus); }

/* Como Number(v)||def, pero sin pisar un 0 capturado a propósito: Number(0)
   es falsy, así que `0 || 15` da 15 y un margen en cero se volvería 15 solo. */
function numDef(v, def){
  return (v !== undefined && v !== null && v !== '' && !isNaN(Number(v))) ? Number(v) : def;
}

function normalizarPartidaCotizacion(x){
  return {
    id: (x && x.id ? String(x.id) : '').trim() || nuevoId(),
    seccion: (x && x.seccion ? String(x.seccion) : '').trim(),
    cantidad: Math.max(0, numDef(x && x.cantidad, 0)),
    um: (x && x.um ? String(x.um) : '').trim(),
    concepto: (x && x.concepto ? String(x.concepto) : '').trim(),
    precioCosto: Math.max(0, numDef(x && x.precioCosto, 0)),
    /* null = "sin precio propio": el precio al cliente sale de costo × margen.
       Un número aquí es una excepción capturada a mano para ESE renglón, tal
       cual pasaba en el Excel, donde varias filas traían el precio tecleado
       aparte del cálculo. */
    precioClienteManual: (x && x.precioClienteManual !== null && x.precioClienteManual !== undefined && x.precioClienteManual !== '')
      ? Math.max(0, numDef(x.precioClienteManual, 0)) : null
  };
}

function normalizarCotizacion(q){
  const partidasCrudas = (Array.isArray(q && q.partidas) ? q.partidas : []).map(normalizarPartidaCotizacion);
  /* Un renglón sin concepto es basura de una captura a medias: se tira. */
  const partidas = partidasCrudas.filter(x => x.concepto);
  const inst = (q && q.instalacion) || {};
  return {
    id: (q && q.id) || nuevoId(),
    folio: (q && q.folio ? String(q.folio) : '').trim(),
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fecha) ? q.fecha : hoyISO(),
    realizo: (q && q.realizo ? String(q.realizo) : '').trim(),
    clienteId: (q && q.clienteId) || '',
    sitioId: (q && q.sitioId) || '',
    tipoMtto: (q && q.tipoMtto ? String(q.tipoMtto) : '').trim(),
    cargoA: (q && q.cargoA === 'comedor') ? 'comedor' : 'cliente',
    solicitud: (q && q.solicitud ? String(q.solicitud) : '').trim() || SOLICITUD_SUGERIDA[0],
    vigenciaDias: Math.max(0, parseInt(q && q.vigenciaDias, 10) || 14),
    noReporte: (q && q.noReporte ? String(q.noReporte) : '').trim(),
    fechaReporte: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fechaReporte) ? q.fechaReporte : '',
    departamento: (q && q.departamento ? String(q.departamento) : '').trim() || 'DEPARTAMENTO DE MANTENIMIENTO',
    margen: Math.max(0, numDef(q && q.margen, 15)),
    instalacion: {
      incluir: !!inst.incluir,
      porcentaje: Math.max(0, numDef(inst.porcentaje, 20)),
      fijo: Math.max(0, numDef(inst.fijo, 750))
    },
    ordenCompra: (q && q.ordenCompra ? String(q.ordenCompra) : '').trim() || 'PENDIENTE',
    tipoPago: (q && q.tipoPago ? String(q.tipoPago) : '').trim() || 'Crédito',
    tiempoEntrega: (q && q.tiempoEntrega ? String(q.tiempoEntrega) : '').trim() || 'TE: 3 A 4 SEMANAS DIAS HABILES',
    notas: (q && q.notas ? String(q.notas) : '').trim() || 'PRECIOS SUJETOS A CAMBIO SIN PREVIO AVISO',
    estatus: ESTATUS_COTIZACION.includes(q && q.estatus) ? q.estatus : 'borrador',
    /* Si esta cotización nació de un reporte (ver módulo Reportes), aquí
       queda la liga hacia atrás — el reporte guarda la liga hacia adelante
       en su propio `cotizacionId`. */
    reporteOrigenId: (q && q.reporteOrigenId) || '',
    /* Mismo criterio, pero cuando nace de una refacción pedida al registrar
       un servicio de póliza (ver `refaccion`/`refaccionCotizacionId` en
       `hechos`, dentro de normalizarPoliza): la liga hacia atrás queda aquí,
       con el equipo y el mes exactos, no solo la póliza — un mismo equipo
       puede pedir refacciones distintas en meses distintos. */
    polizaOrigenId: (q && q.polizaOrigenId) || '',
    polizaOrigenPartidaId: (q && q.polizaOrigenPartidaId) || '',
    polizaOrigenMes: Number.isInteger(q && q.polizaOrigenMes) ? q.polizaOrigenMes : null,
    /* Mismo criterio otra vez, cuando nace de uno o varios hallazgos de un
       levantamiento de sitio (ver módulo Levantamientos) que pidieron cotizar
       algo — SIEMPRE arreglo, incluso cuando es un solo hallazgo, para que
       "una cotización con varios hallazgos" (elegir "una sola" al generar)
       y "una cotización por hallazgo" compartan el mismo campo. Migra sola
       el formato viejo (un único id suelto, de antes de que existiera la
       opción de combinar) al leer. */
    levantamientoOrigenId: (q && q.levantamientoOrigenId) || '',
    levantamientoOrigenHallazgoIds: Array.isArray(q && q.levantamientoOrigenHallazgoIds)
      ? q.levantamientoOrigenHallazgoIds.slice()
      : (q && q.levantamientoOrigenHallazgoId ? [q.levantamientoOrigenHallazgoId] : []),
    /* Cotización(es) de proveedor externo que sustentan el costo interno de
       arriba — solo se ven del lado "Costo interno", nunca en el documento
       para el cliente. */
    respaldosCosto: (Array.isArray(q && q.respaldosCosto) ? q.respaldosCosto : []).map(normalizarRespaldoCosto),
    /* Campos propios del pipeline de 13 etapas (ver ETAPAS_TABLERO_COTIZACION):
       opcionales, en blanco para cualquier cotización de toda la vida. Quién
       ejecuta (distinto de `realizo`, que es quién hizo la cotización) y las
       fechas del seguimiento real del servicio, más allá de la vigencia de
       la cotización. */
    proveedor: (q && q.proveedor ? String(q.proveedor) : '').trim(),
    fechaLiberacion: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fechaLiberacion) ? q.fechaLiberacion : '',
    fechaProgramadaInicio: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fechaProgramadaInicio) ? q.fechaProgramadaInicio : '',
    fechaProgramadaFin: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fechaProgramadaFin) ? q.fechaProgramadaFin : '',
    fechaRealizado: /^\d{4}-\d{2}-\d{2}$/.test(q && q.fechaRealizado) ? q.fechaRealizado : '',
    partidas
  };
}

function cotizacionPorId(id){ return datos.cotizaciones.find(q => q.id === id); }
function cotizacionesDeSitio(sitioId){ return datos.cotizaciones.filter(q => q.sitioId === sitioId); }

/* Un solo lugar para decidir el color de una cotización, para que la lista del
   módulo Cotizaciones y el resumen por cliente digan siempre lo mismo. */
function tonoCotizacion(cot){
  const vencidaAbierta = cotizacionAbierta(cot) && calcularCotizacion(cot).vencida;
  if(vencidaAbierta) return { tono:'error', tonoInsignia:'error' };
  if(ETAPAS_TABLERO_COTIZACION.includes(cot.estatus)){
    /* No hay t-info en .tarjeta (solo ok/alerta/error/neutro) — la insignia SÍ
       tiene i-info, así que el acento de la tarjeta usa un mapeo aparte. */
    const t = TONO_ETAPA_TABLERO_COTIZACION[cot.estatus];
    return { tono: t === 'info' ? 'neutro' : t, tonoInsignia: t };
  }
  if(cot.estatus === 'borrador') return { tono:'alerta', tonoInsignia:'alerta' };
  if(cot.estatus === 'enviada') return { tono:'alerta', tonoInsignia:'info' };
  if(cot.estatus === 'aprobada') return { tono:'ok', tonoInsignia:'ok' };
  return { tono:'neutro', tonoInsignia:'neutro' };
}

/* El folio por omisión al crear una cotización nueva: SERV-DDMMAA-NN, donde NN
   es su lugar dentro de las que ya llevan ese mismo día. Es solo una
   sugerencia — el campo sigue siendo texto libre, por si hace falta otra
   convención o corregirlo a mano. */
/* Folio por default: SERV-ddmmaa-NN. El consecutivo es GLOBAL — cuántas
   cotizaciones ya existen, no cuántas del mismo día — a pedido explícito de
   Victor (21-ago-2026): "conforme a las cotizaciones creadas". Sigue siendo
   solo una sugerencia inicial: el campo del formulario es texto libre y se
   puede corregir a mano. */
/* Quién capturó la última cotización, para no volver a teclearlo cada vez.
   En modo servidor manda el nombre de la sesión —siempre correcto y no hace
   falta recordar nada—; en modo local no hay cuentas, así que es lo único
   que dice quién es quién. Sigue siendo editable en el formulario: esto solo
   rellena la sugerencia. */
const LLAVE_REALIZO = 'forguard_forpass_realizo_v1';
function realizoSugerido(){
  const deSesion = sesion.nombre || nombreDe(sesion);
  if(deSesion) return deSesion;
  try{ return localStorage.getItem(LLAVE_REALIZO) || ''; }catch(e){ return ''; }
}
function recordarRealizo(nombre){
  if(HAY_NUBE) return;   /* con sesión real no hace falta ni tiene caso */
  try{ localStorage.setItem(LLAVE_REALIZO, nombre); }catch(e){}
}

function generarFolioCotizacion(fechaISO){
  const f = /^\d{4}-\d{2}-\d{2}$/.test(fechaISO) ? fechaISO : hoyISO();
  const ddmmaa = f.slice(8,10) + f.slice(5,7) + f.slice(2,4);
  return 'SERV-' + ddmmaa + '-' + String(datos.cotizaciones.length + 1).padStart(2,'0');
}

/* ============================ Reportes (tickets) ============================
   Cuarto módulo: el reporte que levanta CUALQUIERA —no solo quien cotiza— para
   avisar que un equipo falló. Es la puerta de entrada al trabajo correctivo;
   de aquí puede salir una cotización (ver `cotizacionId` más abajo), pero el
   reporte existe aunque nunca se cotice nada — a veces el técnico lo resuelve
   en la misma visita y ahí queda.

   Folio: TK-DDMMAA-NNNN. Mismo molde que las cotizaciones (SERV-DDMMAA-NN)
   para que a nadie le sorprenda el patrón, con dos diferencias a propósito:
   prefijo TK (de "ticket", la palabra que va a usar todo el mundo en piso) y
   CUATRO dígitos en vez de dos — un reporte lo puede levantar cualquiera desde
   su celular, así que el volumen por día es de otro orden que una cotización
   capturada por el equipo comercial.

   Quién puede qué (ver también config/firestore.rules):
     · Levantar un reporte y darle seguimiento (subir evidencia, cambiar su
       propio avance) → cualquiera con acceso al tablero, SIN excepción. Un
       Viewer no puede tocar clientes ni pagos, pero si ve un refrigerador
       goteando tiene que poder avisar — por eso `puedeReportar()` es más
       permisivo que `puedeEditar()`.
     · Asignar o cambiar los técnicos → Analyst para arriba: es una decisión
       de despacho, no de campo.
     · Borrar un reporte → solo Admin, igual que todo lo demás. */
const PRIORIDAD_REPORTE = ['baja', 'media', 'alta', 'urgente'];
const ETIQUETA_PRIORIDAD = { baja:'Baja', media:'Media', alta:'Alta', urgente:'Urgente' };
const TONO_PRIORIDAD = { baja:'neutro', media:'info', alta:'alerta', urgente:'error' };

/* Estados de un reporte, en el orden en que de verdad ocurren. 'abierto' nace
   solo; nadie lo puede cerrar sin haber pasado por 'resuelto' primero —eso lo
   exige el propio flujo de botones, no el estatus—, salvo 'cancelado', que se
   puede marcar en cualquier momento (se levantó por error, el sitio ya no
   existe, etc.). */
const ESTATUS_REPORTE = ['abierto', 'asignado', 'en_proceso', 'resuelto', 'cerrado', 'cancelado'];
const ETIQUETA_ESTATUS_REPORTE = {
  abierto:'Abierto', asignado:'Asignado', en_proceso:'En proceso',
  resuelto:'Resuelto', cerrado:'Cerrado', cancelado:'Cancelado'
};
const TONO_ESTATUS_REPORTE = {
  abierto:'error', asignado:'alerta', en_proceso:'alerta',
  resuelto:'ok', cerrado:'neutro', cancelado:'neutro'
};

/* Cualquiera con acceso levanta un reporte — es el permiso "de piso", a
   propósito tan abierto: cualquiera que vea algo roto tiene que poder
   avisar. Pero una vez emitido, SOLO puedeGestionarReporte() decide quién
   lo toca (editarlo, moverle el estatus, asignar técnicos, subir o quitar
   evidencia, resolverlo): un reportero puede levantar tickets y seguir su
   estatus, pero no tocar uno que ya emitió — ver `ROLES.reportero`. */
function puedeReportar(){ return !HAY_NUBE || haySesion(); }

/* Quién puede trabajar un reporte ya emitido: administración (owner/admin),
   analyst (ya tenía permiso general de edición desde antes de que existiera
   este módulo, así que no se le quita nada) y el rol nuevo `tecnico`. */
function puedeGestionarReporte(){ return puedeEditar() || sesion.rol === 'tecnico'; }
function exigirGestionReporte(){
  if(puedeGestionarReporte()) return true;
  aviso('Ese reporte ya está emitido: solo un técnico o administración puede modificarlo. Tú puedes verlo y seguir su estatus.', true);
  return false;
}

/* Levantamientos es "para todos los perfiles", a propósito distinto del resto
   del tablero: no hay aquí un piso más abierto para crear y un techo más
   cerrado para gestionar (como sí pasa en Reportes con puedeReportar() vs
   puedeGestionarReporte()) — cualquiera con acceso, sea Viewer, Reportero o
   Técnico, levanta el recorrido Y da seguimiento a sus hallazgos igual que
   Owner/Admin/Analyst. Es un registro de campo, no un documento de precios:
   no hay nada aquí que proteger de quien solo consulta el resto del tablero.
   Borrar el levantamiento completo es la única excepción — eso sigue
   reservado a Admin, como cualquier borrado del sistema. */
function puedeGestionarLevantamiento(){ return !HAY_NUBE || haySesion(); }
function exigirGestionLevantamiento(){
  if(puedeGestionarLevantamiento()) return true;
  aviso('Necesitas una sesión iniciada para levantar o dar seguimiento a un recorrido.', true);
  return false;
}

/* Mismo criterio que puedeGestionarReporte(), aplicado a pólizas: un
   `tecnico` con acceso de solo lectura al resto de la póliza (precios,
   renglones, cobranza — todo eso sigue detrás de puedeEditar()) sí puede
   registrar que un servicio ya se hizo, con fecha, quién lo atendió y
   evidencia fotográfica. Es la misma idea que subir evidencia a un
   reporte: quien está parado frente al equipo es quien puede probar que
   se atendió. */
function puedeRegistrarServicioPoliza(){ return puedeEditar() || sesion.rol === 'tecnico'; }
function exigirRegistroServicio(){
  if(puedeRegistrarServicioPoliza()) return true;
  aviso('Tu cuenta no puede registrar servicios de esta póliza.', true);
  return false;
}

function normalizarEvidencia(e){
  return {
    id: (e && e.id) || nuevoId(),
    dataUrl: (e && e.dataUrl) ? String(e.dataUrl) : '',
    nota: (e && e.nota ? String(e.nota) : '').trim(),
    subioNombre: (e && e.subioNombre ? String(e.subioNombre) : '').trim(),
    cuando: (e && e.cuando) || hoyISO()
  };
}

/* Un respaldo de costo: la cotización de un proveedor externo que sustenta
   el costo interno de una cotización (foto o PDF). */
function normalizarRespaldoCosto(r){
  return {
    id: (r && r.id) || nuevoId(),
    nombre: (r && r.nombre ? String(r.nombre) : '').trim() || 'Archivo',
    tipo: (r && r.tipo === 'pdf') ? 'pdf' : 'imagen',
    dataUrl: (r && r.dataUrl) ? String(r.dataUrl) : '',
    subioNombre: (r && r.subioNombre ? String(r.subioNombre) : '').trim(),

  };
}

function normalizarTecnicoAsignado(t){
  return { uid: (t && t.uid ? String(t.uid) : '').trim(), nombre: (t && t.nombre ? String(t.nombre) : '').trim() };
}

/* Una entrada de la bitácora PROPIA del reporte (distinta de la bitácora
   general del tablero): quién hizo qué y cuándo, para que el historial de UN
   reporte se pueda leer completo sin ir a buscarlo en Administración. */
function normalizarSeguimientoReporte(s){
  return {
    cuando: (s && s.cuando) || new Date().toISOString(),
    quien: (s && s.quien ? String(s.quien) : '').trim(),
    texto: (s && s.texto ? String(s.texto) : '').trim()
  };
}

function normalizarReporte(r){
  const evidencias = (Array.isArray(r && r.evidencias) ? r.evidencias : []).map(normalizarEvidencia).filter(e => e.dataUrl);
  const tecnicos = (Array.isArray(r && r.tecnicos) ? r.tecnicos : []).map(normalizarTecnicoAsignado).filter(t => t.nombre);
  return {
    id: (r && r.id) || nuevoId(),
    folio: (r && r.folio ? String(r.folio) : '').trim(),
    clienteId: (r && r.clienteId) || '',
    sitioId: (r && r.sitioId) || '',
    /* Igual que sitioNombre en pólizas: se copia el texto para que el
       reporte siga diciendo dónde fue aunque el sitio se borre o se
       renombre después. */
    sitioNombre: (r && r.sitioNombre ? String(r.sitioNombre) : '').trim(),
    /* El equipo puede venir del catálogo (id + nombre copiado, como las
       partidas de una póliza) o ser texto libre si no está en la lista —
       nunca un formulario detiene a alguien porque le falta un renglón
       en el catálogo. */
    equipoCatalogoId: (r && r.equipoCatalogoId ? String(r.equipoCatalogoId) : '').trim(),
    equipoNombre: (r && r.equipoNombre ? String(r.equipoNombre) : '').trim(),
    titulo: (r && r.titulo ? String(r.titulo) : '').trim(),
    descripcion: (r && r.descripcion ? String(r.descripcion) : '').trim(),
    /* Lo que el técnico encontró y lo que hizo para resolverlo. Es DISTINTO
       de `descripcion` (esa cuenta el problema, al levantar el reporte) —
       este es el reporte de atención, y es obligatorio para poder marcar el
       reporte como resuelto (ver `cerrable()` y modalResolverReporte). */
    reporteAtencion: (r && r.reporteAtencion ? String(r.reporteAtencion) : '').trim(),
    prioridad: PRIORIDAD_REPORTE.includes(r && r.prioridad) ? r.prioridad : 'media',
    estatus: ESTATUS_REPORTE.includes(r && r.estatus) ? r.estatus : 'abierto',
    tecnicos,
    reportadoPor: {
      uid: (r && r.reportadoPor && r.reportadoPor.uid) || '',
      nombre: (r && r.reportadoPor && r.reportadoPor.nombre) || ''
    },
    fechaCreacion: /^\d{4}-\d{2}-\d{2}$/.test(r && r.fechaCreacion) ? r.fechaCreacion : hoyISO(),
    fechaCierre: /^\d{4}-\d{2}-\d{2}$/.test(r && r.fechaCierre) ? r.fechaCierre : '',
    /* El puente hacia Cotizaciones: si de este reporte salió un trabajo que
       hay que cotizar, aquí queda la liga en los dos sentidos (ver
       `cotizacionPorId(r.cotizacionId)` y, del otro lado, el reporte que
       trae `cot.reporteOrigenId === r.id`). */
    cotizacionId: (r && r.cotizacionId) || '',
    evidencias,
    seguimiento: (Array.isArray(r && r.seguimiento) ? r.seguimiento : []).map(normalizarSeguimientoReporte)
  };
}

function reportePorId(id){ return datos.reportes.find(r => r.id === id); }
function reportesDeSitio(sitioId){ return datos.reportes.filter(r => r.sitioId === sitioId); }
function reportesDeCliente(clienteId){ return datos.reportes.filter(r => r.clienteId === clienteId); }

function tonoReporte(r){
  const t = TONO_ESTATUS_REPORTE[r.estatus] || 'neutro';
  /* Un reporte urgente y todavía sin técnico grita más fuerte que su estatus:
     "abierto" ya es rojo, pero uno urgente en proceso también debe leerse
     distinto de uno de prioridad baja en proceso. */
  if(r.prioridad === 'urgente' && !['resuelto','cerrado','cancelado'].includes(r.estatus)) return 'error';
  return t;
}

/* TK-ddmmaa-NNNN: mismo molde que las cotizaciones, cuatro dígitos porque
   cualquiera puede levantar uno desde su celular. Es sugerencia, no candado:
   como el folio de cotización, sigue siendo texto libre por si hace falta
   corregirlo a mano. */
function generarFolioReporte(fechaISO){
  const f = /^\d{4}-\d{2}-\d{2}$/.test(fechaISO) ? fechaISO : hoyISO();
  const ddmmaa = f.slice(8,10) + f.slice(5,7) + f.slice(2,4);
  return 'TK-' + ddmmaa + '-' + String(datos.reportes.length + 1).padStart(4,'0');
}

function guardarReporte(r, accion, detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'reportes', id:r.id, obj:r });
  anotar(accion || 'editó', 'reporte', r.folio || r.titulo || 'sin folio', detalle);
}

/* Agrega una línea a la bitácora PROPIA del reporte y guarda. Se usa en cada
   acción que cambia algo importante (asignar técnico, cambiar estatus, subir
   evidencia) para que abrir el reporte cuente su historia completa. */
function anotarReporte(r, texto, accionGlobal, detalleGlobal){
  r.seguimiento.push(normalizarSeguimientoReporte({ quien: nombreDe(sesion) || 'Alguien del equipo', texto }));
  guardarReporte(r, accionGlobal, detalleGlobal);
}

/* ============================ Levantamientos ============================
   Séptimo módulo: el recorrido de sitio. Distinto de un Reporte —que nace de
   UN problema puntual que alguien reporta— un levantamiento nace de UNA
   visita completa, y de esa visita pueden salir VARIOS hallazgos, cada uno
   marcado como corrective (hay que arreglarlo ya) o preventivo (conviene
   hacerlo antes de que truene). Es el "reporte detallado" pensado para
   armar el plan de mantenimiento, no para atender una urgencia aislada.

   Permisos: ver puedeGestionarLevantamiento(), arriba — "para todos los
   perfiles", sin el piso/techo que sí tiene Reportes. */

const ACCION_HALLAZGO = ['correctivo', 'preventivo'];
const ETIQUETA_ACCION_HALLAZGO = { correctivo:'Correctivo', preventivo:'Preventivo' };

const ESTATUS_HALLAZGO = ['pendiente', 'resuelto'];
const ETIQUETA_ESTATUS_HALLAZGO = { pendiente:'Pendiente', resuelto:'Resuelto' };

/* Menos cupo que la evidencia de un reporte (6): aquí es UN hallazgo de
   VARIOS en la misma visita, no el caso completo. */
const EVIDENCIA_MAX_POR_HALLAZGO = 4;

function normalizarHallazgo(h){
  return {
    id: (h && h.id) || nuevoId(),
    /* Dónde, dentro del sitio: "Cocina caliente", "Cámara 2", "Azotea" — texto
       libre porque un levantamiento cubre instalaciones, no solo equipos. */
    ubicacion: (h && h.ubicacion ? String(h.ubicacion) : '').trim(),
    /* El equipo es OPCIONAL y, si aplica, viene del catálogo (id + nombre
       copiado, mismo molde que en reportes/pólizas) o texto libre: un
       hallazgo de "falta señalización de salida" no tiene equipo. */
    equipoCatalogoId: (h && h.equipoCatalogoId ? String(h.equipoCatalogoId) : '').trim(),
    equipoNombre: (h && h.equipoNombre ? String(h.equipoNombre) : '').trim(),
    hallazgo: (h && h.hallazgo ? String(h.hallazgo) : '').trim(),
    accion: ACCION_HALLAZGO.includes(h && h.accion) ? h.accion : 'correctivo',
    prioridad: PRIORIDAD_REPORTE.includes(h && h.prioridad) ? h.prioridad : 'media',
    /* Qué se recomienda hacer — distinto de `hallazgo` (eso es lo que SE
       ENCONTRÓ), igual que reporteAtencion es distinto de descripcion en
       Reportes. */
    accionSugerida: (h && h.accionSugerida ? String(h.accionSugerida) : '').trim(),
    estatus: ESTATUS_HALLAZGO.includes(h && h.estatus) ? h.estatus : 'pendiente',
    resueltoNota: (h && h.resueltoNota ? String(h.resueltoNota) : '').trim(),
    evidencias: (Array.isArray(h && h.evidencias) ? h.evidencias : [])
      .map(normalizarEvidencia).filter(e => e.dataUrl).slice(0, EVIDENCIA_MAX_POR_HALLAZGO),
    /* Qué hace falta cotizar (refacción, servicio, material) y la solicitud
       de cotización (borrador) que se generó sola para pedirlo — mismo
       criterio exacto que refaccion/refaccionCotizacionId en el servicio de
       una póliza: la liga se pone UNA sola vez. */
    cotizar: (h && h.cotizar ? String(h.cotizar) : '').trim(),
    cotizacionId: (h && h.cotizacionId ? String(h.cotizacionId) : '').trim()
  };
}

function normalizarLevantamiento(l){
  /* Un hallazgo sin texto es una fila que alguien abrió y no llenó — se tira,
     igual que un renglón sin concepto en una póliza. */
  const hallazgos = (Array.isArray(l && l.hallazgos) ? l.hallazgos : [])
    .map(normalizarHallazgo).filter(h => h.hallazgo);
  return {
    id: (l && l.id) || nuevoId(),
    folio: (l && l.folio ? String(l.folio) : '').trim(),
    clienteId: (l && l.clienteId) || '',
    sitioId: (l && l.sitioId) || '',
    sitioNombre: (l && l.sitioNombre ? String(l.sitioNombre) : '').trim(),
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(l && l.fecha) ? l.fecha : hoyISO(),
    /* Quién hizo el recorrido — se copia el texto, no solo el uid, mismo
       criterio que `vendedor` en pólizas: el papel tiene que seguir diciendo
       lo mismo aunque esa persona ya no esté en el equipo. */
    realizoNombre: (l && l.realizoNombre ? String(l.realizoNombre) : '').trim(),
    notasGenerales: (l && l.notasGenerales ? String(l.notasGenerales) : '').trim(),
    hallazgos
  };
}

function levantamientoPorId(id){ return datos.levantamientos.find(l => l.id === id); }
function levantamientosDeSitio(sitioId){ return datos.levantamientos.filter(l => l.sitioId === sitioId); }
function levantamientosDeCliente(clienteId){ return datos.levantamientos.filter(l => l.clienteId === clienteId); }

const hallazgosPendientes = l => l.hallazgos.filter(h => h.estatus === 'pendiente').length;
/* Sin hallazgos todavía no cuenta como "cerrado": es un levantamiento a
   medio llenar, no uno donde ya no falta nada. */
const levantamientoCerrado = l => l.hallazgos.length > 0 && hallazgosPendientes(l) === 0;

function tonoLevantamiento(l){
  if(levantamientoCerrado(l)) return 'ok';
  const hayUrgente = l.hallazgos.some(h => h.estatus === 'pendiente' && h.prioridad === 'urgente');
  if(hayUrgente) return 'error';
  const hayCorrectivoPendiente = l.hallazgos.some(h => h.estatus === 'pendiente' && h.accion === 'correctivo');
  return hayCorrectivoPendiente ? 'alerta' : 'neutro';
}

/* LV-ddmmaa-NN: mismo molde que las cotizaciones — un levantamiento es una
   visita completa, no un ticket suelto, así que su volumen es más parecido
   al de cotizaciones que al de reportes (de ahí los dos dígitos, no cuatro). */
function generarFolioLevantamiento(fechaISO){
  const f = /^\d{4}-\d{2}-\d{2}$/.test(fechaISO) ? fechaISO : hoyISO();
  const ddmmaa = f.slice(8,10) + f.slice(5,7) + f.slice(2,4);
  return 'LV-' + ddmmaa + '-' + String(datos.levantamientos.length + 1).padStart(2,'0');
}

function guardarLevantamiento(l, accion, detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'levantamientos', id:l.id, obj:l });
  anotar(accion || 'editó', 'levantamiento', l.folio || l.sitioNombre || 'sin folio', detalle);
}

/* Genera la solicitud de cotización (borrador) de lo que uno o VARIOS
   hallazgos pidieron cotizar — mismo criterio de fondo que
   generarSolicitudCotizacionRefaccion() en pólizas: nace en 'borrador', con
   la liga hacia atrás (levantamientoOrigenId/levantamientoOrigenHallazgoIds)
   para que Cotizaciones sepa de dónde salió.

   A propósito NO se llama sola al guardar un hallazgo (a diferencia de la
   refacción de pólizas): con un levantamiento de varios hallazgos, Victor
   pidió poder juntar dos o más solicitudes en UNA sola cotización —o
   mandarlas por separado, a su elección—, y eso solo se puede decidir una
   vez que ya existen los hallazgos que se van a combinar. Por eso el
   hallazgo solo guarda `cotizar` (el texto) al capturarse, y la cotización
   de verdad se genera después, desde el bloque "Cotizaciones por generar"
   en vistaLevantamiento(). */
function generarSolicitudCotizacionHallazgos(l, hallazgos){
  const varios = hallazgos.length > 1;
  const cot = normalizarCotizacion({
    id: nuevoId(),
    folio: generarFolioCotizacion(hoyISO()),
    sitioId: l.sitioId,
    tipoMtto: hallazgos.some(h => h.accion === 'correctivo') ? 'CORRECTIVO' : 'PREVENTIVO',
    solicitud: 'Levantamiento · ' + (varios
      ? hallazgos.length + ' hallazgos'
      : (hallazgos[0].ubicacion || hallazgos[0].equipoNombre || 'hallazgo')) + ' · ' + (l.folio || ''),
    notas: 'Cotización pedida desde ' + (varios ? hallazgos.length + ' hallazgos' : 'un hallazgo')
      + ' del levantamiento ' + (l.folio || '') + ' en ' + (l.sitioNombre || '') + '.',
    levantamientoOrigenId: l.id,
    levantamientoOrigenHallazgoIds: hallazgos.map(h => h.id),
    partidas: hallazgos.map(h => normalizarPartidaCotizacion({ concepto: h.cotizar, cantidad: 1 }))
  });
  datos.cotizaciones.push(cot);
  guardarCotizacion(cot, 'creó', 'solicitud de cotización desde ' + hallazgos.length + ' '
    + plural(hallazgos.length,'hallazgo','hallazgos') + ' de levantamiento');
  return cot.id;
}

/* ---- Análisis de funcionamiento (Levantamientos) ----
   Cuánto "pesa" un hallazgo correctivo pendiente, según prioridad: entre más
   grave, más baja el score del equipo. Preventivo (aunque esté pendiente) y
   cualquier hallazgo ya resuelto NUNCA bajan el score — no es una falla de
   operación, es mantenimiento recomendado o ya atendido. */
const FACTOR_HALLAZGO_CORRECTIVO_PENDIENTE = { urgente:0, alta:0.25, media:0.5, baja:0.75 };
function scoreHallazgo(h){
  if(h.accion === 'preventivo' || h.estatus === 'resuelto') return 1;
  const f = FACTOR_HALLAZGO_CORRECTIVO_PENDIENTE[h.prioridad];
  return f === undefined ? 0.5 : f;
}

/* Etiqueta de gravedad EN PALABRAS para el análisis de funcionamiento — a
   propósito nunca un %, porque un % por equipo es justo lo que hacía pensar
   que "todos dicen 50%" significaba "la cocina está al 50%". Mismo criterio
   que scoreHallazgo() (correctivo/prioridad/estatus), nada más presentado
   como texto en vez de número. */
const ETIQUETA_SEVERIDAD_PRIORIDAD = {
  urgente: { texto: 'Crítico', tono: 'error' },
  alta:    { texto: 'Grave',   tono: 'error' },
  media:   { texto: 'Medio',   tono: 'alerta' },
  baja:    { texto: 'Leve',    tono: 'alerta' }
};
function etiquetaSeveridadHallazgo(h){
  if(h.estatus === 'resuelto') return { texto: 'Resuelto', tono: 'ok' };
  if(h.accion === 'preventivo') return { texto: 'Preventivo', tono: 'ok' };
  return ETIQUETA_SEVERIDAD_PRIORIDAD[h.prioridad] || { texto: 'Medio', tono: 'alerta' };
}

/* % de funcionamiento de la cocina/sitio en este levantamiento — a propósito
   SOLO cuenta los equipos que tienen algún hallazgo ligado (equipoCatalogoId
   o equipoNombre): un hallazgo de infraestructura sin equipo (ej. "falta
   señalización") se puede cotizar, pero no afecta si la cocina opera, así
   que no entra a la cuenta (decisión de Victor, 27-ago-2026, para no
   necesitar un inventario completo de equipos por sitio: el % se arma con lo
   que el recorrido de verdad encontró). Cada equipo distinto toma el peor de
   sus hallazgos (el score más bajo), ponderado por su "peso" del catálogo —
   un equipo fuera de catálogo (texto libre, no encontrado por id) pesa 3
   (media) por default, igual que un equipo recién dado de alta. */
function calcularFuncionamientoLevantamiento(l){
  const porEquipo = new Map();
  l.hallazgos.forEach(h=>{
    const key = h.equipoCatalogoId || (h.equipoNombre ? 'texto:' + llaveTexto(h.equipoNombre) : '');
    if(!key) return;
    const eq = h.equipoCatalogoId ? equipoDeCatalogo(h.equipoCatalogoId) : null;
    const peso = eq ? eq.ponderacion : 3;
    const score = scoreHallazgo(h);
    const actual = porEquipo.get(key);
    if(!actual || score < actual.peorScore){
      porEquipo.set(key, { nombre: h.equipoNombre || (eq && eq.concepto) || 'Equipo', peso, peorScore: score, peorHallazgo: h });
    }
  });
  if(!porEquipo.size) return null;
  const equipos = Array.from(porEquipo.values());
  const sumaPeso = equipos.reduce((s,x)=> s + x.peso, 0);
  const sumaPonderada = equipos.reduce((s,x)=> s + x.peso * x.peorScore, 0);
  const pct = Math.round((sumaPonderada / sumaPeso) * 100);

  /* Reparte el 100% en un "presupuesto de puntos" por equipo, según su peso
     — y muestra cuántos de esos puntos ya trae y cuántos le faltan. Es la
     misma cuenta de siempre, nada más partida para que se pueda leer sin
     explicar la ponderación: sumando puntosActuales de todos los equipos da
     exactamente el % de arriba, y puntosPosibles de todos suma 100 (con el
     redondeo normal de repartir enteros). Así "le faltan 40 puntos de 40
     para llegar a su máximo" es tan directo como se puede poner. */
  equipos.forEach(eq=>{
    eq.puntosPosibles = Math.round((eq.peso / sumaPeso) * 100);
    eq.puntosActuales = Math.round((eq.peso * eq.peorScore / sumaPeso) * 100);
    eq.puntosFaltan = eq.puntosPosibles - eq.puntosActuales;
    const sev = etiquetaSeveridadHallazgo(eq.peorHallazgo);
    eq.severidadTexto = sev.texto;
    eq.severidadTono = sev.tono;
  });

  return {
    pct,
    equipos: equipos.sort((a,b)=> a.peorScore - b.peorScore)
  };
}

/* =============================== Módulo Imagen / Aperturas =============================== */
/* Octavo módulo: proyectos de cambio de imagen, apertura de sucursal o
   remodelación — de la marca/prospecto hasta el costo estimado y el material
   visual (renders, planos, layout) para presentarlo. A propósito puede colgar
   de un cliente/sitio YA dado de alta (existente, o creado ahí mismo con el
   mismo "+ Nuevo" que Levantamientos) O ser un prospecto que todavía no es
   cliente formal de mantenimiento — Victor, 27-ago-2026: "puede ser los
   sitios existentes... o inclusive nuevo realmente sin levantamiento". Por
   eso clienteId/sitioId son OPCIONALES, y clienteNombre/sitioNombre son
   texto SIEMPRE presente (copiado del registro real si existe, o tecleado a
   mano si es un prospecto) — mismo criterio que sitioNombre en Levantamiento,
   nada más un nivel más arriba porque aquí ni el cliente es seguro.

   A diferencia de Levantamientos (abierto a todos los perfiles), este módulo
   queda para quien ya puede editar precios (puedeEditar(): owner/admin/
   analyst) — son costos y proyectos comerciales, no un registro de campo
   abierto a cualquiera (decisión de Victor, 27-ago-2026). */
const TIPO_PROYECTO_IMAGEN = ['apertura', 'remodelacion', 'cambio_imagen'];
const ETIQUETA_TIPO_PROYECTO_IMAGEN = { apertura:'Apertura nueva', remodelacion:'Remodelación', cambio_imagen:'Cambio de imagen' };
const ESTATUS_PROYECTO_IMAGEN = ['diseno', 'cotizacion', 'aprobado', 'obra', 'terminado', 'cancelado'];
const ETIQUETA_ESTATUS_PROYECTO_IMAGEN = { diseno:'En diseño', cotizacion:'En cotización', aprobado:'Aprobado', obra:'En obra', terminado:'Terminado', cancelado:'Cancelado' };
const TONO_ESTATUS_PROYECTO_IMAGEN = { diseno:'info', cotizacion:'info', aprobado:'alerta', obra:'alerta', terminado:'ok', cancelado:'neutro' };
const TIPO_IMAGEN_PROYECTO = ['render', 'plano', 'foto'];
const ETIQUETA_TIPO_IMAGEN_PROYECTO = { render:'Render', plano:'Plano / layout', foto:'Foto' };
const IMAGENES_MAX_POR_PROYECTO = 12;
/* Firestore rechaza un documento de más de 1 MiB completo — y con
   IMAGENES_MAX_POR_PROYECTO=12, varias imágenes convertidas de un PDF (más
   pesadas que una foto normal) sí lo pueden rebasar sin este tope. Se
   valida AQUÍ, al agregar, para avisar de inmediato ("ya no cabe") en vez
   de descubrirlo después con un guardado que la nube rechaza en silencio
   —eso mismo pasó en producción el 27-ago-2026, un proyecto se quedó
   "Sin conexión" para siempre porque en realidad el documento ya no cabía,
   no porque faltara internet. 800 KB dejando margen para el resto de los
   campos del proyecto (conceptos, notas, etc.) dentro del 1 MiB. */
const IMAGENES_PRESUPUESTO_TOTAL = 800 * 1024;
function tamanoImagenesProyecto(lista){
  return lista.reduce((s, im) => s + (im.dataUrl ? im.dataUrl.length : 0), 0);
}

/* Un concepto de costo es INFORMATIVO a propósito (decisión de Victor,
   27-ago-2026): el desglose de lo que cuesta la remodelación/apertura, para
   verlo en el PDF y llevar el total — si hace falta un documento formal para
   el cliente, eso se arma aparte con el motor de Cotizaciones, sin que cada
   concepto de aquí tenga que generar un renglón allá. */
function normalizarConceptoProyecto(x){
  return {
    id: (x && x.id) || nuevoId(),
    /* Opcional: quién lo surte. No se exige porque un concepto capturado a
       mano casi nunca trae proveedor todavía (se cotiza después) — pero SÍ
       viaja completo cuando se importa de un desglose como el de Excel, que
       trae un proveedor por renglón. */
    proveedor: (x && x.proveedor ? String(x.proveedor) : '').trim(),
    concepto: (x && x.concepto ? String(x.concepto) : '').trim(),
    cantidad: Math.max(0, numDef(x && x.cantidad, 1)),
    precioUnitario: Math.max(0, numDef(x && x.precioUnitario, 0))
  };
}
function totalConceptosProyecto(p){
  return p.conceptos.reduce((s,c)=> s + c.cantidad * c.precioUnitario, 0);
}
/* Un renglón es MANO DE OBRA si su proveedor viene marcado literalmente como
   "Servicios" o "Servicios / IT" (así llega en los desgloses reales: la
   mano de obra no trae un proveedor de verdad, trae esta etiqueta) — TODO lo
   demás es material comprado. Decisión de Victor, 28-ago-2026: separar
   inversión total en materiales vs. mano de obra, sin tocar cómo se captura
   el proveedor de cada renglón. */
function esConceptoManoDeObra(c){
  const norm = (c.proveedor || '').toLowerCase().trim().replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ');
  return norm === 'servicios' || norm === 'servicios/it';
}
function desgloseConceptosProyecto(p){
  let materiales = 0, manoObra = 0;
  p.conceptos.forEach(c=>{
    const monto = c.cantidad * c.precioUnitario;
    if(esConceptoManoDeObra(c)) manoObra += monto; else materiales += monto;
  });
  return { materiales, manoObra, total: materiales + manoObra };
}

/* Mismo molde que normalizarEvidencia (dataUrl/nota/subioNombre/cuando), con
   un `tipo` extra para distinguir un render de un plano a simple vista — aquí
   sí importa, a diferencia de una foto suelta de reporte o hallazgo.

   `formato` es harina de otro costal: un plano casi siempre llega como PDF
   (así lo entrega el arquitecto), no como foto — mismo criterio exacto que
   normalizarRespaldoCosto() en cotizaciones: 'pdf' se guarda TAL CUAL (no
   se puede recomprimir un PDF desde el navegador), 'imagen' pasa por
   comprimirEvidencia() como cualquier foto. `nombre` solo hace falta para un
   PDF: no hay miniatura que enseñar, así que se enseña el nombre del
   archivo en su lugar. */
function normalizarImagenProyecto(x){
  const base = normalizarEvidencia(x);
  base.tipo = TIPO_IMAGEN_PROYECTO.includes(x && x.tipo) ? x.tipo : 'render';
  base.formato = (x && x.formato === 'pdf') ? 'pdf' : 'imagen';
  base.nombre = (x && x.nombre ? String(x.nombre) : '').trim();
  return base;
}

function normalizarProyectoImagen(p){
  const conceptos = (Array.isArray(p && p.conceptos) ? p.conceptos : [])
    .map(normalizarConceptoProyecto).filter(c => c.concepto);
  const imagenes = (Array.isArray(p && p.imagenes) ? p.imagenes : [])
    .map(normalizarImagenProyecto).filter(im => im.dataUrl).slice(0, IMAGENES_MAX_POR_PROYECTO);
  return {
    id: (p && p.id) || nuevoId(),
    folio: (p && p.folio ? String(p.folio) : '').trim(),
    clienteId: (p && p.clienteId) || '',
    clienteNombre: (p && p.clienteNombre ? String(p.clienteNombre) : '').trim(),
    sitioId: (p && p.sitioId) || '',
    sitioNombre: (p && p.sitioNombre ? String(p.sitioNombre) : '').trim(),
    nombreProyecto: (p && p.nombreProyecto ? String(p.nombreProyecto) : '').trim(),
    tipo: TIPO_PROYECTO_IMAGEN.includes(p && p.tipo) ? p.tipo : 'apertura',
    estatus: ESTATUS_PROYECTO_IMAGEN.includes(p && p.estatus) ? p.estatus : 'diseno',
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(p && p.fecha) ? p.fecha : hoyISO(),
    /* fechaObjetivo = fecha de apertura (o de reapertura, en una
       remodelación): el hito que le importa al negocio. fechaEntrada/
       fechaSalida acotan la obra en el sitio — de ahí sale la duración del
       cronograma. Las tres son independientes y opcionales: un proyecto en
       diseño puede no tener ninguna todavía. */
    fechaObjetivo: /^\d{4}-\d{2}-\d{2}$/.test(p && p.fechaObjetivo) ? p.fechaObjetivo : '',
    fechaEntrada: /^\d{4}-\d{2}-\d{2}$/.test(p && p.fechaEntrada) ? p.fechaEntrada : '',
    fechaSalida: /^\d{4}-\d{2}-\d{2}$/.test(p && p.fechaSalida) ? p.fechaSalida : '',
    responsable: (p && p.responsable ? String(p.responsable) : '').trim(),
    notas: (p && p.notas ? String(p.notas) : '').trim(),
    conceptos,
    imagenes
  };
}

function proyectoImagenPorId(id){ return datos.proyectosImagen.find(p => p.id === id); }
function proyectosImagenDeSitio(sitioId){ return datos.proyectosImagen.filter(p => p.sitioId === sitioId); }
function proyectosImagenDeCliente(clienteId){ return datos.proyectosImagen.filter(p => p.clienteId === clienteId); }

/* IMG-ddmmaa-NN: mismo molde que levantamientos/cotizaciones. */
function generarFolioProyectoImagen(fechaISO){
  const f = /^\d{4}-\d{2}-\d{2}$/.test(fechaISO) ? fechaISO : hoyISO();
  const ddmmaa = f.slice(8,10) + f.slice(5,7) + f.slice(2,4);
  return 'IMG-' + ddmmaa + '-' + String(datos.proyectosImagen.length + 1).padStart(2,'0');
}

function guardarProyectoImagen(p, accion, detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'proyectosImagen', id:p.id, obj:p });
  anotar(accion || 'editó', 'proyecto de imagen', p.folio || p.nombreProyecto || 'sin folio', detalle);
}

/* ===================== Importar Excel (Imagen/Aperturas) =====================
   Victor comparte los presupuestos de remodelación/apertura en un Excel como
   ARCHIVO_DE_INVERSION_ADIANT.xlsx: una tabla con PROVEEDOR/CONCEPTOS/UD/
   CANT/PRECIO UNITARIO/… — y pidió poder subirlo tal cual en vez de
   recapturar renglón por renglón.

   Un .xlsx es un ZIP con XML adentro. En vez de traer una librería externa
   (SheetJS y similares, fuera de las reglas de esta app: un solo archivo,
   sin CDN ni build), se lee a mano con lo que YA trae el navegador:
   DecompressionStream('deflate-raw') para inflar el DEFLATE del ZIP, y
   DOMParser para leer el XML de cada hoja. Alcance a propósito acotado: nada
   más lo que hace falta para reconocer ESTA tabla de costos (sea cual sea
   el nombre o la posición de la hoja), no un lector de Excel genérico. */

async function inflarDeflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('Este navegador no puede leer archivos comprimidos aquí. Actualiza Chrome/Edge/Firefox a una versión reciente.');
  }
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}

/* Lector de ZIP mínimo (sin ZIP64: de sobra para un .xlsx real) — regresa un
   Map nombre de archivo -> bytes YA descomprimidos. Lee el directorio
   central desde el final del archivo (firma 0x06054b50), y por cada entrada
   busca su cabecera local (su nombre/extra pueden medir distinto ahí) para
   saber dónde empiezan los datos de verdad. */
async function leerZip(buffer){
  const dv = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let eocd = -1;
  const desde = Math.max(0, bytes.length - 22 - 65536);
  for(let i = bytes.length - 22; i >= desde; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('No se reconoce el archivo como .xlsx (no es un ZIP válido).');
  const totalEntradas = dv.getUint16(eocd + 10, true);
  let offset = dv.getUint32(eocd + 16, true);

  const archivos = new Map();
  for(let i = 0; i < totalEntradas; i++){
    if(dv.getUint32(offset, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(offset + 10, true);
    const compSize = dv.getUint32(offset + 20, true);
    const nombreLen = dv.getUint16(offset + 28, true);
    const extraLen = dv.getUint16(offset + 30, true);
    const comentLen = dv.getUint16(offset + 32, true);
    const localOffset = dv.getUint32(offset + 42, true);
    const nombre = new TextDecoder('utf-8').decode(bytes.subarray(offset + 46, offset + 46 + nombreLen));

    const nombreLenL = dv.getUint16(localOffset + 26, true);
    const extraLenL = dv.getUint16(localOffset + 28, true);
    const inicioDatos = localOffset + 30 + nombreLenL + extraLenL;
    const datosComprimidos = bytes.subarray(inicioDatos, inicioDatos + compSize);

    if(metodo === 0) archivos.set(nombre, datosComprimidos);
    else if(metodo === 8) archivos.set(nombre, await inflarDeflateRaw(datosComprimidos));
    /* Otros métodos de compresión son rarísimos en un .xlsx real (todo lo
       genera Excel/Sheets con 0 u 8) — si aparece uno, ese archivo del ZIP
       simplemente no queda disponible, y como no es ninguno de los que se
       leen abajo (sharedStrings/workbook/hojas), no hace falta. */

    offset += 46 + nombreLen + extraLen + comentLen;
  }
  return archivos;
}

function textoDeArchivoZip(mapaZip, nombre){
  const bytes = mapaZip.get(nombre);
  return bytes ? new TextDecoder('utf-8').decode(bytes) : '';
}

function leerSharedStringsXlsx(mapaZip){
  const xml = textoDeArchivoZip(mapaZip, 'xl/sharedStrings.xml');
  if(!xml) return [];
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  return Array.from(doc.getElementsByTagName('si')).map(si =>
    Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
}

/* Nombre de hoja -> archivo real (sheet1.xml, sheet2.xml…): el orden y los
   nombres de archivo NO siempre coinciden con el orden de las pestañas, hay
   que seguir workbook.xml + su .rels. */
function mapaHojasXlsx(mapaZip){
  const wbDoc = new DOMParser().parseFromString(textoDeArchivoZip(mapaZip, 'xl/workbook.xml'), 'application/xml');
  const relsDoc = new DOMParser().parseFromString(textoDeArchivoZip(mapaZip, 'xl/_rels/workbook.xml.rels'), 'application/xml');
  const relPorId = new Map();
  Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(r => relPorId.set(r.getAttribute('Id'), r.getAttribute('Target')));
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return Array.from(wbDoc.getElementsByTagName('sheet')).map(s=>{
    const rid = s.getAttribute('r:id') || s.getAttributeNS(NS_R, 'id');
    const target = relPorId.get(rid) || '';
    /* Excel/Google Sheets escriben el Target RELATIVO a xl/ ("worksheets/sheet1.xml"),
       pero algunas librerías (p.ej. openpyxl) lo escriben ABSOLUTO desde la raíz
       del paquete ("/xl/worksheets/sheet1.xml") — con el "/xl/" ya incluido.
       Antes se le anteponía "xl/" sin distinguir los dos casos, y un archivo
       absoluto terminaba apuntando a "xl/xl/worksheets/sheet1.xml" (no existe
       en el zip), leyéndose como 0 filas sin ningún error visible. */
    const ruta = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    return { nombre: s.getAttribute('name'), ruta };
  }).filter(h => h.ruta !== 'xl/');
}

function columnaXlsxANumero(ref){
  const letras = /^([A-Z]+)/.exec(ref)[1];
  let n = 0;
  for(const ch of letras) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

/* Una hoja como una matriz de valores YA resueltos (texto de sharedStrings
   o inline, número tal cual) — cada fila es un arreglo alineado por columna
   (fila[0] = columna A, fila[1] = columna B…), con huecos para columnas sin
   valor. */
function leerHojaXlsxComoFilas(mapaZip, ruta, sharedStrings){
  const xml = textoDeArchivoZip(mapaZip, ruta);
  if(!xml) return [];
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const filas = [];
  Array.from(doc.getElementsByTagName('row')).forEach(rowEl=>{
    const numFila = parseInt(rowEl.getAttribute('r'), 10) - 1;
    const fila = filas[numFila] = filas[numFila] || [];
    Array.from(rowEl.getElementsByTagName('c')).forEach(cEl=>{
      const ref = cEl.getAttribute('r');
      if(!ref) return;
      const col = columnaXlsxANumero(ref) - 1;
      const tipo = cEl.getAttribute('t');
      const vEl = cEl.getElementsByTagName('v')[0];
      let valor = null;
      if(tipo === 's') valor = vEl ? (sharedStrings[parseInt(vEl.textContent, 10)] || '') : '';
      else if(tipo === 'inlineStr'){
        const isEl = cEl.getElementsByTagName('is')[0];
        valor = isEl ? Array.from(isEl.getElementsByTagName('t')).map(t => t.textContent).join('') : '';
      }
      else if(tipo === 'str') valor = vEl ? vEl.textContent : '';
      else valor = vEl && vEl.textContent !== '' ? parseFloat(vEl.textContent) : null;
      fila[col] = valor;
    });
  });
  for(let i = 0; i < filas.length; i++) if(!filas[i]) filas[i] = [];
  return filas;
}

async function leerLibroXlsx(archivo){
  const buffer = await archivo.arrayBuffer();
  const mapaZip = await leerZip(buffer);
  const sharedStrings = leerSharedStringsXlsx(mapaZip);
  return mapaHojasXlsx(mapaZip).map(h => ({ nombre: h.nombre, filas: leerHojaXlsxComoFilas(mapaZip, h.ruta, sharedStrings) }));
}

/* ---- De filas crudas a conceptos: encuentra la tabla sin importar en qué
   hoja ni en qué posición esté ---- */
const ALIAS_COLUMNA_COSTOS_PROYECTO = {
  proveedor: ['PROVEEDOR'],
  concepto: ['CONCEPTOS', 'CONCEPTO', 'DESCRIPCION'],
  cantidad: ['CANT', 'CANT.', 'CANTIDAD'],
  precioUnitario: ['PRECIO UNITARIO', 'P. UNITARIO', 'PRECIO UNIT']
};

function normalizarTextoEncabezadoXlsx(s){
  return String(s == null ? '' : s).toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ').trim();
}

/* Busca, en TODAS las hojas y TODOS los renglones, el que más se parezca a
   un encabezado de tabla de costos — entre más columnas conocidas reconoce,
   mejor candidato. Así no importa si la hoja se llama "FACHADA", el nombre
   del proyecto, o cualquier otra cosa, ni en qué fila/hoja esté la tabla
   (por ejemplo, no confunde la tabla resumen con los mini-desgloses de
   materiales de la hoja "MATERIALES", que no traen PROVEEDOR). */
function buscarTablaCostosXlsx(hojas){
  let mejor = null;
  hojas.forEach(hoja=>{
    hoja.filas.forEach((fila, i)=>{
      const normal = fila.map(normalizarTextoEncabezadoXlsx);
      const columnas = {};
      let encontrados = 0;
      Object.keys(ALIAS_COLUMNA_COSTOS_PROYECTO).forEach(campo=>{
        const idx = normal.findIndex(txt => ALIAS_COLUMNA_COSTOS_PROYECTO[campo].includes(txt));
        if(idx >= 0){ columnas[campo] = idx; encontrados++; }
      });
      const esTablaDeCostos = ['concepto', 'cantidad', 'precioUnitario'].every(c => columnas[c] !== undefined);
      if(esTablaDeCostos && (!mejor || encontrados > mejor.encontrados)){
        mejor = { hoja: hoja.nombre, filaEncabezado: i, columnas, encontrados };
      }
    });
  });
  return mejor;
}

function extraerConceptosXlsx(hoja, tabla){
  const conceptos = [];
  let vaciosSeguidos = 0;
  for(let i = tabla.filaEncabezado + 1; i < hoja.filas.length; i++){
    const fila = hoja.filas[i] || [];
    const concepto = fila[tabla.columnas.concepto];
    const cantidad = fila[tabla.columnas.cantidad];
    const precioUnitario = fila[tabla.columnas.precioUnitario];
    if(typeof concepto !== 'string' || !concepto.trim() || /^TOTAL/i.test(concepto.trim())){
      /* Un renglón de totales, o simplemente vacío (a veces hay una fila de
         aire entre grupos) — se tolera hasta 5 seguidos antes de dar por
         terminada la tabla, para no seguir leyendo basura muy abajo. */
      if(conceptos.length && ++vaciosSeguidos >= 5) break;
      continue;
    }
    vaciosSeguidos = 0;
    if(typeof cantidad !== 'number' && typeof precioUnitario !== 'number') continue;
    conceptos.push(normalizarConceptoProyecto({
      proveedor: tabla.columnas.proveedor !== undefined ? fila[tabla.columnas.proveedor] : '',
      concepto: concepto.trim(),
      cantidad: typeof cantidad === 'number' ? cantidad : 1,
      precioUnitario: typeof precioUnitario === 'number' ? precioUnitario : 0
    }));
  }
  return conceptos;
}

/* ---- Metadatos sueltos del encabezado del documento (nombre del proyecto,
   fecha, quién lo elaboró) — se buscan por etiqueta, no por celda fija: cada
   Excel los acomoda un poco distinto, pero la etiqueta ("PROYECTO", "FECHA",
   "ELABORÓ") se repite. Lo que no se reconoce se deja en blanco: el usuario
   lo revisa y completa en el modal antes de guardar, nunca se inventa. ---- */
const MESES_ES_XLSX = { ENERO:1, FEBRERO:2, MARZO:3, ABRIL:4, MAYO:5, JUNIO:6, JULIO:7, AGOSTO:8,
  SEPTIEMBRE:9, SETIEMBRE:9, OCTUBRE:10, NOVIEMBRE:11, DICIEMBRE:12 };
function fechaDesdeTextoEsXlsx(txt){
  const m = /([0-3]?\d)\s*\/?\s*([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\s*\/?\s*(\d{4})/.exec(txt || '');
  if(!m) return '';
  const mes = MESES_ES_XLSX[normalizarTextoEncabezadoXlsx(m[2])];
  if(!mes) return '';
  return m[3] + '-' + String(mes).padStart(2, '0') + '-' + String(parseInt(m[1], 10)).padStart(2, '0');
}
function extraerMetadatosXlsx(hoja){
  const meta = { nombreProyecto: '', fecha: '', responsable: '' };
  const notasExtra = [];
  hoja.filas.forEach(fila=>{
    (fila || []).forEach(valor=>{
      if(typeof valor !== 'string' || !valor.trim()) return;
      const norm = normalizarTextoEncabezadoXlsx(valor);
      if(!meta.nombreProyecto && norm.startsWith('PROYECTO')) meta.nombreProyecto = valor.trim();
      else if(!meta.fecha && norm.startsWith('FECHA')) meta.fecha = fechaDesdeTextoEsXlsx(valor);
      else if(!meta.responsable && norm.startsWith('ELABORO')) meta.responsable = valor.replace(/^[^:]*:\s*/, '').trim();
      else if(norm.startsWith('ATENCION')) notasExtra.push(valor.trim());
    });
  });
  meta.notas = notasExtra.join(' · ');
  return meta;
}

/* Punto de entrada: lee el archivo, arma los conceptos y abre el modal de
   "Nuevo proyecto" YA PRELLENADO — nunca se guarda solo. Cliente/sitio,
   tipo y estatus los sigue decidiendo la persona; lo único que ahorra
   Excel es recapturar renglón por renglón un presupuesto que ya existe. */
async function importarProyectoImagenDesdeExcel(archivo){
  if(!exigirPermiso()) return;
  let hojas;
  try{
    hojas = await leerLibroXlsx(archivo);
  }catch(e){
    aviso('No se pudo leer el archivo: ' + (e && e.message ? e.message : 'formato no reconocido') + '.', true);
    return;
  }
  const tabla = buscarTablaCostosXlsx(hojas);
  if(!tabla){
    aviso('No se encontró una tabla de costos reconocible en este Excel (se buscan columnas como Conceptos, Cant. y Precio unitario).', true);
    return;
  }
  const hoja = hojas.find(h => h.nombre === tabla.hoja);
  const conceptos = extraerConceptosXlsx(hoja, tabla);
  if(!conceptos.length){
    aviso('Se encontró el encabezado de la tabla de costos, pero ningún renglón con datos debajo.', true);
    return;
  }
  const meta = extraerMetadatosXlsx(hoja);
  modalProyectoImagen(null, {
    nombreProyecto: meta.nombreProyecto,
    fecha: meta.fecha,
    responsable: meta.responsable,
    notas: (meta.notas ? meta.notas + '\n' : '')
      + 'Importado de ' + archivo.name + ' (hoja "' + tabla.hoja + '", ' + conceptos.length + ' ' + plural(conceptos.length, 'concepto', 'conceptos') + ').',
    conceptos
  });
  aviso('Se importaron ' + conceptos.length + ' ' + plural(conceptos.length, 'concepto', 'conceptos')
    + ' desde ' + archivo.name + '. Revisa cliente, sitio, tipo y estatus antes de guardar.');
}

/* ------------------- Importar una póliza desde Excel (hoja "BASE") -------------------
   El formato real de Victor trae tres hojas — BASE (portada + tabla de
   equipos), DESCRIP. TRAB y Equipos (el catálogo de costos/descripciones) —
   pero como con Imagen/Aperturas, aquí no importa en qué hoja ni en qué fila
   esté cada cosa: se busca por encabezado y por etiqueta, nunca por celda
   fija, porque cada cliente acomoda un poco distinto su copia de la
   plantilla.

   La tabla de equipos siempre trae, además de EQUIPO/CANT/MARCA/PRECIO
   UNIT./FRECUENCIA, un tramo de columnas "mmm-aa" (mar-26, abr-26…) — una
   por mes de vigencia, con un 1 marcando en qué meses le toca servicio a
   cada renglón. Esas columnas se detectan por patrón, en el orden en que
   aparecen, y su POSICIÓN (no el mes real) es el corrimiento 0..11 que pide
   normalizarPartida — así no hace falta que la vigencia empiece en enero. */
const MES_ABR_POLIZA_XLSX = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function esColumnaMesPolizaXlsx(txtNorm){
  return /^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)-\d{2}$/.test(txtNorm);
}
/* De la primera columna de mes ("MAR-26") al día 1 de ese mes calendario:
   así el corrimiento 0 de cada partida cae justo en el mes real que dice el
   Excel, sin tener que sumar/restar nada a mano en el modal. */
function fechaInicioDesdePrimerMesPolizaXlsx(txtNorm){
  const m = /^(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)-(\d{2})$/.exec(txtNorm || '');
  if(!m) return '';
  const mes = MES_ABR_POLIZA_XLSX.indexOf(m[1]) + 1;
  return (2000 + parseInt(m[2],10)) + '-' + String(mes).padStart(2,'0') + '-01';
}

const ALIAS_COLUMNA_EQUIPO_POLIZA_XLSX = {
  equipo: ['EQUIPO', 'CONCEPTO', 'DESCRIPCION'],
  cantidad: ['CANT', 'CANT.', 'CANTIDAD'],
  marca: ['MARCA'],
  precioUnitario: ['PRECIO UNIT.MTTO.', 'PRECIO UNIT MTTO', 'PRECIO UNITARIO', 'P. UNITARIO', 'PRECIO UNIT'],
  frecuencia: ['FRECUENCIA', 'FRECUENCIA ']
};
/* Igual que buscarTablaCostosXlsx (Imagen/Aperturas): recorre TODAS las hojas
   y TODOS los renglones buscando el que más se parezca a un encabezado de
   tabla de equipos, y de paso ubica las columnas de mes de ESE MISMO
   renglón. Nunca hay que decirle en qué hoja está. */
function buscarTablaEquiposPolizaXlsx(hojas){
  let mejor = null;
  hojas.forEach(hoja=>{
    hoja.filas.forEach((fila,i)=>{
      const normal = fila.map(normalizarTextoEncabezadoXlsx);
      const columnas = {};
      let encontrados = 0;
      Object.keys(ALIAS_COLUMNA_EQUIPO_POLIZA_XLSX).forEach(campo=>{
        const idx = normal.findIndex(txt => ALIAS_COLUMNA_EQUIPO_POLIZA_XLSX[campo].includes(txt));
        if(idx >= 0){ columnas[campo] = idx; encontrados++; }
      });
      const columnasMes = [];
      normal.forEach((txt, idx) => { if(esColumnaMesPolizaXlsx(txt)) columnasMes.push(idx); });
      const esTablaEquipos = columnas.equipo !== undefined && columnas.precioUnitario !== undefined && columnasMes.length >= 1;
      const puntaje = encontrados + columnasMes.length;
      if(esTablaEquipos && (!mejor || puntaje > mejor.puntaje)){
        mejor = { hoja: hoja.nombre, filaEncabezado: i, columnas, columnasMes, puntaje };
      }
    });
  });
  return mejor;
}
function extraerEquiposPolizaXlsx(hoja, tabla){
  const filas = [];
  let vaciosSeguidos = 0;
  for(let i = tabla.filaEncabezado + 1; i < hoja.filas.length; i++){
    const fila = hoja.filas[i] || [];
    const nombre = fila[tabla.columnas.equipo];
    if(typeof nombre !== 'string' || !nombre.trim() || /^TOTAL/i.test(nombre.trim())){
      /* Igual que en Imagen: se tolera hasta 5 renglones vacíos seguidos —
         a veces hay aire entre secciones — antes de dar la tabla por
         terminada, para no seguir leyendo basura mucho más abajo. */
      if(filas.length && ++vaciosSeguidos >= 5) break;
      continue;
    }
    vaciosSeguidos = 0;
    const precioUnitario = fila[tabla.columnas.precioUnitario];
    if(typeof precioUnitario !== 'number') continue;
    const cantidad = (tabla.columnas.cantidad !== undefined && typeof fila[tabla.columnas.cantidad] === 'number')
      ? fila[tabla.columnas.cantidad] : 1;
    const marca = tabla.columnas.marca !== undefined ? textoCeldaCotizacionXlsx(fila[tabla.columnas.marca]) : '';
    const mesesServicio = tabla.columnasMes
      .map((col, offset) => (typeof fila[col] === 'number' && fila[col]) ? offset : -1)
      .filter(o => o >= 0);
    /* La frecuencia manda la columna si la trae; si no, se cuenta cuántos
       meses quedaron marcados — nunca 0, para que normalizarPartida no la
       fuerce a 1 con un calendario ya lleno. */
    const frecuencia = (tabla.columnas.frecuencia !== undefined && typeof fila[tabla.columnas.frecuencia] === 'number')
      ? fila[tabla.columnas.frecuencia] : (mesesServicio.length || 1);
    filas.push({ concepto: nombre.trim(), marca, cantidad, precioUnitario, frecuencia, mesesServicio });
  }
  return filas;
}
/* Consolida renglones que en el papel son "el mismo equipo, x veces": mismo
   nombre, marca, precio, frecuencia Y calendario exacto — el Excel real trae
   un renglón por UNIDAD física (una fila por cada trampa de grasa, por
   ejemplo) pero el modelo de la póliza no guarda modelo/serie por unidad, así
   que se suman en un solo renglón con cantidad > 1, igual que lo capturaría
   una persona a mano. Dos renglones con el mismo nombre pero calendarios
   distintos (dos tandas de mantenimiento corridas) NO se mezclan. */
function consolidarEquiposPolizaXlsx(filas){
  const grupos = new Map();
  filas.forEach(f=>{
    const llave = [normalizarTextoEncabezadoXlsx(f.concepto), normalizarTextoEncabezadoXlsx(f.marca),
      f.precioUnitario, f.frecuencia, f.mesesServicio.join(',')].join('|');
    if(!grupos.has(llave)) grupos.set(llave, Object.assign({}, f, { cantidad:0 }));
    grupos.get(llave).cantidad += f.cantidad;
  });
  return [...grupos.values()];
}

/* La hoja "Equipos" (o su prima "DESCRIP. TRAB") que Victor deja pegada en
   cada póliza es la misma hoja de costos 2025/2026 de siempre —ver
   COSTOS_CATALOGO_2026— así que se busca igual que la tabla de equipos: por
   encabezado, sin importar el nombre de la pestaña. */
const ALIAS_COLUMNA_CATALOGO_POLIZA_XLSX = {
  equipo: ['EQUIPO'],
  costoInsumos: ['COSTO INSUMOS'],
  costoManoObra: ['COSTO MANO DE OBRA'],
  descripcion: ['DESCRIPCION DE TRABAJO', 'DESCRIPCION DE TRABAJOS A REALIZAR', 'DESCRIPCION']
};
function buscarTablaCatalogoPolizaXlsx(hojas){
  let mejor = null;
  hojas.forEach(hoja=>{
    hoja.filas.forEach((fila,i)=>{
      const normal = fila.map(normalizarTextoEncabezadoXlsx);
      const columnas = {};
      let encontrados = 0;
      Object.keys(ALIAS_COLUMNA_CATALOGO_POLIZA_XLSX).forEach(campo=>{
        const idx = normal.findIndex(txt => ALIAS_COLUMNA_CATALOGO_POLIZA_XLSX[campo].includes(txt));
        if(idx >= 0){ columnas[campo] = idx; encontrados++; }
      });
      if(columnas.equipo !== undefined && encontrados >= 2 && (!mejor || encontrados > mejor.encontrados)){
        mejor = { hoja: hoja.nombre, filaEncabezado: i, columnas, encontrados };
      }
    });
  });
  return mejor;
}
/* Nombre de equipo (normalizado) -> costos/descripción de ESTE archivo. Sirve
   de segunda opción cuando el equipo todavía no está en datos.catalogo — la
   primera opción siempre es el catálogo vivo de la app, nunca esta hoja. */
function mapaCatalogoPolizaDesdeXlsx(hojas){
  const mapa = new Map();
  const tabla = buscarTablaCatalogoPolizaXlsx(hojas);
  if(!tabla) return mapa;
  const hoja = hojas.find(h => h.nombre === tabla.hoja);
  for(let i = tabla.filaEncabezado + 1; i < hoja.filas.length; i++){
    const fila = hoja.filas[i] || [];
    const nombre = fila[tabla.columnas.equipo];
    if(typeof nombre !== 'string' || !nombre.trim()) continue;
    const llave = normalizarTextoEncabezadoXlsx(nombre);
    if(mapa.has(llave)) continue; /* la primera aparición gana */
    mapa.set(llave, {
      costoInsumos: (tabla.columnas.costoInsumos !== undefined && typeof fila[tabla.columnas.costoInsumos] === 'number') ? fila[tabla.columnas.costoInsumos] : 0,
      costoManoObra: (tabla.columnas.costoManoObra !== undefined && typeof fila[tabla.columnas.costoManoObra] === 'number') ? fila[tabla.columnas.costoManoObra] : 0,
      descripcion: tabla.columnas.descripcion !== undefined ? textoCeldaCotizacionXlsx(fila[tabla.columnas.descripcion]) : ''
    });
  }
  return mapa;
}
function equipoDeCatalogoAppPorNombre(nombre){
  const norm = normalizarTextoEncabezadoXlsx(nombre);
  return catalogo().find(e => e.activo && normalizarTextoEncabezadoXlsx(e.concepto) === norm) || null;
}
/* El costo interno de un renglón importado. El catalogoId se liga por nombre
   siempre que exista —así la descripción se sigue rellenando sola desde ahí,
   ver descripcionDe()— pero el COSTO se toma de la fuente que de verdad
   traiga un número: el catálogo vivo de la app si ya lo tiene capturado, o
   si no, la hoja de costos de este mismo Excel (hay equipos en el catálogo
   semilla que todavía nadie enriqueció con «Importar costos»). En cero si
   ninguna de las dos lo trae — igual que cualquier renglón nuevo sin costo
   capturado, nunca se inventa un margen. */
function costoUnitarioPolizaXlsx(concepto, mapaCatalogoXlsx){
  const delCatalogoApp = equipoDeCatalogoAppPorNombre(concepto);
  const costoCatalogo = delCatalogoApp ? costoTotalEquipo(delCatalogoApp) : 0;
  const catalogoId = delCatalogoApp ? delCatalogoApp.id : '';
  if(costoCatalogo > 0) return { costoUnitario: costoCatalogo, catalogoId, descripcion: '' };
  const delXlsx = mapaCatalogoXlsx.get(normalizarTextoEncabezadoXlsx(concepto));
  const costoXlsx = delXlsx ? costoTotalEquipo(delXlsx) : 0;
  if(costoXlsx > 0) return { costoUnitario: costoXlsx, catalogoId, descripcion: catalogoId ? '' : delXlsx.descripcion };
  return { costoUnitario: 0, catalogoId, descripcion: '' };
}

/* Metadatos sueltos de la portada (a quién es la póliza, cuándo se elaboró):
   se buscan por ETIQUETA, no por celda fija, porque la plantilla a veces
   pone el valor a la derecha de la etiqueta y a veces una fila abajo. Se
   prueba a la derecha primero (mismo renglón) y si no hay nada, abajo. */
function valorCercaDeEtiquetaPolizaXlsx(hojas, etiquetas){
  for(const hoja of hojas){
    for(let r = 0; r < hoja.filas.length; r++){
      const fila = hoja.filas[r] || [];
      for(let c = 0; c < fila.length; c++){
        if(typeof fila[c] !== 'string' || !etiquetas.includes(normalizarTextoEncabezadoXlsx(fila[c]))) continue;
        for(let c2 = c+1; c2 < fila.length; c2++){
          if(fila[c2] != null && String(fila[c2]).trim() !== '') return fila[c2];
        }
        for(let r2 = r+1; r2 <= r+2 && r2 < hoja.filas.length; r2++){
          const v2 = (hoja.filas[r2] || [])[c];
          if(v2 != null && String(v2).trim() !== '') return v2;
        }
      }
    }
  }
  return null;
}

/* Punto de entrada: lee el archivo, arma los renglones YA CONSOLIDADOS y con
   su costo resuelto, y abre el modal de "Nueva póliza" PRELLENADO — igual que
   Imagen/Aperturas, nunca se guarda solo. Cliente, sitio y fechas los sigue
   confirmando la persona; lo único que ahorra Excel es no tener que
   teclear equipo por equipo un contrato que ya viene armado. */
async function importarPolizaDesdeExcel(archivo){
  if(!exigirPermiso()) return;
  let hojas;
  try{
    hojas = await leerLibroXlsx(archivo);
  }catch(e){
    aviso('No se pudo leer el archivo: ' + (e && e.message ? e.message : 'formato no reconocido') + '.', true);
    return;
  }

  const tabla = buscarTablaEquiposPolizaXlsx(hojas);
  if(!tabla){
    aviso('No se encontró una tabla de equipos reconocible en este Excel (se buscan columnas como Equipo, Precio unit. y los meses de servicio, ej. "mar-26").', true);
    return;
  }
  const hoja = hojas.find(h => h.nombre === tabla.hoja);
  const filasEquipo = extraerEquiposPolizaXlsx(hoja, tabla);
  if(!filasEquipo.length){
    aviso('Se encontró el encabezado de la tabla de equipos, pero ningún renglón con datos debajo.', true);
    return;
  }

  const mapaCatalogoXlsx = mapaCatalogoPolizaDesdeXlsx(hojas);
  const partidas = consolidarEquiposPolizaXlsx(filasEquipo).map(f=>{
    const { costoUnitario, catalogoId, descripcion } = costoUnitarioPolizaXlsx(f.concepto, mapaCatalogoXlsx);
    return { concepto: f.concepto, marca: f.marca, catalogoId, descripcion, cantidad: f.cantidad,
      precioUnitario: f.precioUnitario, costoUnitario, frecuencia: f.frecuencia, mesesServicio: f.mesesServicio };
  });

  const sitioNombreXlsx = textoCeldaCotizacionXlsx(valorCercaDeEtiquetaPolizaXlsx(hojas, ['UNIDAD', 'SITIO', 'CLIENTE', 'NOMBRE DEL SITIO']));
  const fechaElabCelda = valorCercaDeEtiquetaPolizaXlsx(hojas, ['FECHA DE ELABORACION']);
  const fechaElaboracion = typeof fechaElabCelda === 'number' ? fechaDesdeSerialExcel(fechaElabCelda) : fechaCeldaCotizacionXlsx(fechaElabCelda);
  const primerMesTxt = normalizarTextoEncabezadoXlsx((hoja.filas[tabla.filaEncabezado] || [])[tabla.columnasMes[0]]);
  const fechaInicio = fechaInicioDesdePrimerMesPolizaXlsx(primerMesTxt) || fechaElaboracion || hoyISO();

  /* Si el nombre del sitio ya existe en Forpass, se liga solo — el mismo
     criterio que ya usan los demás importadores de la app. Si no, la persona
     lo crea desde el propio modal con "+ Nuevo" al revisar. */
  const sitioLigado = sitioNombreXlsx
    ? datos.sitios.find(s => normalizarTextoEncabezadoXlsx(s.nombre) === normalizarTextoEncabezadoXlsx(sitioNombreXlsx))
    : null;

  modalPoliza(null, {
    clienteId: sitioLigado ? sitioLigado.clienteId : '',
    sitioId: sitioLigado ? sitioLigado.id : '',
    sitioNombre: sitioNombreXlsx,
    fechaCotizacion: fechaElaboracion || hoyISO(),
    fechaInicio,
    partidas,
    notas: 'Importado de ' + archivo.name + ' (' + partidas.length + ' ' + plural(partidas.length, 'renglón', 'renglones') + ').'
  });
  aviso('Se importaron ' + partidas.length + ' ' + plural(partidas.length, 'renglón', 'renglones')
    + ' desde ' + archivo.name + '. Revisa cliente, sitio y fechas antes de guardar.');
}

/* Numera las partidas como en el documento: consecutivas con la misma
   sección comparten grupo (1.1, 1.2…); sin sección, número simple (2, 3…).
   Se calcula aquí y nunca se guarda — es de exhibición, como las letras de
   columna del generador de Excel. */
function numerarPartidasCotizacion(partidas){
  let grupo = 0, sub = 0, seccionActual = null;
  const numeradas = partidas.map(x=>{
    if(x.seccion){
      if(x.seccion !== seccionActual){ grupo++; sub = 0; seccionActual = x.seccion; }
      sub++;
      return Object.assign({}, x, { numPart: grupo + '.' + sub });
    }
    grupo++; sub = 0; seccionActual = null;
    return Object.assign({}, x, { numPart: String(grupo) });
  });
  return { numeradas, ultimoGrupo: grupo };
}

/* El único lugar que calcula el dinero de una cotización, en sus dos caras.
   Nunca se guarda un total: se recalcula siempre de partidas + margen +
   instalación, igual que calcular() en Forpass y calcularPoliza() en
   Pólizas. */
function calcularCotizacion(q){
  const { numeradas, ultimoGrupo } = numerarPartidasCotizacion(q.partidas);

  const filas = numeradas.map(x=>{
    const importeCosto = x.cantidad * x.precioCosto;
    const precioCliente = x.precioClienteManual != null ? x.precioClienteManual : x.precioCosto * (1 + q.margen / 100);
    const importeCliente = x.cantidad * precioCliente;
    return Object.assign({}, x, { importeCosto, precioCliente, importeCliente });
  });

  const subtotalPartidasCosto = filas.reduce((s,x)=> s + x.importeCosto, 0);
  const subtotalPartidasCliente = filas.reduce((s,x)=> s + x.importeCliente, 0);

  /* Misma fórmula que F50 de COTI: 20% del subtotal de partidas + un fijo. Se
     marca con el mismo margen para pasar al lado del cliente — nunca se
     prorratea entre renglones, para no repetir el #DIV/0 del Excel cuando no
     hay ninguna partida capturada todavía. */
  const instalacionCosto = subtotalPartidasCosto * (q.instalacion.porcentaje / 100) + q.instalacion.fijo;
  const instalacionCliente = instalacionCosto * (1 + q.margen / 100);
  const instalacionNumPart = String(ultimoGrupo + 1);
  const incluyeInstalacion = q.instalacion.incluir;

  const subtotalCosto = subtotalPartidasCosto + (incluyeInstalacion ? instalacionCosto : 0);
  const subtotalCliente = subtotalPartidasCliente + (incluyeInstalacion ? instalacionCliente : 0);

  const ivaCosto = subtotalCosto * IVA_COTIZACION;
  const ivaCliente = subtotalCliente * IVA_COTIZACION;

  const fechaVence = sumarDias(q.fecha, q.vigenciaDias);
  const diasVigencia = diasEntre(hoyISO(), fechaVence);

  return {
    filas,
    instalacionCosto, instalacionCliente, instalacionNumPart, incluyeInstalacion,
    subtotalPartidasCosto, subtotalPartidasCliente,
    subtotalCosto, subtotalCliente,
    ivaCosto, ivaCliente,
    totalCosto: subtotalCosto + ivaCosto,
    totalCliente: subtotalCliente + ivaCliente,
    fechaVence, diasVigencia,
    vencida: diasVigencia < 0
  };
}

function guardarCotizacion(q, accion, detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'cotizaciones', id:q.id, obj:q });
  anotar(accion || 'editó', 'cotización', q.folio || 'sin folio', detalle);
}

/* ---------------------------- Importar desde Excel (tablero de Monday.com) ----------------------------
   El export real ("Servicios Pendientes - Cargo al Cliente") trae UNA sola
   hoja con las 13 etapas del pipeline como secciones seguidas: cada una
   arranca con un renglón de una sola celda (el nombre de la etapa), luego el
   mismo encabezado de 26 columnas repetido, y después sus renglones de
   datos hasta la siguiente etapa. Se reconoce el TIPO de cada renglón por su
   FORMA (cuántas celdas trae y en cuáles columnas) y no por su posición
   fija, porque el archivo real además trae un título general en la fila 1 y
   una sección de cola sin usar al final que no son ninguna de las 13
   etapas — ambas se ignoran solas, al no encontrar coincidencia.

   Cada renglón se vuelve una Cotización con UNA sola partida (concepto = el
   nombre del servicio, costo $0 porque el tablero de origen no lo trae,
   precio al cliente = el Subtotal capturado a mano vía precioClienteManual)
   — así se aprovecha el cálculo de costo/cliente/IVA que ya existe en vez de
   inventar un segundo sistema de totales. */
const ALIAS_COLUMNA_COTIZACION_TABLERO_XLSX = {
  nombre: ['NAME'],
  sitio: ['COMEDOR'],
  fechaLiberacion: ['FECHA LIBERACION'],
  fechaProgramadaInicio: ['FECHAS PROGRAMADAS - START'],
  fechaProgramadaFin: ['FECHAS PROGRAMADAS - END'],
  folioOC: ['FOLIO OC COMPRAS'],
  folioSoporte: ['FOLIO SOPORTE'],
  proveedor: ['PROVEEDOR'],
  statusMaterial: ['STATUS MATERIAL / REFACCIONES'],
  estadoServicio: ['ESTADO DE SERVICIO'],
  estatusEjecucion: ['ESTATUS EJECUCION'],
  fechaRealizado: ['FECHA SERVICIO RELIZADO', 'FECHA SERVICIO REALIZADO'],
  subtotal: ['SUBTOTAL'],
  comentarios: ['COMENTARIOS'],
  registroCreacion: ['REGISTRO DE CREACION'],
  folioCotiMtto: ['FOLIO COTI MTTO'],
  personas: ['PERSONAS']
};

/* De etiqueta de sección ("Trabajos con Orden de Compra") a nuestro código
   de etapa — se calcula una sola vez a partir de ETIQUETA_ETAPA_TABLERO_COTIZACION,
   nunca a mano, para que un cambio de texto ahí no desalinee al importador. */
let mapaAliasEtapaTableroCotizacionXlsx = null;
function aliasEtapaTableroCotizacionXlsx(){
  if(!mapaAliasEtapaTableroCotizacionXlsx){
    mapaAliasEtapaTableroCotizacionXlsx = {};
    ETAPAS_TABLERO_COTIZACION.forEach(e=>{
      mapaAliasEtapaTableroCotizacionXlsx[normalizarTextoEncabezadoXlsx(ETIQUETA_ETAPA_TABLERO_COTIZACION[e])] = e;
    });
  }
  return mapaAliasEtapaTableroCotizacionXlsx;
}

/* Inverso exacto de serialExcel(iso): una celda de fecha en el XML del xlsx
   no trae más que el número de serie (el formato de fecha vive aparte, en el
   estilo, y leerHojaXlsxComoFilas no lo resuelve) — mismo epoch y mismo
   redondeo que ya usa el resto del tablero para ir de ISO a serie. */
function fechaDesdeSerialExcel(n){
  if(typeof n !== 'number' || !isFinite(n)) return '';
  const ms = Date.UTC(1899, 11, 30) + Math.round(n) * 86400000;
  const d = new Date(ms);
