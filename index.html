/* El catálogo vivo. Sale del servidor; si todavía no hay nada, se usa la semilla
   para que la app nunca se quede sin lista con qué trabajar. */
function catalogo(){ return datos.catalogo.length ? datos.catalogo : CATALOGO_SEMILLA.map(normalizarEquipo); }
const equipoDeCatalogo = id => catalogo().find(e => e.id === id) || null;

/* Un renglón de la lista de precios. Mismo tono que los otros normalizadores:
   esta función es el contrato. El precio se limita al centavo por la misma razón
   que en las partidas — un precio con milésimas no se puede facturar. */
function normalizarEquipo(e){
  return {
    id: (e.id || '').trim() || nuevoId(),
    concepto: (e.concepto || '').trim(),
    precio: Math.max(0, Math.round((Number(e.precio) || 0) * 100) / 100),
    frecuencia: Math.max(1, Math.min(MESES_POLIZA, parseInt(e.frecuencia,10) || 1)),
    descripcion: (e.descripcion || '').trim(),
    /* Lo que de verdad cuesta dar ese servicio, para poder comparar precio vs
       costo vs margen — antes solo existía el precio de venta. Se captura
       insumos y mano de obra por separado, como en la hoja de costos real; el
       total con indirectos se deriva (ver costoTotalEquipo), nunca se guarda. */
    costoInsumos: Math.max(0, Math.round((Number(e.costoInsumos) || 0) * 100) / 100),
    costoManoObra: Math.max(0, Math.round((Number(e.costoManoObra) || 0) * 100) / 100),
    /* Un equipo que ya no se vende se apaga en vez de borrarse: las pólizas
       viejas siguen apuntando a su id y tienen que poder resolver su texto. */
    activo: e.activo !== false,
    /* Qué tanto pesa este equipo en el % de funcionamiento de una cocina
       (ver calcularFuncionamientoLevantamiento, módulo Levantamientos): 1
       (apenas afecta operar, ej. un carrito) a 5 (para la cocina, ej. una
       cámara de refrigeración). Entero, 3 = importancia media por default —
       así un equipo recién dado de alta ya entra al cálculo sin que alguien
       tenga que ponderarlo primero a mano. */
    ponderacion: Math.max(1, Math.min(5, parseInt(e.ponderacion, 10) || 3))
  };
}

const ETIQUETA_PONDERACION = { 1:'Muy baja', 2:'Baja', 3:'Media', 4:'Alta', 5:'Crítica' };

/* 10% de indirectos sobre insumos + mano de obra: así se arma el costo total
   de un servicio en la hoja de costos 2025/2026 (verificado exacto en sus 63
   renglones). Se deja como constante y no como número suelto para que, si el
   porcentaje cambia, haya un solo lugar que tocar. */
const COSTO_INDIRECTO_PCT = 10;
function costoTotalEquipo(e){
  const base = (e && e.costoInsumos || 0) + (e && e.costoManoObra || 0);
  return Math.round(base * (1 + COSTO_INDIRECTO_PCT / 100) * 100) / 100;
}

/* La descripción va al revés que el precio: NO se copia al documento salvo que
   alguien la edite a mano. Describe el trabajo, no el contrato, así que si
   mañana mejoramos el texto conviene que todas las pólizas lo tomen. Y de paso
   una cotización de 79 renglones no carga ~20 KB de texto repetido. */
function descripcionDe(x){
  if(x.descripcion) return x.descripcion;
  const e = equipoDeCatalogo(x.catalogoId);
  return e ? e.descripcion : '';
}

/* =============================== ALMACÉN =============================== */
const LLAVE = 'forguard_control_forpass_v1';
let datos = { v:1, clientes:[], sitios:[], polizas:[], catalogo:[], segmentos:[], parametros:{clientes:[],sitios:[]}, cotizaciones:[], reportes:[], levantamientos:[], proyectosImagen:[] };

function cargar(){
  try{
    const cruda = localStorage.getItem(LLAVE);
    if(!cruda) return;
    const d = JSON.parse(cruda);
    if(d && Array.isArray(d.clientes) && Array.isArray(d.sitios)){
      datos = { v:1,
        clientes: d.clientes.map(normalizarCliente),
        sitios:   d.sitios.map(normalizarSitio),
        /* Un respaldo anterior al módulo de pólizas no trae esta llave. No es un
           archivo roto, es un archivo viejo: se abre con la lista vacía y sigue.
           Por eso la condición de arriba tampoco la exige. Igual con segmentos y
           parametros, que son más nuevos todavía. */
        polizas:  (Array.isArray(d.polizas) ? d.polizas : []).map(normalizarPoliza),
        catalogo: (Array.isArray(d.catalogo) ? d.catalogo : []).map(normalizarEquipo),
        segmentos: normalizarSegmentos(d.segmentos),
        parametros: normalizarListaParametros(d.parametros),
        /* El módulo "Servicios Extras" se fusionó con Cotizaciones (28-ago-
           2026): lo que haya quedado en la colección vieja (local o de la
           nube) se convierte a cotización en cuanto se lee, para no perder
           nada — ver migrarServiciosExtrasACotizaciones(). */
        cotizaciones: (Array.isArray(d.cotizaciones) ? d.cotizaciones : []).map(normalizarCotizacion)
          .concat(migrarServiciosExtrasACotizaciones(d.serviciosExtras)),
        reportes: (Array.isArray(d.reportes) ? d.reportes : []).map(normalizarReporte),
        levantamientos: (Array.isArray(d.levantamientos) ? d.levantamientos : []).map(normalizarLevantamiento),
        proyectosImagen: (Array.isArray(d.proyectosImagen) ? d.proyectosImagen : []).map(normalizarProyectoImagen) };
    }
  }catch(e){ console.warn('No se pudo leer el respaldo local:', e); }
}
/* Copia profunda de `obj` con cualquier dataURL pesado (fotos, PDFs, planos)
   vaciado a ''. Se usa SOLO como respaldo de emergencia en guardarLocal()
   cuando el objeto completo ya no cabe en localStorage: el límite de
   localStorage (~5 MB en Safari de iPhone) es muchísimo más chico que el de
   Firestore, así que un teléfono se puede quedar sin espacio para el
   espejo local mucho antes de que la nube rechace nada. El umbral (20,000
   caracteres ≈ 15 KB decodificado) deja pasar cosas chicas como un logo de
   cliente y solo vacía fotos/PDFs de verdad. */
function quitarDataUrlsPesados(obj){
  if(Array.isArray(obj)) return obj.map(quitarDataUrlsPesados);
  if(obj && typeof obj === 'object'){
    const o = {};
    for(const k in obj) o[k] = quitarDataUrlsPesados(obj[k]);
    return o;
  }
  if(typeof obj === 'string' && obj.length > 20000 && obj.slice(0, 5) === 'data:') return '';
  return obj;
}
/* ===================== RESPALDO GRANDE (IndexedDB) =====================
   localStorage tiene un tope fijo de unos 5 MB por sitio (sobre todo en
   Safari de iPhone) que NO depende de cuánto espacio libre tenga el
   aparato — llenarlo de fotos/PDFs lo rebasa fácil según crece la captura.
   IndexedDB, en cambio, sí escala con el disco real (cientos de MB o más).
   Se usa solo como DESBORDE: si la copia completa (con imágenes) cabe en
   localStorage, como en casi todos los casos, IndexedDB ni se toca. Solo
   cuando ya no cabe se guarda ahí una copia completa aparte, para
   recuperarla sola al abrir la página sin internet (ver
   restaurarSnapshotIndexedDB). ========================================= */
const IDB_NOMBRE = 'forguard_forpass_grande';
const IDB_TIENDA = 'snapshots';
const IDB_LLAVE = 'principal';
function abrirIndexedDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
    const pet = indexedDB.open(IDB_NOMBRE, 1);
    pet.onupgradeneeded = () => { pet.result.createObjectStore(IDB_TIENDA); };
    pet.onsuccess = () => resolve(pet.result);
    pet.onerror = () => reject(pet.error || new Error('No se pudo abrir IndexedDB'));
  });
}
async function guardarSnapshotIndexedDB(obj){
  const db = await abrirIndexedDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_TIENDA, 'readwrite');
    tx.objectStore(IDB_TIENDA).put(obj, IDB_LLAVE);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('No se pudo guardar en IndexedDB'));
  });
}
async function leerSnapshotIndexedDB(){
  const db = await abrirIndexedDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_TIENDA, 'readonly');
    const pet = tx.objectStore(IDB_TIENDA).get(IDB_LLAVE);
    pet.onsuccess = () => resolve(pet.result || null);
    pet.onerror = () => reject(pet.error || new Error('No se pudo leer de IndexedDB'));
  });
}
function borrarSnapshotIndexedDB(){
  abrirIndexedDB().then(db=>{
    db.transaction(IDB_TIENDA, 'readwrite').objectStore(IDB_TIENDA).delete(IDB_LLAVE);
  }).catch(()=>{});
}
/* Al abrir sin internet (modo local, o la nube que no contesta): si
   guardarLocal() tuvo que recortar imágenes de la copia rápida la última
   vez, aquí se recupera la copia COMPLETA desde IndexedDB y se repinta. Si
   hay sesión de nube y sí se pudo conectar, bajarDeLaNube() ya trajo todo
   fresco del servidor y esto ni se llama —ver los dos puntos donde se
   invoca, ambos solo en caminos sin conexión real. */
async function restaurarSnapshotIndexedDB(){
  try{
    const d = await leerSnapshotIndexedDB();
    if(!d || !Array.isArray(d.clientes) || !Array.isArray(d.sitios)) return;
    datos = { v:1,
      clientes: d.clientes.map(normalizarCliente),
      sitios:   d.sitios.map(normalizarSitio),
      polizas:  (Array.isArray(d.polizas) ? d.polizas : []).map(normalizarPoliza),
      catalogo: (Array.isArray(d.catalogo) ? d.catalogo : []).map(normalizarEquipo),
      segmentos: normalizarSegmentos(d.segmentos),
      parametros: normalizarListaParametros(d.parametros),
      cotizaciones: (Array.isArray(d.cotizaciones) ? d.cotizaciones : []).map(normalizarCotizacion)
        .concat(migrarServiciosExtrasACotizaciones(d.serviciosExtras)),
      reportes: (Array.isArray(d.reportes) ? d.reportes : []).map(normalizarReporte),
      levantamientos: (Array.isArray(d.levantamientos) ? d.levantamientos : []).map(normalizarLevantamiento),
      proyectosImagen: (Array.isArray(d.proyectosImagen) ? d.proyectosImagen : []).map(normalizarProyectoImagen) };
    render();
  }catch(e){ console.warn('No se pudo leer el respaldo grande (IndexedDB):', e); }
}
/* Copia local: sirve de caché y para que la página siga sirviendo sin internet.
   Se llama SIEMPRE antes de encolar() el cambio hacia la nube (ver
   guardarLevantamiento, guardarProyectoImagen, etc.) — que esta copia falle
   NO impide que el cambio se intente sincronizar aparte; por eso los avisos
   de abajo aclaran que es solo el respaldo sin conexión de este aparato, no
   que se haya perdido el cambio. */
function guardarLocal(){
  try{
    localStorage.setItem(LLAVE, JSON.stringify(datos));
    /* Cupo completo (con fotos y todo): si un guardado anterior había usado
       el respaldo grande, ya no hace falta — se limpia para no arrastrar
       por accidente una versión vieja el día que este sí falle. */
    borrarSnapshotIndexedDB();
    return;
  }catch(e){}
  /* Ya no cupo con las fotos/PDFs adentro. Se guarda una copia rápida SIN
     esas imágenes (folios, nombres, hallazgos y totales siguen disponibles
     de inmediato sin internet) y, aparte, una copia COMPLETA en IndexedDB
     —con cupo real para cientos de MB— que se recupera sola la próxima vez
     que la página abra sin conexión. */
  try{
    localStorage.setItem(LLAVE, JSON.stringify(quitarDataUrlsPesados(datos)));
  }catch(e2){
    aviso('No se pudo guardar ni una copia sin conexión en este navegador (sin espacio ni para eso). Tu cambio se sigue intentando sincronizar con la nube; descarga un respaldo JSON si te preocupa perder algo.', true);
    return;
  }
  guardarSnapshotIndexedDB(datos).catch(()=>{
    aviso('Este dispositivo ya no tiene espacio (ni en su almacén grande) para guardar las fotos/PDFs sin conexión. Tu cambio se sigue sincronizando con la nube; solo no podrás ver esas imágenes sin internet en este aparato.', true);
  });
}
function nuevoId(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizarCliente(c){
  return {
    id: c.id || nuevoId(),
    nombre: c.nombre || 'Cliente',
    contacto: c.contacto || '',
    notas: c.notas || '',
    /* Logo del cliente ya reducido, guardado dentro del propio registro. */
    logo: typeof c.logo === 'string' && c.logo.startsWith('data:image/') ? c.logo : '',
    /* ¿Este cliente incluye Forpass? Es la casilla que se marca en su ficha,
       porque hay cuentas que contratan póliza sin kioscos y al revés — pedido
       de Santiago. Tres estados a propósito: 'si' y 'no' son la decisión
       explícita del equipo; '' es un cliente de antes de que existiera la
       casilla, y con él la lista de Forpass decide como siempre lo hizo (por
       sus datos). Materializar un sí/no aquí sería inventar la respuesta: esta
       función es pura y no puede ver los sitios ni las pólizas del cliente.
       La colección sigue siendo UNA (decisión cerrada: una empresa con kioscos
       y pólizas es un registro con un solo logo); esto solo dice en qué lista
       aparece. */
    usaForpass: c.usaForpass === 'si' ? 'si' : c.usaForpass === 'no' ? 'no' : '',
    /* Valores de los parámetros personalizados (Admin → Segmentos y
       parámetros), llaveados por el id del parámetro para que sobrevivan si
       se renombra la etiqueta. */
    personalizados: (c.personalizados && typeof c.personalizados === 'object' && !Array.isArray(c.personalizados)) ? c.personalizados : {}
  };
}

/* ---------------------------- Logos de cliente ----------------------------
   La imagen se reduce a 256 px y se recomprime antes de guardarla. Sin esto,
   una foto del celular de 4 MB se iría tal cual a la base de datos y al cabo
   de unos clientes ya no cabría nada.
   ------------------------------------------------------------------------- */
const LOGO_LADO = 256;
const LOGO_MAX_ENTRADA = 10 * 1024 * 1024;   /* 10 MB de archivo original */
const LOGO_MAX_GUARDADO = 120 * 1024;        /* ~120 KB ya reducido */

function cargarImagen(archivo){
  return new Promise((listo, falla)=>{
    const lector = new FileReader();
    lector.onerror = ()=> falla(new Error('No se pudo leer el archivo.'));
    lector.onload = ()=>{
      const img = new Image();
      img.onload = ()=> listo(img);
      img.onerror = ()=> falla(new Error('Ese archivo no parece ser una imagen válida.'));
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

/* Valida el archivo y devuelve la imagen ya cargada, lista para encuadrar. */
async function leerLogo(archivo){
  if(!archivo.type || !archivo.type.startsWith('image/')) throw new Error('Elige una imagen (PNG, JPG, WEBP o SVG).');
  if(archivo.size > LOGO_MAX_ENTRADA) throw new Error('La imagen pesa más de 10 MB. Usa una más chica.');
  return cargarImagen(archivo);
}

/* Se prueban varios formatos y se toma el más liviano que el navegador
   realmente haya producido (WEBP y PNG conservan los fondos transparentes). */
function comprimirLienzo(lienzo){
  const candidatos = [];
  [['image/webp', 0.92], ['image/png', undefined], ['image/webp', 0.7]].forEach(([tipo, calidad])=>{
    try{
      const d = lienzo.toDataURL(tipo, calidad);
      if(d && d.indexOf('data:' + tipo) === 0) candidatos.push(d);
    }catch(e){}
  });
  if(!candidatos.length) throw new Error('Este navegador no pudo procesar la imagen.');

  const mejor = candidatos.sort((a,b)=> a.length - b.length)[0];
  if(mejor.length > LOGO_MAX_GUARDADO * 1.37){   /* base64 abulta ~37% */
    throw new Error('La imagen quedó muy pesada aun reduciéndola. Prueba con un logo más simple o en PNG.');
  }
  return mejor;
}

/* ---- Fotos de evidencia de un reporte ----
   Van EMBEBIDAS en el propio documento del reporte (como el logo de un
   cliente), no en Firebase Storage — este proyecto no usa Storage en ningún
   otro lado y sumar un servicio nuevo solo para esto era más de lo que la
   primera versión necesitaba. La consecuencia es real y hay que respetarla:
   Firestore tope 1 MB por documento. Con el tope de abajo (6 fotos de ~90 KB
   ya en base64) un reporte lleno pesa ~550 KB, dejando margen de sobra para
   el resto de sus campos. Si más adelante hacen falta más fotos por reporte,
   o fotos con más detalle, el siguiente paso es Firebase Storage de verdad
   —ahí sí sin límite práctico— y este archivo guardaría solo la URL. */
const EVIDENCIA_LADO_MAX = 1000;                 /* lado mayor, en px */
const EVIDENCIA_MAX_ENTRADA = 15 * 1024 * 1024;  /* 15 MB: una foto de celular pesa más que un logo */
const EVIDENCIA_MAX_GUARDADO = 90 * 1024;        /* ~90 KB ya reducida */
const EVIDENCIA_MAX_POR_REPORTE = 6;
/* Evidencia de UN servicio de póliza (un equipo, un mes): menos cupo que un
   reporte porque aquí es solo "prueba de que se hizo", no una investigación
   completa. Mismo pipeline de compresión y mismo molde (normalizarEvidencia). */
const EVIDENCIA_MAX_POR_SERVICIO = 4;

/* ---- Respaldo de costo de una cotización (cotización de un proveedor
   externo que sustenta el costo interno mostrado) ----
   Mismo criterio que la evidencia de arriba: va embebido en el propio
   documento de la cotización, sin Firebase Storage. Aquí el archivo puede
   ser una foto o un PDF, y un PDF no se puede recomprimir desde el
   navegador, así que su tope de entrada es más chico para que quepa tal
   cual. El presupuesto total cuenta las cadenas ya guardadas de TODOS los
   respaldos de una misma cotización, para no rebasar el 1 MB por documento
   de Firestore entre esto y el resto de sus campos. */
const RESPALDO_COSTO_LADO_MAX = 1600;                    /* lado mayor, en px: más grande que la evidencia para que se lea el documento */
const RESPALDO_COSTO_MAX_ENTRADA = 15 * 1024 * 1024;     /* 15 MB de imagen original */
const RESPALDO_COSTO_MAX_GUARDADO = 220 * 1024;          /* ~220 KB ya reducida */
const RESPALDO_COSTO_PDF_MAX_ENTRADA = 600 * 1024;       /* un PDF no se comprime: entra tal cual, por eso el tope es chico */
const RESPALDO_PRESUPUESTO_TOTAL = 900 * 1024;           /* suma máxima, en la cotización completa, de las cadenas dataURL de todos sus respaldos */

async function leerEvidencia(archivo){
  if(!archivo.type || !archivo.type.startsWith('image/')) throw new Error('Elige una foto para la evidencia.');
  if(archivo.size > EVIDENCIA_MAX_ENTRADA) throw new Error('Esa foto pesa más de 15 MB. Prueba con otra o reduce la calidad de la cámara.');
  return cargarImagen(archivo);
}

/* A diferencia del logo, aquí no hay encuadre manual: se reduce al lado
   máximo y se prueba en JPEG de más a menos calidad hasta quedar bajo el
   tope, o se toma la más chica que el navegador pudo sacar. */
function comprimirEvidencia(img){
  const anchoOrig = img.naturalWidth || img.width, altoOrig = img.naturalHeight || img.height;
  const escala = Math.min(1, EVIDENCIA_LADO_MAX / Math.max(anchoOrig, altoOrig));
  const w = Math.max(1, Math.round(anchoOrig * escala)), h = Math.max(1, Math.round(altoOrig * escala));
  const lienzo = document.createElement('canvas');
  lienzo.width = w; lienzo.height = h;
  lienzo.getContext('2d').drawImage(img, 0, 0, w, h);

  const candidatos = [0.72, 0.5, 0.32, 0.2].map(calidad=>{
    try{ return lienzo.toDataURL('image/jpeg', calidad); }catch(e){ return null; }
  }).filter(Boolean);
  if(!candidatos.length) throw new Error('Este navegador no pudo procesar la foto.');

  const objetivo = EVIDENCIA_MAX_GUARDADO * 1.37;   /* base64 abulta ~37% */
  return candidatos.find(d => d.length <= objetivo) || candidatos[candidatos.length - 1];
}

/* Lee cualquier archivo (aquí, sobre todo PDFs) tal cual, sin pasar por
   <Image>: cargarImagen() sirve solo para imágenes. */
function leerArchivoComoDataURL(archivo){
  return new Promise((listo, falla)=>{
    const lector = new FileReader();
    lector.onerror = ()=> falla(new Error('No se pudo leer el archivo.'));
    lector.onload = ()=> listo(lector.result);
    lector.readAsDataURL(archivo);
  });
}

async function leerRespaldoImagen(archivo){
  if(!archivo.type || !archivo.type.startsWith('image/')) throw new Error('Elige una imagen o un PDF para el respaldo.');
  if(archivo.size > RESPALDO_COSTO_MAX_ENTRADA) throw new Error('Esa imagen pesa más de 15 MB. Prueba con otra o reduce la calidad.');
  return cargarImagen(archivo);
}

/* Igual que comprimirEvidencia, pero con un lado máximo y una calidad más
   altos: aquí hay que poder leer un documento, no solo reconocer una foto. */
function comprimirRespaldoCosto(img){
  const anchoOrig = img.naturalWidth || img.width, altoOrig = img.naturalHeight || img.height;
  const escala = Math.min(1, RESPALDO_COSTO_LADO_MAX / Math.max(anchoOrig, altoOrig));
  const w = Math.max(1, Math.round(anchoOrig * escala)), h = Math.max(1, Math.round(altoOrig * escala));
  const lienzo = document.createElement('canvas');
  lienzo.width = w; lienzo.height = h;
  lienzo.getContext('2d').drawImage(img, 0, 0, w, h);

  const candidatos = [0.85, 0.72, 0.5, 0.32].map(calidad=>{
    try{ return lienzo.toDataURL('image/jpeg', calidad); }catch(e){ return null; }
  }).filter(Boolean);
  if(!candidatos.length) throw new Error('Este navegador no pudo procesar la imagen.');

  const objetivo = RESPALDO_COSTO_MAX_GUARDADO * 1.37;
  return candidatos.find(d => d.length <= objetivo) || candidatos[candidatos.length - 1];
}

/* ===================== Plano en PDF -> imagen (Imagen/Aperturas) =====================
   Única dependencia externa de toda la app (todo lo demás corre sin CDN ni
   build) — a propósito acotada a esto: un plano casi siempre llega en PDF, y
   sin una librería que lea PDFs no hay forma de convertir su primera hoja en
   una imagen real desde el navegador. pdf.js SOLO se trae la primera vez que
   alguien de verdad sube un PDF aquí, nunca en el arranque de la página, así
   que el resto del tablero se sigue usando sin internet igual que siempre.

   Si el CDN no responde (sin internet, o bloqueado) o el PDF no se puede
   leer, se degrada solo: se guarda el PDF tal cual como documento —el
   comportamiento de antes de esta función— con un aviso de qué pasó, nunca
   una pantalla rota. */
const PDFJS_CDN_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
let pdfJsCargando = null;
function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsCargando) return pdfJsCargando;
  pdfJsCargando = new Promise((listo, falla)=>{
    const s = document.createElement('script');
    s.src = PDFJS_CDN_BASE + 'pdf.min.js';
    s.onload = ()=>{
      if(!window.pdfjsLib){ pdfJsCargando = null; falla(new Error('El lector de PDF no cargó correctamente')); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN_BASE + 'pdf.worker.min.js';
      listo(window.pdfjsLib);
    };
    s.onerror = ()=>{ pdfJsCargando = null; falla(new Error('sin conexión a internet para traer el lector de PDF')); };
    document.head.appendChild(s);
  });
  return pdfJsCargando;
}

/* Renderiza la PRIMERA hoja del PDF a un <canvas> y de ahí sale un dataURL
   JPEG — mismo criterio de compresión por intentos que comprimirRespaldoCosto()
   (varias calidades, se usa la más alta que quepa en el presupuesto). La
   escala se calcula para que el lado mayor quede en RESPALDO_COSTO_LADO_MAX
   px, sea cual sea el tamaño real de la hoja del plano. */
async function convertirPdfAImagen(archivo){
  const pdfjsLib = await cargarPdfJs();
  const buffer = await archivo.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const pagina = await pdf.getPage(1);
  const base = pagina.getViewport({ scale: 1 });
  const escala = Math.max(0.5, RESPALDO_COSTO_LADO_MAX / Math.max(base.width, base.height));
  const viewport = pagina.getViewport({ scale: escala });
  const lienzo = document.createElement('canvas');
  lienzo.width = Math.round(viewport.width);
  lienzo.height = Math.round(viewport.height);
  await pagina.render({ canvasContext: lienzo.getContext('2d'), viewport }).promise;

  const candidatos = [0.85, 0.72, 0.5, 0.32].map(calidad=>{
    try{ return lienzo.toDataURL('image/jpeg', calidad); }catch(e){ return null; }
  }).filter(Boolean);
  if(!candidatos.length) throw new Error('este navegador no pudo convertir la hoja del PDF');
  const objetivo = RESPALDO_COSTO_MAX_GUARDADO * 1.37;
  return candidatos.find(d => d.length <= objetivo) || candidatos[candidatos.length - 1];
}

/* Dibuja la imagen en un cuadro de LOGO_LADO con el zoom y el desplazamiento
   que eligió el usuario. Con zoom 1 la imagen entra completa; de ahí para
   arriba se acerca, y arrastrando se decide qué parte queda a la vista. */
function dibujarLogo(lienzo, img, zoom, offX, offY){
  const L = lienzo.width;
  const ctx = lienzo.getContext('2d');
  ctx.clearRect(0, 0, L, L);
  const anchoOrig = img.naturalWidth  || img.width;
  const altoOrig  = img.naturalHeight || img.height;
  const base = Math.min(L / anchoOrig, L / altoOrig);
  const e = base * zoom;
  const w = anchoOrig * e, h = altoOrig * e;
  ctx.drawImage(img, (L - w) / 2 + offX, (L - h) / 2 + offY, w, h);
  return { w, h };
}
/* Evita que la imagen se pueda arrastrar tan lejos que quede fuera del cuadro. */
function limitarOffset(v, tamano, L){
  const tope = Math.max(tamano, L) / 2;
  return Math.max(-tope, Math.min(tope, v));
}

/* Avatar del cliente: su logo si lo tiene, y si no las iniciales. */

/* ============================ SESIÓN Y PERMISOS ============================
   Nada de esto corre en modo local: ahí no hay cuentas ni permisos.
   ========================================================================== */
const LLAVE_SESION = 'forguard_forpass_sesion_v1';

/* Los cuatro permisos, de más a menos poder. El Owner es el dueño del tablero:
   nadie más puede quitarle el permiso ni bloquearlo, y es el único que puede
   nombrar a otro Owner. */
const ROLES = {
  owner:   { nombre:'Owner',   desc:'Dueño del tablero: todo, y nadie lo puede bloquear ni degradar.' },
  admin:   { nombre:'Admin',   desc:'Todo, incluido el panel de administración y las cuentas.' },
  analyst: { nombre:'Analyst', desc:'Puede agregar y modificar clientes, sitios y pagos.' },
  viewer:  { nombre:'Viewer',  desc:'Solo puede ver la información; no modifica nada.' },
  /* Los dos de abajo son roles "de piso", pensados solo para el módulo
     Reportes (ver modulosPermitidos() y puedeGestionarReporte()): a alguien
     que solo levanta o atiende tickets no le hace falta ver clientes,
     pólizas ni cotizaciones — así que ni las ve. */
  tecnico:   { nombre:'Técnico',   desc:'Solo ve Reportes: atiende los tickets asignados — cambia su estatus, sube evidencia y los resuelve.' },
  reportero: { nombre:'Reportero', desc:'Solo ve Reportes: levanta tickets y sigue su estatus, pero no puede editar uno ya emitido.' }
};
/* Nombres viejos de una versión anterior, por si quedó alguna cuenta con ellos. */
const ROLES_VIEJOS = { editor:'analyst', lector:'viewer' };
function normalizarRol(r){
  const x = ROLES_VIEJOS[r] || r;
  return ROLES[x] ? x : 'viewer';
}

/* Saca un nombre presentable del correo: santiago.garza@… → «Santiago Garza».
   Sirve para no andar mostrando correos crudos en pantalla. */
function nombreDeCorreo(correo){
  const local = String(correo || '').split('@')[0];
  if(!local) return '';
  return local.split(/[._\-+]+/)
    .filter(Boolean)
    .map(p => p.charAt(0).toLocaleUpperCase('es') + p.slice(1).toLocaleLowerCase('es'))
    .join(' ');
}
/* El nombre capturado gana; si no hay, se deduce del correo. */
function nombreDe(u){
  return (u && u.nombre && u.nombre.trim()) ? u.nombre.trim() : nombreDeCorreo(u && u.correo);
}
/* Etiqueta de permiso con su color. */
function etiquetaRol(rol){
  const r = normalizarRol(rol);
  return '<span class="rol c-' + r + '">' + esc(ROLES[r].nombre) + '</span>';
}

const sesion = { correo:null, uid:null, idToken:null, refreshToken:null, expira:0, rol:null, nombre:'', telefono:'' };

function guardarSesion(){ try{ localStorage.setItem(LLAVE_SESION, JSON.stringify(sesion)); }catch(e){} }
function cargarSesion(){
  try{ Object.assign(sesion, JSON.parse(localStorage.getItem(LLAVE_SESION) || '{}')); }catch(e){}
}
function haySesion(){ return !!(sesion.idToken && sesion.refreshToken); }
function esOwner(){ return !HAY_NUBE || sesion.rol === 'owner'; }
function esAdmin(){ return !HAY_NUBE || sesion.rol === 'owner' || sesion.rol === 'admin'; }
function puedeEditar(){ return !HAY_NUBE || esAdmin() || sesion.rol === 'analyst'; }

function urlAuth(metodo){
  return 'https://identitytoolkit.googleapis.com/v1/accounts:' + metodo + '?key=' + encodeURIComponent(CONFIG_NUBE.apiKey);
}
async function pedirAuth(metodo, cuerpo){
  const r = await fetch(urlAuth(metodo), {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(cuerpo)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(traducirAuth(d && d.error && d.error.message));
  return d;
}
function traducirAuth(codigo){
  const c = String(codigo || '');
  if(/CREDENTIAL_TOO_OLD_LOGIN_AGAIN|TOKEN_EXPIRED/.test(c)) return 'Por seguridad, vuelve a escribir tu contraseña actual.';
  if(/MISSING_PASSWORD/.test(c)) return 'Falta la contraseña.';
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(c)) return 'Correo o contraseña incorrectos.';
  if(/USER_DISABLED/.test(c)) return 'Esta cuenta está deshabilitada. Pide a un administrador que la reactive.';
  if(/TOO_MANY_ATTEMPTS/.test(c)) return 'Demasiados intentos fallidos. Espera unos minutos y vuelve a probar.';
  if(/EMAIL_EXISTS/.test(c)) return 'Ya existe una cuenta con ese correo.';
  if(/WEAK_PASSWORD/.test(c)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/INVALID_EMAIL/.test(c)) return 'Ese correo no tiene un formato válido.';
  if(/OPERATION_NOT_ALLOWED/.test(c)) return 'Falta activar el acceso por correo y contraseña en Firebase.';
  return c ? 'No se pudo completar la operación (' + c + ').' : 'No se pudo conectar con el servidor.';
}

async function entrar(correo, contrasena){
  const d = await pedirAuth('signInWithPassword', { email:correo, password:contrasena, returnSecureToken:true });
  sesion.correo = d.email;
  sesion.uid = d.localId;
  sesion.idToken = d.idToken;
  sesion.refreshToken = d.refreshToken;
  sesion.expira = Date.now() + (Number(d.expiresIn) || 3600) * 1000;
  guardarSesion();
  await cargarPerfil();
}
async function renovarToken(){
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(CONFIG_NUBE.apiKey), {
    method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: sesion.refreshToken }).toString()
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('SESION_VENCIDA');
  sesion.idToken = d.id_token;
  sesion.refreshToken = d.refresh_token || sesion.refreshToken;
  sesion.expira = Date.now() + (Number(d.expires_in) || 3600) * 1000;
  guardarSesion();
}
async function tokenVigente(){
  if(!haySesion()) throw new Error('SIN_SESION');
  if(Date.now() > sesion.expira - 60000) await renovarToken();
  return sesion.idToken;
}
/* Borra sesión y datos, SIN mostrar el login. Está separado porque la persiana
   de cierre necesita borrar de inmediato pero destapar el login más tarde,
   cuando ya está cubierta la pantalla. */
/* ====================== ¿SIGUE CON LA CONTRASEÑA INICIAL? ======================
   Firebase guarda cuándo se creó la cuenta y cuándo se cambió la contraseña por
   última vez. Si las dos fechas casi coinciden, nunca la cambió: sigue con la
   que le dio el administrador.
   Se hace así, y no con una bandera en Firestore, porque no requiere tocar las
   reglas de seguridad —que se pegan a mano en la consola— ni guardar un dato más
   que se pueda desincronizar de la realidad. */
let claveEsInicial = false;
let claveRevisada = false;

async function revisarClaveInicial(){
  claveEsInicial = false;
  claveRevisada = false;
  if(!HAY_NUBE || !haySesion()) return;
  try{
    const d = await pedirAuth('lookup', { idToken: await tokenVigente() });
    const u = d && d.users && d.users[0];
    if(!u) return;
    const creada = Number(u.createdAt || 0);
    const cambiada = Number(u.passwordUpdatedAt || 0);
    /* Un minuto de margen: al crear la cuenta las dos marcas caen casi juntas. */
    if(creada && cambiada) claveEsInicial = Math.abs(cambiada - creada) < 60000;
    claveRevisada = true;
  }catch(e){
    /* Si no se puede consultar, no se inventa: no se avisa nada. */
  }
  pintarPuntoClave();
}
function pintarPuntoClave(){
  const p = $('puntoClave');
  if(p) p.hidden = !(claveRevisada && claveEsInicial);
}

function limpiarSesionYDatos(){
  detenerVigilancia();
  Object.assign(sesion, { correo:null, uid:null, idToken:null, refreshToken:null, expira:0, rol:null, nombre:'', telefono:'' });
  try{ localStorage.removeItem(LLAVE_SESION); }catch(e){}
  /* Todas las colecciones. Si aquí faltara una, al salir quedaría en undefined
     y lo primero que la recorriera tronaría. */
  datos = { v:1, clientes:[], sitios:[], polizas:[], catalogo:[], segmentos:[], parametros:{clientes:[],sitios:[]}, cotizaciones:[], reportes:[], levantamientos:[], proyectosImagen:[] };
  try{ localStorage.removeItem(LLAVE); }catch(e){}
  estado.vista = inicioDelModulo(); estado.clienteId = null; estado.polizaId = null; estado.cotizacionId = null; estado.reporteId = null; estado.levantamientoId = null; estado.proyectoImagenId = null;
  sincronizado = false;
}
function salir(porVencimiento){
  limpiarSesionYDatos();
  mostrarAcceso(porVencimiento ? 'Tu sesión expiró. Vuelve a entrar.' : '');

}

/* El perfil dice el rol. Si no existe, la cuenta no tiene acceso concedido. */
async function cargarPerfil(){
  const d = await pedirNube('/usuarios/' + encodeURIComponent(sesion.uid), { method:'GET' }, true);
  if(!d || !d.fields) throw new Error('SIN_PERMISO');
  const p = deCampos(d.fields);
  if(p.activo === false) throw new Error('BLOQUEADO');
  sesion.rol = normalizarRol(p.rol);
  sesion.nombre = p.nombre || '';
  /* El celular del vendedor sale impreso en las cotizaciones de póliza. Se trae
     aquí para poder prellenarlo; que falte nunca detiene nada, porque la póliza
     guarda su propia copia y ahí se puede teclear. */
  sesion.telefono = p.telefono || '';
  guardarSesion();
  /* Deja constancia del acceso, sin frenar el arranque si falla. */
  pedirNube('/usuarios/' + encodeURIComponent(sesion.uid) + '?updateMask.fieldPaths=ultimoAcceso', {
    method:'PATCH', body: JSON.stringify({ fields:{ ultimoAcceso:{ stringValue:new Date().toISOString() } } })
  }).catch(()=>{});
}

/* ====================== VIGILANCIA DE LA CUENTA ======================
   Bloquear a alguien escribe activo:false en Firestore. El servidor lo rechaza
   al instante, pero la app del bloqueado ya tiene todo en memoria y solo revisaba
   su perfil al arrancar: seguía viendo un tablero que ya no le toca hasta que
   recargaba. Desde el cliente no se puede deshabilitar la cuenta de Auth (eso
   necesita el Admin SDK), así que la bandera de Firestore es la única señal.

   Tres disparadores, del más barato al más frecuente:
     · cuando el servidor rechaza algo con 403 (gratis, y es la señal más directa)
     · cuando la pestaña vuelve al frente (gratis, y es cuando alguien retoma)
     · cada VIGILAR_CUENTA_MS mientras la pestaña esté visible (una lectura)

   Un usuario siempre puede leer su propio documento, incluso bloqueado: la regla
   lo permite por uid sin exigir activo. Por eso esta revisión funciona.

   REGLA QUE NO SE ROMPE: un fallo de red NO saca a nadie. Solo un activo:false
   o un 403 del servidor. */
/* Dos minutos. Es el peor caso: los otros dos disparadores —el 403 y el volver a
   la pestaña— actúan al instante, así que este solo cubre a quien dejó la
   pantalla abierta sin tocarla. Cuesta ~240 lecturas al día por persona; subirlo
   lo abarata y bajarlo aprieta el tope gratuito de Firestore. */
const VIGILAR_CUENTA_MS = 120000;
let relojVigilancia = null;
let vigilando = false;

async function revisarCuenta(){
  if(!HAY_NUBE || !haySesion() || vigilando) return;
  vigilando = true;
  try{
    const d = await pedirNube('/usuarios/' + encodeURIComponent(sesion.uid), { method:'GET' }, true);
    if(!d || !d.fields) throw new Error('SIN_PERMISO');
    const p = deCampos(d.fields);
    if(p.activo === false) throw new Error('BLOQUEADO');

    /* El permiso también cambia sin bloquear. Si alguien pasó de Admin a Viewer y
       no se entera, la interfaz le sigue ofreciendo botones que el servidor ya
       rechaza. Eso no amerita sacarlo: se actualiza y se redibuja. */
    const rolNuevo = normalizarRol(p.rol);
    const nombreNuevo = p.nombre || '';
    if(rolNuevo !== sesion.rol || nombreNuevo !== sesion.nombre){
      const rolAntes = sesion.rol;
      sesion.rol = rolNuevo;
      sesion.nombre = nombreNuevo;
      guardarSesion();
      /* Si lo bajaron de Admin estando en el panel de cuentas, no puede quedarse ahí. */
      if(estado.vista === 'admin' && !esAdmin()){ estado.vista = 'clientes'; estado.clienteId = null; }
      render();
      if(rolNuevo !== rolAntes) aviso('Un administrador cambió tu permiso a ' + ROLES[rolNuevo].nombre + '.');
    }
  }catch(e){
    const m = String((e && e.message) || '');
    if(/SIN_PERMISO|BLOQUEADO/.test(m)){
      detenerVigilancia();
      vigilando = false;
      manejarFalloDeArranque(e);   /* ya sabe sacar con el mensaje correcto */
      return;
    }
    /* Cualquier otra cosa —sin internet, servidor con hipo— se aguanta. */
  }finally{
    vigilando = false;
  }
}

function arrancarVigilancia(){
  detenerVigilancia();
  if(!HAY_NUBE) return;
  /* Solo con la pestaña visible: en segundo plano los temporizadores van frenados
     y no tiene sentido gastar lecturas de alguien que no está mirando. Al volver
     al frente se revisa de inmediato por el visibilitychange. */
  relojVigilancia = setInterval(()=>{ if(!document.hidden) revisarCuenta(); }, VIGILAR_CUENTA_MS);
}
function detenerVigilancia(){
  if(relojVigilancia){ clearInterval(relojVigilancia); relojVigilancia = null; }
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) revisarCuenta(); });

/* ========================= FIRESTORE POR REST =========================
   Se habla con Firestore con fetch normal, sin librerías, para que la
   página siga siendo un solo archivo.
   ====================================================================== */
const RAIZ_NUBE = () =>
  'https://firestore.googleapis.com/v1/projects/' + CONFIG_NUBE.projectId + '/databases/(default)/documents';

function aValor(v){
  if(v === null || v === undefined) return { nullValue:null };
  if(typeof v === 'boolean') return { booleanValue:v };
  if(typeof v === 'number') return Number.isInteger(v) ? { integerValue:String(v) } : { doubleValue:v };
  if(Array.isArray(v)) return { arrayValue:{ values: v.map(aValor) } };
  if(typeof v === 'object') return { mapValue:{ fields: aCampos(v) } };
  return { stringValue:String(v) };
}
function aCampos(o){ const f = {}; Object.keys(o).forEach(k=>{ f[k] = aValor(o[k]); }); return f; }
function deValor(v){
  if(!v || typeof v !== 'object') return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v)  return Number(v.doubleValue);
  if('stringValue' in v)  return v.stringValue;
  if('timestampValue' in v) return v.timestampValue;
  if('nullValue' in v)    return null;
  if('arrayValue' in v)   return (v.arrayValue.values || []).map(deValor);
  if('mapValue' in v)     return deCampos(v.mapValue.fields || {});
  return null;
}
function deCampos(f){ const o = {}; Object.keys(f).forEach(k=>{ o[k] = deValor(f[k]); }); return o; }

async function pedirNube(ruta, opciones, permitirVacio, esReintento){
  const t = await tokenVigente();
  const op = Object.assign({}, opciones);
  op.headers = Object.assign({ 'Authorization':'Bearer ' + t, 'Content-Type':'application/json' }, op.headers || {});
  const r = await fetch(RAIZ_NUBE() + ruta, op);
  if(r.status === 401 && !esReintento){
    await renovarToken();
    return pedirNube(ruta, opciones, permitirVacio, true);
  }
  if(r.status === 404 && permitirVacio) return null;
  if(r.status === 403){
    /* El servidor rechazó: lo más probable es que le acaben de quitar el acceso.
       Se confirma contra su perfil en segundo plano para sacarlo de inmediato en
       vez de esperar la revisión periódica. Sin await: quien llamó necesita su
       error ya. El guardo de "vigilando" evita que esto se muerda la cola cuando
       el 403 viene de la revisión misma. */
    if(!vigilando && haySesion()) revisarCuenta();
    throw new Error('SIN_PERMISO');
  }
  if(!r.ok){
    const t2 = await r.text().catch(()=>'');
    /* 400-499 (menos 401/403/404, ya resueltos arriba) es la respuesta del
       servidor RECHAZANDO la petición tal cual está escrita — un documento
       que pasó el 1 MiB de Firestore, un valor que no cuadra con el
       esquema. Reintentar eso mil veces nunca lo va a arreglar, a
       diferencia de un 5xx o una caída de red, que sí son pasajeros. Antes
       esto se trataba igual que "sin internet": la cola lo reintentaba para
       siempre y el tablero decía "Sin conexión" cuando el problema de
       fondo no tenía nada que ver con la conexión. */
    const permanente = r.status >= 400 && r.status < 500;
    throw new Error((permanente ? 'ERROR_PERMANENTE: ' : '') + 'HTTP ' + r.status + ' ' + t2.slice(0,300));
  }
  if(r.status === 204) return null;
  return r.json().catch(()=>null);
}

/* El tamaño de página se puede bajar para colecciones de documentos gordos:
   300 pólizas de 25 KB serían una respuesta de 7 MB. Por omisión, 300, que es
   como venía para clientes y sitios. */
async function listarNube(coleccion, porPagina){
  const salida = [];
  let pagina = '';
  const tam = Math.max(1, Math.min(300, parseInt(porPagina, 10) || 300));
  do{
    const d = await pedirNube('/' + coleccion + '?pageSize=' + tam + (pagina ? '&pageToken=' + encodeURIComponent(pagina) : ''), { method:'GET' });
    ((d && d.documents) || []).forEach(doc=>{
      const o = deCampos(doc.fields || {});
      o.id = doc.name.split('/').pop();
      salida.push(o);
    });
    pagina = (d && d.nextPageToken) || '';
  }while(pagina);
  return salida;
}
/* updateMask explícito: sin él, Firestore no reemplaza el registro de forma predecible. */
async function escribirNube(coleccion, id, obj){
  const campos = Object.assign({}, obj);
  delete campos.id;
  const mascara = Object.keys(campos).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id) + '?' + mascara, {
    method:'PATCH', body: JSON.stringify({ fields: aCampos(campos) })
  });
}
async function borrarNube(coleccion, id){
  return pedirNube('/' + coleccion + '/' + encodeURIComponent(id), { method:'DELETE' }, true);
}
async function crearNube(coleccion, obj){
  return pedirNube('/' + coleccion, { method:'POST', body: JSON.stringify({ fields: aCampos(obj) }) });
}

/* ===================== COLA DE CAMBIOS PENDIENTES =====================
   Cada cambio se guarda primero local y se apunta en una cola. La cola se
   vacía contra el servidor; si no hay internet, espera y reintenta. Así no
   se pierde nada aunque se cierre la pestaña.
   ====================================================================== */
const LLAVE_COLA = 'forguard_forpass_cola_v1';
let cola = [];
let vaciando = false, intentosFallidos = 0, temporizadorCola = null;

function cargarCola(){ try{ cola = JSON.parse(localStorage.getItem(LLAVE_COLA) || '[]'); }catch(e){ cola = []; } }
function guardarCola(){ try{ localStorage.setItem(LLAVE_COLA, JSON.stringify(cola)); }catch(e){} }

function encolar(op){
  if(!HAY_NUBE) return;
  /* Si ya había un cambio pendiente del mismo registro, este lo reemplaza. */
  cola = cola.filter(x => !(x.coleccion === op.coleccion && x.id === op.id));
  cola.push(op);
  guardarCola();
  pintarEstadoNube();
  vaciarCola();
}

async function vaciarCola(){
  if(vaciando || !HAY_NUBE || !haySesion() || !cola.length) return;
  clearTimeout(temporizadorCola);
  vaciando = true;
  pintarEstadoNube();
  try{
    while(cola.length){
      const op = cola[0];
      try{
        if(op.tipo === 'borrar') await borrarNube(op.coleccion, op.id);
        else                     await escribirNube(op.coleccion, op.id, op.obj);
      }catch(e){
        /* Un 403 de escritura NO es pasajero: el servidor no la va a aceptar
           nunca, ni en el reintento número mil. Dejarla en la cola la atoraba
           para siempre —el tablero decía "cambios pendientes" a perpetuidad y
           hasta estorbaba al cerrar sesión— y el aviso genérico echaba la culpa a
           la cuenta cuando lo que faltaba era publicar una regla. Se saca, se
           dice CUÁL fue, y se sigue con las demás. */
        if(/SIN_PERMISO/.test(String(e.message || ''))){
          /* Solo si sigue siendo la MISMA operación: si el usuario volvió a
             guardar este registro durante el intento, encolar() ya la
             reemplazó y quitarla aquí tiraría la versión nueva sin mandarla. */
          if(cola[0] === op) cola.shift();
          guardarCola();
          aviso('El servidor rechazó un cambio en «' + op.coleccion + '». Se quedó guardado aquí, pero no subió. '
              + (op.coleccion === 'catalogo'
                  ? 'Falta publicar la regla de /catalogo en Firebase.'
                  : 'Puede faltar la regla de esa colección, o tu permiso no alcanza.'), true);
          continue;
        }
        /* Un 4xx (típicamente 400: el documento pasó del 1 MiB que permite
           Firestore, casi siempre por varias imágenes/PDFs convertidos en
           un mismo proyecto de Imagen/Aperturas) TAMPOCO es pasajero —
           mismo criterio que SIN_PERMISO arriba: reintentarlo no lo va a
           arreglar solo. Se saca de la cola y se avisa CUÁL registro fue y
           por qué, para no quedarse "Sin conexión" para siempre por un
           problema que no es de conexión. */
        if(/ERROR_PERMANENTE/.test(String(e.message || ''))){
          if(cola[0] === op) cola.shift();
          guardarCola();
          const detalle = String(e.message || '').replace('ERROR_PERMANENTE: ', '').slice(0, 180);
          const nombreRegistro = (op.obj && (op.obj.nombreProyecto || op.obj.folio)) || op.id;
          aviso('El servidor rechazó guardar «' + nombreRegistro + '» (' + op.coleccion + ') y no se va a resolver reintentando — '
              + detalle + '. '
              + (op.coleccion === 'proyectosImagen'
                  ? 'Es probable que las imágenes o PDFs juntos ya no quepan en un solo documento: quita alguna imagen del proyecto y vuelve a guardar.'
                  : 'Revisa el contenido de ese registro.'), true);
          continue;
        }
        throw e;
      }
      /* Mismo cuidado que arriba, y este sí mordió: dos guardados rápidos del
         mismo registro (marcar un pago e inmediatamente palomear «facturado»).
         encolar() reemplaza en la cola la operación del mismo registro, así que
         durante el await de escribirNube cola[0] puede dejar de ser `op`: el
         shift ciego quitaba la versión NUEVA —que nunca viajó— y el servidor se
         quedaba con la vieja. El siguiente refresco pisaba la copia local con
         eso y el segundo guardado se perdía sin ningún aviso. */
      if(cola[0] === op) cola.shift();
      guardarCola();
      pintarEstadoNube();
    }
    intentosFallidos = 0;
  }catch(e){
    const m = String(e.message || '');
    if(/SIN_SESION|SESION_VENCIDA/.test(m)){ vaciando = false; salir(true); return; }
    intentosFallidos = Math.min(intentosFallidos + 1, 6);
    temporizadorCola = setTimeout(vaciarCola, 1500 * Math.pow(2, intentosFallidos - 1));
    console.warn('Reintentando guardar en la nube:', m);
  }finally{
    vaciando = false;
    pintarEstadoNube();
  }
}

/* Trae del servidor y reemplaza la copia local.
   Si el servidor está completamente vacío pero aquí sí hay información, no la
   borra: devuelve 'vacia' para que quien arranca decida subirla. Así nadie
   pierde lo que ya había capturado antes de conectar la nube. */
async function bajarDeLaNube(){
  /* Una póliza pesa ~25 KB contra ~1.1 KB de un sitio, así que se piden de 60 en
     60 y no de 300: una página de 300 pólizas serían ~7 MB en una sola respuesta.
     listarNube pagina igual, nada más que en más viajes y más chicos. */
  /* La lista de precios va en UN documento con un arreglo adentro, no en un
     documento por equipo: así son 48 equipos por 1 lectura en vez de 48. Se
     edita poco y se lee en cada carga, así que el ahorro es todo. El costo es
     que dos admins editándola a la vez se pisan, y eso está anotado en la vista. */
  /* serviciosExtras se sigue leyendo aquí (aunque el módulo ya no existe)
     solo para no perder nada que ya se hubiera subido antes de la fusión con
     Cotizaciones (28-ago-2026, ver migrarServiciosExtrasACotizaciones) — es
     de solo lectura, ya no se le vuelve a escribir. */
  const [cl, si, po, eq, sg, pr, co, rp, lv, im, se] = await Promise.all([
    listarNube('clientes'), listarNube('sitios'), listarNube('polizas', 60), leerCatalogo(),
    leerSegmentos(), leerParametros(), listarNube('cotizaciones'), listarNube('reportes', 60),
    listarNube('levantamientos', 60), listarNube('proyectosImagen', 60),
    listarNube('serviciosExtras', 60)
  ]);
  if(!cl.length && !si.length && !po.length
     && (datos.clientes.length || datos.sitios.length || datos.polizas.length)) return 'vacia';
  /* La descarga tarda —cuatro lecturas paginadas— y el guardia de quien llama
     revisa la cola ANTES de arrancarla: una captura hecha DENTRO de esa ventana
     quedaba pisada en pantalla y en la copia local por la versión del servidor,
     hasta el siguiente refresco. Y en el arranque con cola pendiente de una
     sesión sin internet era peor: se pisaba la copia local antes de subir. Con
     cambios pendientes se sigue trabajando con la copia local; el siguiente
     refresco, ya con la cola vacía, descarga limpio. */
  if(cola.length || vaciando) return 'ok';
  datos = { v:1, clientes: cl.map(normalizarCliente), sitios: si.map(normalizarSitio),
            polizas: po.map(normalizarPoliza), catalogo: eq.map(normalizarEquipo),
            segmentos: sg, parametros: pr,
            cotizaciones: co.map(normalizarCotizacion).concat(migrarServiciosExtrasACotizaciones(se)),
            reportes: rp.map(normalizarReporte), levantamientos: lv.map(normalizarLevantamiento),
            proyectosImagen: im.map(normalizarProyectoImagen) };
  guardarLocal();
  return 'ok';
}

/* La lista de precios NUNCA puede impedir entrar al tablero.

   Se lee aparte y se traga cualquier error a propósito. La primera versión no lo
   hacía y el resultado fue no poder entrar: sin la regla de /catalogo pegada, el
   catch-all responde 403 —no 404—, pedirNube lanzaba SIN_PERMISO, y
   manejarFalloDeArranque lee SIN_PERMISO como "esta cuenta perdió el acceso" y
   saca al usuario. Un dato de comodidad tumbando el login entero.

   Si falla, se trabaja con la semilla en memoria y ya. */
async function leerCatalogo(){
  try{
    const d = await pedirNube('/catalogo/lista', { method:'GET' }, true);
    return (d && d.fields) ? (deCampos(d.fields).equipos || []) : [];
  }catch(e){
    console.warn('No se pudo leer la lista de precios; se usa la de arranque:', String(e.message || e));
    return [];
  }
}

/* Guarda la lista de precios completa. Local primero, como todo lo demás.
   No se guarda equipo por equipo porque el documento es uno solo. */
function guardarCatalogo(detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'catalogo', id:'lista', obj:{ equipos: datos.catalogo } });
  anotar('actualizó', 'lista de precios', datos.catalogo.length + ' equipos', detalle);
}

/* La semilla se sube cuando alguien lo pide, NO sola al arrancar.

   Automático era peor: si la regla de /catalogo no está pegada, la escritura
   rebota con 403, se queda atorada en la cola, y a partir de ahí el tablero dice
   "hay cambios pendientes" para siempre y hasta estorba al cerrar sesión. Un
   botón no puede envenenar la cola de nadie sin que se haya pedido. */
function sembrarCatalogo(){
  if(!exigirAdmin('guardar la lista de precios')) return;
  if(datos.catalogo.length){ aviso('La lista ya está guardada en el servidor.'); return; }
  datos.catalogo = CATALOGO_SEMILLA.map(normalizarEquipo);
  guardarCatalogo('siembra inicial de las cotizaciones de MXGT01, MXNL02, INOAC y NGK');
  render();
  aviso('Lista de precios guardada con ' + datos.catalogo.length + ' equipos.');
}

/* Carga masiva de costos (insumos + mano de obra) desde un JSON —
   [{concepto, costoInsumos, costoManoObra}, ...]— para no tener que teclear
   equipo por equipo. Empareja por nombre normalizado (mismo criterio que
   tituloPoliza y compañía: sin mayúsculas ni acentos). Solo TOCA el costo de
   equipos que YA existen en el catálogo: un equipo nuevo se da de alta con
   "Agregar equipo", no aparece solo porque venía en el archivo — así nunca
   se cuela un nombre mal escrito como si fuera un equipo real. */
function importarCostosCatalogo(datosCrudos){
  if(!exigirAdmin('importar costos al catálogo')) return;
  if(!Array.isArray(datosCrudos) || !datosCrudos.length){
    aviso('Ese archivo no trae una lista de equipos con costo.', true);
    return;
  }
  if(!datos.catalogo.length) datos.catalogo = CATALOGO_SEMILLA.map(normalizarEquipo);

  const porLlave = new Map(datos.catalogo.map(e => [llaveTexto(e.concepto), e]));
  let actualizados = 0, sinDatoDeCosto = 0, descripcionesLlenadas = 0;
  const sinCoincidencia = [];

  datosCrudos.forEach(fila=>{
    const concepto = (fila && fila.concepto ? String(fila.concepto) : '').trim();
    if(!concepto) return;
    const eq = porLlave.get(llaveTexto(concepto));
    if(!eq){ sinCoincidencia.push(concepto); return; }

    const cambios = {};
    /* Una fila en cero no es "este equipo cuesta cero" — en la hoja de origen
       significa "todavía no lo costeamos". Importarla tal cual borraría un
       costo real que alguien ya haya capturado a mano. Se salta, no se pisa. */
    const insumos = Number(fila.costoInsumos) || 0, manoObra = Number(fila.costoManoObra) || 0;
    if(insumos || manoObra){ cambios.costoInsumos = insumos; cambios.costoManoObra = manoObra; }
    else sinDatoDeCosto++;

    /* Igual criterio con la descripción: solo RELLENA la que está vacía. Si
       alguien ya escribió una propia para ese equipo, se respeta — la hoja
       no la pisa. */
    const descripcionNueva = (fila.descripcion ? String(fila.descripcion) : '').trim();
    if(descripcionNueva && !eq.descripcion){ cambios.descripcion = descripcionNueva; descripcionesLlenadas++; }

    if(!Object.keys(cambios).length) return;
    Object.assign(eq, normalizarEquipo(Object.assign({}, eq, cambios)));
    actualizados++;
  });

  if(!actualizados){
    aviso('Ningún equipo del archivo trae costo o descripción nueva y coincide con el catálogo. Revisa la ortografía.', true);
    return;
  }

  guardarCatalogo('importó costos: ' + actualizados + ' ' + plural(actualizados,'equipo','equipos'));
  render();
  aviso(actualizados + ' ' + plural(actualizados,'equipo actualizado','equipos actualizados') + ' (costo y/o descripción).'
    + (descripcionesLlenadas ? ' ' + descripcionesLlenadas + ' ' + plural(descripcionesLlenadas,'descripción rellenada','descripciones rellenadas') + '.' : '')
    + (sinDatoDeCosto ? ' ' + sinDatoDeCosto + ' sin dato de costo en la hoja, se dejaron como estaban.' : '')
    + (sinCoincidencia.length ? ' ' + sinCoincidencia.length + ' sin coincidencia en el catálogo: ' + sinCoincidencia.join(', ') + '.' : ''),
    !!sinCoincidencia.length);
}

/* ===================== SEGMENTOS Y PARÁMETROS PERSONALIZADOS =====================
   Dos catálogos más, mismo molde que la lista de precios: un solo documento
   con un arreglo adentro, editable desde Admin → «Segmentos y parámetros»,
   sin tocar código.

   segmentos  → sustituye a la constante ZONAS: sugerencias de zona al
                capturar un sitio. Es solo texto libre sugerido, así que basta
                un arreglo de strings.
   parametros → campos extra que un Admin define para clientes y/o sitios
                ({id, etiqueta, tipo}). El VALOR de cada uno vive en
                `personalizados[id]` del cliente/sitio — llaveado por id y no
                por posición, por la misma razón que ya costó una vez con el
                registro de servicios de pólizas: si el parámetro se renombra,
                el valor no se desalinea.
   =================================================================== */
function normalizarSegmentos(arr){
  return (Array.isArray(arr) ? arr : [])
    .map(z => String(z || '').trim())
    .filter(Boolean);
}
/* La lista viva. Sale del servidor; si todavía no hay nada, se usan las
   sugerencias de arranque para que el formulario nunca se quede sin nada
   que sugerir. */
function segmentos(){ return datos.segmentos.length ? datos.segmentos : ZONAS.slice(); }

async function leerSegmentos(){
  try{
    const d = await pedirNube('/segmentos/lista', { method:'GET' }, true);
    return normalizarSegmentos((d && d.fields) ? deCampos(d.fields).valores : []);
  }catch(e){
    console.warn('No se pudo leer la lista de segmentos; se usa la de arranque:', String(e.message || e));
    return [];
  }
}
function guardarSegmentos(detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'segmentos', id:'lista', obj:{ valores: datos.segmentos } });
  anotar('actualizó', 'lista de segmentos', datos.segmentos.length + ' ' + plural(datos.segmentos.length,'segmento','segmentos'), detalle);
}

const TIPOS_PARAMETRO = ['texto','numero','fecha','booleano'];
const ETIQUETA_TIPO_PARAM = { texto:'Texto', numero:'Número', fecha:'Fecha', booleano:'Sí / No' };

function normalizarParametro(p){
  return {
    id: (p && p.id ? String(p.id) : '').trim() || nuevoId(),
    etiqueta: (p && p.etiqueta ? String(p.etiqueta) : '').trim(),
    tipo: TIPOS_PARAMETRO.includes(p && p.tipo) ? p.tipo : 'texto'
  };
}
function normalizarListaParametros(x){
  return {
    clientes: (Array.isArray(x && x.clientes) ? x.clientes : []).map(normalizarParametro),
    sitios:   (Array.isArray(x && x.sitios)   ? x.sitios   : []).map(normalizarParametro)
  };
}
/* Definiciones vivas para un módulo ('clientes' o 'sitios'). */
function parametrosDe(modulo){ return (datos.parametros && datos.parametros[modulo]) || []; }

async function leerParametros(){
  try{
    const d = await pedirNube('/parametros/lista', { method:'GET' }, true);
    return normalizarListaParametros((d && d.fields) ? deCampos(d.fields) : null);
  }catch(e){
    console.warn('No se pudo leer los parámetros personalizados; se usan los de arranque:', String(e.message || e));
    return { clientes:[], sitios:[] };
  }
}
function guardarParametros(detalle){
  guardarLocal();
  encolar({ tipo:'poner', coleccion:'parametros', id:'lista', obj: datos.parametros });
  anotar('actualizó', 'parámetros personalizados', detalle);
}

/* Pinta los campos de un módulo dentro de un formulario (modalCliente o
   modalSitio). `prefijo` distingue los id de los inputs entre los dos
   formularios para que nunca choquen. */
function camposParametros(modulo, prefijo, valores){
  valores = valores || {};
  const defs = parametrosDe(modulo);
  if(!defs.length) return '';
  return '<div class="seccion"><h4>Parámetros</h4>'
    + defs.map(d=>{
        const val = valores[d.id];
        const idInput = prefijo + 'Param_' + d.id;
        if(d.tipo === 'booleano'){
          return '<label class="casilla"><input type="checkbox" id="' + esc(idInput) + '" data-param-id="' + esc(d.id) + '"'
            + (val === true || val === 'true' ? ' checked' : '') + '> ' + esc(d.etiqueta) + '</label>';
        }
        const tipoInput = d.tipo === 'numero' ? 'number' : d.tipo === 'fecha' ? 'date' : 'text';
        return '<div class="campo"><label>' + esc(d.etiqueta) + '</label>'
          + '<input type="' + tipoInput + '" id="' + esc(idInput) + '" data-param-id="' + esc(d.id) + '" value="' + esc(val ?? '') + '"></div>';
      }).join('')
    + '</div>';
}
/* Lee del DOM los valores capturados, fusionados sobre los que ya tenía el
   registro: así un parámetro que ya no está definido no se pierde al editar,
   la misma trampa que ya costó con pagosDetalle y contactos de un sitio. */
function leerParametrosForm(modulo, prefijo, previos){
  const out = Object.assign({}, previos || {});
  parametrosDe(modulo).forEach(d=>{
    const el = $(prefijo + 'Param_' + d.id);
    if(!el) return;
    out[d.id] = d.tipo === 'booleano' ? el.checked : el.value.trim();
  });
  return out;
}
function formatoParametro(def, valor){
  if(def.tipo === 'numero') return numero(valor);
  if(def.tipo === 'fecha')  return valor ? fmtFecha(valor) : '';
  if(def.tipo === 'booleano') return (valor === true || valor === 'true') ? 'Sí' : 'No';
  return String(valor);
}
/* Chips de solo lectura para la tarjeta de sitio o el encabezado de cliente:
   nada más lo que de verdad tiene valor, para no ensuciar la vista con
   parámetros que nadie llenó. */
function chipsPersonalizados(modulo, obj){
  const p = obj.personalizados || {};
  const defs = parametrosDe(modulo).filter(d => p[d.id] !== undefined && p[d.id] !== '');
  if(!defs.length) return '';
  return '<div class="t-nota" style="display:flex; flex-wrap:wrap; gap:6px 16px">'
    + defs.map(d => '<span><b>' + esc(d.etiqueta) + ':</b> ' + esc(formatoParametro(d, p[d.id])) + '</span>').join('')
    + '</div>';
}

/* Panel de Admin: alta y baja de segmentos y de parámetros. Los tres bloques
   comparten molde con «Lista de precios» (vistaPrecios): un documento único,
   se ve completo y se cambia de golpe. */
function bloqueSegmentos(){
  const puede = esAdmin();
  const lista = segmentos();
  return '<div class="bloque"><div class="bloque-cabeza"><div>'
     +   '<h3>Segmentos</h3><p>Sugerencias de zona al capturar un sitio (campo de texto libre; esto solo cambia qué se sugiere). '

           + '</span>').join('')
           : '<span class="pista">Ninguno guardado todavía; se sugieren los de arranque.</span>')
     +   '</div>'
     +   (puede
         ? '<div class="fila2" style="align-items:flex-end">'
           +   '<div class="campo" style="margin-bottom:0"><label>Nuevo segmento</label>'
