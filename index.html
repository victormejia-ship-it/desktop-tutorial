  /* Actualiza SOLO los números, sin tocar el HTML de los campos: nadie pierde el
     cursor a media captura. */
  /* Con "soloIdx" actualiza un renglón; sin él, todos. Al teclear se pasa el
     índice: recorrer 150 renglones en cada tecla se siente. */
  function refrescar(soloIdx){
    const sel = soloIdx === undefined
      ? 'tbody tr[data-idx]:not(.fila-meses)'
      : 'tbody tr[data-idx="' + soloIdx + '"]:not(.fila-meses)';
    const nodos = $('listaPartidas').querySelectorAll(sel);
    nodos.forEach(nodo=>{
      const i = +nodo.dataset.idx, x = partidasTmp[i];
      if(!x) return;
      const lim = normalizarPartida(x);
      const t = nodo.querySelector('[data-total]');
      if(t) t.value = dineroCent(totalRenglon(lim));
      const cuadra = cuadraFrecuencia(lim);
      const fr = nodo.querySelector('[data-campo="frecuencia"]');
      /* No se regaña antes de que el usuario escriba nada: un renglón recién
         agregado está vacío por definición. */
      if(fr) fr.setAttribute('aria-invalid', (cuadra || !x._tocada) ? 'false' : 'true');
      /* Ancho del concepto para el documento impreso. Se avisa, NO se bloquea:
         es el mismo criterio que la frecuencia que no cuadra. */
      const cp = nodo.querySelector('[data-campo="concepto"]');
      if(cp){
        const largo = (x.concepto || '').trim().length;
        const cabe = conceptoCabeImpreso(x);
        /* Sin el guardo de `_tocada` que sí usa la frecuencia, y a propósito: un
           concepto de 40 caracteres no cabe igual si lo acaban de teclear que si
           entró por el importador —y las cuatro pólizas reales entraron así—. Un
           renglón nuevo trae el concepto vacío, así que nunca se regaña de gratis. */
        cp.setAttribute('aria-invalid', cabe ? 'false' : 'true');
        cp.title = cabe ? '' :
          'Son ' + largo + ' caracteres y en el documento impreso caben unos '
          + CHARS_CONCEPTO_IMPRESO + '. No se bloquea: si no cabe, el nombre se '
          + 'parte en dos líneas y ese renglón queda más alto que los demás.';
      }
      const cu = $('listaPartidas').querySelector('.fila-meses[data-idx="' + i + '"] [data-cuadre]');
      if(cu){
        cu.hidden = cuadra || !x._tocada;
        if(!cuadra) cu.textContent = 'Marcaste ' + lim.mesesServicio.length + ' '
          + plural(lim.mesesServicio.length,'mes','meses') + ' y pusiste ' + lim.frecuencia + ' '
          + plural(lim.frecuencia,'servicio al año','servicios al año') + '. No cuadra.';
      }
    });
    refrescarResumen();
  }

  function refrescarResumen(){
    const f = leerForm();
    const prov = normalizarPoliza(Object.assign({}, f, { partidas: partidasTmp, id:'tmp' }));
    const c = calcularPoliza(prov);
    if($('pieAnual'))   $('pieAnual').textContent   = dineroCent(c.precioAnual);
    /* El descuento en vivo mientras se captura: se teclea 5 y el pie ya enseña
       cuánto son y cuánto queda. Sin esto habría que guardar para saberlo. */
    if($('pieBloqueDesc')){
      const hay = c.descuento !== 0;
      $('pieBloqueDesc').style.display  = hay ? '' : 'none';
      $('pieBloqueDesc2').style.display = hay ? '' : 'none';
      if(hay){
        $('pieSubtotalEtiqueta').textContent = c.etiquetaBase;
        $('pieSubtotal').textContent = dineroCent(c.base);
        $('pieDescEtiqueta').textContent = (c.esAumento ? 'Aumento ' : 'Descuento ') + c.descuentoAbs + '%';
        $('pieDescuento').textContent = (c.esAumento ? '+' : '−') + dineroCent(c.montoDescuentoAbs);
        $('pieDescuento').style.color = c.esAumento ? 'var(--ok)' : 'var(--error)';
      }
    }
    if($('pieMensual')) $('pieMensual').textContent = dineroCent(c.precioMensual);

    const nCobros = prov.cobros.length;
    /* Se CUENTAN los iguales en vez de dar por hecho "11 y uno": cuando el anual
       divide exacto entre doce, los doce cobros son iguales y decir "11 de X"
       era un off-by-one puro y duro. */
    const iguales = c.montosCent.filter(m => m === c.montosCent[0]).length;
    const ultimo = c.montos[nCobros - 1];
    $('resumenPoliza').innerHTML =
        '<div class="r-fila"><span>Renglones</span><span>' + partidasTmp.length
      + (c.noCuadran ? ' · ' + c.noCuadran + ' sin cuadrar' : '') + '</span></div>'
      + '<div class="r-fila"><span>Equipos en total</span><span>'
      +   numero(prov.partidas.reduce((t,x)=> t + x.cantidad, 0)) + '</span></div>'
      + '<div class="r-fila"><span>Vigencia</span><span>' + fmtFecha(prov.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</span></div>'
      + '<div class="r-fila"><span>Servicios al año</span><span>' + numero(c.programados) + '</span></div>'
      + (prov.facturacion === 'mensual'
          ? '<div class="r-fila"><span>Cobros</span><span>'
            + (iguales === nCobros
                ? nCobros + ' de ' + dineroCent(c.montos[0])
                : iguales + ' de ' + dineroCent(c.montos[0]) + ' y uno de ' + dineroCent(ultimo))
            + '</span></div>'
          : '<div class="r-fila"><span>Cobros</span><span>uno solo, al inicio</span></div>')
      + '<div class="r-fila r-total"><span>Precio anual</span><span>' + dineroCent(c.precioAnual) + '</span></div>'
      + '<div class="r-fila"><span>Costo anual</span><span>' + dineroCent(c.costoAnual) + '</span></div>'
      + '<div class="r-fila r-total"><span>Margen</span><span style="color:' + (c.utilidadAnual >= 0 ? 'var(--ok)' : 'var(--error)') + '">'
      +   dineroCent(c.utilidadAnual) + ' (' + c.margenPct.toFixed(1) + '%)</span></div>';
  }

  /* Agrega un renglón y deja el cursor donde toca seguir capturando. */
  function agregarRenglon(base, foco){
    /* Candado de respaldo. Los controles que llegan aquí ya van apagados, pero
       agregar un renglón cambia `partidas` y en una póliza congelada eso es un
       403: más vale que no haya un segundo camino. */
    if(congelada) return;
    if(partidasTmp.length >= MAX_RENGLONES){
      aviso('Una cotización aguanta ' + MAX_RENGLONES + ' renglones. Ya no cabe otro.', true);
      return;
    }
    partidasTmp.push(normalizarPartida(base));
    pintarPartidas();
    if(foco === null) return;          /* quien llama se encarga del foco */
    const fila = $('listaPartidas').querySelector('tr[data-idx="' + (partidasTmp.length-1) + '"]');
    const campo = fila && fila.querySelector('[data-campo="' + (foco || 'concepto') + '"]');
    if(campo){ campo.focus(); campo.select && campo.select(); }
  }

  /* ---- Listeners delegados: se cuelgan UNA vez, fuera de pintarPartidas.
     Adentro se acumularían y una sola acción correría N veces. ---- */
  $('listaPartidas').addEventListener('input', ev=>{
    const campo = ev.target.closest('[data-campo]');
    if(!campo) return;
    const fila = campo.closest('[data-idx]');
    const x = partidasTmp[+fila.dataset.idx];
    if(!x) return;
    const k = campo.dataset.campo;
    x._tocada = true;
    if(k === 'cantidad'){ x.cantidad = parseInt(campo.value,10) || 0; }
    else if(k === 'frecuencia'){
      const antes = mesArranqueDe(normalizarPartida(x));
      x.frecuencia = parseInt(campo.value,10) || 0;
      /* Cambiar la frecuencia cambia el intervalo, así que los meses se recalculan
         desde el mismo arranque. Si el renglón estaba a mano no se le tocan: ahí
         los meses los puso alguien a propósito. */
      const nuevos = mesesRegulares(antes === null ? 0 : antes, Math.max(1, x.frecuencia));
      if(antes !== null && nuevos) { x.mesesServicio = nuevos; pintarPartidas(); return; }
    }
    else if(k === 'precioUnitario'){ formatearMiles(campo); x.precioUnitario = aNumero(campo.value); }
    else if(k === 'costoUnitario'){ formatearMiles(campo); x.costoUnitario = aNumero(campo.value); }
    else x[k] = campo.value;
    refrescar(+fila.dataset.idx);
  });

  $('listaPartidas').addEventListener('change', ev=>{
    const sel = ev.target.closest('[data-arranque]');
    if(!sel) return;
    if(sel.value === '') return;                 /* «a mano»: no se toca nada */
    const x = partidasTmp[+sel.closest('[data-idx]').dataset.idx];
    const m = mesesRegulares(parseInt(sel.value,10), Math.max(1, x.frecuencia));
    if(!m) return;
    x.mesesServicio = m;
    x._tocada = true;
    pintarPartidas();
  });

  $('listaPartidas').addEventListener('click', ev=>{
    const mes = ev.target.closest('[data-mes]');
    if(mes){
      const x = partidasTmp[+mes.closest('[data-idx]').dataset.idx];
      const m = +mes.dataset.mes;
      const j = x.mesesServicio.indexOf(m);
      x._tocada = true;
      if(j === -1) x.mesesServicio.push(m); else x.mesesServicio.splice(j,1);
      x.mesesServicio.sort((a,b)=> a-b);
      /* Marcar meses a mano AJUSTA la frecuencia: si escoges cuatro meses, son
         cuatro servicios al año. Antes había que corregir el número aparte y el
         renglón se quedaba en rojo por no cuadrar consigo mismo. Si se quedan en
         cero no se toca: 0 servicios al año no significa nada. */
      if(x.mesesServicio.length) x.frecuencia = x.mesesServicio.length;
      pintarPartidas();          /* el arranque puede haber pasado a «a mano» */
      return;
    }
    const mano = ev.target.closest('[data-meses-mano]');
    if(mano){
      const x = partidasTmp[+mano.dataset.mesesMano];
      x._abierta = !x._abierta;
      pintarPartidas();
      return;
    }
    const dup = ev.target.closest('[data-duplicar]');
    if(dup){
      const i = +dup.dataset.duplicar;
      /* Copia con id EN BLANCO: el duplicado es otro equipo, no el mismo con dos
         vidas. Como el historial de servicios se llavea por el id de la partida,
         dejarle el mismo id le heredaría los servicios del original — y borrar
         uno de los dos borraría los del otro. normalizarPartida le pone uno
         nuevo. */
      const copia = Object.assign({}, partidasTmp[i],
        { id:'', mesesServicio: partidasTmp[i].mesesServicio.slice() });
      partidasTmp.splice(i + 1, 0, normalizarPartida(copia));
      partidasTmp[i + 1]._tocada = true;
      pintarPartidas();
      aviso('Renglón duplicado. Cámbiale los meses si esa unidad va aparte.');
      return;
    }
    const quitar = ev.target.closest('[data-quitar]');
    if(quitar){
      const i = +quitar.dataset.quitar;
      const x = partidasTmp[i];
      /* Un renglón con servicios ya registrados no se va sin avisar: eso borra
         trabajo hecho, no solo una línea de precio. El historial vive en la
         póliza, llaveado por el id de este renglón — y normalizarPoliza tira las
         llaves cuyo renglón ya no existe, así que quitarlo sí se lo lleva. */
      const hechos = Object.keys((p && p.hechos && p.hechos[x.id]) || {}).length;
      /* Mismo motivo que arriba: confirmar() reemplazaría #modalCuerpo y se
         perdería la captura. Diálogo del navegador. */
      if(hechos && !window.confirm(
          (x.concepto || 'Este equipo') + ' tiene ' + hechos + ' '
          + plural(hechos,'servicio registrado','servicios registrados')
          + '.\n\nAl quitarlo se borra también ese historial. ¿Seguir?')){
        return;
      }
      partidasTmp.splice(i,1);
      pintarPartidas();
    }
  });

  /* Chips de acceso rápido: los equipos que más se cotizan, a un clic. Escribir
     el nombre completo para los de siempre era el trabajo tonto de la captura.
     Salen de las pólizas que ya existen; si no hay ninguna, del catálogo. */
  function pintarChips(){
    const caja = $('chipsEquipo');
    if(!caja) return;
    /* En una póliza congelada no se agregan renglones, así que los chips no van.
       Doce botones apagados son ruido; no enseñarlos dice lo mismo mejor. */
    if(congelada){ caja.innerHTML = ''; caja.hidden = true; return; }
    caja.hidden = false;
    const cuenta = {};
    datos.polizas.forEach(q => q.partidas.forEach(x => {
      if(x.catalogoId) cuenta[x.catalogoId] = (cuenta[x.catalogoId] || 0) + 1;
    }));
    const activos = catalogo().filter(e => e.activo);
    const orden = activos.slice().sort((a,b)=> (cuenta[b.id]||0) - (cuenta[a.id]||0) || a.concepto.localeCompare(b.concepto,'es'));
    caja.innerHTML = orden.slice(0, 12).map(e =>
      '<button type="button" class="chip-eq" data-chip="' + esc(e.id) + '" '
      + 'title="' + esc(e.concepto + (e.precio ? ' · ' + dineroCent(e.precio) : ' · sin precio')
          + ' · ' + e.frecuencia + ' al año') + '">'
      + esc(e.concepto) + '<span class="mas">+</span></button>').join('');
  }
  $('chipsEquipo').addEventListener('click', ev=>{
    const b = ev.target.closest('[data-chip]');
    if(!b) return;
    const e = equipoDeCatalogo(b.dataset.chip);
    if(e) agregarDelEquipo(e);
  });

  /* Buscador del catálogo: al elegir un equipo se agrega el renglón ya con su
     precio y su frecuencia, y el foco SE QUEDA en el buscador para poder escribir
     el siguiente sin volver a picarlo. Con 34 equipos, ir y volver al buscador
     cada vez era la mitad del trabajo. */
  function agregarDelCatalogo(){
    const txt = $('pBuscaEquipo').value.trim();
    if(!txt) return;
    const e = catalogo().find(q => q.activo && q.concepto.toLowerCase() === txt.toLowerCase())
           || catalogo().find(q => q.activo && q.concepto.toLowerCase().startsWith(txt.toLowerCase()));
    $('pBuscaEquipo').value = '';
    if(!e){
      aviso('«' + txt + '» no está en el catálogo. Usa «Agregar otro» y captúralo a mano.', true);
      return;
    }
    agregarDelEquipo(e);
  }
  function agregarDelEquipo(e){
    agregarRenglon({
      catalogoId: e.id, concepto: e.concepto, cantidad: 1,
      precioUnitario: e.precio, costoUnitario: costoTotalEquipo(e), frecuencia: e.frecuencia,
      /* Arranca en el primer mes; "Balancear calendario" los reparte después. */
      mesesServicio: mesesRegulares(0, e.frecuencia)
    }, null);
    /* El foco vuelve al buscador, no a la cantidad: así se encadenan los 34
       equipos escribiendo, y las cantidades se ajustan al final en la tabla. */
    if($('pBuscaEquipo')) $('pBuscaEquipo').focus();
    if(!e.precio) aviso(e.concepto + ' no tiene precio en el catálogo. Escríbelo en el renglón.', true);
  }
  $('pBuscaEquipo').addEventListener('change', agregarDelCatalogo);
  $('pBuscaEquipo').addEventListener('keydown', ev=>{
    if(ev.key === 'Enter'){ ev.preventDefault(); agregarDelCatalogo(); }
  });
  /* Agregar de a muchos: capturar una cotización de 40 equipos picando "Agregar
     otro" cuarenta veces es absurdo. Se pide el número y se ponen todos de golpe. */
  $('btnOtroEquipo').addEventListener('click', ()=>{
    const pedidos = Math.max(1, Math.min(MAX_RENGLONES, parseInt($('pCuantos').value,10) || 1));
    const espacio = MAX_RENGLONES - partidasTmp.length;
    if(espacio <= 0){
      aviso('Una cotización aguanta ' + MAX_RENGLONES + ' renglones. Ya no cabe otro.', true);
      return;
    }
    const cuantos = Math.min(pedidos, espacio);
    const molde = () => ({ concepto:'', cantidad:1, precioUnitario:0, frecuencia:3, mesesServicio:mesesRegulares(0,3) });
    for(let i = 0; i < cuantos; i++) partidasTmp.push(normalizarPartida(molde()));
    pintarPartidas();
    /* El cursor cae en el PRIMERO de los nuevos, no en el último: se captura de
       arriba hacia abajo y de ahí en adelante todo es Tab. */
    const fila = $('listaPartidas').querySelector('tr[data-idx="' + (partidasTmp.length - cuantos) + '"]');
    const campo = fila && fila.querySelector('[data-campo="concepto"]');
    if(campo) campo.focus();
    $('pCuantos').value = 1;
    if(cuantos > 1) aviso(cuantos + ' renglones agregados. Captúralos con Tab.');
    if(cuantos < pedidos) aviso('Solo cupieron ' + cuantos + ': el tope es ' + MAX_RENGLONES + ' renglones.', true);
  });

  /* Cliente nuevo sin salir del modal: hay clientes con póliza y sin ningún
     kiosco, y mandar al usuario al módulo de Forpass a crearlo rompía la captura. */
  $('btnClienteNuevo').addEventListener('click', ()=>{
    if(!exigirPermiso()) return;
    const z = $('zonaClienteNuevo');
    z.hidden = !z.hidden;
    if(!z.hidden){ $('ncNombre').value = ''; $('ncUsaForpass').checked = false; $('ncNombre').focus(); }
  });
  $('ncCancelar').addEventListener('click', ()=>{ $('zonaClienteNuevo').hidden = true; });
  $('ncCrear').addEventListener('click', ()=>{
    const nombre = $('ncNombre').value.trim();
    if(!nombre){ $('ncNombre').setAttribute('aria-invalid','true'); $('ncNombre').focus(); aviso('Falta el nombre del cliente.', true); return; }
    const ya = datos.clientes.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
    if(ya){
      $('pCliente').value = ya.id; $('zonaClienteNuevo').hidden = true;
      pintarSitios(); refrescarResumen();
      aviso('Ese cliente ya existía; lo seleccioné.');
      return;
    }
    const nuevo = normalizarCliente({ id:nuevoId(), nombre,
      usaForpass: $('ncUsaForpass').checked ? 'si' : 'no' });
    datos.clientes.push(nuevo);
    guardarCliente(nuevo, 'creó');
    /* Se repinta solo el select, no el modal: repintar tiraría la captura. */
    $('pCliente').innerHTML = datos.clientes.slice()
      .sort((x,y)=> x.nombre.localeCompare(y.nombre,'es'))
      .map(c => '<option value="' + esc(c.id) + '"' + (c.id === nuevo.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('');
    $('zonaClienteNuevo').hidden = true;
    pintarSitios(); refrescarResumen();
    aviso(nombre + ' dado de alta y seleccionado'
      + ($('ncUsaForpass').checked ? ' — ya aparece también en Forpass.' : '.')
      + ' Su logo se sube desde el detalle de la póliza.');
  });

  $('pCliente').addEventListener('change', ()=>{ pintarSitios(); refrescarResumen(); });
  /* Mover el inicio mueve el calendario entero: hay que reescribir las etiquetas
     de los meses, así que este sí redibuja la tabla. */
  $('pInicio').addEventListener('change', pintarPartidas);
  ['pSitioNombre','pFolio','pEstatus','pCotizacion','pNotas','pVendNombre','pVendCorreo','pVendTel']
    .forEach(x => $(x).addEventListener('input', refrescarResumen));
  /* El descuento repinta el pie en cada tecla, como los renglones: teclear 5 y
     ver de inmediato cuánto son y cuánto queda es la mitad del valor de tenerlo. */
  if($('pDescuento')) $('pDescuento').addEventListener('input', refrescarResumen);

  $('pFacturacion').addEventListener('change', ()=>{
    /* Cambiar de anual a mensual rehace las casillas de cobro. Si ya había algo
       capturado, se avisa en vez de que aparezcan once casillas de la nada. */
    if(p && p.cobros.some(Boolean)) aviso('Ojo: esta póliza ya tiene cobros capturados y cambiar la facturación rehace las casillas.', true);
    refrescarResumen();
  });

  pintarSitios();
  pintarChips();
  pintarPartidas();

  cerrarModalActual = ()=>{
    /* Se lee TODO antes de cerrar: cerrarModal() reemplaza #modalCuerpo por un
       clon limpio y después de eso los campos devuelven null. */
    const f = leerForm();
    const limpias = partidasTmp.map(normalizarPartida).filter(x => x.concepto);

    if(!f.clienteId){ aviso('Selecciona un cliente.', true); return; }
    if(!f.sitioNombre){ $('pSitioNombre').setAttribute('aria-invalid','true'); $('pSitioNombre').focus(); aviso('La póliza necesita el nombre del sitio.', true); return; }
    if(!limpias.length){ aviso('Agrega al menos un equipo con su concepto.', true); return; }

    /* Se puede guardar una cotización a medias; lo que no se puede es CERRARLA
       si los renglones no cuadran. Un contrato activo con una frecuencia que no
       corresponde a sus meses es justo lo que veníamos a evitar. */
    const noCuadran = limpias.filter(x => !cuadraFrecuencia(x));
    /* Al intentar guardar sí se destapan todos los avisos: ya no es prematuro. */
    if(noCuadran.length){ partidasTmp.forEach(x => { x._tocada = true; }); refrescar(); }
    /* Admin solo para la TRANSICIÓN. Antes el gate era `estatus === 'activa'` a
       secas, y a un Analyst que reeditaba una activa —corregir el sitio o las
       notas, exactamente lo que el aviso de congelada le promete— lo detenía
       «Solo un Admin puede cerrar una póliza». La regla del servidor sí
       distingue: la cláusula 3 le acepta la reescritura mientras lo congelado
       salga idéntico, y de eso ya se encarga el formulario apagado. */
    if(f.estatus === 'activa' && (!p || p.estatus !== 'activa')){
      if(!exigirAdmin('cerrar una póliza como activa')) return;
      if(noCuadran.length){
        aviso('No se puede cerrar: ' + noCuadran.length + ' ' + plural(noCuadran.length,'renglón no cuadra','renglones no cuadran') + ' entre meses y servicios al año.', true);
        return;
      }
    }

    /* El formulario no trae ni la cobranza ni los servicios ejecutados: los dos
       se capturan aparte. Hay que arrastrarlos EXPLÍCITAMENTE o normalizarPoliza
       los deja en blanco y editar una póliza le borra sus OC y su historial de
       mantenimientos. Es la misma trampa de leerForm() con los sitios, y `hechos`
       cayó en ella en cuanto se subió al nivel de la póliza: mientras vivía
       dentro de cada partida viajaba solo. */
    const conservado = p ? { cobros:p.cobros, cobrosDetalle:p.cobrosDetalle, hechos:p.hechos } : {};
    const limpio = normalizarPoliza(Object.assign({}, conservado, f, {
      partidas: partidasTmp, id: p ? p.id : nuevoId()
    }));

    const c = calcularPoliza(limpio);
    if(p){ Object.assign(p, limpio); }
    else{ datos.polizas.push(limpio); }

    let accion = p ? 'editó' : 'creó';
    if(f.estatus === 'activa' && (!p || p.estatus !== 'activa')) accion = 'cerró';
    /* El precio de cierre queda en la bitácora, que es inmutable por regla: si
       alguien corrige una póliza activa después, este renglón sigue diciendo con
       cuánto se cerró. */
    guardarPoliza(p || limpio, accion,
      limpio.partidas.length + ' ' + plural(limpio.partidas.length,'equipo','equipos') + ' · ' + dineroCent(c.precioAnual) + ' al año');

    cerrarModal();
    estado.modulo = 'polizas'; guardarModulo();
    estado.vista = 'polizas'; estado.polizaId = null;
    render();
    if(noCuadran.length && f.estatus !== 'activa'){
      aviso('Guardada, pero ' + noCuadran.length + ' ' + plural(noCuadran.length,'renglón no cuadra','renglones no cuadran') + ': no se podrá cerrar así.', true);
    }else{
      aviso(p ? 'Póliza actualizada.' : 'Cotización creada.');
    }
  };
}

/* ------------------------- Modal: cotización de servicio ------------------------- */
/* `origenReporte` es opcional: cuando la cotización nace de un reporte (botón
   "Generar cotización desde este reporte"), llega el reporte completo para
   prellenar sitio, tipo de mantenimiento y un primer concepto con el equipo
   que se reportó — y para dejar la liga en los dos sentidos al guardar. */
function modalCotizacion(id, origenReporte){
  const q = id ? cotizacionPorId(id) : null;

  /* Copia de trabajo: se toca esto y no el registro, para que Cancelar
     cancele de verdad — mismo molde que partidasTmp en modalPoliza. */
  let partidasTmp = (q ? q.partidas
    : (origenReporte ? [normalizarPartidaCotizacion({ concepto: origenReporte.equipoNombre || origenReporte.titulo, cantidad:1 })] : [])
  ).map(x => Object.assign({}, x));

  const sitiosOrd = () => datos.sitios.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
  const opcSitiosHTML = sel => (sitiosOrd().length
    ? sitiosOrd().map(s=>{
        const cli = clientePorId(s.clienteId);
        return '<option value="' + esc(s.id) + '"' + (s.id === sel ? ' selected' : '') + '>'
          + esc(s.nombre) + (cli ? ' — ' + esc(cli.nombre) : '') + '</option>';
      }).join('')
    : '<option value="">— Todavía no hay sitios: crea uno abajo —</option>');

  const opcDatalist = (idLista, valores) => '<datalist id="' + idLista + '">'
    + valores.map(v => '<option value="' + esc(v) + '">').join('') + '</datalist>';

  /* Sin sitios el candado bloqueaba el módulo entero: había que ir a Forpass,
     dar de alta cliente y sitio, y volver — rompiendo la captura de la
     cotización que se quería hacer. Mismo remedio que "Cliente nuevo" en
     modalPoliza: alta en línea, sin salir de aquí. Si ya no hay ninguno,
     arranca abierta. */
  const sinSitios = !datos.sitios.length;

  const cuerpo =
      (origenReporte
        ? '<div class="aviso">' + ICONO.info + '<div>Esta cotización se va a ligar al reporte <b>'

/* ==================== IMPORTAR PÓLIZAS DESDE UN JSON ====================
   Las cotizaciones viejas viven en PDF de Canva. El lector de
   scripts/lector-pdf/ las convierte a JSON con la forma de una póliza; esto
   es lo que las mete al tablero.

   Se escogen archivos, NO se bajan de la red. Un fetch a docs/ dependería de
   que Pages sirva esa carpeta —cosa que nunca se comprobó— y no funcionaría
   en modo local. Con el selector funciona igual en los dos, y sirve para
   cualquier cotización futura y no solo para las cuatro que ya están.

   NADA se guarda hasta que se confirma: primero se ve qué va a entrar, con
   cuánto, y qué renglones traen problema.
   ======================================================================= */

/* En el JSON los meses vienen escritos: "29 de julio 2026". */
const MESES_TEXTO = ['enero','febrero','marzo','abril','mayo','junio','julio',
                     'agosto','septiembre','octubre','noviembre','diciembre'];

/* Compara nombres sin que un acento o una mayúscula estorben: el catálogo dice
   «Báscula de recibo» y la cotización «Bascula De Recibo», y es el mismo
   equipo. Solo para comparar — lo que se guarda es siempre el texto original. */
function llaveTexto(s){
  return String(s ?? '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\s+/g, ' ').trim();
}

/* «29 de julio 2026» → «2026-07-29». Devuelve '' si no se entiende, para que
   quien llama decida el respaldo en vez de inventar una fecha aquí. */
function fechaEsp(txt){
  const m = /^\s*(\d{1,2})\s+de\s+([a-záéíóúñ]+)\s+(?:de\s+)?(\d{4})\s*$/i.exec(String(txt ?? ''));
  if(!m) return '';
  const mes = MESES_TEXTO.indexOf(llaveTexto(m[2]));
  if(mes < 0) return '';
  return m[3] + '-' + String(mes+1).padStart(2,'0') + '-' + String(Number(m[1])).padStart(2,'0');
}

function leerTexto(archivo){
  return new Promise((listo, falla)=>{
    const l = new FileReader();
    l.onerror = ()=> falla(new Error('No se pudo leer el archivo.'));
    l.onload  = ()=> listo(String(l.result));
    l.readAsText(archivo);
  });
}

/* Un archivo → una póliza lista, más lo que hay que advertir antes de meterla.
   NO escribe nada: eso pasa en confirmarImportacion() y solo si se acepta. */
function polizaDesdeJSON(j, archivo){
  if(!j || typeof j !== 'object' || !Array.isArray(j.partidas))
    return { error:'No trae un arreglo «partidas»: no parece una cotización.' };

  const nombreCliente = String(j.cliente || '').trim();
  if(!nombreCliente) return { error:'No trae el nombre del cliente.' };

  const avisos = [];

  /* El cliente se busca por nombre y se crea al confirmar si no está. Uno solo
     para los dos módulos: Mercado Libre con kioscos y con pólizas es un
     registro con un solo logo. */
  const cli = datos.clientes.find(c => llaveTexto(c.nombre) === llaveTexto(nombreCliente)) || null;

  /* Sin sitio, el nombre del cliente. sitioNombre es lo que sale impreso y lo
     que titula la tarjeta: dejarlo vacío daría una póliza llamada «Póliza». */
  const sitioNombre = String(j.sitio || '').trim() || nombreCliente;

  /* Se liga al kiosco de Forpass solo si el nombre coincide y es del mismo
     cliente. Adivinar la liga es peor que no ligarla: se pone a mano después. */
  const sitio = cli
    ? datos.sitios.find(s => s.clienteId === cli.id && llaveTexto(s.nombre) === llaveTexto(sitioNombre)) || null
    : null;

  const fechaCot = fechaEsp(j.fecha);
  if(!fechaCot) avisos.push('La fecha «' + esc(String(j.fecha || '')) + '» no se entendió: entra con la de hoy.');

  /* inicioCalendario manda la vigencia, y con ella el calendario entero:
     mesesServicio son corrimientos DESDE esta fecha. Día 1 porque el PDF solo
     dice el mes.

     `mes` viene 0-INDEXADO: 0 = enero, 11 = diciembre. Así lo escribe el lector
     de PDF (`MESN` de generar.py se arma con enumerate sobre ['ene',…]) y así lo
     documenta la plantilla. Esto se leyó como 1-indexado y las cuatro pólizas
     entraron con la vigencia UN MES ANTES: MXNL02 arrancaba en julio cuando su
     calendario impreso empieza en agosto. Como los meses de servicio son
     corrimientos desde aquí, no se movía un dato: se movían TODOS los servicios
     de TODOS los renglones, un mes, sin error y sin aviso.

     El `+ 1` es la conversión a mes de calendario. Y el rango es 0..11, no 1..12:
     con el de antes, una póliza que arrancara en enero (mes 0) reprobaba la
     validación y se iba callada a la fecha de la cotización. */
  const ic = j.inicioCalendario || {};
  const mes = parseInt(ic.mes, 10), anio = parseInt(ic.anio, 10);
  let fechaInicio = '';
  if(mes >= 0 && mes <= 11 && anio >= 2000 && anio <= 2999){
    fechaInicio = anio + '-' + String(mes + 1).padStart(2,'0') + '-01';
  }else{
    avisos.push('Sin «inicioCalendario» válido: la vigencia arranca en la fecha de la cotización.');
  }

  /* El vendedor se guarda COPIADO, igual que al capturar a mano: el documento
     tiene que seguir diciendo lo mismo dentro de un año. Del JSON solo viene
     su correo y su teléfono, así que el nombre se saca del correo. */
  const contacto = j.contacto || {};
  const correo = String(contacto.correo || '').trim();
  const vendedor = { uid:'', nombre: correo ? nombreDeCorreo(correo) : '',
                     correo, telefono: String(contacto.tel || '').trim() };

  const lista = catalogo();          /* una vez, no una por renglón */
  let sinCatalogo = 0;
  const partidas = j.partidas.map(x=>{
    const eq = lista.find(e => llaveTexto(e.concepto) === llaveTexto(x.concepto)) || null;
    if(!eq) sinCatalogo++;
    /* La descripción se resuelve del catálogo y solo se guarda si es distinta
       —la regla de siempre—. De los renglones reales, la gran mayoría trae
       exactamente el texto del catálogo: guardarlo sería repetirlo decenas de
       veces y perder la mejora si algún día se corrige el catálogo. */
    const propia = String(x.descripcion || '').trim();
    const suya = (eq && llaveTexto(propia) === llaveTexto(eq.descripcion)) ? '' : propia;
    return normalizarPartida(Object.assign({}, x, { catalogoId: eq ? eq.id : '', descripcion: suya }));
  }).filter(x => x.concepto);

  if(!partidas.length) return { error:'Ningún renglón trae concepto: no hay nada que importar.' };

  if(sinCatalogo){
    avisos.push(sinCatalogo + ' ' + plural(sinCatalogo,'renglón no está','renglones no están')
      + ' en la lista de precios: entran con su propio texto y sin ligar al catálogo.');
  }
  const noCuadran = partidas.filter(x => !cuadraFrecuencia(x)).length;
  if(noCuadran){
    avisos.push(noCuadran + ' ' + plural(noCuadran,'renglón no cuadra','renglones no cuadran')
      + ' entre sus meses y sus servicios al año: así no se podrá cerrar como activa.');
  }

  /* Importar dos veces el mismo archivo es el error fácil. Se detecta y la fila
     llega DESMARCADA: que se pueda no quiere decir que se deba. Si el cliente
     ya existe se exige que sea el mismo, porque dos clientes distintos sí
     pueden tener sitios con el mismo nombre. */
  const repetida = datos.polizas.find(p =>
        llaveTexto(p.sitioNombre) === llaveTexto(sitioNombre)
        && (!cli || p.clienteId === cli.id)) || null;

  /* Estatus «enviada» con la fecha del documento: es una cotización que ya
     salió y todavía no se cierra. Los precios NO quedan congelados —eso pasa
     al pasarla a activa— así que se puede corregir un renglón sin pelearse con
     la regla del servidor. */
  const poliza = normalizarPoliza({
    id: nuevoId(),
    clienteId: cli ? cli.id : '',       /* si no existe, se rellena al crearlo */
    sitioId: sitio ? sitio.id : '',
    sitioNombre,
    estatus: 'enviada',
    facturacion: 'mensual',
    fechaCotizacion: fechaCot || hoyISO(),
    fechaEnvio: fechaCot || hoyISO(),
    fechaInicio: fechaInicio || fechaCot || hoyISO(),
    vendedor, partidas,
    notas: 'Importada de ' + archivo + '.'
  });

  return { poliza, nombreCliente, cli, sitio, repetida, avisos };
}

/* Lee los archivos escogidos y abre la vista previa. */
async function importarPolizas(archivos){
  const lecturas = [];
  for(const f of archivos){
    let r;
    try{
      r = polizaDesdeJSON(JSON.parse(await leerTexto(f)), f.name);
    }catch(e){
      /* El mensaje de JSON.parse viene en inglés y hablando de posiciones de
         caracteres: no le sirve a nadie. El archivo lo genera el lector de PDF,
         así que si viene roto lo que toca es volver a generarlo. */
      r = { error: (e instanceof SyntaxError)
              ? 'El archivo no es un JSON válido: vuelve a generarlo.'
              : 'No se pudo leer el archivo.' };
    }
    r.archivo = f.name;
    lecturas.push(r);
  }
  modalImportar(lecturas);
}

/* Vista previa. Una fila por archivo con lo que de verdad va a entrar: el
   dinero se calcula aquí mismo con calcularPoliza(), o sea con el mismo código
   que la tarjeta, así que lo que se ve es lo que va a quedar. */
function modalImportar(lecturas){
  /* Un archivo repetido llega desmarcado; los demás marcados. */
  const marcado = lecturas.map(r => !r.error && !r.repetida);

  const filas = lecturas.map((r,i)=>{
    if(r.error){
      return '<tr><td></td><td>' + esc(r.archivo) + '</td>'
           + '<td colspan="6" style="color:var(--error)">' + esc(r.error) + '</td></tr>';
    }
    const c = calcularPoliza(r.poliza);
    const notas = r.avisos.slice();
    if(r.repetida) notas.unshift('<b>Ya hay una póliza de ese sitio</b> en el tablero. Si la importas quedan dos.');
    if(!r.cli) notas.push('El cliente «' + esc(r.nombreCliente) + '» no existe todavía: se va a crear.');
    if(r.sitio) notas.push('Queda ligada al sitio de Forpass «' + esc(r.sitio.nombre) + '».');

    return '<tr' + (notas.length ? ' class="tiene-notas"' : '') + '>'
         + '<td><input type="checkbox" data-imp="' + i + '"' + (marcado[i] ? ' checked' : '') + '></td>'
         + '<td>' + esc(r.poliza.sitioNombre) + '<div class="pista">' + esc(r.archivo) + '</div></td>'
         + '<td>' + esc(r.nombreCliente) + (r.cli ? '' : ' <span class="insignia i-info">nuevo</span>') + '</td>'
         + '<td style="text-align:right">' + r.poliza.partidas.length + '</td>'
         + '<td style="text-align:right">' + numero(r.poliza.partidas.reduce((t,x)=> t + x.cantidad, 0)) + '</td>'
         + '<td style="text-align:right"><b>' + dineroCent(c.precioAnual) + '</b></td>'
         + '<td style="text-align:right">' + dineroCent(c.precioMensual) + '</td>'
         + '<td style="white-space:nowrap">' + fmtFecha(r.poliza.fechaInicio) + ' → ' + fmtFecha(c.fin) + '</td>'
         + '</tr>'
         + (notas.length
             ? '<tr class="imp-notas"><td></td><td colspan="7">' + notas.join('<br>') + '</td></tr>'
             : '');
  }).join('');

  abrirModal('Importar pólizas desde JSON',
      '<p class="pista" style="margin-bottom:12px">Entran como <b>enviadas</b> —cotizaciones en la calle, con sus precios todavía editables— '
    + 'y con <b>facturación mensual</b>, o sea doce casillas de cobro. Nada se guarda hasta que le des a Importar.</p>'
    + '<div class="rodillo"><table class="tabla" style="min-width:760px"><thead><tr>'
    + '<th></th><th>Sitio</th><th>Cliente</th><th style="text-align:right">Renglones</th>'
    + '<th style="text-align:right">Equipos</th><th style="text-align:right">Anual</th>'
    + '<th style="text-align:right">Mensual</th><th>Vigencia</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<div id="impResumen" class="imp-pie"></div>',
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar" id="btnImportar">Importar</button>');
  $('modal').classList.add('enorme');

  const resumir = ()=>{
    const escogidas = lecturas.filter((r,i)=> !r.error && marcado[i]);
    const total = escogidas.reduce((t,r)=> t + calcularPoliza(r.poliza).precioAnualCent, 0);
    const porCrear = [...new Set(escogidas.filter(r => !r.cli).map(r => llaveTexto(r.nombreCliente)))].length;
    $('impResumen').innerHTML =
        '<span>' + escogidas.length + ' de ' + lecturas.length + ' ' + plural(lecturas.length,'archivo','archivos')
      + (porCrear ? ' · ' + porCrear + ' ' + plural(porCrear,'cliente nuevo','clientes nuevos') : '')
      + '</span><b>' + dineroCent(deCentavos(total)) + ' al año</b>';
    $('btnImportar').disabled = !escogidas.length;
  };
  resumir();

  /* Delegado y colgado una sola vez: dentro de resumir() se acumularían. */
  $('modalCuerpo').addEventListener('change', ev=>{
    const ch = ev.target.closest('[data-imp]');
    if(!ch) return;
    marcado[Number(ch.dataset.imp)] = ch.checked;
    resumir();
  });

  cerrarModalActual = ()=>{
    const escogidas = lecturas.filter((r,i)=> !r.error && marcado[i]);
    if(!escogidas.length) return;
    cerrarModal();
    confirmarImportacion(escogidas);
  };
}

function confirmarImportacion(escogidas){
  /* Los clientes que faltan se crean UNA vez por nombre: dos archivos de
     Mercado Libre no pueden dejar dos registros con el mismo logo por subir. */
  const creados = new Map();
  let nuevosClientes = 0;
  escogidas.forEach(r=>{
    if(r.poliza.clienteId) return;
    const llave = llaveTexto(r.nombreCliente);
    if(!creados.has(llave)){
      const c = normalizarCliente({ nombre: r.nombreCliente, usaForpass:'no' });
      datos.clientes.push(c);
      guardarCliente(c, 'creó');
      creados.set(llave, c);
      nuevosClientes++;
    }
    r.poliza.clienteId = creados.get(llave).id;
  });

  escogidas.forEach(r=>{
    datos.polizas.push(r.poliza);
    const c = calcularPoliza(r.poliza);
    guardarPoliza(r.poliza, 'importó',
      r.poliza.partidas.length + ' ' + plural(r.poliza.partidas.length,'equipo','equipos')
      + ' · ' + dineroCent(c.precioAnual) + ' al año · ' + r.archivo);
  });

  estado.modulo = 'polizas'; guardarModulo();
  estado.vista = 'polizas'; estado.polizaId = null;
  animarTarjetas = true;
  render();
  aviso(escogidas.length + ' ' + plural(escogidas.length,'póliza importada','pólizas importadas')
    + (nuevosClientes ? ' · ' + nuevosClientes + ' ' + plural(nuevosClientes,'cliente nuevo','clientes nuevos') : '') + '.');
}

/* ------------------- Modal: encargado del sitio (de nuestro lado) ----------
   Quién de nuestro equipo lleva ese sitio. Lo ve todo el mundo en la tarjeta,
   pero solo Owner y Admin pueden asignarlo.
   ------------------------------------------------------------------------- */
async function modalEncargado(sitioId){
  const s = sitioPorId(sitioId);
  if(!s) return;
  if(!exigirAdmin('asignar el encargado de un sitio')) return;

  abrirModal('Encargado de ' + s.nombre,
    '<div class="vacio-chico">Cargando el equipo…</div>',
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>');

  /* En modo nube se elige de las cuentas del equipo; en local se escribe a mano. */
  let cuentas = null;
  if(HAY_NUBE){
    try{
      if(!admin.usuarios) admin.usuarios = await listarNube('usuarios');
      cuentas = admin.usuarios.filter(u => u.activo !== false);
    }catch(e){
      cuentas = null;   /* si no se pudo leer, se cae al campo de texto libre */
    }
  }

  const actual = s.encargado || { uid:'', nombre:'', correo:'' };
  let cuerpo = '<p class="pista" style="margin:0 0 14px">Quién de nuestro equipo tiene este sitio a su cargo. '
             + 'Lo van a ver todos, pero solo un Admin lo puede cambiar.</p>';

  if(cuentas && cuentas.length){
    const opciones = cuentas
      .slice().sort((a,b)=> nombreDe(a).localeCompare(nombreDe(b),'es'))
      .map(u => '<option value="' + esc(u.id) + '"' + (u.id === actual.uid ? ' selected' : '') + '>'
                + esc(nombreDe(u)) + ' — ' + esc(ROLES[normalizarRol(u.rol)].nombre) + '</option>').join('');
    cuerpo += '<div class="campo"><label>Encargado</label><select id="eSel">'
            + '<option value="">Sin asignar</option>' + opciones + '</select></div>';
    /* Si el encargado guardado ya no tiene cuenta, no se pierde en silencio. */
    if(actual.nombre && !cuentas.some(u => u.id === actual.uid)){
      cuerpo += '<div class="aviso" style="margin-top:4px">' + ICONO.info
              + '<div>Hoy dice <b>' + esc(actual.nombre) + '</b>, pero esa cuenta ya no está en el equipo. '
              + 'Si guardas sin elegir a nadie, el sitio queda sin asignar.</div></div>';
    }
  }else{
    cuerpo += '<div class="campo"><label>Nombre del encargado</label>'
            + '<input type="text" id="eNombre" placeholder="Ej. Ana Torres" value="' + esc(actual.nombre) + '">'
            + '<div class="pista">Déjalo vacío para dejar el sitio sin asignar.</div></div>';
  }

  $('modalCuerpo').innerHTML = cuerpo;
  $('modalPie').innerHTML =
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar">Guardar</button>';

  cerrarModalActual = ()=>{
    let nuevo = { uid:'', nombre:'', correo:'' };
    if($('eSel')){
      const u = (cuentas || []).find(x => x.id === $('eSel').value);
      if(u) nuevo = { uid:u.id, nombre:nombreDe(u), correo:u.correo || '' };
    }else if($('eNombre')){
      nuevo = { uid:'', nombre:$('eNombre').value.trim(), correo:'' };
    }

    const antes = actual.nombre || 'sin asignar';
    s.encargado = nuevo;
    guardarSitio(s, 'cambió el encargado de', antes + ' → ' + (nuevo.nombre || 'sin asignar'));
    cerrarModal(); render();
    aviso(nuevo.nombre ? s.nombre + ' queda a cargo de ' + nuevo.nombre + '.'
                       : s.nombre + ' queda sin encargado.');
  };
}

/* ------------------- Modal: contactos de la OC del sitio -------------------
   Quién nos manda la orden de compra de este sitio. Los que pueden editar lo
   ven como formulario; un Viewer lo ve como ficha de consulta, con los correos
   y teléfonos listos para hacer clic.
   ------------------------------------------------------------------------- */
function modalContactos(sitioId){
  const s = sitioPorId(sitioId);
  if(!s) return;
  const cli = clientePorId(s.clienteId);
  const puedo = puedeEditar();
  let lista = s.contactos.map(x => Object.assign({}, x));

  function vista(){
    if(!lista.length){
      return '<div class="vacio-chico">Todavía no hay nadie registrado para este sitio. '
           + (puedo ? 'Agrega a la persona que nos manda la OC.' : 'Pide a alguien con permiso de captura que lo registre.') + '</div>';
    }
    return lista.map(x=>
        '<div class="contacto-vista">'
      +   '<div class="cv-icono">' + ICONO.persona + '</div>'
      +   '<div style="flex:1; min-width:0">'
      +     '<div class="cv-nombre">' + esc(x.nombre || 'Sin nombre') + '</div>'
      +     (x.puesto ? '<div class="cv-puesto">' + esc(x.puesto) + '</div>' : '')
      +     '<div class="cv-datos">'
      +       (x.correo ? '<a href="mailto:' + esc(x.correo) + '">' + ICONO.sobre + esc(x.correo) + '</a>' : '')
      +       (x.telefono ? '<a href="tel:' + esc(x.telefono.replace(/[^0-9+]/g,'')) + '">' + ICONO.tel + esc(x.telefono) + '</a>' : '')
      +     '</div>'
      +     (x.notas ? '<div class="cv-notas">' + esc(x.notas) + '</div>' : '')
      +   '</div>'
      + '</div>').join('');
  }

  function formulario(){
    return lista.map((x,i)=>
        '<div class="contacto">'
      +   '<button type="button" class="btn btn-peligro btn-mini c-quitar" data-quitar-contacto="' + i + '" title="Quitar">' + ICONO.basura + '</button>'
      +   '<div class="fila2">'
      +     '<div class="campo"><label>Nombre *</label>'
      +       '<input type="text" data-cc="nombre" data-i="' + i + '" placeholder="Ej. Juan Pérez" value="' + esc(x.nombre) + '"></div>'
      +     '<div class="campo"><label>Puesto</label>'
      +       '<input type="text" data-cc="puesto" data-i="' + i + '" placeholder="Ej. Compras" value="' + esc(x.puesto) + '"></div>'
      +   '</div>'
      +   '<div class="fila2">'
      +     '<div class="campo"><label>Correo</label>'
      +       '<input type="email" data-cc="correo" data-i="' + i + '" placeholder="juan@cliente.com" value="' + esc(x.correo) + '"></div>'
      +     '<div class="campo"><label>Teléfono</label>'
      +       '<input type="tel" data-cc="telefono" data-i="' + i + '" placeholder="81 1234 5678" value="' + esc(x.telefono) + '"></div>'
      +   '</div>'
      +   '<div class="campo" style="margin-bottom:0"><label>Notas</label>'
      +     '<input type="text" data-cc="notas" data-i="' + i + '" placeholder="Ej. solo contesta por WhatsApp" value="' + esc(x.notas) + '"></div>'
      + '</div>').join('')
      + '<button type="button" class="btn btn-suave btn-mini" id="btnAgregarContacto">' + ICONO.mas + 'Agregar otra persona</button>';
  }

  function pintar(){
    $('modalCuerpo').innerHTML =
        '<p class="pista" style="margin:0 0 16px">Persona que nos manda la orden de compra de <b>' + esc(s.nombre) + '</b>'
      + (cli ? ' · ' + esc(cli.nombre) : '') + '.</p>'
      + (puedo ? formulario() : vista());

    /* Este botón sí se recrea en cada redibujo, así que se conecta aquí. */
    if(puedo){
      $('btnAgregarContacto').addEventListener('click', ()=>{
        lista.push({ nombre:'', puesto:'', correo:'', telefono:'', notas:'' });
        pintar();
        const campos = $('modalCuerpo').querySelectorAll('[data-cc="nombre"]');
        if(campos.length) campos[campos.length-1].focus();
      });
    }
  }

  abrirModal('Contacto de la OC · ' + s.nombre, '',
      (puedo ? '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
             + '<button type="button" class="btn btn-primario" data-modal="guardar">Guardar contactos</button>'
             : '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>'));

  /* Estos van UNA sola vez: #modalCuerpo sobrevive a los redibujos, y si se
     conectaran dentro de pintar() se irían acumulando — quitar un contacto
     acabaría borrando varios de golpe. */
  if(puedo){
    $('modalCuerpo').addEventListener('input', ev=>{
      const campo = ev.target.closest('[data-cc]');
      if(!campo || !lista[+campo.dataset.i]) return;
      lista[+campo.dataset.i][campo.dataset.cc] = campo.value;
    });
    $('modalCuerpo').addEventListener('click', ev=>{
      const q = ev.target.closest('[data-quitar-contacto]');
      if(!q) return;
      lista.splice(+q.dataset.quitarContacto, 1);
      pintar();
    });
  }
  pintar();

  cerrarModalActual = puedo ? ()=>{
    /* Se descartan los renglones vacíos; un contacto sin nombre no sirve. */
    const limpios = lista
      .map(x=>({ nombre:x.nombre.trim(), puesto:x.puesto.trim(), correo:x.correo.trim(),
                 telefono:x.telefono.trim(), notas:x.notas.trim() }))
      .filter(x => x.nombre || x.correo || x.telefono);
    const sinNombre = limpios.find(x => !x.nombre);
    if(sinNombre){ aviso('Cada contacto necesita al menos un nombre.', true); return; }

    s.contactos = limpios;
    guardarSitio(s, 'actualizó el contacto de', limpios.length
      ? limpios.map(x=>x.nombre).join(', ') : 'ninguno');
    cerrarModal(); render();
    aviso(limpios.length ? 'Contacto guardado.' : 'Se quitó el contacto del sitio.');
  } : null;
}

/* -------------------- Modal: vigencias por vencer -------------------------
   El indicador cuenta los contratos activos que terminan dentro de 45 días.
   Aquí se ve cuáles son, para poder renovarlos a tiempo. Se añaden aparte los
   que YA se vencieron y siguen marcados como activos, que urgen más.
   ------------------------------------------------------------------------- */
const DIAS_POR_VENCER = 45;

function modalPorVencer(clienteId){
  const lista = clienteId ? sitiosDe(clienteId) : datos.sitios;

  const conDatos = lista
    .map(s => ({ s, c: calcular(s), cli: clientePorId(s.clienteId) }))
    .filter(x => x.s.estado === 'activo');

  const porVencer = conDatos
    .filter(x => x.c.diasVigencia >= 0 && x.c.diasVigencia <= DIAS_POR_VENCER)
    .sort((a,b)=> a.c.diasVigencia - b.c.diasVigencia);
  const yaVencidos = conDatos
    .filter(x => x.c.diasVigencia < 0)
    .sort((a,b)=> a.c.diasVigencia - b.c.diasVigencia);

  function tabla(filas, urgente){
    return '<div class="rodillo"><table class="tabla" style="min-width:560px"><thead><tr>'
      + '<th>Cliente</th><th>Sitio</th><th>Forpass</th><th>Vigencia</th>'
      + '<th style="text-align:right">' + (urgente ? 'Terminó' : 'Faltan') + '</th>'
      + '<th style="text-align:right">Mensualidad</th>'
      + '</tr></thead><tbody>'
      + filas.map(x=>{
          const d = Math.abs(x.c.diasVigencia);
          const etiqueta = urgente
            ? '<span class="rol c-owner">hace ' + d + ' ' + plural(d,'día','días') + '</span>'
            : '<span class="rol ' + (x.c.diasVigencia <= 15 ? 'c-owner' : 'c-admin') + '">'
              + d + ' ' + plural(d,'día','días') + '</span>';
          return '<tr>'
            + '<td>' + esc(x.cli ? x.cli.nombre : '—') + '</td>'
            + '<td><b>' + esc(x.s.nombre) + '</b></td>'
            + '<td style="text-align:center">' + numero(x.s.modulos) + '</td>'
            + '<td>' + fmtFecha(x.c.fin) + '</td>'
            + '<td style="text-align:right">' + etiqueta + '</td>'
            + '<td style="text-align:right; font-weight:700">' + dinero(x.s.mensualidad) + '</td>'
            + '</tr>';
        }).join('')
      + '</tbody></table></div>';
  }

  let cuerpo = '';
  if(!porVencer.length && !yaVencidos.length){
    cuerpo = '<div class="vacio-chico">Ningún contrato activo termina en los próximos '
           + DIAS_POR_VENCER + ' días. Nada que renovar por ahora.</div>';
  }else{
    if(yaVencidos.length){
      const mrr = yaVencidos.reduce((t,x)=> t + x.s.mensualidad, 0);
      cuerpo += '<h4 style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#a5322e; font-weight:700; margin-bottom:10px">'
             +  'Ya se vencieron y siguen activos · ' + dinero(mrr) + ' al mes</h4>'
             +  tabla(yaVencidos, true)
             +  '<p class="pista" style="margin:8px 0 20px">Estos contratos ya terminaron pero el sitio sigue marcado como Activo. '
             +  'Hay que renovarlos o cambiarles el estado a Baja.</p>';
    }
    if(porVencer.length){
      const mrr = porVencer.reduce((t,x)=> t + x.s.mensualidad, 0);
      cuerpo += '<h4 style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:700; margin-bottom:10px">'
             +  'Terminan en los próximos ' + DIAS_POR_VENCER + ' días · ' + dinero(mrr) + ' al mes en juego</h4>'
             +  tabla(porVencer, false);
    }
  }

  const cli = clienteId ? clientePorId(clienteId) : null;
  abrirModal('Vigencias por vencer' + (cli ? ' · ' + cli.nombre : ''), cuerpo,
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>');
  $('modal').classList.add('ancho');
  cerrarModalActual = null;
}

/* Detalle de los indicadores de cobranza. tipo: 'atrasados' o 'porPagar'.
   Antes solo "Vigencias por vencer" se podía abrir; los demás se veían igualitos
   pero no respondían al clic, que es enseñar que se puede y luego no cumplir.
   Los dos totales de arriba (Forpass activos y Mensualidad total) se quedan sin
   abrir a propósito: son sumas, no tienen un detalle que valga una ventana. */
function modalCobranza(clienteId, tipo){
  const atraso = tipo === 'atrasados';
  const lista = clienteId ? sitiosDe(clienteId) : datos.sitios;

  const filas = lista
    .map(s => ({ s, c: calcular(s), cli: clientePorId(s.clienteId) }))
    .filter(x => atraso ? x.c.tono === 'error' : x.c.estatus === 'Por pagar')
    /* Atrasados: el que más debe primero. Por pagar: el que vence antes. */
    .sort((a,b) => atraso ? (b.c.adeudo - a.c.adeudo) : (a.c.diasRest - b.c.diasRest));

  /* El importe del siguiente pago sale de montos[], nunca de multiplicar la
     mensualidad: el mes 1 lleva onboarding y viáticos. Y el índice se busca en
     s.pagos en vez de usar el conteo de pagados, por si alguien marcó los meses
     fuera de orden. */
  const montoSiguiente = (x) => {
    const i = x.s.pagos.findIndex(p => !p);
    return i >= 0 && x.c.montos[i] != null ? x.c.montos[i] : 0;
  };

  const total = filas.reduce((t,x)=> t + (atraso ? x.c.adeudo : montoSiguiente(x)), 0);

  let cuerpo;
  if(!filas.length){
    cuerpo = '<div class="vacio-chico">' + (atraso
      ? 'Ningún sitio tiene mensualidades vencidas. Todo al corriente.'
      : 'Ningún sitio tiene una mensualidad que caiga en los próximos 7 días.') + '</div>';
  }else{
    cuerpo = '<div class="rodillo"><table class="tabla" style="min-width:600px"><thead><tr>'
      + '<th>Cliente</th><th>Sitio</th><th>Zona</th>'
      + (atraso
          ? '<th style="text-align:center">Vencidas</th><th>Más vieja</th><th style="text-align:right">Adeudo</th>'
          : '<th>Se paga el</th><th style="text-align:right">Faltan</th><th style="text-align:right">Importe</th>')
      + '</tr></thead><tbody>'
      + filas.map(x=>{
          const d = x.c.diasRest;
          const cola = atraso
            ? '<td style="text-align:center"><span class="rol c-owner">' + x.c.atrasadas + '</span></td>'
              + '<td>' + (x.c.proximo ? fmtFecha(x.c.proximo) : '—') + '</td>'
              + '<td style="text-align:right; font-weight:700">' + dinero(x.c.adeudo) + '</td>'
            : '<td>' + (x.c.proximo ? fmtFecha(x.c.proximo) : '—') + '</td>'
              + '<td style="text-align:right"><span class="rol ' + (d <= 2 ? 'c-owner' : 'c-admin') + '">'
                + (d < 0 ? 'hoy' : d + ' ' + plural(d,'día','días')) + '</span></td>'
              + '<td style="text-align:right; font-weight:700">' + dinero(montoSiguiente(x)) + '</td>';
          return '<tr>'
            + '<td>' + esc(x.cli ? x.cli.nombre : '—') + '</td>'
            + '<td><b>' + esc(x.s.nombre) + '</b></td>'
            + '<td>' + (x.s.zona ? esc(x.s.zona) : '—') + '</td>'
            + cola + '</tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<p class="pista" style="margin-top:10px">' + (atraso
          ? '<b>' + dinero(total) + '</b> vencido en ' + filas.length + ' ' + plural(filas.length,'sitio','sitios')
            + '. Los tres puntos del sitio abren su plan de pagos para registrar la OC.'
          : '<b>' + dinero(total) + '</b> por cobrar en ' + filas.length + ' ' + plural(filas.length,'sitio','sitios')
            + ' esta semana. Conviene pedir la OC desde ahora.') + '</p>';
  }

  const cli = clienteId ? clientePorId(clienteId) : null;
  abrirModal((atraso ? 'Sitios atrasados' : 'Por pagar esta semana') + (cli ? ' · ' + cli.nombre : ''), cuerpo,
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>');
  $('modal').classList.add('ancho');
  cerrarModalActual = null;
}

/* Qué puede hacer cada rol, en frases concretas. ROLES[].desc dice la idea en una
   línea; esto la desglosa en acciones para que nadie tenga que adivinar. */
function loQuePuedeHacer(rol){
  const r = normalizarRol(rol);
  const lista = ['Ver todos los clientes, sitios y pagos', 'Descargar el Excel'];
  if(r === 'analyst' || r === 'admin' || r === 'owner') lista.push('Agregar y modificar clientes, sitios y mensualidades');
  if(r === 'admin' || r === 'owner') lista.push('Respaldar y restaurar la base completa', 'Crear cuentas y cambiar permisos del equipo');
  if(r === 'owner') lista.push('Nombrar a otro Owner');
  return lista;
}

function modalPerfil(){
  if(!HAY_NUBE || !haySesion()){ aviso('Esta pantalla solo aplica cuando entras con una cuenta.', true); return; }
  const rol = normalizarRol(sesion.rol);

  const cuerpo =
      '<div class="bloque">'
    +   '<div class="c-fila"><span>Nombre</span><b>' + esc(nombreDe(sesion)) + '</b></div>'
    +   '<div class="c-fila"><span>Correo</span><b>' + esc(sesion.correo || '—') + '</b></div>'
    +   '<div class="c-fila"><span>Permiso</span>' + etiquetaRol(rol) + '</div>'
    + '</div>'
    + '<p class="pista" style="margin:10px 0 4px">' + esc(ROLES[rol].desc) + '</p>'
    + '<ul style="margin:8px 0 0 18px; font-size:12.5px; color:var(--gray); line-height:1.75">'
    +   loQuePuedeHacer(rol).map(x => '<li>' + esc(x) + '</li>').join('')
    + '</ul>'

    /* El teléfono se guarda en la ficha del usuario y las cotizaciones lo
       imprimen junto al vendedor. La regla del servidor deja que cada quien
       actualice el suyo desde siempre — lo que no había era el campo: el dato
       era imposible de capturar y las pólizas salían sin celular. */
    + '<h4 style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:700; margin:22px 0 10px">'
    +   'Mi teléfono</h4>'
    + '<div class="campo"><label for="pfTelefono">Celular</label>'
    +   '<div class="cliente-zona">'
    +     '<input type="text" id="pfTelefono" inputmode="tel" placeholder="811 60 71 051" value="' + esc(sesion.telefono || '') + '">'
    +     '<button type="button" class="btn btn-suave btn-mini" id="pfGuardaTel">Guardar</button>'
    +   '</div>'
    +   '<div class="pista">Sale impreso en tus cotizaciones, junto a tu nombre. Solo tú lo puedes cambiar.</div></div>'

    + '<h4 style="font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:700; margin:22px 0 10px">'
    +   'Cambiar mi contraseña</h4>'
    + (claveRevisada && claveEsInicial
        ? '<p class="pista" style="color:#9a6a15; margin-bottom:12px"><b>Sigues usando la contraseña que te dieron.</b> '
          + 'Quien te creó la cuenta la conoce; conviene poner una tuya.</p>'
        : '')
    + '<div class="acceso-error" id="pfError" role="alert"></div>'
    + '<div class="campo"><label for="pfActual">Tu contraseña actual</label>'
    +   '<input type="password" id="pfActual" autocomplete="current-password" placeholder="••••••••"></div>'
    + '<div class="campo"><label for="pfNueva">Nueva contraseña</label>'
    +   '<input type="password" id="pfNueva" autocomplete="new-password" placeholder="Al menos 6 caracteres"></div>'
    + '<div class="campo"><label for="pfRepite">Repite la nueva</label>'
    +   '<input type="password" id="pfRepite" autocomplete="new-password" placeholder="La misma otra vez"></div>'
    + '<p class="pista" style="margin-top:10px">Se te pide la actual por seguridad: así nadie que encuentre '
    +   'tu sesión abierta puede cambiártela. Si no la recuerdas, '
    +   '<button type="button" class="enlace" id="pfPorCorreo">pide un correo para cambiarla</button>.</p>';

  abrirModal('Mi cuenta', cuerpo,
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar">Cambiar contraseña</button>');

  $('pfGuardaTel').addEventListener('click', async ()=>{
    const tel = $('pfTelefono').value.trim();
    const btn = $('pfGuardaTel');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      /* PATCH de SOLO este campo, como ultimoAcceso: la regla del propio
         usuario exige hasOnly(['ultimoAcceso','telefono']) — mandar la ficha
         completa por escribirNube rebotaría con 403. */
      await pedirNube('/usuarios/' + encodeURIComponent(sesion.uid) + '?updateMask.fieldPaths=telefono', {
        method:'PATCH', body: JSON.stringify({ fields:{ telefono:{ stringValue: tel } } })
      });
      sesion.telefono = tel;
      guardarSesion && guardarSesion();
      aviso(tel ? 'Teléfono guardado. Va a salir en tus próximas cotizaciones.' : 'Teléfono borrado.');
    }catch(e){
      aviso('No se pudo guardar el teléfono: ' + e.message, true);
    }finally{
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });

  $('pfPorCorreo').addEventListener('click', async ()=>{
    try{
      await pedirAuth('sendOobCode', { requestType:'PASSWORD_RESET', email: sesion.correo });
      cerrarModal();
      aviso('Te mandamos un correo a ' + sesion.correo + ' para poner una contraseña nueva.');
    }catch(e){ aviso(e.message, true); }
  });

  cerrarModalActual = async ()=>{
    /* Se leen los valores ANTES de cualquier cierre: cerrarModal() reemplaza
       #modalCuerpo por un clon limpio y después los campos devuelven null. */
    const actual = $('pfActual').value;
    const nueva  = $('pfNueva').value;
    const repite = $('pfRepite').value;

    const marcarError = (m)=>{ const e = $('pfError'); e.textContent = m; e.classList.add('visible'); };
    $('pfError').classList.remove('visible');
    if(!actual) return marcarError('Escribe tu contraseña actual.');
    if(nueva.length < 6) return marcarError('La nueva debe tener al menos 6 caracteres.');
    if(nueva !== repite) return marcarError('Las dos nuevas no coinciden.');
    if(nueva === actual) return marcarError('La nueva tiene que ser distinta de la que ya usas.');

    const btn = $('modalPie').querySelector('[data-modal="guardar"]');
    btn.disabled = true; btn.textContent = 'Cambiando…';
    try{
      /* Primero se vuelve a entrar con la contraseña actual. Sirve para dos cosas:
         comprueba que quien está en el teclado es el dueño de la cuenta, y entrega
         un token recién hecho, que es lo que Firebase exige para cambiarla (con un
         token viejo responde CREDENTIAL_TOO_OLD_LOGIN_AGAIN). */
      const fresco = await pedirAuth('signInWithPassword',
        { email: sesion.correo, password: actual, returnSecureToken: true });
      const d = await pedirAuth('update',
        { idToken: fresco.idToken, password: nueva, returnSecureToken: true });

      /* Cambiar la contraseña invalida los tokens anteriores. Si no se guardan los
         nuevos, la siguiente petición al servidor falla y sacaría al usuario justo
         después de haber hecho todo bien. */
      if(d && d.idToken){
        sesion.idToken = d.idToken;
        sesion.refreshToken = d.refreshToken || sesion.refreshToken;
        sesion.expira = Date.now() + (Number(d.expiresIn || 3600) * 1000);
        guardarSesion();
      }

      claveEsInicial = false; claveRevisada = true;
      pintarPuntoClave();
      anotar('cambió', 'su contraseña', sesion.correo || '');
      cerrarModal();
      render();
      aviso('Contraseña cambiada. La próxima vez entra con la nueva.');
    }catch(e){
      btn.disabled = false; btn.textContent = 'Cambiar contraseña';
      marcarError(e.message);
    }
  };
}

/* ----------------------- Modal: plan de pagos -----------------------------
   El desglose mes por mes: cuánto toca cada mensualidad, si ya se pagó, con
   qué OC y quién la capturó. Los extras van en el mes 1 y se ven ahí mismo,
   sin necesidad de explicarlo con textos en la tarjeta.
   ------------------------------------------------------------------------- */
function modalPlanDePagos(sitioId){
  const s = sitioPorId(sitioId);
  if(!s) return;
  const c = calcular(s);

  const filas = s.pagos.map((pagado, i)=>{
    const det = s.pagosDetalle[i] || {};
    const fecha = sumarMeses(s.fechaInicio, i);
    const vencida = !pagado && i < c.debidas;

    let concepto = 'Mensualidad';
    if(i === 0){
      const extras = [];
      if(s.incOnboarding && s.onboarding) extras.push('onboarding ' + dinero(s.onboarding));
      if(s.incViaticos && s.viaticos)     extras.push('viáticos ' + dinero(s.viaticos));
      if(extras.length) concepto = 'Mensualidad + ' + extras.join(' + ');
    }

    let estado;
    if(pagado) estado = '<span class="rol c-analyst">Pagada</span>'
      + (det.facturado ? ' <span class="rol c-admin">Facturada</span>'
                       : ' <span class="rol c-viewer">Sin facturar</span>');
    else if(vencida) estado = '<span class="rol c-owner">Vencida</span>';
    else estado = '<span class="rol c-viewer">Pendiente</span>';

    const detalle = pagado
      ? '<div style="font-size:11px; color:var(--gray); margin-top:3px">'
        + (det.oc ? 'OC <b>' + esc(det.oc) + '</b>' : 'sin OC registrada')
        + (det.quien ? ' · capturó ' + esc(det.quien) : '')
        + (det.cuando ? ' · ' + esc(fechaHora(det.cuando)) : '') + '</div>'
      : '';

    return '<tr>'
      + '<td style="text-align:center; font-weight:700; color:var(--navy)">' + (i+1) + '</td>'
      + '<td>' + fmtFecha(fecha) + '</td>'
      + '<td>' + esc(concepto) + detalle + '</td>'
      + '<td style="text-align:right; font-weight:700">' + dinero(c.montos[i]) + '</td>'
      + '<td style="text-align:right">' + estado + '</td>'
      + '</tr>';
  }).join('');

  const cuerpo =
      '<div class="resumen" style="margin-bottom:16px">'
    +   '<div class="r-fila"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + s.meses + '</span></div>'
    +   '<div class="r-fila"><span>Cobrado</span><span>' + dinero(c.cobrado) + '</span></div>'
    +   (c.adeudo ? '<div class="r-fila"><span>Vencido por cobrar</span><span>' + dinero(c.adeudo) + '</span></div>' : '')
    +   '<div class="r-fila r-total"><span>Valor total del contrato</span><span>' + dinero(c.valorContrato) + '</span></div>'
    + '</div>'
    + '<div class="rodillo"><table class="tabla" style="min-width:520px"><thead><tr>'
    +   '<th style="text-align:center">Mes</th><th>Fecha de corte</th><th>Concepto</th>'
    +   '<th style="text-align:right">Monto</th><th style="text-align:right">Estado</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table></div>';

  abrirModal('Plan de pagos · ' + s.nombre, cuerpo,
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cerrar</button>');
  $('modal').classList.add('ancho');
  cerrarModalActual = null;
}

/* --------------------- Modal: capturar una mensualidad ---------------------
   Cada pago queda con su número de OC y con el nombre de quien lo capturó.
   ------------------------------------------------------------------------- */
const LLAVE_CAPTURADOR = 'forguard_forpass_capturador_v1';
function nombreCapturador(){
  if(HAY_NUBE && haySesion()) return nombreDe(sesion);
  try{ return localStorage.getItem(LLAVE_CAPTURADOR) || ''; }catch(e){ return ''; }
}
function recordarCapturador(nombre){
  try{ localStorage.setItem(LLAVE_CAPTURADOR, nombre || ''); }catch(e){}
}

/* Deshace una captura: la mensualidad vuelve a pendiente y se borra su OC. */
function deshacerPago(sitioId, idx){
  const s = sitioPorId(sitioId);
  if(!s) return;
  const det = s.pagosDetalle[idx] || {};
  confirmar('Deshacer esta captura',
    'La mensualidad <b>' + (idx+1) + '</b> de <b>' + esc(s.nombre) + '</b> vuelve a quedar como no pagada'
    + (det.oc ? ', y se borra su <b>OC ' + esc(det.oc) + '</b>' : '') + '.',
    'Sí, deshacer', ()=>{
      s.pagos[idx] = false;
      s.pagosDetalle[idx] = { oc:'', quien:'', cuando:'', facturado:false };
      guardarSitio(s, 'deshizo la captura de', 'mensualidad ' + (idx+1) + ' de ' + s.meses
                   + (det.oc ? ' · OC ' + det.oc : ''));
      cerrarModal(); render();
      aviso('Captura deshecha.');
    });
}

function modalCapturarPago(sitioId, idx){
  const s = sitioPorId(sitioId);
  if(!s || idx < 0 || idx >= s.meses) return;
  const c = calcular(s);
  const det = s.pagosDetalle[idx] || { oc:'', quien:'', cuando:'' };
  const conCuenta = HAY_NUBE && haySesion();
  const partes = [];
  if(idx === 0 && s.incOnboarding && s.onboarding) partes.push('onboarding ' + dinero(s.onboarding));
  if(idx === 0 && s.incViaticos && s.viaticos)     partes.push('viáticos ' + dinero(s.viaticos));

  const cuerpo =
      '<div class="resumen" style="margin-bottom:18px">'
    +   '<div class="r-fila"><span>Sitio</span><span>' + esc(s.nombre) + '</span></div>'
    +   '<div class="r-fila"><span>Mensualidad</span><span>' + (idx+1) + ' de ' + s.meses + '</span></div>'
    +   '<div class="r-fila"><span>Fecha de corte</span><span>' + fmtFecha(sumarMeses(s.fechaInicio, idx)) + '</span></div>'
    +   (partes.length ? '<div class="r-fila"><span>Incluye</span><span>' + esc(partes.join(' + ')) + '</span></div>' : '')
    +   '<div class="r-fila r-total"><span>Monto de esta mensualidad</span><span>' + dinero(c.montos[idx]) + '</span></div>'
    + '</div>'

    + '<div class="campo"><label>Nombre de quien captura *</label>'
    +   (conCuenta
          ? '<input type="text" id="pQuien" value="' + esc(nombreDe(sesion)) + '" readonly>'
            + '<div class="pista">Es tu cuenta (' + esc(sesion.correo) + '). Queda registrada en el historial de cambios.</div>'
          : '<input type="text" id="pQuien" placeholder="Ej. Santiago Garza" value="' + esc(nombreCapturador()) + '">'
            + '<div class="pista">Se guarda para las siguientes capturas de esta computadora.</div>')
    + '</div>'

    + '<div class="campo"><label>Número de OC *</label>'
    +   '<input type="text" id="pOC" placeholder="Ej. 4500123" value="' + esc(det.oc) + '">'
    +   '<div class="pista">La orden de compra con la que se pagó <b>esta</b> mensualidad. Cada pago lleva la suya.'
    +     (s.contactos.length
            ? ' La manda ' + s.contactos.map(x =>
                '<b>' + esc(x.nombre) + '</b>' + (x.puesto ? ' (' + esc(x.puesto) + ')' : '')
                + (x.correo ? ' · ' + esc(x.correo) : '')
                + (x.telefono ? ' · ' + esc(x.telefono) : '')
              ).join(' — ') + '.'
            : '')
    +   '</div>'
    + '</div>'

    + '<label class="casilla"><input type="checkbox" id="pFacturado"' + (det.facturado ? ' checked' : '') + '> '
    +   'Ya se facturó esta mensualidad</label>'
    + '<div class="pista" style="margin:-6px 0 0">Si todavía no se factura, déjala sin marcar y márcala después '
    +   'volviendo a abrir esta mensualidad desde el plan de pagos.</div>';

  const yaPagada = !!s.pagos[idx];
  abrirModal((yaPagada ? 'Mensualidad ' : 'Capturar mensualidad ') + (idx+1), cuerpo,
      (yaPagada ? '<button type="button" class="btn btn-peligro izq" id="btnDeshacerPago">Deshacer captura</button>' : '')
    + '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-verde" data-modal="guardar">' + ICONO.cheque
    + (yaPagada ? 'Guardar cambios' : 'Capturar mensualidad') + '</button>');

  if(yaPagada) $('btnDeshacerPago').addEventListener('click', ()=> deshacerPago(sitioId, idx));
  setTimeout(()=>{ const oc = $('pOC'); if(oc) oc.focus(); }, 70);

  cerrarModalActual = ()=>{
    const quien = $('pQuien').value.trim();
    const oc    = $('pOC').value.trim();
    if(!quien){ $('pQuien').setAttribute('aria-invalid','true'); $('pQuien').focus(); aviso('Falta el nombre de quien captura.', true); return; }
    if(!oc){ $('pOC').setAttribute('aria-invalid','true'); $('pOC').focus(); aviso('Falta el número de OC.', true); return; }

    /* Se leen los campos ANTES de cerrar: cerrarModal reemplaza el contenedor
       y después de eso ya no existen. */
    const facturado = $('pFacturado').checked;

    s.pagos[idx] = true;
    s.pagosDetalle[idx] = { oc, quien, cuando: new Date().toISOString(), facturado };
    if(!conCuenta) recordarCapturador(quien);

    guardarSitio(s, yaPagada ? 'corrigió el pago de' : 'marcó pagada',
      'mensualidad ' + (idx+1) + ' de ' + s.meses + ' · OC ' + oc
      + ' · ' + (facturado ? 'facturada' : 'sin facturar') + ' · capturó ' + quien);
    cerrarModal();
    render();
    aviso('Mensualidad ' + (idx+1) + ' de ' + s.nombre + (yaPagada ? ' actualizada' : ' capturada')
          + ' con OC ' + oc + (facturado ? ' · facturada' : ' · sin facturar') + '.');
  };
}

/* Escribe separadores de miles mientras se teclea, sin mover el cursor al final. */
function aNumero(txt){ return Math.max(0, Number(String(txt||'').replace(/[^0-9.]/g,'')) || 0); }
function formatearMiles(input){
  const antes = input.value, cursor = input.selectionStart;
  const digitosAntes = antes.slice(0, cursor).replace(/[^0-9.]/g,'').length;
  const partes = antes.replace(/[^0-9.]/g,'').split('.');
  let limpio = partes.shift();
  if(partes.length) limpio += '.' + partes.join('').slice(0,2);
  if(limpio === '' || limpio === '.'){ input.value = limpio; return; }
  const [ent, dec] = limpio.split('.');
  let salida = (ent ? Number(ent).toLocaleString('en-US') : '') + (dec !== undefined ? '.' + dec : '');
  input.value = salida;
  let vistos = 0, pos = 0;
  for(; pos < salida.length && vistos < digitosAntes; pos++) if(/[0-9.]/.test(salida[pos])) vistos++;
  try{ input.setSelectionRange(pos, pos); }catch(e){}
}

    const n = sitiosDe(c.id).length;
