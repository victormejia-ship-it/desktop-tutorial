<style>
/* ===========================================================================
   Paleta de marca Forguard
   Tomada de forguard.com para que el tablero y el sitio se sientan lo mismo.
   El verde --accent es la firma de la marca; el navy es el color institucional.
   Al cambiar algo aquí, cámbialo primero en forguard.com o quedan desfasados.
   =========================================================================== */
:root{
  /* Institucionales */
  --navy-oscuro:#00143D; --navy:#002369; --navy-2:#103580;
  --accent:#54C682; --accent-hover:#43B471;
  /* Neutros */
  --ink:#00143D; --gray:#5D5D5D; --gray-claro:#AAAAAA; --line:#E4E7EC; --bg:#F6F7F9;
  /* Semáforo: verde más profundo que el acento para que "al día" no se
     confunda con un botón de la marca. */
  --ok:#3FA66B; --ok-suave:#E8F5EE; --alerta:#E8A33D; --alerta-suave:#FDF4E5;
  --error:#D9534F; --error-suave:#FCEDEC; --neutro:#8a90a3; --neutro-suave:#F1F3F8;
  /* Sombras: la de la marca es muy marcada para una reja de tarjetas, así que
     esa se reserva para modales y las tarjetas llevan una versión suave. */
  --sombra:0 18px 50px rgba(0,20,61,.18);
  --sombra-suave:0 1px 2px rgba(0,20,61,.04), 0 2px 8px rgba(0,20,61,.06);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;}

/* ---------- Encabezado ---------- */
header.app{background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:50;}
header.app::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--navy),var(--accent));}
header.app .logo-header{height:22px; width:auto; display:block;}
/* El logo hace de atajo a Clientes. Sin fondo, borde ni relleno: visualmente
   sigue siendo solo el logo. La única pista es el cursor y que se aclara al
   pasar encima, y solo cuando de verdad lleva a algún lado. */
.ir-inicio{background:none; border:none; padding:0; display:flex; align-items:center; cursor:default;}
.ir-inicio:not([disabled]){cursor:pointer;}
.ir-inicio:not([disabled]):hover{opacity:.7;}
.ir-inicio:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:5px;}
header.app .bar{width:4px; height:26px; border-radius:2px; background:linear-gradient(180deg,var(--navy),var(--accent));}
header.app h1{font-size:15px; font-weight:600; color:var(--navy);}
header.app .sub{font-size:12px; color:var(--gray); margin-left:auto;}

/* Selector de módulo: control segmentado, del tamaño de un título porque ocupa
   su lugar. La pestaña encendida va en blanco sobre el fondo gris para que se
   lea como una pestaña de verdad y no como dos botones sueltos. */
.modulos{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line);
         border-radius:9px; padding:3px;}
.modulos .mod{appearance:none; border:none; background:none; font:inherit; font-size:13px;
              font-weight:600; color:var(--gray); padding:5px 13px; border-radius:6px;
              cursor:pointer; white-space:nowrap; transition:color .15s var(--ease), background .15s var(--ease);}
.modulos .mod:hover{color:var(--navy);}
.modulos .mod[aria-selected="true"]{background:#fff; color:var(--navy); box-shadow:var(--sombra-suave); cursor:default;}
.modulos .mod:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* Bajo los 840px ya no cabe todo en una sola fila: logo, las seis pestañas de
   módulo, estado de la nube y los tres botones de sesión. En vez de
   encimarse o empujar la página entera a hacer scroll horizontal —lo que se
   veía antes—, el encabezado se parte en dos renglones. El selector de
   módulo se va completo a su propio renglón (flex-basis:100% fuerza el
   salto de línea) y, si de plano no caben las 6 pestañas, se desliza con
   scroll horizontal PROPIO en vez de desbordar el documento.
   El corte quedó en 840 y no en 700 porque a las 6 pestañas (se agregó
   Reportes) el renglón sin partir necesita ~828px — medido con Playwright en
   varios anchos —, así que 700 se quedaba corto y esos 130px de tablets
   angostas desbordaban toda la página. */
@media (max-width:840px){
  header.app{padding:12px 16px; gap:10px; flex-wrap:wrap;}
  header.app .sub{display:none;}
  .modulos{flex:1 1 100%; order:3; gap:1px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;}
  .modulos::-webkit-scrollbar{display:none;}
  .modulos .mod{padding:5px 6px; font-size:11.5px;}
  .nube-zona{gap:6px;}
  /* Mismo criterio que ya usa .pastilla: con el icono basta, el texto ("Admin",
     "Mi cuenta", "Log out") solo hace bulto en una pantalla angosta. */
  .btn-cabeza .txt{display:none;}
  .btn-cabeza{padding:7px 9px;}
}

/* ---------- Contenedor ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:26px 24px 90px;}
@media (max-width:700px){ .wrap{padding:20px 16px 80px;} }


/* ---------- Título de vista ---------- */
.titulo-zona{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.titulo-zona h2{font-size:23px; font-weight:700; color:var(--navy); line-height:1.2;}
.titulo-zona p{font-size:13px; color:var(--gray); margin-top:4px;}
.titulo-zona .acciones{margin-left:auto; display:flex; gap:9px; flex-wrap:wrap;}

/* ---------- Botones ---------- */
.btn{
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border-radius:10px; padding:10px 15px; border:1.5px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap;
  transition:background .15s, border-color .15s, color .15s, transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.985);}
.btn svg{width:15px; height:15px; flex-shrink:0;}
.btn-primario{background:var(--navy); color:#fff; box-shadow:0 4px 14px rgba(10,27,77,.22);}
.btn-primario:hover{background:var(--navy-2);}
.btn-suave{background:#fff; color:var(--navy); border-color:var(--line);}
.btn-suave:hover{border-color:var(--accent); background:#f6f9ff;}
.btn-peligro{background:#fff; color:var(--error); border-color:#f0d5d4;}
.btn-peligro:hover{background:var(--error-suave); border-color:var(--error);}
.btn-mini{font-size:12px; padding:7px 11px; border-radius:8px;}

/* Borrar dentro de una reja de tarjetas va callado: en rojo pesaba igual que
   editar y estaba a un clic de distancia en cada tarjeta. Se enciende al pasar
   el cursor o al llegar con el teclado, así que sigue siendo fácil de encontrar
   pero deja de competir con la acción de todos los días.
   La confirmación de borrado no cambió: sigue pidiéndose. */
.grid .btn-peligro{color:var(--gray); border-color:var(--line);}
.grid .btn-peligro:hover, .grid .btn-peligro:focus-visible{color:var(--error); border-color:var(--error); background:var(--error-suave);}
.btn-verde{background:var(--ok); color:#fff;}
.btn-verde:hover{background:#35935c;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- Tarjetas de indicadores ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px;}
.kpi{background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 16px; position:relative; overflow:hidden; box-shadow:var(--sombra-suave);}
.kpi::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--accent);}
.kpi.k-ok::before{background:var(--ok);} .kpi.k-alerta::before{background:var(--alerta);} .kpi.k-error::before{background:var(--error);}
/* Reserva dos renglones para el título aunque quepa en uno: así los números
   grandes quedan a la misma altura en toda la fila. Sin esto, "Vigencias por
   vencer" —el único que da vuelta— empujaba su número 16 px hacia abajo. */
.kpi .k-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--gray); font-weight:600; line-height:1.35; min-height:2.7em;}
.kpi .k-valor{font-size:24px; font-weight:700; color:var(--navy); margin-top:5px; line-height:1.1;}
.kpi .k-pie{font-size:11px; color:var(--gray); margin-top:3px;}

/* Indicadores que se pueden abrir para ver el detalle */
button.kpi{font-family:inherit; text-align:left; width:100%; cursor:pointer;}
.kpi-clic{transition:transform .15s, box-shadow .15s, border-color .15s;}
.kpi-clic:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,20,61,.12); border-color:#c9d4ec;}
.kpi-clic:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.kpi .k-mas{display:block; font-size:11px; font-weight:600; color:var(--accent); margin-top:7px;}

/* ---------- Buscador ---------- */
.barra-busca{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.barra-busca input, .barra-busca select{
  padding:10px 12px; border:1px solid #d4d9e6; border-radius:10px; font-family:inherit; font-size:13px;
  color:var(--ink); background:#fff; outline:none; transition:border-color .15s;
}
.barra-busca input{flex:1; min-width:180px;}
/* Alternador tarjetas/tabla: mismo lenguaje visual que .modulos (fondo gris,
   la opción activa se despega en blanco con sombra), pero de tamaño de icono
   porque aquí no hay texto que leer. */
.alterna-vista{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px;}
.alterna-vista button{
  appearance:none; border:none; background:none; display:flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:6px; color:var(--gray); cursor:pointer;
  transition:color .15s var(--ease), background .15s var(--ease);
}
.alterna-vista button svg{width:16px; height:16px;}
.alterna-vista button:hover{color:var(--navy);}
.alterna-vista button[aria-pressed="true"]{background:#fff; color:var(--navy); box-shadow:var(--sombra-suave); cursor:default;}
.alterna-vista button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
/* Filas de tabla que abren un detalle al clic, igual que las tarjetas. */
.fila-clic{cursor:pointer; transition:background .12s;}
.fila-clic:hover{background:var(--bg);}
.fila-clic:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
.barra-busca input:focus, .barra-busca select:focus{border-color:var(--accent);}

/* ---------- Rejilla de tarjetas ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px;}
.grid-sitios{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
@media (max-width:700px){ .grid, .grid-sitios{grid-template-columns:1fr;} }

.tarjeta{
  background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px 18px 16px;
  position:relative; transition:transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
  box-shadow:var(--sombra-suave);
  animation:aparece .3s cubic-bezier(.22,1,.36,1) both; animation-delay:var(--d,0ms);
}
/* La entrada escalonada solo debe correr cuando la reja se ve por primera vez.
   render() rehace todo el HTML, así que sin esto la animación se reinicia en cada
   redibujado —y al arrancar hay varios— y las tarjetas se ven desaparecer y
   reaparecer. Con la clase puesta el cambio es instantáneo. */
.grid.sin-entrada .tarjeta{animation:none;}
/* Las tarjetas de sitio no recortan, para que la etiqueta del encargado pueda
   asomarse por fuera del borde. La barra de color de arriba lleva su propio
   redondeo, que antes lo daba el overflow:hidden. */
.grid .tarjeta{overflow:hidden;}
.grid-sitios .tarjeta{overflow:visible;}

/* Etiqueta del encargado: sobresale del borde superior de la tarjeta. */
.encargado{
  position:absolute; top:-12px; left:16px; z-index:2;
  display:inline-flex; align-items:center; gap:6px; max-width:calc(100% - 32px);
  background:#fff; border:1.5px solid var(--marca-borde, #c9d4ec); border-radius:999px;
  padding:4px 12px; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--navy);
  box-shadow:0 2px 8px rgba(10,27,77,.10); white-space:nowrap;
}
.encargado svg{width:13px; height:13px; flex-shrink:0; color:var(--accent);}
.encargado span{overflow:hidden; text-overflow:ellipsis;}
/* padding y border-radius se repiten aquí a propósito: la clase genérica
   ".vacio" (la del estado "todavía no hay nada", con su propio padding de
   44px) tiene la misma especificidad que ".encargado" y aparece después en
   la hoja de estilos, así que sin esto se la ganaba en el empate y la
   etiqueta de "Sin encargado" se inflaba hasta tapar la tarjeta completa. */
.encargado.vacio{color:var(--gray); border-color:var(--line); border-style:dashed; padding:4px 12px; border-radius:999px;}
.encargado.vacio svg{color:#b6bccb;}
button.encargado{cursor:pointer; transition:border-color .15s, color .15s, box-shadow .15s;}
button.encargado:hover{border-color:var(--accent); color:var(--accent); box-shadow:0 4px 12px rgba(10,27,77,.14);}
button.encargado:hover svg{color:var(--accent);}
button.encargado:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
/* Con la etiqueta encima hay que bajar un poco el contenido. */
.grid-sitios .tarjeta{margin-top:8px;}
@keyframes aparece{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.tarjeta::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; border-radius:15px 15px 0 0; background:linear-gradient(90deg,var(--navy),var(--accent));}
.tarjeta.t-ok::before{background:linear-gradient(90deg,var(--ok),#7ccfa1);}
.tarjeta.t-alerta::before{background:linear-gradient(90deg,var(--alerta),#f3c987);}
.tarjeta.t-error::before{background:linear-gradient(90deg,var(--error),#eda19f);}
.tarjeta.t-neutro::before{background:var(--line);}
.tarjeta-clic{cursor:pointer;}
.tarjeta-clic:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(10,27,77,.10); border-color:#c9d4ec;}

/* ---------- Resumen de cliente (módulo Clientes): cruce de Forpass, Pólizas
   y Cotizaciones sin ir módulo por módulo. ---------- */
.bloque-resumen{background:#fff; border:1px solid var(--line); border-radius:15px; padding:18px; margin-bottom:16px;}
.bloque-resumen h3{font-size:15px; color:var(--navy); display:flex; align-items:center; gap:8px; margin:0;}
.bloque-resumen h3 svg{width:18px; height:18px; color:var(--accent); flex-shrink:0;}
.bloque-resumen .b-pie{font-size:12px; color:var(--gray); margin:2px 0 10px;}
.fila-resumen{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 6px; border-top:1px solid var(--line); border-radius:8px;}
.fila-resumen:first-of-type{border-top:none;}
.fila-resumen.tarjeta-clic:hover{background:var(--bg); transform:none; box-shadow:none; border-color:var(--line); border-top-color:transparent;}
.fila-resumen:first-of-type.tarjeta-clic:hover{border-top-color:transparent;}
.fr-titulo{font-size:13.5px; font-weight:600; color:var(--navy); word-break:break-word;}
.fr-sub{font-size:11.5px; color:var(--gray); margin-top:1px;}

/* ---------- Estado de resultados (módulo Resultados) ---------- */
.tabla-pyl{background:#fff; border:1px solid var(--line); border-radius:15px; padding:6px 20px; margin-bottom:16px;}
.tp-seccion{font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--gray); text-transform:uppercase; padding:14px 0 4px;}
.tp-fila{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; color:var(--ink);}
.tp-fila:last-of-type{border-bottom:none;}
.tp-fila .tp-monto{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
.tp-fila.tp-total{font-weight:700; font-size:14.5px; color:var(--navy); border-top:1.5px solid var(--line); border-bottom:none; padding-top:12px; margin-top:2px;}
.tp-fila.tp-negativo .tp-monto{color:var(--error);}
.tp-final{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; margin-top:6px; border-top:2px solid var(--navy); background:#fff; border-radius:0 0 15px 15px;}
.tp-final .tp-label{font-size:14.5px; font-weight:700; color:var(--navy);}
.tp-final .tp-monto{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}

/* Gráficas de Resultados: leyenda en HTML (texto nítido, seleccionable) y el
   dibujo mismo en SVG inline — sin librerías, para no meter una dependencia
   externa a una app de un solo archivo. */
.grafica-leyenda{display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--gray); margin:-4px 0 14px;}
.grafica-leyenda span, .grafica-leyenda button{display:inline-flex; align-items:center; gap:6px;}
.grafica-leyenda i{width:10px; height:10px; border-radius:3px; display:inline-block; flex-shrink:0;}
.grafica-leyenda i.linea{width:14px; height:2px; border-radius:1px;}
/* Cada fuente de la leyenda es un botón: clic para aislarla/ocultarla de la
   gráfica, como en cualquier tablero de verdad — no es solo un dibujo. */
.grafica-leyenda button{all:unset; cursor:pointer; padding:4px 8px; border-radius:7px; color:var(--gray);
  transition:background .12s, opacity .12s;}
.grafica-leyenda button:hover{background:var(--bg);}
.grafica-leyenda button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.grafica-leyenda button.apagada{opacity:.4;}
.grafica-leyenda button.apagada i{background:var(--gray-claro) !important;}
.svg-vacio{padding:26px 0; text-align:center; color:var(--gray); font-size:13px;}

/* ---------- Tooltip interactivo de las gráficas de Resultados ---------- */
.grafica-hit{fill:transparent; cursor:pointer;}
.grafica-hit:hover{fill:rgba(0,35,105,.05);}
.eje-cruce{stroke:var(--gray-claro); stroke-width:1; opacity:0; pointer-events:none;}
.eje-cruce.activo{opacity:1;}
.grafica-tt{
  position:fixed; z-index:210; pointer-events:none; opacity:0; visibility:hidden;
  background:#fff; border:1px solid var(--line); border-radius:11px; box-shadow:var(--sombra);
  padding:11px 14px; font-size:12.5px; color:var(--ink); min-width:160px;
  transition:opacity .1s; top:0; left:0;
}
.grafica-tt.visible{opacity:1; visibility:visible;}
.grafica-tt .tt-titulo{font-weight:700; color:var(--navy); font-size:13px; margin-bottom:6px; white-space:nowrap;}
.grafica-tt .tt-fila{display:flex; align-items:center; gap:16px; justify-content:space-between; padding:2.5px 0;}
.grafica-tt .tt-fila > span:first-child{display:flex; align-items:center; gap:6px; color:var(--gray); white-space:nowrap;}
.grafica-tt .tt-fila i{width:8px; height:8px; border-radius:2px; display:inline-block; flex-shrink:0;}
.grafica-tt .tt-monto{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
.grafica-tt .tt-total{border-top:1px solid var(--line); margin-top:5px; padding-top:6px; font-weight:700; color:var(--navy);}
.grafica-tt .tt-negativo{color:var(--error);}

.t-cabeza{display:flex; align-items:flex-start; gap:10px;}
.t-nombre{font-size:16.5px; font-weight:700; color:var(--navy); line-height:1.25; word-break:break-word;}
.t-sub{font-size:11.5px; color:var(--gray); margin-top:2px;}
/* Etiqueta de zona del sitio, con su color */
.chip-zona{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em;
  background:var(--marca-suave, #EEF2FB); color:var(--navy); border:1px solid #c9d4ec;
  border-radius:6px; padding:1px 7px; margin-right:7px; vertical-align:1px;
}
/* Los diez colores. Cada uno lleva su tono de texto y de borde para que se lea
   bien: un fondo de color con texto oscuro del mismo tono nunca falla. */
.z-azul    {background:#EAF1FC; color:#1B4FA8; border-color:#C6D8F5;}
.z-verde   {background:#E8F5EE; color:#26714A; border-color:#C0E3D0;}
.z-rojo    {background:#FCEDEC; color:#B3312C; border-color:#F0CBC9;}
.z-ambar   {background:#FDF4E5; color:#8A5A0B; border-color:#F0DCB4;}
.z-morado  {background:#F1ECFB; color:#5B3A9E; border-color:#DBCEF3;}
.z-rosa    {background:#FCECF3; color:#A32B62; border-color:#F5CFE0;}
.z-turquesa{background:#E6F6F6; color:#12656B; border-color:#C2E7E8;}
.z-naranja {background:#FDEFE6; color:#A34A12; border-color:#F6D6BE;}
.z-cafe    {background:#F4EFEA; color:#6B4A2F; border-color:#E3D6C8;}
.z-gris    {background:#F1F3F8; color:#5C6273; border-color:#DFE3EE;}

/* Selector de color en el formulario */
.colores{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;}
.colores button{
  width:28px; height:28px; border-radius:8px; cursor:pointer; padding:0;
  border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  transition:transform .1s, border-color .12s;
}
.colores button:hover{transform:scale(1.08);}
.colores button[aria-pressed="true"]{border-color:var(--navy); transform:scale(1.08);}
.colores button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.t-avatar{
  width:40px; height:40px; border-radius:11px; flex-shrink:0; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--navy-2),var(--accent)); color:#fff; font-size:14.5px; font-weight:700; letter-spacing:.02em;
  overflow:hidden;
}
/* Con logo: fondo blanco y la imagen completa, sin recortarla ni deformarla. */
.t-avatar.con-logo{background:#fff; border:1px solid var(--line); padding:3px;}
.t-avatar.con-logo img{width:100%; height:100%; object-fit:contain; display:block;}

/* Zona de carga del logo dentro del formulario */
.logo-zona{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.logo-previa{
  width:64px; height:64px; border-radius:14px; flex-shrink:0; display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(135deg,var(--navy-2),var(--accent)); color:#fff; font-size:20px; font-weight:700;
}
.logo-previa.con-logo{background:#fff; border:1px solid var(--line); padding:4px;}
.logo-previa img{width:100%; height:100%; object-fit:contain; display:block;}
.logo-botones{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}

/* Editor de encuadre: cuadro con la imagen y control de zoom */
.logo-lienzo{
  width:128px; height:128px; border-radius:16px; border:1px solid var(--line); background:#fff;
  display:block; flex-shrink:0; cursor:grab; touch-action:none;
  background-image:linear-gradient(45deg,#f3f5fa 25%,transparent 25%,transparent 75%,#f3f5fa 75%),
                   linear-gradient(45deg,#f3f5fa 25%,transparent 25%,transparent 75%,#f3f5fa 75%);
  background-size:14px 14px; background-position:0 0, 7px 7px;   /* damero: se nota la transparencia */
}
.logo-lienzo:active{cursor:grabbing;}
.logo-zoom{display:flex; align-items:center; gap:10px; margin-top:2px;}
.logo-zoom label{font-size:11.5px; font-weight:600; color:#3a4256; white-space:nowrap;}
.logo-zoom input[type="range"]{flex:1; min-width:120px; accent-color:var(--navy); cursor:pointer;}
.logo-zoom output{font-size:11.5px; color:var(--gray); min-width:34px; text-align:right; font-variant-numeric:tabular-nums;}
.logo-lado{flex:1; min-width:190px;}

/* Botoncitos junto al nombre del sitio */
.t-iconos{display:flex; align-items:center; gap:2px; margin-left:auto; flex-shrink:0;}
.icono-btn{
  background:none; border:1px solid transparent; border-radius:8px; cursor:pointer; padding:3px 5px;
  color:#a3aabb; display:grid; place-items:center; flex-shrink:0;
  transition:color .15s, background .15s, border-color .15s;
}
.icono-btn svg{width:16px; height:16px;}
.icono-btn:hover{color:var(--navy); background:#EEF2FB; border-color:#c9d4ec;}
.icono-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
/* Sin contacto registrado: se nota, para que se llene. */
.icono-btn.sin-datos{color:var(--alerta);}
.icono-btn.sin-datos:hover{color:#9a6a15; background:var(--alerta-suave); border-color:#f0dcb4;}

/* Tarjetas de contacto dentro del modal */
.contacto{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; background:#fafbfe; position:relative;}
.contacto .c-quitar{position:absolute; top:10px; right:10px;}
.contacto .fila2{margin-bottom:0;}
.contacto-vista{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
.contacto-vista .cv-icono{width:38px; height:38px; border-radius:11px; flex-shrink:0; display:grid; place-items:center; background:linear-gradient(135deg,var(--navy-2),var(--accent)); color:#fff;}
.contacto-vista .cv-icono svg{width:19px; height:19px;}
.contacto-vista .cv-nombre{font-size:14.5px; font-weight:700; color:var(--navy);}
.contacto-vista .cv-puesto{font-size:12px; color:var(--gray); margin-top:1px;}
.contacto-vista .cv-datos{margin-top:8px; display:flex; flex-direction:column; gap:5px;}
.contacto-vista .cv-datos a, .contacto-vista .cv-datos span{font-size:12.5px; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:7px;}
.contacto-vista .cv-datos a:hover{color:var(--accent); text-decoration:underline;}
.contacto-vista .cv-datos svg{width:14px; height:14px; color:var(--gray); flex-shrink:0;}
.contacto-vista .cv-notas{font-size:11.5px; color:var(--gray); margin-top:7px; line-height:1.5; white-space:pre-wrap;}

/* Punto de estado */
.punto{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0;}
.punto.p-ok{background:var(--ok); box-shadow:0 0 0 3px rgba(63,166,107,.18);}
.punto.p-alerta{background:var(--alerta); box-shadow:0 0 0 3px rgba(232,163,61,.18);}
.punto.p-error{background:var(--error); box-shadow:0 0 0 3px rgba(217,83,79,.18);}
.punto.p-neutro{background:#b6bccb; box-shadow:0 0 0 3px rgba(182,188,203,.18);}
.punto.late{animation:pulso 1.8s ease-in-out infinite;}
@keyframes pulso{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

/* Insignias */
.insignia{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
  border-radius:999px; padding:4px 10px; border:1px solid transparent; white-space:nowrap;
}
.i-ok{background:var(--ok-suave); color:#2c7a4e; border-color:#c5e6d3;}
.i-alerta{background:var(--alerta-suave); color:#9a6a15; border-color:#f0dcb4;}
.i-error{background:var(--error-suave); color:#a5322e; border-color:#f0cbc9;}

/* ---- Agenda de servicios (Fase 4) ----
   Tres bloques por estado, y adentro mes → sitio → equipos. El color vive en el
   filo izquierdo del bloque y no en cada chip: con veinte equipos en pantalla,
   veinte chips de color no dicen nada y cansan. */
.agenda-bloque{background:#fff; border:1px solid var(--line); border-left:3px solid var(--neutro);
  border-radius:14px; padding:16px 18px 6px; margin-bottom:16px; box-shadow:var(--sombra-suave);}
.agenda-bloque.a-error {border-left-color:var(--error);}
.agenda-bloque.a-alerta{border-left-color:var(--alerta);}
.agenda-bloque.a-ok    {border-left-color:var(--ok);}
.agenda-bloque.a-info  {border-left-color:#c9d4ec;}
.agenda-cabeza h3{font-size:14.5px; color:var(--navy); display:flex; align-items:center; gap:8px;}
.agenda-cabeza .pista{margin:3px 0 0;}
.agenda-cuenta{background:var(--neutro-suave); color:#5d6479; font-size:11.5px; font-weight:700;
  border-radius:999px; padding:1px 9px;}
.a-error .agenda-cuenta {background:var(--error-suave);  color:#a5322e;}
.a-alerta .agenda-cuenta{background:var(--alerta-suave); color:#9a6a15;}
.agenda-mes{margin-top:14px;}
.agenda-mes-tit{font-size:11px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
  color:#5d6479; padding-bottom:7px; border-bottom:1px solid var(--line);}
.agenda-sitio{padding:11px 0 12px; border-bottom:1px solid var(--line);}
.agenda-sitio:last-child{border-bottom:0;}
.agenda-sitio-tit{background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
  font-size:13px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:7px;
  margin-bottom:8px;}
.agenda-sitio-tit:hover{color:#2c7a4e;}
.agenda-sitio-tit span{font-weight:500; color:var(--gray);}
.agenda-cuenta-mini{background:var(--neutro-suave); color:#5d6479; font-size:10.5px; font-weight:700;
  border-radius:999px; padding:0 7px;}
.agenda-equipos{display:flex; flex-wrap:wrap; gap:7px;}
/* El equipo es el botón que registra el servicio. Se ve como lo que es —algo que
   se pica— y no como una etiqueta de adorno. */
.agenda-eq{font-family:inherit; font-size:12px; color:var(--gray); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:5px 10px; cursor:pointer;
  transition:border-color .12s, background .12s;}
.agenda-eq b{font-weight:700; color:var(--navy);}
.agenda-eq:hover{border-color:var(--accent); background:#fff;}
/* Parcial: ámbar, la misma señal que su chip en el detalle de la póliza. */
.agenda-eq.parcial{background:var(--alerta-suave); border-color:#F0DCB4;}
.agenda-eq.parcial b{color:#9a6a15;}

/* Cronograma de Imagen/Aperturas: mismo molde de bloque que la agenda de
   servicios (mes → filas), pero cada fila YA es un proyecto completo, sin
   necesidad de agrupar por sitio como en pólizas. */
.cronograma-fila{display:flex; align-items:center; gap:14px; padding:10px 4px;
  border-bottom:1px solid var(--line); cursor:pointer; border-radius:8px;}
.cronograma-fila:last-child{border-bottom:0;}
.cronograma-fila:hover, .cronograma-fila:focus-visible{background:var(--bg);}
.cronograma-fecha{flex:none; width:52px; text-align:center; font-size:11px;
  font-weight:700; color:var(--gray); text-transform:uppercase;}
.cronograma-fecha b{display:block; font-size:19px; font-weight:800; color:var(--navy);
  text-transform:none;}
.cronograma-info{flex:1; min-width:0;}
.cronograma-chips{flex:none; display:flex; gap:6px; align-items:center;}

/* Gantt de Imagen/Aperturas: eje de fechas continuo en píxeles (ver
   filaGanttProyectoImagen), no una columna por día — así un rango de varios
   meses no significa cientos de columnas de tabla. */
.gantt-alerta{background:var(--error-suave); border:1px solid #f0cbc9; border-radius:12px;
  padding:11px 16px; margin-bottom:14px; font-size:12.5px; color:#a5322e; line-height:1.5;}
.gantt-caja{border:1px solid var(--line); border-radius:14px; background:#fff;
  overflow-x:auto; box-shadow:var(--sombra-suave);}
.gantt{position:relative;}
.gantt-meses{display:flex; position:sticky; top:0; background:#fff; z-index:3;
  border-bottom:1px solid var(--line);}
.gantt-mes{flex:none; font-size:10.5px; font-weight:800; letter-spacing:.4px;
  color:#5d6479; padding:9px 0 9px 10px; border-left:1px solid var(--line); box-sizing:border-box;}
.gantt-mes-espaciador{position:sticky; left:0; z-index:4; width:260px; background:#fff; border-left:0;}
.gantt-filas{position:relative;}
.gantt-fila{display:flex; align-items:stretch; border-bottom:1px solid var(--line);}
.gantt-fila:last-child{border-bottom:0;}
.gantt-rotulo{position:sticky; left:0; z-index:2; background:#fff; flex:none; width:260px;
  padding:10px 12px; box-sizing:border-box; border-right:1px solid var(--line); cursor:pointer;}
.gantt-rotulo:hover{background:var(--bg);}
.gantt-fechas{color:var(--navy); font-weight:600; margin-top:2px;}
.gantt-pista{position:relative; flex:1 1 auto; min-height:56px;}
.gantt-barra{position:absolute; top:50%; transform:translateY(-50%); height:28px; min-width:20px;
  border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:800; color:#fff; overflow:hidden; white-space:nowrap; padding:0 6px;
  box-sizing:border-box; transition:filter .12s;}
.gantt-barra:hover{filter:brightness(1.08);}
.gantt-barra.atrasada{box-shadow:0 0 0 2px var(--error);}
.gantt-marcador{position:absolute; top:50%; width:14px; height:14px; transform:translate(-50%,-50%) rotate(45deg);
  border-radius:3px; cursor:pointer; box-shadow:0 0 0 2px #fff, var(--sombra-suave);}
.gantt-hoy{position:absolute; top:0; bottom:0; width:2px; background:var(--navy); z-index:1; opacity:.5;}
.gantt-hoy-etq{position:absolute; top:2px; left:4px; font-size:9px; font-weight:800; color:var(--navy);
  background:#fff; padding:1px 4px; border-radius:4px; white-space:nowrap;}
/* El alta de cliente en línea, dentro del modal de la cotización. */
.cliente-nuevo{background:var(--neutro-suave); border:1px solid var(--line); border-radius:11px;
  padding:12px 14px 10px; margin-top:10px;}
.cliente-nuevo .campo{margin-bottom:8px;}
.cliente-nuevo-botones{display:flex; justify-content:flex-end; gap:8px; margin-top:10px;}
/* El puente al otro módulo: se lee como un enlace, no como un botón de acción —
   no cambia nada, solo lleva. */
.enlace-modulo{font-family:inherit; font-size:11.5px; font-weight:600; color:var(--navy-2);
  background:var(--neutro-suave); border:1px solid var(--line); border-radius:8px;
  padding:2px 8px; margin-left:8px; cursor:pointer; display:inline-flex; align-items:center;
  gap:5px; vertical-align:middle;}
.enlace-modulo svg{width:13px; height:13px;}
.enlace-modulo:hover{border-color:var(--accent); color:var(--navy);}
.agenda-eq.inerte{cursor:default;}
.agenda-eq.inerte:hover{border-color:var(--line); background:var(--bg);}
.i-neutro{background:var(--neutro-suave); color:#5c6273; border-color:#dfe3ee;}
.i-info{background:#EEF2FB; color:var(--navy); border-color:#c9d4ec;}

.t-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px;}

/* Datos en dos columnas */
.t-datos{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line);}
.t-dato .d-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:600;}
.t-dato .d-valor{font-size:13.5px; font-weight:600; color:var(--ink); margin-top:2px;}
.t-dato .d-valor.chico{font-size:12.5px; font-weight:500;}
.t-dato .d-valor.ok{color:#2c7a4e;} .t-dato .d-valor.alerta{color:#9a6a15;} .t-dato .d-valor.error{color:#a5322e;}

/* Barra de progreso de mensualidades */
.progreso{margin-top:14px;}
.progreso .p-cabeza{display:flex; align-items:center; justify-content:space-between; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:600; margin-bottom:7px;}
.meses{display:flex; gap:4px; flex-wrap:wrap;}
.mes{
  width:26px; height:26px; border-radius:7px; border:1.5px solid #d9dfec; background:#fbfcfe;
  font-family:inherit; font-size:10.5px; font-weight:600; color:#9aa0b0;
  /* El cursor de mano solo si de verdad se puede picar: para el Viewer estas
     casillas son <span>, no botones. */
  cursor:default;
  display:grid; place-items:center; transition:background .12s, border-color .12s, color .12s, transform .1s;
}
/* El resaltado al pasar encima, solo donde SÍ se puede picar. */
button.mes:hover{border-color:var(--accent); color:var(--accent);}
button.mes{cursor:pointer;}
.mes.pagado{background:var(--ok); border-color:var(--ok); color:#fff;}
.mes.pagado:hover{background:#35935c; border-color:#35935c; color:#fff;}
.mes.debido{border-color:var(--error); color:var(--error); background:var(--error-suave);}
.mes.debido:hover{background:#f8dcdb;}
.mes:active{transform:scale(.92);}

/* Pie de tarjeta con acciones */
.t-pie{display:flex; gap:8px; margin-top:15px; padding-top:13px; border-top:1px solid var(--line); flex-wrap:wrap;}
.t-pie .btn{flex:0 0 auto;}
.t-pie .espacio{margin-left:auto;}

/* Nota de la tarjeta */
.t-nota{margin-top:12px; font-size:11.5px; color:var(--gray); line-height:1.5; background:#fafbfe; border:1px solid var(--line); border-radius:9px; padding:8px 10px; white-space:pre-wrap;}

/* ---------- Estado vacío ---------- */
.vacio{
  background:#fff; border:1.5px dashed #d4d9e6; border-radius:16px; padding:44px 26px; text-align:center;
}
.vacio .v-icono{width:52px; height:52px; margin:0 auto 14px; border-radius:14px; display:grid; place-items:center; background:#EEF2FB; color:var(--navy);}
.vacio .v-icono svg{width:26px; height:26px;}
.vacio h3{font-size:16px; font-weight:600; color:var(--navy);}
.vacio p{font-size:13px; color:var(--gray); margin:7px auto 18px; max-width:420px; line-height:1.6;}

/* ---------- Aviso de guardado local ---------- */
.aviso{
  display:flex; gap:11px; align-items:flex-start; background:#fff; border:1px solid var(--line);
  border-left:4px solid var(--accent); border-radius:12px; padding:13px 15px; margin-bottom:20px;
}
.aviso svg{width:17px; height:17px; color:var(--accent); flex-shrink:0; margin-top:1px;}
.aviso div{font-size:12px; color:var(--gray); line-height:1.55;}
.aviso b{color:var(--navy); font-weight:600;}

/* ---------- Ventana modal ---------- */
.telon{
  position:fixed; inset:0; background:rgba(10,27,77,.5); backdrop-filter:blur(2px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:26px 16px; overflow-y:auto;
}
.telon.abierto{display:flex;}
.modal{
  background:#fff; border-radius:18px; width:100%; max-width:620px; box-shadow:0 24px 70px rgba(0,0,0,.3);
  animation:sube .24s cubic-bezier(.22,1,.36,1) both; overflow:hidden;
}
.modal.ancho{max-width:860px;}
/* La cotización de una póliza llega a 34 renglones de ocho columnas: 860 px no
   alcanzan y la tabla se volvía ilegible a fuerza de comprimir. */
.modal.enorme{max-width:1180px;}
/* Vista previa del documento de cotización: un iframe a la plantilla real
   —los MISMOS datos, el mismo cálculo—, no una segunda maqueta que se pueda
   desalinear. Alto fijo con scroll propio del iframe: el documento mide
   11in y no tiene por qué caber completo sin desplazarse. */
.modal.doc-previa{max-width:900px;}
.iframe-previa{width:100%; height:78vh; border:0; border-radius:10px; background:#E9EBEE; display:block;}
@keyframes sube{ from{opacity:0; transform:translateY(16px) scale(.99);} to{opacity:1; transform:none;} }
.modal-cabeza{padding:19px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; position:sticky; top:0; background:#fff; z-index:2;}
.modal-cabeza h3{font-size:16px; font-weight:700; color:var(--navy); flex:1;}
.modal-cabeza .cerrar{background:none; border:none; cursor:pointer; color:var(--gray); font-size:22px; line-height:1; padding:2px 6px; border-radius:7px; font-family:inherit;}
.modal-cabeza .cerrar:hover{background:var(--bg); color:var(--ink);}
.modal-cuerpo{padding:20px 22px 6px;}
.modal-pie{padding:16px 22px 20px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
.modal-pie .izq{margin-right:auto;}

/* ---------- Campos ---------- */
.seccion{margin-bottom:20px;}
.seccion h4{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--navy); font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.seccion h4::after{content:""; flex:1; height:1px; background:var(--line);}
.campo{margin-bottom:13px;}
.campo label{display:block; font-size:12px; font-weight:500; color:#3a4256; margin-bottom:5px;}
.campo input, .campo select, .campo textarea{
  width:100%; padding:9px 11px; border:1px solid #d4d9e6; border-radius:9px;
  font-family:inherit; font-size:13px; color:var(--ink); background:#fbfcfe; outline:none; transition:border-color .15s, background .15s;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{border-color:var(--accent); background:#fff;}
.campo input[readonly]{background:#f1f3f8; color:#5c6273; cursor:default;}
.campo input[readonly]:focus{border-color:#d4d9e6;}
.campo textarea{resize:vertical; min-height:66px; font-size:12.5px; line-height:1.5;}
.campo input[aria-invalid="true"]{border-color:var(--error); background:#fffafa;}
.fila2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
@media (max-width:560px){ .fila2{grid-template-columns:1fr;} }
.pista{font-size:11px; color:var(--gray); margin-top:4px; line-height:1.45;}
.casilla{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500; color:#3a4256; cursor:pointer; margin-bottom:11px;}
.casilla input{width:16px; height:16px; accent-color:var(--navy); cursor:pointer;}

/* Resumen dentro del modal */
.resumen{background:var(--navy); color:#fff; border-radius:13px; padding:15px 17px; margin-top:4px;}
.resumen .r-fila{display:flex; justify-content:space-between; gap:12px; font-size:12px; padding:5px 0;}
.resumen .r-fila span:first-child{opacity:.72;}
.resumen .r-fila span:last-child{font-weight:600; text-align:right;}
.resumen .r-total{border-top:1px solid rgba(255,255,255,.18); margin-top:6px; padding-top:9px;}
.resumen .r-total span:last-child{font-size:17px; font-weight:700;}

/* Variante en cuadrícula del mismo cajón: para un puñado de datos sueltos
   (etiqueta arriba, valor abajo — Tipo de mantenimiento, Cargo a, Solicitud…)
   en vez de una lista de renglones tipo recibo. Clase aparte de .resumen (y
   no la misma con display:grid) porque .resumen YA se usa en varios lados
   como lista vertical de .r-fila — convertirla a grid habría vuelto cada
   renglón de ESOS una columna suelta en vez de una fila completa. */
.resumen-datos{background:var(--navy); color:#fff; border-radius:13px; padding:15px 17px; margin-top:4px;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:14px 22px;}
.resumen-datos .d-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.65); font-weight:600;}
.resumen-datos .d-valor{font-size:13.5px; font-weight:600; color:#fff; margin-top:3px; word-break:break-word;}
.resumen-datos .d-valor.chico{font-size:12.5px; font-weight:500;}

/* Rejilla de casillas de mes en el modal */
.meses-modal{display:flex; gap:6px; flex-wrap:wrap;}
.meses-modal .mes{width:34px; height:34px; font-size:11.5px;}
/* Los meses de servicio llevan el mes escrito, no un número: "¿en qué mes le
   toca a la campana?" no se contesta con un 3. */
.meses-modal.con-mes .mes{width:auto; min-width:50px; padding:0 8px; height:32px; font-size:11px;}
.mes.serv{background:var(--navy); border-color:var(--navy); color:#fff;}
.mes.serv:hover{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}

/* ---- Tabla de captura de la cotización ----
   Una fila por equipo, con los campos editables dentro de la celda. Antes era una
   tarjeta por renglón y no escalaba: MXGT01 tiene 34 equipos y eran 34 tarjetas
   de scroll infinito. Aquí caben de un vistazo y se recorren con Tab. */
/* El min-width es a propósito: sin él las columnas fijas se comían el ancho y la
   de "Equipo" quedaba en 40 px mostrando "Cám…". Mejor que la tabla se recorra a
   lo ancho dentro de .rodillo que leer el nombre del equipo cortado. */
.tabla-renglones{width:100%; min-width:940px; border-collapse:collapse;}
.tabla-renglones .equipo{min-width:190px;}
.tabla-renglones .marca{width:96px;}
.tabla-renglones th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray);
  font-weight:700; text-align:left; padding:7px 5px; border-bottom:1.5px solid var(--line); white-space:nowrap;}
.tabla-renglones td{padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
.tabla-renglones input, .tabla-renglones select{width:100%; padding:6px 7px; border:1px solid #d4d9e6;
  border-radius:7px; font-family:inherit; font-size:12px; color:var(--ink); background:#fbfcfe; outline:none;}
.tabla-renglones input:focus, .tabla-renglones select:focus{border-color:var(--accent); background:#fff;}
/* El total va gris y de solo lectura porque NO se captura: se calcula. */
/* Apunta al TOTAL por su atributo, no a "cualquier readonly de la tabla": con lo
   segundo, congelar las demás celdas les robaba este estilo y el concepto salía
   alineado a la derecha y en negritas. */
.tabla-renglones input[data-total]{background:#f1f3f8; color:var(--navy); font-weight:700; text-align:right; cursor:default;}
/* Celda congelada: se ve inerte pero conserva su alineación y su peso. */
.tabla-renglones input[readonly]:not([data-total]){background:#f1f3f8; color:#6b7186; cursor:not-allowed;}
.tabla-renglones input[aria-invalid="true"]{border-color:var(--error); background:#fffafa;}
.tabla-renglones .num{width:24px; color:var(--gray-claro); font-size:11px; text-align:right; padding-right:6px;}
.tabla-renglones .mini{width:62px;}
.tabla-renglones .med{width:106px;}
.tabla-renglones .arr{width:132px;}
.tabla-renglones td.acc{white-space:nowrap; text-align:right; width:1%;}
.tabla-renglones tfoot td{border-bottom:none; padding-top:12px; font-size:13px; font-weight:700; color:var(--navy);}
.tabla-renglones tfoot .lbl{text-align:right; font-weight:500; color:var(--gray);}
/* Renglón con meses que no siguen el intervalo: se marca para que no se pierda. */
.tabla-renglones tr.irregular > td{background:#fffdf6;}
.fila-meses > td{background:var(--bg); padding:10px 12px 13px; border-bottom:1px solid var(--line);}
/* Vista previa de la importación. Los avisos van en su PROPIO renglón a todo lo
   ancho, no en una columna: son la razón de ser de esta pantalla, y metidos en
   una columna estrecha se cortaban justo donde empezaba lo importante. */
table.tabla tr.tiene-notas > td{border-bottom:none; padding-bottom:2px;}
.imp-notas > td{padding-top:0; padding-bottom:13px; font-size:11.5px; color:var(--gray); line-height:1.6;}
.imp-notas b{color:var(--error);}
.imp-pie{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  margin-top:16px; padding-top:13px; border-top:1.5px solid var(--line); font-size:13px;}
.imp-pie span{color:var(--gray);}
.imp-pie b{font-size:15.5px; color:var(--navy);}
.icono-mini{background:none; border:1px solid var(--line); border-radius:6px; cursor:pointer;
  padding:5px 6px; color:var(--gray); line-height:0; margin-left:3px;}
.icono-mini:hover{border-color:var(--navy); color:var(--navy); background:#fff;}
.icono-mini svg{width:13px; height:13px; display:block;}
.icono-mini.on{border-color:var(--navy); color:var(--navy); background:var(--bg);}
/* Globito al pasar el mouse. El title nativo tarda casi un segundo y con tres
   iconos seguidos nadie adivina cuál es cuál mientras espera. */
/* El avatar de la tarjeta de póliza es un botón: lleva al cliente para subirle la
   foto. Se ve idéntico al avatar normal — la única pista es el cursor. */
.avatar-btn{background:none; border:none; padding:0; cursor:pointer; position:relative; line-height:0; border-radius:12px;}
.avatar-btn:hover{opacity:.82;}
.avatar-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.icono-mini[data-tip], .avatar-btn[data-tip]{position:relative;}
.icono-mini[data-tip]::after, .avatar-btn[data-tip]::after{
  content:attr(data-tip); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:var(--navy-oscuro); color:#fff; font-size:10.5px; font-weight:600; letter-spacing:.01em;
  padding:4px 8px; border-radius:6px; white-space:nowrap; pointer-events:none;
  opacity:0; transition:opacity .13s var(--ease); z-index:5;
}
.icono-mini[data-tip]:hover::after, .icono-mini[data-tip]:focus-visible::after,
.avatar-btn[data-tip]:hover::after, .avatar-btn[data-tip]:focus-visible::after{opacity:1;}
.busca-equipo{display:flex; gap:9px; align-items:center; margin-bottom:13px; flex-wrap:wrap;}
.busca-equipo input{flex:1; min-width:220px; padding:9px 11px; border:1px solid #d4d9e6; border-radius:9px;
  font-family:inherit; font-size:13px; color:var(--ink); background:#fbfcfe; outline:none;}
.busca-equipo input:focus{border-color:var(--accent); background:#fff;}
.cuantos-zona{display:flex; align-items:stretch; gap:6px;}
.cliente-zona{display:flex; gap:7px; align-items:stretch;}
.cliente-zona select{flex:1; min-width:0;}
.cliente-zona .btn{flex:0 0 auto; white-space:nowrap;}

/* Chips de acceso rápido a los equipos que más se cotizan. Con el buscador solo,
   agregar los de siempre era teclear el nombre completo cada vez. */
.chips-equipo{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.chip-eq{display:inline-flex; align-items:center; gap:6px; background:var(--bg);
  border:1px solid var(--line); border-radius:999px; padding:5px 9px 5px 11px;
  font-family:inherit; font-size:12px; font-weight:600; color:var(--navy); cursor:pointer;
  transition:background .14s var(--ease), border-color .14s var(--ease), transform .14s var(--ease);}
.chip-eq:hover{background:#fff; border-color:var(--navy); transform:translateY(-1px);}
.chip-eq:active{transform:none;}
.chip-eq:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.chip-eq .mas{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
  border-radius:50%; background:var(--navy); color:#fff; font-size:12px; line-height:1; font-weight:700;}
.chip-eq:hover .mas{background:var(--accent);}
/* Calendario de la póliza: una tarjeta por mes. */
.cal-meses{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:11px; margin-top:15px;}
.cal-mes{border:1px solid var(--line); border-radius:11px; padding:11px 12px; background:#fff;}
.cal-mes.vacio{background:var(--bg); border-style:dashed;}
.cal-mes.ahora{border-color:var(--alerta); box-shadow:0 0 0 2px var(--alerta-suave);}
.cal-cabeza{display:flex; align-items:center; gap:7px; margin-bottom:8px;}
.cal-cabeza b{font-size:13px; color:var(--navy); text-transform:capitalize;}
.cal-cuenta{font-size:10.5px; font-weight:700; color:var(--gray); white-space:nowrap;}
.cal-lista{list-style:none; display:flex; flex-direction:column; gap:5px;}
.cal-lista li{font-size:12px; color:var(--ink); line-height:1.4; display:flex; align-items:baseline; gap:5px;}
.cal-lista li.hecho{color:var(--ok);}
/* El resumen de arriba del calendario: etiqueta con dos puntos, aire entre
   etiqueta y valor. Sin esto .c-fila queda sin estilo aquí (solo lo trae dentro
   de .bloque) y todo salía pegado. */
.cal-resumen{margin-bottom:4px;}
.cal-resumen .c-fila{display:flex; gap:8px; align-items:baseline; font-size:13.5px; padding:3px 0;}
.cal-resumen .c-fila span:first-child{color:var(--gray);}
.cal-lista li svg{width:12px; height:12px; flex:0 0 auto; position:relative; top:2px;}
/* El renglón del calendario es un botón: ahí se marca "este ya se hizo". Se ve
   como texto hasta que el mouse encima lo delata — una lista de doce meses llena
   de botones con marco se vuelve ilegible. */
.cal-marcar{background:none; border:none; font-family:inherit; font-size:inherit; color:inherit;
  text-align:left; padding:2px 4px; margin:-2px -4px; border-radius:6px; cursor:pointer;
  display:flex; align-items:baseline; gap:5px; width:100%;}
.cal-marcar:hover{background:var(--bg);}
.cal-marcar:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.cal-lista li.hecho .cal-marcar{color:var(--ok);}
/* Chip de mes clicable en la tabla del detalle. Hereda el color del chip; lo
   único que cambia es que se puede picar. */
.chip-mes{font-family:inherit; cursor:pointer;}
.chip-mes:hover{filter:brightness(.95);}
.chip-mes:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
/* Botones de unidad del modal de servicio: prendido = se atendió. El apagado se
   ve deliberadamente "hueco" (borde punteado, número tachado) para que el ojo
   cuente los prendidos de un vistazo. */
.sv-unidades{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 4px;}
.sv-uni{min-width:46px; padding:9px 0; text-align:center; cursor:pointer;
  font:700 13.5px Manrope,sans-serif; border-radius:9px;
  background:#E8F5EE; color:#26714A; border:1.5px solid #54C682;}
.sv-uni:not(.activa){background:var(--bg); color:var(--gray);
  border:1.5px dashed var(--line); text-decoration:line-through;}
.sv-uni:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.busca-equipo .cuantos{flex:0 0 auto; width:58px; min-width:0; text-align:center; padding:6px 4px; font-size:12px;}
/* Pie de la tabla de renglones. Fuera del scroll horizontal a propósito. */
.pie-renglones{display:flex; gap:26px; justify-content:flex-end; flex-wrap:wrap;
  border-top:1.5px solid var(--line); margin-top:2px; padding:11px 4px 2px;}
.pie-renglones div{display:flex; align-items:baseline; gap:9px;}
.pie-renglones span{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray); font-weight:700;}
.pie-renglones b{font-size:16px; font-weight:700; color:var(--navy);}

/* Renglones de la cotización dentro del modal (tarjeta, ya no se usa en pólizas) */
.partida{border:1px solid var(--line); border-radius:12px; padding:14px 14px 4px; margin-bottom:12px; background:#fcfdff;}
.partida .p-cabeza{display:flex; align-items:center; gap:9px; margin-bottom:12px;}
.partida .p-num{width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff;
                font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.partida .p-cabeza select{flex:1; min-width:0; padding:7px 9px; border:1px solid #d4d9e6; border-radius:8px;
                          font-family:inherit; font-size:12px; color:var(--ink); background:#fff; outline:none;}
.partida .p-cabeza select:focus{border-color:var(--accent);}
.partida .fila3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px;}
@media (max-width:560px){ .partida .fila3{grid-template-columns:1fr;} }
/* El total va en gris y de solo lectura porque NO se captura: se calcula. Que se
   vea distinto a los campos editables es parte del mensaje. */
.partida .p-total input{font-weight:700; color:var(--navy);}
.partida .aviso-cuadre{font-size:11px; color:var(--error); margin-top:5px; font-weight:600;}
/* Aviso de póliza cerrada, arriba del formulario. Va en ámbar y no en rojo a
   propósito: no es un error de quien captura, es el estado del documento. Los
   campos apagados se ven apagados por el navegador; esto explica POR QUÉ. */
.aviso-congelada{background:var(--alerta-suave); color:#8A5A0B; border:1px solid #F0DCB4;
  border-radius:11px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; line-height:1.6;}
.aviso-congelada b{color:#6E480A;}
/* Un campo que el servidor no va a dejar guardar se ve claramente inerte, para
   que nadie teclee ahí y crea que se perdió su cambio. Solo :disabled, que es
   exclusivamente este candado: los readonly de siempre —quién capturó un cobro o
   un servicio— ya los viste `.campo input[readonly]` y no se les toca el cursor. */
#modalCuerpo input:disabled, #modalCuerpo select:disabled{background:var(--neutro-suave);
  color:#6b7186; cursor:not-allowed;}
#modalCuerpo button:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Aviso flotante ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translate(-50%,90px);
  background:var(--navy); color:#fff; font-size:13px; font-weight:500; padding:13px 20px;
  border-radius:12px; box-shadow:0 14px 40px rgba(10,27,77,.35); z-index:200; opacity:0;
  transition:transform .28s cubic-bezier(.22,1,.36,1), opacity .28s; pointer-events:none; max-width:calc(100% - 32px); text-align:center;
}
.toast.visible{transform:translate(-50%,0); opacity:1;}
.toast.err{background:var(--error);}

/* ---------- Indicador de nube y sesión en el encabezado ---------- */
.nube-zona{display:flex; align-items:center; gap:9px; margin-left:auto;}
.pastilla{
  display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600;
  border-radius:999px; padding:6px 12px; border:1px solid var(--line); background:#fff; color:var(--gray);
  white-space:nowrap;
}
.pastilla .punto{width:8px; height:8px;}
.pastilla.n-ok{background:var(--ok-suave); color:#2c7a4e; border-color:#c5e6d3;}
.pastilla.n-trabajo{background:#EEF2FB; color:var(--navy); border-color:#c9d4ec;}
.pastilla.n-error{background:var(--error-suave); color:#a5322e; border-color:#f0cbc9;}
.pastilla.n-local{background:var(--neutro-suave); color:#5c6273; border-color:#dfe3ee;}
.btn-cabeza{
  font-family:inherit; font-size:12px; font-weight:600; color:var(--navy); background:#fff;
  border:1.5px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:border-color .15s, background .15s;
}
.btn-cabeza:hover{border-color:var(--accent); background:#f6f9ff;}
.btn-cabeza svg{width:14px; height:14px;}
/* Puntito ámbar en "Mi cuenta" cuando la contraseña sigue siendo la que dio el
   administrador. Es un recordatorio, no un bloqueo: se ve pero no estorba. */
.punto-alerta{width:7px; height:7px; border-radius:50%; background:var(--alerta); flex-shrink:0;
  box-shadow:0 0 0 3px var(--alerta-suave);}
.punto-alerta[hidden]{display:none;}
.correo-sesion{font-size:12.5px; font-weight:600; color:var(--tinta, var(--ink)); max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (max-width:900px){ .correo-sesion{display:none;} }

/* ---------- Etiquetas de permiso, con su color ---------- */
.rol{
  display:inline-flex; align-items:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  border-radius:999px; padding:4px 11px; border:1px solid transparent; white-space:nowrap;
}
.c-owner  {background:#FCEDEC; color:#B3312C; border-color:#F0CBC9;}
.c-admin  {background:#EAF1FC; color:#1B4FA8; border-color:#C6D8F5;}
.c-analyst{background:#E8F5EE; color:#26714A; border-color:#C0E3D0;}
.c-viewer {background:#F1F3F8; color:#5C6273; border-color:#DFE3EE;}
.c-tecnico  {background:#FCEFDD; color:#9A5B12; border-color:#F0D9B4;}
.c-reportero{background:#F1EAFB; color:#6A3FA0; border-color:#DCC9F2;}
table.tabla select.sel-rol{font-weight:600;}
@media (max-width:700px){ .pastilla span.txt{display:none;} .pastilla{padding:6px 8px;} }

/* ---------- Pantalla de acceso ---------- */
.acceso{
  position:fixed; inset:0; z-index:150; background:var(--bg);
  display:none; align-items:center; justify-content:center; padding:24px 16px; overflow-y:auto;
}
.acceso.abierto{display:flex;}
.acceso-caja{
  background:#fff; border:1px solid var(--line); border-radius:18px; padding:34px 30px 28px;
  width:100%; max-width:392px; box-shadow:var(--sombra); position:relative; overflow:hidden;
  animation:sube .3s cubic-bezier(.22,1,.36,1) both;
}
.acceso-caja::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--accent));}
/* El logo del login es un SVG inline, no un <img>: se le da alto y el ancho
   sale de su proporción. overflow visible para que las piezas puedan venir de
   fuera del recuadro sin que se recorten a media entrada. */
.acceso-caja #logoAcceso{height:30px; width:auto; margin-bottom:18px; overflow:visible; display:block;}
.acceso-caja h2{font-size:19px; font-weight:700; color:var(--navy);}
.acceso-caja p.intro{font-size:12.5px; color:var(--gray); line-height:1.55; margin:7px 0 20px;}
.acceso-caja .btn{width:100%; margin-top:6px; padding:13px;}
.acceso-error{
  display:none; font-size:12px; color:#a5322e; background:var(--error-suave); border:1px solid #f0cbc9;
  border-radius:9px; padding:9px 11px; margin:2px 0 12px; line-height:1.5;
}

/* ---------- Pantalla de carga posterior al login ---------- */
/* z-index 200: por encima del login (150) y de los modales (100). Así la carga
   aparece tapando la caja de acceso y esta se esconde detrás, sin parpadeo.
   Fondo del mismo color que el tablero: al desvanecerse no hay salto de color,
   solo aparece el contenido debajo. */
.cargando{
  position:fixed; inset:0; z-index:200; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:26px;
  background:var(--bg);
}
.cargando.abierto{display:flex;}

/* El logo completo es 3.26 veces más ancho que alto; se le da el alto y el ancho
   sale solo. clamp() para que no se desborde en un celular. */
.cargando .c-logo{height:clamp(38px, 8vw, 62px); width:auto; overflow:visible;}
.cargando .c-texto{color:var(--gray); font-size:13px; letter-spacing:.01em; opacity:0; animation:cargaTexto .5s var(--ease) .7s forwards;}
@keyframes cargaTexto{ to{opacity:1;} }

/* ---- Salida: el logo se encoge y vuela al encabezado ----
   El destino se mide en JS (posición real del logo del header) y se aplica como
   variables --vx/--vy/--ve, porque depende del ancho de la ventana. El fondo y
   el texto se van desvaneciendo mientras el logo viaja. */
.cargando.volando{ pointer-events:none; }
.cargando.volando .c-logo{
  transform:translate(var(--vx,0), var(--vy,0)) scale(var(--ve,1));
  transition:transform .62s cubic-bezier(.66,0,.24,1);
}
/* Tiene que ser OTRA animación, no un "opacity:0" a secas: la animación de
   entrada lleva "forwards" y en la cascada de CSS una animación le gana a una
   declaración normal, así que el texto se quedaba visible durante el vuelo. */
.cargando.volando .c-texto{animation:cargaTextoSale .2s linear forwards;}
@keyframes cargaTextoSale{ from{opacity:1;} to{opacity:0;} }
/* El fondo se va un poco después de que el logo arranca, para que no se vea el
   logo flotando sobre el tablero a medio camino. */
.cargando.volando{ animation:cargaFondoSale .5s var(--ease) .16s forwards; }
@keyframes cargaFondoSale{ to{ background-color:transparent; } }

@media (prefers-reduced-motion: reduce){
  .cargando .c-texto{animation:none; opacity:1;}
  /* Sin vuelo: desaparece y ya. */
  .cargando.volando .c-logo{transition:none; transform:none;}
  .cargando.volando{animation-duration:.01s;}
}

/* ---------- Persiana de cierre de sesión ---------- */
/* z-index 300: encima del login (150) y de la pantalla de carga (200), porque
   tapa la transición completa.
   pointer-events sí activo, a propósito: mientras la persiana cubre no queremos
   que se pueda escribir a ciegas en el formulario de acceso que está detrás. */
.persiana{position:fixed; inset:0; z-index:300; display:none;}
.persiana.abierta{display:block;}
.persiana svg{display:block; width:100%; height:100%;}
.acceso-error.visible{display:block;}
.acceso-pie{font-size:11.5px; color:var(--gray); text-align:center; margin-top:16px; line-height:1.55;}
.acceso-pie button{background:none; border:none; font-family:inherit; font-size:11.5px; color:var(--accent); font-weight:600; cursor:pointer; padding:0;}
.acceso-pie button:hover{text-decoration:underline;}

/* ---------- Tablas del panel de administración ---------- */
.bloque{background:#fff; border:1px solid var(--line); border-radius:15px; padding:20px 20px 16px; margin-bottom:18px; position:relative; overflow:hidden;}
.bloque::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg,var(--navy),var(--accent));}
.bloque-cabeza{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.bloque-cabeza h3{font-size:15.5px; font-weight:700; color:var(--navy);}
.bloque-cabeza p{font-size:12px; color:var(--gray); margin-top:2px;}
.bloque-cabeza .der{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
.hallazgo-item.resuelto{opacity:.62;}
/* Renglones de dato dentro de un bloque claro. La regla de .credencial .c-fila
   es para la tarjeta oscura de "cuenta creada" y no aplica aquí. */
.bloque .c-fila{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:7px 0; align-items:center; border-bottom:1px solid var(--line);}
.bloque .c-fila:last-child{border-bottom:none;}
.bloque .c-fila span:first-child{color:var(--gray);}
/* Botón que se lee como un enlace, para acciones secundarias dentro de un texto. */
.enlace{background:none; border:none; font-family:inherit; font-size:inherit; color:var(--accent); font-weight:600; cursor:pointer; padding:0;}
.enlace:hover{text-decoration:underline;}

.rodillo{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table.tabla{width:100%; border-collapse:collapse; min-width:620px;}
table.tabla th{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray); font-weight:700;
  text-align:left; padding:8px 10px; border-bottom:1.5px solid var(--line); white-space:nowrap;
}
table.tabla td{font-size:12.5px; color:var(--ink); padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.tabla tr:last-child td{border-bottom:none;}
table.tabla td.acciones{white-space:nowrap; text-align:right;}
table.tabla td.acciones .btn{margin-left:5px;}
table.tabla select{
  padding:6px 9px; border:1px solid #d4d9e6; border-radius:8px; font-family:inherit; font-size:12px;
  color:var(--ink); background:#fbfcfe; outline:none;
}
table.tabla select:focus{border-color:var(--accent);}
table.tabla .yo{font-size:10.5px; color:var(--accent); font-weight:600;}
.vacio-chico{font-size:12.5px; color:var(--gray); text-align:center; padding:24px 10px; line-height:1.6;}

/* Credenciales recién creadas */
.credencial{background:var(--navy); color:#fff; border-radius:13px; padding:16px 18px; margin-top:4px;}
.credencial .c-fila{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:6px 0; align-items:center;}
.credencial .c-fila span:first-child{opacity:.72;}
.credencial .c-fila code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:600; background:rgba(255,255,255,.14); border-radius:6px; padding:3px 8px;}
.credencial .c-nota{font-size:11px; opacity:.72; margin-top:9px; line-height:1.5;}

/* Historial */
.bitacora{display:flex; flex-direction:column; gap:2px;}
.evento{display:flex; gap:12px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid var(--line);}
.evento:last-child{border-bottom:none;}
.evento .e-icono{width:28px; height:28px; border-radius:8px; flex-shrink:0; display:grid; place-items:center; background:#EEF2FB; color:var(--navy);}
.evento .e-icono svg{width:14px; height:14px;}
.evento.e-alta .e-icono{background:var(--ok-suave); color:#2c7a4e;}
.evento.e-baja .e-icono{background:var(--error-suave); color:#a5322e;}
.evento .e-texto{flex:1; min-width:0; font-size:12.5px; color:var(--ink); line-height:1.5;}
.evento .e-texto b{font-weight:600; color:var(--navy);}
.evento .e-meta{font-size:11px; color:var(--gray); margin-top:2px;}
.evento .e-cuando{font-size:11px; color:var(--gray); white-space:nowrap; text-align:right; flex-shrink:0;}

/* ---------- Reportes: evidencia, técnicos y seguimiento ---------- */
/* Cuadritos, no una fila que se desborda: en el celular —el dispositivo de
   quien más usa esto— una galería que envuelve es más fácil de hojear que
   una tira con scroll horizontal escondido. */
.galeria-evidencia{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.galeria-evidencia:empty{margin-bottom:0;}
.evidencia-foto{position:relative; width:92px; height:92px; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex-shrink:0;}
.evidencia-foto img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
.evidencia-quitar{
  position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none;
  background:rgba(20,24,38,.62); color:#fff; display:grid; place-items:center; cursor:pointer;
}
.evidencia-quitar svg{width:11px; height:11px;}
.evidencia-quitar:hover{background:rgba(179,49,44,.85);}

/* Imagen/Aperturas: mismo cuadrito de evidencia, con una etiqueta de qué es
   (render/plano/foto) pegada abajo — a diferencia de una foto de reporte,
   aquí SÍ importa distinguir un plano de un render a simple vista. */
.evidencia-tipo{
  position:absolute; left:0; right:0; bottom:0; padding:2px 5px; font-size:9px; font-weight:700;
  color:#fff; background:rgba(20,24,38,.62); text-align:center;
}
/* Un plano en PDF ya enseña su nombre de archivo pegado abajo (mismo cuadro
   que un respaldo de costo) — la etiqueta de tipo se sube arriba para no
   taparlo. */
.respaldo-pdf .evidencia-tipo{ top:0; bottom:auto; }

/* Respaldo de costo en cotizaciones: mismo cuadrito que una foto de
   evidencia, pero cuando el archivo es PDF se muestra un ícono y el nombre
   en lugar de una miniatura (no hay como generar una vista previa de un
   PDF sin librerías). */
.respaldo-pdf{background:var(--bg);}
.respaldo-pdf a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; width:100%; height:100%; padding:6px; text-align:center; color:var(--ink); text-decoration:none; cursor:pointer;}
.respaldo-pdf svg{width:26px; height:26px; flex-shrink:0; stroke:var(--gray);}
.respaldo-pdf span{font-size:10px; line-height:1.15; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word;}

.lista-tecnicos{display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto; padding:2px;}

.lista-seguimiento{display:flex; flex-direction:column; gap:2px;}
.seguimiento-item{padding:9px 2px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink); line-height:1.5;}
.seguimiento-item:last-child{border-bottom:none;}
.seguimiento-item b{color:var(--navy);}
.seguimiento-item .pista{margin-left:6px;}
.seguimiento-item > div{margin-top:2px; white-space:pre-wrap;}

/* ---------- Pie ---------- */
.pie{padding:18px 24px; text-align:center; font-size:11.5px; color:var(--gray); border-top:1px solid var(--line); background:#fff;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>

<script>
/* =========================================================================
   CONTROL DE FORPASS · Forguard

   Funciona de dos maneras:

   · MODO LOCAL  — si CONFIG_NUBE está vacío. Todo se guarda solo en este
                   navegador, como una libreta personal.
   · MODO NUBE   — al pegar los datos de Firebase abajo. Entonces pide correo
                   y contraseña, guarda en el servidor, varias personas ven lo
                   mismo, hay permisos (admin / captura / lectura) y queda
                   historial de quién cambió qué.

   Modelo de datos
   ---------------
   clientes: { id, nombre, contacto, notas, logo }
   sitios:   { id, clienteId, nombre, zona, estado, tipo, modulos, mensualidad,
               incViaticos, viaticos, incOnboarding, onboarding,
               fechaInicio, meses, pagos:[bool], notas,
               pagosDetalle:[{oc, quien, cuando, facturado}],
               contactos:[{nombre, puesto, correo, telefono, notas}],
               encargado:{uid, nombre, correo} }
   usuarios: { id(uid), correo, nombre, rol, activo, creado, creadoPor, ultimoAcceso }
   bitacora: { cuando, quien, accion, que, nombre, detalle }
   ========================================================================= */

/* ┌───────────────────────────────────────────────────────────────────────┐
   │  PEGA AQUÍ LOS DATOS DE TU PROYECTO DE FIREBASE                       │
   │  Los encuentras en la consola de Firebase, en Configuración del       │
   │  proyecto → Tus apps → Configuración del SDK.                         │
   │  Estos dos datos NO son secretos: quien los ve no puede entrar sin     │
   │  una cuenta. La seguridad real está en las reglas y en el login.       │
   └───────────────────────────────────────────────────────────────────────┘ */
const CONFIG_NUBE = {
  apiKey:    'AIzaSyDtF90I-scvrJprYYMT_Z9qr5ItqxSuZSo',
  projectId: 'forguard-soft-services'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const HAY_NUBE = !!(CONFIG_NUBE.apiKey && CONFIG_NUBE.projectId);

/* Tope de mensualidades por contrato (12 meses es lo normal, 24 el máximo). */
const MAX_MESES = 24;

/* Zonas sugeridas. Son solo sugerencias: el campo acepta cualquier texto, así
   que se pueden agregar plazas nuevas sin tocar el código. */
const ZONAS = ['CDMX','GDL','MTY','Mérida','León','San Luis','Querétaro','Puebla','Tijuana','Cancún'];

/* Diez colores para las etiquetas de zona. La llave se guarda en el sitio. */
const COLORES = [
  { id:'azul',     nombre:'Azul',     muestra:'#EAF1FC' },
  { id:'verde',    nombre:'Verde',    muestra:'#E8F5EE' },
  { id:'rojo',     nombre:'Rojo',     muestra:'#FCEDEC' },
  { id:'ambar',    nombre:'Ámbar',    muestra:'#FDF4E5' },
  { id:'morado',   nombre:'Morado',   muestra:'#F1ECFB' },
  { id:'rosa',     nombre:'Rosa',     muestra:'#FCECF3' },
  { id:'turquesa', nombre:'Turquesa', muestra:'#E6F6F6' },
  { id:'naranja',  nombre:'Naranja',  muestra:'#FDEFE6' },
  { id:'cafe',     nombre:'Café',     muestra:'#F4EFEA' },
  { id:'gris',     nombre:'Gris',     muestra:'#F1F3F8' }
];
const IDS_COLOR = COLORES.map(c => c.id);

/* ===================== PÓLIZAS DE MANTENIMIENTO =====================
   Otro producto de Forguard: mantenimiento preventivo a cafeterías
   industriales. Se cotiza listando equipos, y cuando el cliente acepta esa
   misma cotización se vuelve póliza activa — es el MISMO documento en otro
   momento, distinguido por su 'estatus', igual que un sitio usa 'estado'.
   ==================================================================== */

/* La póliza es anual y punto. No hay campo "meses" en el documento a propósito:
   la cláusula que se imprime dice "un periodo anual de doce (12) meses" y el
   calendario del documento tiene 12 columnas clavadas. Un plazo configurable
   sería un dato que solo puede valer 12 y que alguien podría desincronizar del
   papel. Si algún día se vende una a 24 meses, es función nueva y toca también
   la plantilla — que lo exija es honesto. */
const MESES_POLIZA = 12;

/* Datos de Forguard que salen impresos en el documento de la póliza. Van aquí y
   no en cada cotización porque no cambian por cliente: los cuatro PDF reales
   traen exactamente los mismos. Si algún día se mudan las oficinas, se cambia en
   un lugar y se corrige en todo lo que se imprima de ahí en adelante — no en 79
   renglones de JSON. El teléfono y el correo DEL VENDEDOR sí van copiados en
   cada póliza, porque esos sí cambian de persona a persona. */
const TEL_OFICINA = '+(52) 81 8458 8845';
const OFICINAS = ['Lázaro Garza Ayala, 1213', 'SPGG, Nuevo León'];

/* Tope de renglones por cotización. La más grande de verdad es MXGT01 con 79 sin
   consolidar y ~40 consolidada, así que 150 sobra de largo. El número no es
   estético: la tabla se redibuja completa al agregar o quitar, y a partir de
   cierto punto eso se siente en el dedo. Medido antes de fijarlo. */
const MAX_RENGLONES = 150;

/* Cinco estatus guardados. Lo demás se DERIVA en calcularPoliza(): "Terminada"
   y "Por vencer" salen de comparar fechas, igual que los sitios no guardan
   "Contrato cubierto". Guardar un estatus que se puede calcular es un dato más
   que se desincroniza. */
const ESTATUS_POLIZA = ['cotizacion', 'enviada', 'activa', 'perdida', 'cancelada'];
/* Los que se OFRECEN al capturar. Es una lista aparte de ESTATUS_POLIZA a
   propósito: esa otra la usa normalizarPoliza para VALIDAR lo que llega, así que
   quitar 'perdida' de ahí convertiría en 'cotizacion' —callada— cualquier póliza
   vieja que lo tuviera. Se deja de ofrecer sin dejar de reconocerse: si una
   póliza ya trae 'perdida', su opción se agrega al vuelo para no cambiársela por
   el solo hecho de abrir el modal. Se quitó porque 'Cancelada' ya cubre el caso
   y dos etiquetas para "no se vendió" solo confunden al capturar. */
const ESTATUS_OFRECIDOS = ['cotizacion', 'enviada', 'activa', 'cancelada'];
const ETIQUETA_ESTATUS = {
  cotizacion:'Borrador', enviada:'En espera de confirmar', activa:'Activa',
  perdida:'No se cerró', cancelada:'Cancelada'
};

/* Los dos estatus en los que todavía se puede corregir TODO. Es la misma lista
   que la cláusula 2 de `config/firestore.rules`: si una cambia, la otra también.
   Fuera de estos dos el servidor congela `partidas`, la vigencia, la facturación
   y el descuento. */
const ESTATUS_ABIERTOS = ['cotizacion', 'enviada'];

/* Congelada PARA QUIEN PREGUNTA. Owner y Admin pasan por la primera cláusula de
   la regla, así que para ellos nunca lo está; para los demás el servidor va a
   negar la escritura. Se pregunta por el usuario y no solo por la póliza a
   propósito: enseñarle a un Analyst una casilla que el servidor le va a negar es
   exactamente cómo se pierde una captura —el cambio se guarda local, se ve en
   pantalla, sale un aviso culpando a su permiso, y al recargar ya no está—. Es el
   mismo criterio que el descuento seguía desde el principio. */
function polizaCongelada(p){
  return !!p && !ESTATUS_ABIERTOS.includes(p.estatus) && !esAdmin();
}

/* Catálogo de equipos, con los textos tal cual salen en las cotizaciones.

   Es CONSTANTE y no colección de Firestore por dos razones: las reglas se pegan
   a mano y cada colección nueva es un pegado más que alguien puede olvidar, y
   estas descripciones son texto fijo que no cambia de un cliente a otro.

   Es una SEMILLA, no una consulta: al capturar un renglón se copian el precio y
   la frecuencia al documento, y de ahí en adelante mandan los del documento.
   Por eso subir un precio aquí NO mueve ni un peso de una póliza ya cerrada.
   La descripción es la excepción y va al revés a propósito — ver descripcionDe(). */
/* ---------------------------- Catálogo de equipos ----------------------------
   SEMILLA, no fuente de verdad. Los precios los administra el equipo desde
   Pólizas → Lista de precios, y viven en Firestore (catalogo/lista). Esta lista
   solo se sube la PRIMERA vez, cuando el servidor todavía no tiene ninguna.

   Salió de las cuatro cotizaciones reales (MXGT01, MXNL02, INOAC, NGK): 48
   equipos distintos de los 106 renglones que traían entre todas. La MARCA no va
   aquí a propósito —cambia de sitio en sitio y la pone el vendedor— y 22 equipos
   quedaron sin descripción porque MXGT01 y MXNL02 no traen esa página y no se
   inventa el texto de un mantenimiento.

   Los precios son los de MXGT01, la cotización más reciente (29-jul-2026), y son
   una SUGERENCIA: el mismo equipo se cotizó a distinto precio en distintos
   clientes (campana de extracción a 16,000 y a 8,000), así que el renglón de la
   cotización siempre manda sobre esto. Cortinas de aire y mini split entran en
   cero porque aparecen en las descripciones pero en ningún renglón con precio.
   --------------------------------------------------------------------------- */

/* Hoja de costos 2025/2026 que Victor compartió (63 equipos: insumos, mano
   de obra y descripción del trabajo). Va EMBEBIDA aquí, no como un archivo
   que hay que ir a buscar: el botón "Importar costos" de Lista de precios
   la aplica directo, de un clic. Emparejar por nombre es cosa de
   importarCostosCatalogo(); un costo en cero, o una descripción vacía,
   significa "esta hoja no trae ese dato" — no pisa lo que ya exista. */
const COSTOS_CATALOGO_2026 = [
  { concepto:'Amasadora Industrial', costoInsumos:151.2, costoManoObra:302.4, descripcion:'Engrasado de partes mecánicas, revisión del estado físico eléctrico, entrada de voltaje, revisión de transmisión y estado de bandas.' },
  { concepto:'Anaqueles', costoInsumos:0, costoManoObra:0, descripcion:'' },
  { concepto:'Banda Transportadora de Charola', costoInsumos:270, costoManoObra:540, descripcion:'' },
  { concepto:'Barra Caliente de Servicio Eléctrica', costoInsumos:486, costoManoObra:972, descripcion:'Revisión de tubería, válvulas, estado de tanques de carga y descarga de agua y limpieza de quemadores y del equipo en general con ice machine.' },
