    +   '<div class="cliente-nuevo-botones">'
    +     '<button type="button" class="btn btn-suave btn-mini" id="rnsCancelar">Cancelar</button>'
    +     '<button type="button" class="btn btn-primario btn-mini" id="rnsCrear">Crear y seleccionar</button>'
    +   '</div>'
    + '</div>'
    + '<div class="campo"><label>Equipo</label><select id="rEquipoId">'
    +   '<option value="">— Elegir de la lista —</option>'
    +   opc(cat, equipoEsDelCatalogo ? rp.equipoCatalogoId : '', e=>e.concepto, e=>e.id)
    +   '<option value="__otro__"' + (rp && !equipoEsDelCatalogo && rp.equipoNombre ? ' selected' : '') + '>Otro / no está en la lista</option>'
    + '</select></div>'
    + '<div class="campo" id="zonaEquipoTextoR" hidden><label>Nombre del equipo</label>'
    +   '<input type="text" id="rEquipoTexto" placeholder="Ej. Refrigerador de postres" '
    +     'value="' + esc(rp && !equipoEsDelCatalogo ? rp.equipoNombre : '') + '"></div>'
    + '<div class="campo"><label>Título del reporte *</label>'
    +   '<input type="text" id="rTitulo" placeholder="Ej. Refrigerador no enfría" value="' + esc(rp ? rp.titulo : '') + '"></div>'
    + '<div class="campo"><label>Descripción</label>'
    +   '<textarea id="rDescripcion" placeholder="Qué pasa, desde cuándo, cualquier detalle que ayude al técnico…">' + esc(rp ? rp.descripcion : '') + '</textarea></div>'
    + '<div class="campo"><label>Prioridad</label><select id="rPrioridad">'
    +   PRIORIDAD_REPORTE.map(p => '<option value="' + p + '"' + ((rp ? rp.prioridad : 'media') === p ? ' selected' : '') + '>' + esc(ETIQUETA_PRIORIDAD[p]) + '</option>').join('')
    + '</select></div>'
    + '<div class="campo"><label>Fotos de evidencia</label>'
    +   '<div class="galeria-evidencia" id="galeriaEvidenciaTmp"></div>'
    +   '<button type="button" class="btn btn-suave btn-mini" id="btnAgregarFotoR">' + ICONO.camara + 'Tomar o elegir foto</button>'
    +   '<input type="file" id="archivoEvidenciaR" accept="image/*" capture="environment" multiple style="display:none">'
    +   '<div class="pista" id="pistaEvidenciaR">Hasta ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos. Se reducen solas para no pesar.</div>'
    + '</div>';

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (rp ? 'Guardar cambios' : 'Levantar reporte') + '</button>';

  abrirModal(rp ? 'Editar reporte' : 'Nuevo reporte', cuerpo, pie);

  function pintarSitios(){
    const clienteId = $('rCliente').value;
    const sitios = sitiosDe(clienteId).slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
    $('rSitio').innerHTML = opc(sitios, rp ? rp.sitioId : '', s=>s.nombre, s=>s.id);
    $('pistaSitioR').textContent = sitios.length
      ? ''
      : 'Este cliente no tiene sitios todavía — dale a "Nuevo" para agregar uno sin salir de aquí.';
  }
  pintarSitios();
  $('rCliente').addEventListener('change', ()=>{ $('zonaSitioNuevoR').hidden = true; pintarSitios(); });

  /* Mismo criterio que el cliente: dar de alta el sitio sin salir del modal.
     Antes solo se podía crear el cliente y el sitio había que ir a hacerlo a
     Forpass — un `reportero` ni siquiera VE el módulo Forpass (ver
     modulosPermitidos()), así que un cliente sin sitios lo dejaba
     completamente atorado, sin poder levantar el reporte. */
  $('btnSitioNuevoR').addEventListener('click', ()=>{
    if(!$('rCliente').value){ aviso('Primero elige o crea el cliente.', true); return; }
    $('zonaSitioNuevoR').hidden = false;
    $('rnsNombre').focus();
  });
  $('rnsCancelar').addEventListener('click', ()=>{ $('zonaSitioNuevoR').hidden = true; $('rnsNombre').value = ''; });
  $('rnsCrear').addEventListener('click', ()=>{
    const clienteId = $('rCliente').value;
    const nombreSitio = $('rnsNombre').value.trim();
    if(!clienteId){ aviso('Primero elige o crea el cliente.', true); return; }
    if(!nombreSitio){ aviso('Ponle un nombre al sitio nuevo.', true); return; }
    const yaExiste = datos.sitios.find(s => s.clienteId === clienteId && s.nombre.toLowerCase() === nombreSitio.toLowerCase());
    let sitio;
    if(yaExiste){
      sitio = yaExiste;
      aviso('Ese sitio ya existía para este cliente; lo seleccioné.');
    }else{
      sitio = normalizarSitio({ id:nuevoId(), clienteId, nombre:nombreSitio,
        modulos:0, mensualidad:0, fechaInicio:hoyISO(), meses:12 });
      datos.sitios.push(sitio);
      guardarSitio(sitio, 'creó');
      aviso(nombreSitio + ' dado de alta y seleccionado.');
    }
    pintarSitios();
    $('rSitio').value = sitio.id;
    $('zonaSitioNuevoR').hidden = true;
    $('rnsNombre').value = '';
  });

  $('btnClienteNuevoR').addEventListener('click', ()=>{
    $('zonaClienteNuevoR').hidden = false;
    $('rncNombre').focus();
  });
  $('rncCancelar').addEventListener('click', ()=>{ $('zonaClienteNuevoR').hidden = true; $('rncNombre').value = ''; });
  $('rncCrear').addEventListener('click', ()=>{
    const nombre = $('rncNombre').value.trim();
    if(!nombre){ aviso('Ponle un nombre al cliente nuevo.', true); return; }
    const nuevo = normalizarCliente({ id:nuevoId(), nombre, usaForpass:'si' });
    datos.clientes.push(nuevo);
    guardarCliente(nuevo, 'creó');
    $('rCliente').insertAdjacentHTML('beforeend', '<option value="' + esc(nuevo.id) + '" selected>' + esc(nuevo.nombre) + '</option>');
    $('rCliente').value = nuevo.id;
    $('zonaClienteNuevoR').hidden = true;
    pintarSitios();
    aviso('Cliente agregado. Ahora agrégale un sitio en Forpass si hace falta.');
  });

  function pintarEquipoTexto(){
    $('zonaEquipoTextoR').hidden = $('rEquipoId').value !== '__otro__';
  }
  pintarEquipoTexto();
  $('rEquipoId').addEventListener('change', pintarEquipoTexto);

  function pintarGaleriaTmp(){
    $('galeriaEvidenciaTmp').innerHTML = evidenciasTmp.map(e =>
      '<div class="evidencia-foto"><img src="' + esc(e.dataUrl) + '" alt="Evidencia">'
      + '<button type="button" class="evidencia-quitar" data-quitar-tmp="' + esc(e.id) + '" title="Quitar">' + ICONO.basura + '</button></div>'
    ).join('');
    $('galeriaEvidenciaTmp').querySelectorAll('[data-quitar-tmp]').forEach(b=>{
      b.addEventListener('click', ()=>{
        evidenciasTmp = evidenciasTmp.filter(e => e.id !== b.dataset.quitarTmp);
        pintarGaleriaTmp();
      });
    });
    $('btnAgregarFotoR').disabled = evidenciasTmp.length >= EVIDENCIA_MAX_POR_REPORTE;
  }
  pintarGaleriaTmp();

  $('btnAgregarFotoR').addEventListener('click', ()=> $('archivoEvidenciaR').click());
  $('archivoEvidenciaR').addEventListener('change', async ev=>{
    const archivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if(!archivos.length) return;
    const cupo = EVIDENCIA_MAX_POR_REPORTE - evidenciasTmp.length;
    if(cupo <= 0){ aviso('Ya tienes ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos. Quita alguna para agregar otra.', true); return; }
    $('pistaEvidenciaR').textContent = 'Procesando fotos…';
    for(const archivo of archivos.slice(0, cupo)){
      try{
        const img = await leerEvidencia(archivo);
        const dataUrl = comprimirEvidencia(img);
        evidenciasTmp.push(normalizarEvidencia({ dataUrl, subioNombre: nombreDe(sesion) || '' }));
      }catch(e){ aviso(e.message, true); }
    }
    $('pistaEvidenciaR').textContent = 'Hasta ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos. Se reducen solas para no pesar.';
    pintarGaleriaTmp();
  });

  cerrarModalActual = ()=>{
    const clienteId = $('rCliente').value;
    const sitioId = $('rSitio').value;
    const titulo = $('rTitulo').value.trim();
    if(!sitioId){ aviso('Elige un sitio: el reporte necesita saber dónde fue.', true); return; }
    if(!titulo){ $('rTitulo').setAttribute('aria-invalid','true'); $('rTitulo').focus(); aviso('El reporte necesita un título.', true); return; }

    const equipoId = $('rEquipoId').value;
    let equipoCatalogoId = '', equipoNombre = '';
    if(equipoId === '__otro__'){
      equipoNombre = $('rEquipoTexto').value.trim();
    }else if(equipoId){
      const eq = catalogo().find(e => e.id === equipoId);
      equipoCatalogoId = equipoId;
      equipoNombre = eq ? eq.concepto : '';
    }

    const sitio = sitioPorId(sitioId);
    let reg, cambios;
    if(rp){
      /* Antes de pisar los datos viejos, se anota qué cambió: es lo que le
         da sentido al seguimiento del reporte — no solo "se editó", sino
         qué se editó. */
      const descripcionNueva = $('rDescripcion').value.trim();
      const prioridadNueva = $('rPrioridad').value;
      cambios = [];
      if(rp.titulo !== titulo) cambios.push('título: "' + rp.titulo + '" → "' + titulo + '"');
      if(rp.sitioId !== sitioId) cambios.push('sitio: ' + (rp.sitioNombre || 'sin sitio') + ' → ' + (sitio ? sitio.nombre : 'sin sitio'));
      if(rp.equipoNombre !== equipoNombre) cambios.push('equipo: ' + (rp.equipoNombre || '—') + ' → ' + (equipoNombre || '—'));
      if(rp.prioridad !== prioridadNueva) cambios.push('prioridad: ' + ETIQUETA_PRIORIDAD[rp.prioridad] + ' → ' + ETIQUETA_PRIORIDAD[prioridadNueva]);
      if(rp.descripcion !== descripcionNueva) cambios.push('descripción actualizada');
      if(rp.evidencias.length !== evidenciasTmp.length) cambios.push('fotos: ' + rp.evidencias.length + ' → ' + evidenciasTmp.length);

      Object.assign(rp, {
        clienteId, sitioId, sitioNombre: sitio ? sitio.nombre : rp.sitioNombre,
        equipoCatalogoId, equipoNombre,
        titulo, descripcion: descripcionNueva,
        prioridad: prioridadNueva,
        evidencias: evidenciasTmp
      });
      reg = rp;
    }else{
      reg = normalizarReporte({
        id:nuevoId(), folio: generarFolioReporte(hoyISO()),
        clienteId, sitioId, sitioNombre: sitio ? sitio.nombre : '',
        equipoCatalogoId, equipoNombre, titulo,
        descripcion: $('rDescripcion').value.trim(), prioridad: $('rPrioridad').value,
        estatus:'abierto', fechaCreacion: hoyISO(),
        reportadoPor: { uid: sesion.uid || '', nombre: nombreDe(sesion) || 'Alguien del equipo' },
        evidencias: evidenciasTmp,
        seguimiento: [{ quien: nombreDe(sesion) || 'Alguien del equipo', texto:'Levantó el reporte.' }]
      });
      datos.reportes.push(reg);
    }
    if(rp){
      if(cambios.length) anotarReporte(rp, 'Editó el reporte (' + cambios.join('; ') + ').', 'editó', reg.folio);
      else guardarReporte(reg, 'editó');
    }else{
      guardarReporte(reg, 'creó');
    }
    cerrarModal();
    entrarReporte(reg.id);
    aviso(rp ? 'Reporte actualizado.' : 'Reporte levantado: ' + reg.folio + '.');
  };
}

/* ------------------------- Modal: técnicos del reporte ------------------------- */
async function modalTecnicosReporte(id){
  const rp = reportePorId(id);
  if(!rp) return;
  if(!exigirGestionReporte()) return;

  abrirModal('Técnicos de ' + (rp.folio || 'este reporte'),
    '<div class="vacio-chico">Cargando el equipo…</div>',
    '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>');

  let cuentas = null;
  if(HAY_NUBE){
    try{
      if(!admin.usuarios) admin.usuarios = await listarNube('usuarios');
      cuentas = admin.usuarios.filter(u => u.activo !== false);
    }catch(e){ cuentas = null; }
  }

  let cuerpo = '<p class="pista" style="margin:0 0 14px">Quiénes van a atender este reporte en persona. Se pueden marcar varios.</p>';
  if(cuentas && cuentas.length){
    cuerpo += '<div class="lista-tecnicos">' + cuentas
      .slice().sort((a,b)=> nombreDe(a).localeCompare(nombreDe(b),'es'))
      .map(u => '<label class="casilla"><input type="checkbox" data-tecnico-uid="' + esc(u.id) + '" data-tecnico-nombre="' + esc(nombreDe(u)) + '"'
        + (rp.tecnicos.some(t=>t.uid === u.id) ? ' checked' : '') + '> ' + esc(nombreDe(u))
        + ' <span class="pista">— ' + esc(ROLES[normalizarRol(u.rol)].nombre) + '</span></label>').join('')
      + '</div>';
  }else{
    cuerpo += '<div class="campo"><label>Nombres (separados por coma)</label>'
            + '<input type="text" id="tecNombres" placeholder="Ej. Juan Pérez, Ana Torres" '
            + 'value="' + esc(rp.tecnicos.map(t=>t.nombre).join(', ')) + '"></div>';
  }

  $('modalCuerpo').innerHTML = cuerpo;
  $('modalPie').innerHTML =
      '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
    + '<button type="button" class="btn btn-primario" data-modal="guardar">Guardar</button>';

  cerrarModalActual = ()=>{
    let nuevos = [];
    if(cuentas && cuentas.length){
      $('modalCuerpo').querySelectorAll('[data-tecnico-uid]:checked').forEach(chk=>{
        nuevos.push({ uid:chk.dataset.tecnicoUid, nombre:chk.dataset.tecnicoNombre });
      });
    }else if($('tecNombres')){
      nuevos = $('tecNombres').value.split(',').map(n => n.trim()).filter(Boolean).map(n => ({ uid:'', nombre:n }));
    }
    const antes = rp.tecnicos.map(t=>t.nombre).join(', ') || 'nadie';
    rp.tecnicos = nuevos.map(normalizarTecnicoAsignado);
    if(rp.tecnicos.length && rp.estatus === 'abierto') rp.estatus = 'asignado';
    const despues = rp.tecnicos.map(t=>t.nombre).join(', ') || 'nadie';
    anotarReporte(rp, 'Cambió los técnicos asignados: ' + antes + ' → ' + despues + '.',
                  'asignó técnicos a', rp.folio + ': ' + despues);
    cerrarModal(); render();
    aviso(rp.tecnicos.length ? 'Técnico(s) asignado(s): ' + despues + '.' : 'Reporte sin técnicos asignados.');
  };
}

/* ------------------- Modal: resolver el reporte ------------------- */
/* El candado que pediste: para marcar un reporte como resuelto, el técnico
   TIENE que escribir qué encontró y qué hizo (reporte de atención) Y dejar
   al menos una foto de evidencia — las que ya tenía cuentan, pero si no hay
   ninguna tiene que tomarla aquí mismo. Sin las dos cosas el botón "Guardar"
   ni siquiera pasa la validación: el siguiente paso (resuelto) simplemente
   no se habilita. No hay atajo para saltárselo desde la interfaz. */
function modalResolverReporte(id){
  const rp = reportePorId(id);
  if(!rp) return;
  if(!exigirGestionReporte()) return;

  let evidenciasTmp = rp.evidencias.slice();

  const cuerpo =
      '<div class="aviso">' + ICONO.info + '<div>Para marcar este reporte como resuelto hace falta el reporte de '
    + 'atención y al menos una foto de evidencia. Sin eso no se puede avanzar al siguiente paso.</div></div>'
    + '<div class="campo"><label>Reporte de atención *</label>'
    +   '<textarea id="raTexto" placeholder="Qué encontraste y qué hiciste para resolverlo…">' + esc(rp.reporteAtencion) + '</textarea></div>'
    + '<div class="campo"><label>Evidencia *</label>'
    +   '<div class="galeria-evidencia" id="galeriaEvidenciaRA"></div>'
    +   '<button type="button" class="btn btn-suave btn-mini" id="btnAgregarFotoRA">' + ICONO.camara + 'Tomar o elegir foto</button>'
    +   '<input type="file" id="archivoEvidenciaRA" accept="image/*" capture="environment" multiple style="display:none">'
    +   '<div class="pista" id="pistaEvidenciaRA">Hasta ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos en total.</div>'
    + '</div>';

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">Marcar resuelto</button>';

  abrirModal('Resolver ' + (rp.folio || 'reporte'), cuerpo, pie);

  function pintarGaleria(){
    $('galeriaEvidenciaRA').innerHTML = evidenciasTmp.map(e =>
      '<div class="evidencia-foto"><img src="' + esc(e.dataUrl) + '" alt="Evidencia">'
      + '<button type="button" class="evidencia-quitar" data-quitar-tmp="' + esc(e.id) + '" title="Quitar">' + ICONO.basura + '</button></div>'
    ).join('');
    $('galeriaEvidenciaRA').querySelectorAll('[data-quitar-tmp]').forEach(b=>{
      b.addEventListener('click', ()=>{
        evidenciasTmp = evidenciasTmp.filter(e => e.id !== b.dataset.quitarTmp);
        pintarGaleria();
      });
    });
    $('btnAgregarFotoRA').disabled = evidenciasTmp.length >= EVIDENCIA_MAX_POR_REPORTE;
  }
  pintarGaleria();

  $('btnAgregarFotoRA').addEventListener('click', ()=> $('archivoEvidenciaRA').click());
  $('archivoEvidenciaRA').addEventListener('change', async ev=>{
    const archivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if(!archivos.length) return;
    const cupo = EVIDENCIA_MAX_POR_REPORTE - evidenciasTmp.length;
    if(cupo <= 0){ aviso('Ya tienes ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos. Quita alguna para agregar otra.', true); return; }
    $('pistaEvidenciaRA').textContent = 'Procesando fotos…';
    for(const archivo of archivos.slice(0, cupo)){
      try{
        const img = await leerEvidencia(archivo);
        const dataUrl = comprimirEvidencia(img);
        evidenciasTmp.push(normalizarEvidencia({ dataUrl, subioNombre: nombreDe(sesion) || '' }));
      }catch(e){ aviso(e.message, true); }
    }
    $('pistaEvidenciaRA').textContent = 'Hasta ' + EVIDENCIA_MAX_POR_REPORTE + ' fotos en total.';
    pintarGaleria();
  });

  cerrarModalActual = ()=>{
    const texto = $('raTexto').value.trim();
    if(!texto){
      $('raTexto').setAttribute('aria-invalid','true'); $('raTexto').focus();
      aviso('Escribe el reporte de atención: qué encontraste y qué hiciste.', true);
      return;
    }
    if(!evidenciasTmp.length){
      aviso('Agrega al menos una foto de evidencia antes de marcarlo resuelto.', true);
      return;
    }
    rp.reporteAtencion = texto;
    rp.evidencias = evidenciasTmp;
    rp.estatus = 'resuelto';
    rp.fechaCierre = '';
    anotarReporte(rp, 'Marcó el reporte como resuelto, con reporte de atención y ' + evidenciasTmp.length + ' ' + plural(evidenciasTmp.length,'foto','fotos') + '.',
                  'resolvió', rp.folio);
    cerrarModal(); render();
    aviso('Reporte marcado como resuelto.');
  };
}

/* ------------------------------- Levantamientos ------------------------------- */
function botonRegresarLevantamientos(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-levantamientos">'
       + ICONO.atras + 'Regresar a levantamientos</button></div>';
}

function resumirLevantamientos(lista){
  const r = { total:lista.length, abiertos:0, hallazgosPend:0, urgentes:0 };
  lista.forEach(l=>{
    if(!levantamientoCerrado(l)) r.abiertos++;
    r.hallazgosPend += hallazgosPendientes(l);
    if(l.hallazgos.some(h => h.estatus === 'pendiente' && h.prioridad === 'urgente')) r.urgentes++;
  });
  return r;
}

function vistaLevantamientos(){
  const r = resumirLevantamientos(datos.levantamientos);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Levantamientos</h2>'
     +   '<p>' + numero(r.total) + ' ' + plural(r.total,'levantamiento','levantamientos') + '</p>'
     + '</div><div class="acciones">'
     +   (puedeGestionarLevantamiento()
          ? '<button type="button" class="btn btn-primario" data-accion="nuevo-levantamiento">' + ICONO.mas + 'Nuevo levantamiento</button>'
          : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Abiertos', numero(r.abiertos), 'Con hallazgos pendientes', r.abiertos ? 'k-alerta' : '')
     + tarjetaKpi('Hallazgos pendientes', numero(r.hallazgosPend), 'En todos los levantamientos', r.hallazgosPend ? 'k-alerta' : '')
     + tarjetaKpi('Con urgentes', numero(r.urgentes), 'Al menos un hallazgo urgente sin resolver', r.urgentes ? 'k-error' : '')
     + '</div>';

  if(!datos.levantamientos.length){
    h += vistaVacia('reporte', 'Todavía no hay levantamientos',
          'Un levantamiento documenta una visita completa a un sitio: varios hallazgos, cada uno correctivo o preventivo, para armar el plan de mantenimiento.',
          puedeGestionarLevantamiento() ? 'nuevo-levantamiento' : '', 'Nuevo levantamiento');
    return h;
  }

  const vistaTabla = estado.vistaLevantamientos === 'tabla';
  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaLevantamiento" placeholder="Buscar por folio, sitio o cliente…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroLevantamiento">'
     +     '<option value="todos">Todos</option>'
     +     '<option value="abiertos">Con pendientes</option>'
     +     '<option value="cerrados">Cerrados</option>'
     +     '<option value="urgentes">Con urgentes</option>'
     +   '</select>'
     +   controlAlternaVista('vistaLevantamientos')
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.levantamientos.filter(l=>{
    if(q){
      if(!(l.folio||'').toLowerCase().includes(q) && !(l.sitioNombre||'').toLowerCase().includes(q)){
        const cli = clientePorId(l.clienteId);
        if(!(cli && cli.nombre.toLowerCase().includes(q))) return false;
      }
    }
    if(estado.filtro === 'urgentes') return l.hallazgos.some(h => h.estatus === 'pendiente' && h.prioridad === 'urgente');
    if(estado.filtro === 'cerrados') return levantamientoCerrado(l);
    if(estado.filtro === 'abiertos') return !levantamientoCerrado(l);
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún levantamiento coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  const ordenados = lista.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.folio.localeCompare(a.folio));

  if(vistaTabla) return h + tablaLevantamientos(ordenados);

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenados.map((l,i)=>{
    const cli = clientePorId(l.clienteId);
    const tono = tonoLevantamiento(l);
    const pend = hallazgosPendientes(l);
    let chips = levantamientoCerrado(l)
      ? '<span class="insignia i-ok"><span class="punto p-ok"></span>Cerrado</span>'
      : '<span class="insignia i-' + tono + '"><span class="punto p-' + tono + '"></span>' + numero(pend) + ' ' + plural(pend,'pendiente','pendientes') + '</span>';
    if(l.hallazgos.some(h => h.estatus === 'pendiente' && h.prioridad === 'urgente')) chips += '<span class="insignia i-error">Urgente</span>';

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-levantamiento="' + esc(l.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     (cli ? avatarCliente(cli) : '<div class="t-avatar">' + esc(iniciales(l.sitioNombre || l.folio)) + '</div>')
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(l.sitioNombre || 'Sin sitio') + '</div>'
         +       '<div class="t-sub">' + esc(cli ? cli.nombre : 'Sin cliente') + (l.folio ? ' · ' + esc(l.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Hallazgos</div><div class="d-valor">' + numero(l.hallazgos.length) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Realizó</div><div class="d-valor chico">' + esc(l.realizoNombre || '—') + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie"><span class="pista">' + fmtFecha(l.fecha) + '</span></div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

function tablaLevantamientos(lista){
  return '<div class="rodillo"><table class="tabla" style="min-width:780px"><thead><tr>'
       +   '<th>Folio</th><th>Sitio</th><th>Cliente</th><th>Hallazgos</th><th>Pendientes</th><th>Realizó</th><th>Fecha</th>'
       + '</tr></thead><tbody>'
       + lista.map(l=>{
           const cli = clientePorId(l.clienteId);
           const tono = tonoLevantamiento(l);
           const pend = hallazgosPendientes(l);
           return '<tr class="fila-clic" data-levantamiento="' + esc(l.id) + '" tabindex="0" role="button">'
                +   '<td>' + esc(l.folio || '—') + '</td>'
                +   '<td>' + esc(l.sitioNombre || 'Sin sitio') + '</td>'
                +   '<td>' + esc(cli ? cli.nombre : '—') + '</td>'
                +   '<td>' + numero(l.hallazgos.length) + '</td>'
                +   '<td><span class="insignia i-' + (pend ? tono : 'ok') + '">' + numero(pend) + '</span></td>'
                +   '<td>' + esc(l.realizoNombre || '—') + '</td>'
                +   '<td>' + fmtFecha(l.fecha) + '</td>'
                + '</tr>';
         }).join('')
       + '</tbody></table></div>';
}

/* Detalle de un levantamiento: datos generales + la lista de hallazgos, cada
   uno con sus propias acciones (editar, marcar resuelto, quitar). A
   diferencia de las partidas de una póliza, un hallazgo trae fotos y texto
   largo, así que se pinta como tarjeta, no como renglón de tabla. */
/* "Análisis de funcionamiento": el % ponderado de calcularFuncionamientoLevantamiento(),
   con el detalle equipo por equipo que lo arma. Solo aparece si hay al menos
   un hallazgo ligado a un equipo — si el levantamiento nada más trae temas
   de infraestructura (sin equipo), no hay base para un porcentaje y se avisa
   en vez de fingir un número. */
function bloqueFuncionamiento(l){
  const an = calcularFuncionamientoLevantamiento(l);
  const sinEquipo = l.hallazgos.filter(h => !h.equipoCatalogoId && !h.equipoNombre).length;
  let h = '<div class="bloque"><div class="bloque-cabeza"><div><h3>Análisis de funcionamiento</h3>'
    +   '<p>No es un promedio simple de los hallazgos: el 100% se reparte entre los equipos según qué tan crítico es '
    +   'cada uno para operar la cocina, y cada uno aporta menos de su parte si tiene un hallazgo grave.</p></div></div>';

  if(!an){
    h += '<p class="pista" style="margin:0">Todavía no hay hallazgos ligados a un equipo del catálogo — agrega uno con '
      + '"Equipo" para que aquí salga el %.</p></div>';
    return h;
  }

  const tono = an.pct >= 80 ? 'ok' : an.pct >= 50 ? 'alerta' : 'error';
  h += '<div class="resumen" style="margin-bottom:14px">'
    +   '<div class="r-fila r-total"><span>Funcionamiento estimado</span>'
    +     '<span style="color:var(--' + tono + '); font-size:22px; font-weight:800">' + an.pct + '%</span></div>'
    + '</div>'
    /* Ojo: aquí NUNCA se pinta un % por equipo — fue justo lo que confundía
       ("todos dicen 50%, ¿entonces la cocina está al 50%?"). Cada equipo
       tiene un presupuesto de puntos (según qué tan crítico es) y aporta
       menos de ese presupuesto si tiene un hallazgo grave; sumando lo que
       CADA UNO aporta ahora mismo se llega exacto al % de arriba, así que
       "tiene X de Y puntos, le faltan Z para su máximo" se entiende solo. */
    + '<div class="rodillo"><table class="tabla"><thead><tr><th>Equipo</th>'
    +   '<th>Qué tan crítico es</th>'
    +   '<th>Qué se encontró</th>'
    +   '<th>Puntos que aporta al % de arriba</th>'
    + '</tr></thead><tbody>'
    + an.equipos.map(eq=>{
        return '<tr><td><b>' + esc(eq.nombre) + '</b></td>'
          + '<td>' + esc(ETIQUETA_PONDERACION[eq.peso]) + '</td>'
          + '<td><span class="insignia i-' + esc(eq.severidadTono) + '">' + esc(eq.severidadTexto) + '</span></td>'
          + '<td><b>' + eq.puntosActuales + ' de ' + eq.puntosPosibles + '</b> puntos'
          +   (eq.puntosFaltan > 0
                ? '<br><span style="color:var(--ok)">+' + eq.puntosFaltan + ' si se resuelve</span>'
                : '<br><span class="pista" style="margin:0">Ya aporta su máximo</span>') + '</td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';

  if(sinEquipo > 0){
    h += '<div class="pista" style="margin-top:10px">' + sinEquipo + ' ' + plural(sinEquipo,'hallazgo','hallazgos')
      + ' sin equipo ligado (infraestructura) no ' + plural(sinEquipo,'entra','entran') + ' en este %, aunque sí se pueden cotizar.</div>';
  }
  h += '</div>';
  return h;
}

function vistaLevantamiento(){
  const l = levantamientoPorId(estado.levantamientoId);
  if(!l){ estado.vista = 'levantamientos'; return vistaLevantamientos(); }
  const cli = clientePorId(l.clienteId);
  const puede = puedeGestionarLevantamiento();
  const pend = hallazgosPendientes(l);

  let h = botonRegresarLevantamientos();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>' + esc(l.sitioNombre || 'Levantamiento') + '</h2>'
     +   '<p>' + esc(l.folio || 'Sin folio') + ' · ' + esc(cli ? cli.nombre : 'Sin cliente') + '</p>'
     + '</div></div>';

  h += '<div class="t-chips" style="margin:-6px 0 16px">'
     +   (levantamientoCerrado(l)
          ? '<span class="insignia i-ok"><span class="punto p-ok"></span>Cerrado</span>'
          : '<span class="insignia i-' + tonoLevantamiento(l) + '"><span class="punto p-' + tonoLevantamiento(l) + '"></span>' + numero(pend) + ' ' + plural(pend,'hallazgo pendiente','hallazgos pendientes') + '</span>')
     + '</div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Fecha de visita', fmtFecha(l.fecha), '')
     + tarjetaKpi('Realizó', esc(l.realizoNombre || 'Sin especificar'), '')
     + tarjetaKpi('Hallazgos', numero(l.hallazgos.length), pend ? numero(pend) + ' ' + plural(pend,'pendiente','pendientes') : 'Todos resueltos')
     + '</div>';

  if(l.notasGenerales){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Notas generales</h3></div></div>'
       +   '<p class="pista" style="white-space:pre-wrap; margin:0">' + esc(l.notasGenerales) + '</p>'
       + '</div>';
  }

  h += bloqueFuncionamiento(l);

  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Hallazgos</h3>'
     +   '<p>Correctivo: hay que atenderlo ya. Preventivo: conviene hacerlo antes de que truene.</p></div>'
     +   (puede ? '<div class="acciones"><button type="button" class="btn btn-suave btn-mini" data-accion="agregar-hallazgo">' + ICONO.mas + 'Agregar hallazgo</button></div>' : '')
     + '</div>';

  if(!l.hallazgos.length){
    h += '<p class="pista" style="margin:0">Todavía no se ha agregado ningún hallazgo.</p>';
  }else{
    h += '<div class="lista-hallazgos">' + l.hallazgos.map(hz=>{
      const resuelto = hz.estatus === 'resuelto';
      const tonoAccion = hz.accion === 'preventivo' ? 'info' : 'alerta';
      const cotLigada = hz.cotizacionId ? cotizacionPorId(hz.cotizacionId) : null;
      return '<div class="bloque hallazgo-item' + (resuelto ? ' resuelto' : '') + '" style="margin-bottom:12px">'
        +   '<div class="bloque-cabeza"><div>'
        +     '<h3 style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">'
        +       esc(hz.ubicacion || hz.equipoNombre || 'Hallazgo')
        +       '<span class="insignia i-' + tonoAccion + '">' + esc(ETIQUETA_ACCION_HALLAZGO[hz.accion]) + '</span>'
        +       (hz.prioridad === 'urgente' || hz.prioridad === 'alta'
                  ? '<span class="insignia i-' + TONO_PRIORIDAD[hz.prioridad] + '">' + esc(ETIQUETA_PRIORIDAD[hz.prioridad]) + '</span>' : '')
        +       '<span class="insignia i-' + (resuelto ? 'ok' : 'neutro') + '">' + esc(ETIQUETA_ESTATUS_HALLAZGO[hz.estatus]) + '</span>'
        +     '</h3>'
        +     (hz.equipoNombre && hz.ubicacion ? '<p>' + esc(hz.equipoNombre) + '</p>' : '')
        +   '</div></div>'
        +   '<p style="margin:0 0 8px">' + esc(hz.hallazgo) + '</p>'
        +   (hz.accionSugerida ? '<p class="pista" style="margin:0 0 8px"><b>Acción sugerida:</b> ' + esc(hz.accionSugerida) + '</p>' : '')
        +   (hz.estatus === 'resuelto' && hz.resueltoNota ? '<p class="pista" style="margin:0 0 8px; color:var(--ink)"><b>Resolución:</b> ' + esc(hz.resueltoNota) + '</p>' : '')
        +   (hz.evidencias.length
              ? '<div class="galeria-evidencia">' + hz.evidencias.map(e=>
                  '<div class="evidencia-foto"><img src="' + esc(e.dataUrl) + '" alt="Evidencia" loading="lazy"></div>').join('') + '</div>'
              : '')
        +   (hz.cotizar
              ? '<p class="pista" style="margin:8px 0 0">'
                + (cotLigada && modulosPermitidos().includes('cotizaciones')
                    ? '<button type="button" class="btn btn-suave btn-mini" data-cotizacion="' + esc(cotLigada.id) + '">'
                      + ICONO.credencial + 'Ver cotización ' + esc(cotLigada.folio || '') + ' →</button>'
                    : (cotLigada ? 'Se pidió cotizar: ' + esc(hz.cotizar) : 'Pendiente de generar la solicitud: ' + esc(hz.cotizar)))
                + '</p>'
              : '')
        +   (puede
              ? '<div class="acciones" style="margin-top:10px">'
                +   '<button type="button" class="btn btn-suave btn-mini" data-accion="editar-hallazgo" data-hallazgo="' + esc(hz.id) + '">' + ICONO.lapiz + 'Editar</button>'
                +   '<button type="button" class="btn btn-suave btn-mini" data-accion="alternar-hallazgo" data-hallazgo="' + esc(hz.id) + '">'
                +     (resuelto ? ICONO.atras + 'Reabrir' : ICONO.cheque + 'Marcar resuelto') + '</button>'
                +   '<span class="espacio"></span>'
                +   '<button type="button" class="btn btn-peligro btn-mini" data-accion="quitar-hallazgo" data-hallazgo="' + esc(hz.id) + '">' + ICONO.basura + 'Quitar</button>'
                + '</div>'
              : '')
        + '</div>';
    }).join('') + '</div>';
  }
  h += '</div>';

  /* Cotizaciones por generar: hallazgos con algo que cotizar y todavía sin
     cotizacionId. Antes cada uno generaba su propia solicitud al guardarse,
     lo que partía en varias cotizaciones cosas que eran un solo trabajo
     (mismo equipo, misma visita) — ahora se decide aquí, junta o separada. */
  const pendientesCotizar = l.hallazgos.filter(hz => hz.cotizar && !hz.cotizacionId);
  if(puede && pendientesCotizar.length){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Cotizaciones por generar</h3>'
       +   '<p>' + numero(pendientesCotizar.length) + ' ' + plural(pendientesCotizar.length,'hallazgo pide','hallazgos piden')
       +   ' cotizar algo y aún no tiene solicitud. Elige cuáles van juntos y si va todo en una cotización o cada uno en la suya.</p></div></div>';
    h += '<div class="lista-cot-pendiente">' + pendientesCotizar.map(hz =>
      '<label class="casilla" style="display:flex; gap:8px; align-items:flex-start; margin-bottom:8px">'
      +   '<input type="checkbox" class="chkCotPend" value="' + esc(hz.id) + '" checked>'
      +   '<span><b>' + esc(hz.ubicacion || hz.equipoNombre || 'Hallazgo') + '</b> — ' + esc(hz.cotizar) + '</span>'
      + '</label>'
    ).join('') + '</div>';
    h += '<div class="fila2" style="margin-top:6px">'
       +   '<label class="casilla"><input type="radio" name="modoCotPend" value="una" checked> Una sola cotización con los seleccionados</label>'
       +   '<label class="casilla"><input type="radio" name="modoCotPend" value="separadas"> Una cotización por cada seleccionado</label>'
       + '</div>';
    h += '<div class="acciones" style="margin-top:10px">'
       +   '<button type="button" class="btn btn-primario btn-mini" data-accion="generar-cotizaciones-pendientes">' + ICONO.mas + 'Generar</button>'
       + '</div></div>';
  }

  /* El botón de generar póliza solo tiene sentido cuando el sitio TODAVÍA no
     trae una en curso — si ya hay cotización/enviada/activa, ese es el lugar
     donde seguir capturando equipos, no un segundo formulario suelto. */
  const sitioSinPoliza = l.sitioId
    && !datos.polizas.some(p => p.sitioId === l.sitioId && ['cotizacion','enviada','activa'].includes(p.estatus));

  h += '<div class="acciones" style="flex-wrap:wrap; margin-top:8px">';
  h += '<button type="button" class="btn btn-suave btn-mini" data-accion="imprimir-levantamiento" '
    + 'title="Abre el PDF en otra pestaña, listo para guardarse o compartirse">' + ICONO.imprimir + 'Generar PDF</button>';
  if(puede) h += '<button type="button" class="btn btn-suave btn-mini" data-accion="editar-levantamiento">' + ICONO.lapiz + 'Editar datos</button>';
  /* puedeEditar(), no la abierta puedeGestionarLevantamiento(): armar una
     póliza sí es "editar precios", y un técnico/viewer/reportero con acceso
     de lectura a Pólizas (ver modulosPermitidos()) no debe ver un botón que
     modalPoliza() de todos modos le va a rechazar. */
  if(puedeEditar() && sitioSinPoliza && modulosPermitidos().includes('polizas')){
    h += '<button type="button" class="btn btn-suave btn-mini" data-accion="generar-poliza-levantamiento" '
      + 'title="Arma una póliza nueva con los equipos revisados, para completar precios y frecuencia">'
      + ICONO.mas + 'Generar póliza desde este levantamiento</button>';
  }
  h += '<span class="espacio"></span>';
  if(esAdmin()) h += '<button type="button" class="btn btn-peligro btn-mini" data-accion="borrar-levantamiento">' + ICONO.basura + 'Eliminar</button>';
  h += '</div>';

  return h;
}

/* ---------------------------- Modal: datos generales del levantamiento ---------------------------- */
function modalLevantamiento(id){
  const l = id ? levantamientoPorId(id) : null;
  if(!datos.clientes.length){
    aviso('Primero da de alta un cliente: el levantamiento cuelga de un sitio suyo.', true);
    return;
  }

  const clientesOrd = datos.clientes.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
  const opc = (lista, sel, texto, valor) => lista.map(o =>
    '<option value="' + esc(valor(o)) + '"' + (valor(o) === sel ? ' selected' : '') + '>' + esc(texto(o)) + '</option>').join('');
  const conCuenta = HAY_NUBE && haySesion();

  const cuerpo =
      '<div class="campo"><label>Cliente *</label>'
    +   '<div class="cliente-zona">'
    +     '<select id="lvCliente">' + opc(clientesOrd, l ? l.clienteId : '', c=>c.nombre, c=>c.id) + '</select>'
    +     '<button type="button" class="btn btn-suave btn-mini" id="btnClienteNuevoLV" '
    +       'title="Dar de alta un cliente sin salir de aquí">' + ICONO.mas + 'Nuevo</button>'
    +   '</div>'
    + '</div>'
    + '<div id="zonaClienteNuevoLV" class="cliente-nuevo" hidden>'
    +   '<div class="campo"><label>Nombre del cliente nuevo *</label>'
    +     '<input type="text" id="lvncNombre" placeholder="Ej. Mercado Libre" autocomplete="off"></div>'
    +   '<div class="cliente-nuevo-botones">'
    +     '<button type="button" class="btn btn-suave btn-mini" id="lvncCancelar">Cancelar</button>'
    +     '<button type="button" class="btn btn-primario btn-mini" id="lvncCrear">Crear y seleccionar</button>'
    +   '</div>'
    + '</div>'
    + '<div class="campo"><label>Sitio *</label>'
    +   '<div class="cliente-zona">'
    +     '<select id="lvSitio"></select>'
    +     '<button type="button" class="btn btn-suave btn-mini" id="btnSitioNuevoLV" '
    +       'title="Dar de alta un sitio de este cliente sin salir de aquí">' + ICONO.mas + 'Nuevo</button>'
    +   '</div>'
    +   '<div class="pista" id="pistaSitioLV"></div></div>'
    + '<div id="zonaSitioNuevoLV" class="cliente-nuevo" hidden>'
    +   '<div class="campo"><label>Nombre del sitio nuevo *</label>'
    +     '<input type="text" id="lvnsNombre" placeholder="Ej. BANREGIO Cumbres" autocomplete="off"></div>'
    +   '<div class="cliente-nuevo-botones">'
    +     '<button type="button" class="btn btn-suave btn-mini" id="lvnsCancelar">Cancelar</button>'
    +     '<button type="button" class="btn btn-primario btn-mini" id="lvnsCrear">Crear y seleccionar</button>'
    +   '</div>'
    + '</div>'
    + '<div class="campo"><label>Fecha de la visita *</label>'
    +   '<input type="date" id="lvFecha" value="' + esc(l ? l.fecha : hoyISO()) + '"></div>'
    + '<div class="campo"><label>Realizó el recorrido *</label>'
    +   (conCuenta
          ? '<input type="text" id="lvRealizo" value="' + esc(l ? l.realizoNombre : nombreDe(sesion)) + '">'
            + '<div class="pista">Se sugiere tu cuenta, pero se puede cambiar si el recorrido lo hizo alguien más.</div>'
          : '<input type="text" id="lvRealizo" placeholder="Ej. Santiago Garza" value="' + esc(l ? l.realizoNombre : nombreCapturador()) + '">'
            + '<div class="pista">Se guarda para las siguientes capturas de esta computadora.</div>')
    + '</div>'
    + '<div class="campo"><label>Notas generales (opcional)</label>'
    +   '<textarea id="lvNotas" placeholder="Contexto de la visita, quién acompañó, cualquier cosa que valga la pena recordar…">' + esc(l ? l.notasGenerales : '') + '</textarea></div>';

  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (l ? 'Guardar cambios' : 'Crear levantamiento') + '</button>';

  abrirModal(l ? 'Editar levantamiento' : 'Nuevo levantamiento', cuerpo, pie);

  function pintarSitios(){
    const clienteId = $('lvCliente').value;
    const sitios = sitiosDe(clienteId).slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
    $('lvSitio').innerHTML = opc(sitios, l ? l.sitioId : '', s=>s.nombre, s=>s.id);
    $('pistaSitioLV').textContent = sitios.length
      ? ''
      : 'Este cliente no tiene sitios todavía — dale a "Nuevo" para agregar uno sin salir de aquí.';
  }
  pintarSitios();
  $('lvCliente').addEventListener('change', ()=>{ $('zonaSitioNuevoLV').hidden = true; pintarSitios(); });

  $('btnClienteNuevoLV').addEventListener('click', ()=>{
    $('zonaClienteNuevoLV').hidden = false;
    $('lvncNombre').focus();
  });
  $('lvncCancelar').addEventListener('click', ()=>{ $('zonaClienteNuevoLV').hidden = true; $('lvncNombre').value = ''; });
  $('lvncCrear').addEventListener('click', ()=>{
    const nombre = $('lvncNombre').value.trim();
    if(!nombre){ aviso('Ponle un nombre al cliente nuevo.', true); return; }
    const nuevo = normalizarCliente({ id:nuevoId(), nombre, usaForpass:'si' });
    datos.clientes.push(nuevo);
    guardarCliente(nuevo, 'creó');
    $('lvCliente').insertAdjacentHTML('beforeend', '<option value="' + esc(nuevo.id) + '" selected>' + esc(nuevo.nombre) + '</option>');
    $('lvCliente').value = nuevo.id;
    $('zonaClienteNuevoLV').hidden = true;
    pintarSitios();
    aviso('Cliente agregado. Ahora agrégale un sitio con el botón "Nuevo" de aquí abajo.');
  });

  /* Mismo criterio que el cliente: dar de alta el sitio sin salir del modal.
     Antes solo se podía crear el cliente y el sitio había que ir a hacerlo a
     Forpass — un cliente recién creado (0 sitios) dejaba el levantamiento
     sin poder guardarse. */
  $('btnSitioNuevoLV').addEventListener('click', ()=>{
    if(!$('lvCliente').value){ aviso('Primero elige o crea el cliente.', true); return; }
    $('zonaSitioNuevoLV').hidden = false;
    $('lvnsNombre').focus();
  });
  $('lvnsCancelar').addEventListener('click', ()=>{ $('zonaSitioNuevoLV').hidden = true; $('lvnsNombre').value = ''; });
  $('lvnsCrear').addEventListener('click', ()=>{
    const clienteId = $('lvCliente').value;
    const nombreSitio = $('lvnsNombre').value.trim();
    if(!clienteId){ aviso('Primero elige o crea el cliente.', true); return; }
    if(!nombreSitio){ aviso('Ponle un nombre al sitio nuevo.', true); return; }
    const yaExiste = datos.sitios.find(s => s.clienteId === clienteId && s.nombre.toLowerCase() === nombreSitio.toLowerCase());
    let sitio;
    if(yaExiste){
      sitio = yaExiste;
      aviso('Ese sitio ya existía para este cliente; lo seleccioné.');
    }else{
      sitio = normalizarSitio({ id:nuevoId(), clienteId, nombre:nombreSitio,
        modulos:0, mensualidad:0, fechaInicio:hoyISO(), meses:12 });
      datos.sitios.push(sitio);
      guardarSitio(sitio, 'creó');
      aviso(nombreSitio + ' dado de alta y seleccionado.');
    }
    pintarSitios();
    $('lvSitio').value = sitio.id;
    $('zonaSitioNuevoLV').hidden = true;
    $('lvnsNombre').value = '';
  });

  cerrarModalActual = ()=>{
    const clienteId = $('lvCliente').value;
    const sitioId = $('lvSitio').value;
    const fecha = $('lvFecha').value.trim();
    const realizoNombre = $('lvRealizo').value.trim();
    if(!sitioId){ aviso('Elige un sitio: el levantamiento necesita saber dónde fue.', true); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)){
      $('lvFecha').setAttribute('aria-invalid','true'); $('lvFecha').focus();
      aviso('Falta la fecha de la visita.', true); return;
    }
    if(!realizoNombre){
      $('lvRealizo').setAttribute('aria-invalid','true'); $('lvRealizo').focus();
      aviso('Falta el nombre de quien hizo el recorrido.', true); return;
    }
    if(!conCuenta) recordarCapturador(realizoNombre);

    const sitio = sitioPorId(sitioId);
    let reg;
    if(l){
      Object.assign(l, { clienteId, sitioId, sitioNombre: sitio ? sitio.nombre : l.sitioNombre, fecha, realizoNombre,
        notasGenerales: $('lvNotas').value.trim() });
      reg = l;
      guardarLevantamiento(reg, 'editó');
    }else{
      reg = normalizarLevantamiento({
        id:nuevoId(), folio: generarFolioLevantamiento(fecha),
        clienteId, sitioId, sitioNombre: sitio ? sitio.nombre : '', fecha, realizoNombre,
        notasGenerales: $('lvNotas').value.trim(), hallazgos: []
      });
      datos.levantamientos.push(reg);
      guardarLevantamiento(reg, 'creó');
    }
    cerrarModal();
    estado.modulo = 'levantamientos'; guardarModulo();
    estado.vista = 'levantamiento'; estado.levantamientoId = reg.id;
    render();
    aviso(l ? 'Levantamiento actualizado.' : 'Levantamiento creado. Ahora agrega los hallazgos que encontraste.');
  };
}

/* ---------------------------- Modal: hallazgo ---------------------------- */
/* Mismo criterio exacto que modalServicioPoliza() para la refacción: la
   evidencia se sube en staging (evidenciasTmp) y se comprime al elegirla, y
   la solicitud de cotización se genera sola UNA vez, la primera vez que se
   guarda con texto en "cotizar" — reabrir el hallazgo después deja ese
   campo de solo lectura para no duplicar ni perder la solicitud. */
function modalHallazgo(levantamientoId, hallazgoId){
  const l = levantamientoPorId(levantamientoId);
  if(!l) return;
  const hz = hallazgoId ? l.hallazgos.find(x => x.id === hallazgoId) : null;
  if(!exigirGestionLevantamiento()) return;

  let evidenciasTmp = hz ? hz.evidencias.slice() : [];
  const cat = catalogo().slice().sort((a,b)=> a.concepto.localeCompare(b.concepto,'es'));
  const opc = (lista, sel, texto, valor) => lista.map(o =>
    '<option value="' + esc(valor(o)) + '"' + (valor(o) === sel ? ' selected' : '') + '>' + esc(texto(o)) + '</option>').join('');
  const equipoEsDelCatalogo = hz && hz.equipoCatalogoId;
  const cotLigada = hz && hz.cotizacionId ? cotizacionPorId(hz.cotizacionId) : null;

  const cuerpo =
      '<div class="campo"><label>Ubicación / área</label>'
    +   '<input type="text" id="hzUbicacion" placeholder="Ej. Cocina caliente, Cámara 2, Azotea…" value="' + esc(hz ? hz.ubicacion : '') + '"></div>'
    + '<div class="campo"><label>Equipo (opcional)</label><select id="hzEquipoId">'
    +   '<option value="">— No aplica / elegir de la lista —</option>'
    +   opc(cat, equipoEsDelCatalogo ? hz.equipoCatalogoId : '', e=>e.concepto, e=>e.id)
    +   '<option value="__otro__"' + (hz && !equipoEsDelCatalogo && hz.equipoNombre ? ' selected' : '') + '>Otro / no está en la lista</option>'
    + '</select></div>'
    + '<div class="campo" id="zonaEquipoTextoHZ" hidden><label>Nombre del equipo</label>'
    +   '<input type="text" id="hzEquipoTexto" placeholder="Ej. Refrigerador de postres" '
    +     'value="' + esc(hz && !equipoEsDelCatalogo ? hz.equipoNombre : '') + '"></div>'
    + '<div class="campo"><label>¿Qué se encontró? *</label>'
    +   '<textarea id="hzHallazgo" placeholder="Describe la condición encontrada…">' + esc(hz ? hz.hallazgo : '') + '</textarea></div>'
    + '<div class="fila2">'
    +   '<div class="campo"><label>Tipo de acción</label><select id="hzAccion">'
    +     ACCION_HALLAZGO.map(a => '<option value="' + a + '"' + ((hz ? hz.accion : 'correctivo') === a ? ' selected' : '') + '>' + esc(ETIQUETA_ACCION_HALLAZGO[a]) + '</option>').join('')
    +   '</select></div>'
    +   '<div class="campo"><label>Prioridad</label><select id="hzPrioridad">'
    +     PRIORIDAD_REPORTE.map(p => '<option value="' + p + '"' + ((hz ? hz.prioridad : 'media') === p ? ' selected' : '') + '>' + esc(ETIQUETA_PRIORIDAD[p]) + '</option>').join('')
    +   '</select></div>'
    + '</div>'
    + '<div class="campo"><label>Acción sugerida (opcional)</label>'
    +   '<input type="text" id="hzAccionSugerida" placeholder="Ej. Cambiar empaque de puerta, dar mantenimiento preventivo trimestral…" value="' + esc(hz ? hz.accionSugerida : '') + '"></div>'

    + '<div class="campo"><label>Nota de resolución (opcional)</label>'
    +   '<input type="text" id="hzResueltoNota" placeholder="Qué se hizo para atenderlo, si ya se resolvió" value="' + esc(hz ? hz.resueltoNota : '') + '">'
    +   '<div class="pista">Se llena cuando ya se atendió el hallazgo — igual se puede marcar "Resuelto" sin escribir nada aquí.</div>'
    + '</div>'

    + '<div class="campo"><label>Fotos de evidencia (opcional)</label>'
    +   '<div class="galeria-evidencia" id="hzGaleriaEvidencia"></div>'
    +   '<button type="button" class="btn btn-suave btn-mini" id="hzBtnAgregarFoto">' + ICONO.camara + 'Tomar o elegir foto</button>'
    +   '<input type="file" id="hzArchivoEvidencia" accept="image/*" capture="environment" multiple style="display:none">'
    +   '<div class="pista" id="hzPistaEvidencia">Hasta ' + EVIDENCIA_MAX_POR_HALLAZGO + ' fotos. Se reducen solas para no pesar.</div>'
    + '</div>'

    + '<div class="campo"><label class="casilla"><input type="checkbox" id="hzCotizarChk"'
    +     ((hz && hz.cotizar) ? ' checked' : '') + '> ¿Hay que cotizar algo para esto?</label>'
    +   '<div id="hzCotizarZona"' + ((hz && hz.cotizar) ? '' : ' hidden') + '>'
    +     '<input type="text" id="hzCotizarTexto" placeholder="Ej. Refacción, material, servicio de terceros…" '
    +       'value="' + esc((hz && hz.cotizar) || '') + '">'
    +     '<div class="pista" id="hzPistaCotizar">' + (cotLigada
            ? 'Ya se generó la solicitud de cotización <b>' + esc(cotLigada.folio || 'sin folio') + '</b> para esto — se busca en el módulo Cotizaciones.'
            : 'Se guarda como pendiente de cotizar. La solicitud se genera desde el detalle del levantamiento — sola o junto con otros hallazgos.')
    +     '</div>'
    +   '</div>'
    + '</div>';

  /* Al capturar (no al editar) se puede guardar y de una vez seguir con el
     siguiente hallazgo, sin cerrar el modal: un recorrido real casi nunca
     trae uno solo, y reabrir "Agregar hallazgo" desde cero por cada uno
     era el tropiezo — ver hzBtnGuardarOtro más abajo. */
  const pie = '<button type="button" class="btn btn-suave" data-modal="cancelar">Cancelar</button>'
            + (hz ? '' : '<button type="button" class="btn btn-suave" id="hzBtnGuardarOtro">' + ICONO.mas + 'Guardar y agregar otro</button>')
            + '<button type="button" class="btn btn-primario" data-modal="guardar">' + (hz ? 'Guardar cambios' : 'Agregar hallazgo y cerrar') + '</button>';

  abrirModal(hz ? 'Editar hallazgo' : 'Nuevo hallazgo', cuerpo, pie);

  function pintarEquipoTexto(){
    $('zonaEquipoTextoHZ').hidden = $('hzEquipoId').value !== '__otro__';
  }
  pintarEquipoTexto();
  $('hzEquipoId').addEventListener('change', pintarEquipoTexto);

  function pintarGaleriaHz(){
    $('hzGaleriaEvidencia').innerHTML = evidenciasTmp.map(e =>
      '<div class="evidencia-foto"><img src="' + esc(e.dataUrl) + '" alt="Evidencia">'
      + '<button type="button" class="evidencia-quitar" data-quitar-tmp="' + esc(e.id) + '" title="Quitar">' + ICONO.basura + '</button></div>'
    ).join('');
    $('hzGaleriaEvidencia').querySelectorAll('[data-quitar-tmp]').forEach(b=>{
      b.addEventListener('click', ()=>{
        evidenciasTmp = evidenciasTmp.filter(e => e.id !== b.dataset.quitarTmp);
        pintarGaleriaHz();
      });
    });
    $('hzBtnAgregarFoto').disabled = evidenciasTmp.length >= EVIDENCIA_MAX_POR_HALLAZGO;
  }
  pintarGaleriaHz();
  $('hzBtnAgregarFoto').addEventListener('click', ()=> $('hzArchivoEvidencia').click());
  $('hzArchivoEvidencia').addEventListener('change', async ev=>{
    const archivos = Array.from(ev.target.files || []);
    ev.target.value = '';
    if(!archivos.length) return;
    const cupo = EVIDENCIA_MAX_POR_HALLAZGO - evidenciasTmp.length;
    if(cupo <= 0){ aviso('Ya tienes ' + EVIDENCIA_MAX_POR_HALLAZGO + ' fotos. Quita alguna para agregar otra.', true); return; }
    $('hzPistaEvidencia').textContent = 'Procesando fotos…';
    for(const archivo of archivos.slice(0, cupo)){
      try{
        const img = await leerEvidencia(archivo);
        const dataUrl = comprimirEvidencia(img);
        evidenciasTmp.push(normalizarEvidencia({ dataUrl, subioNombre: nombreDe(sesion) || '' }));
      }catch(e){ aviso(e.message, true); }
    }
    $('hzPistaEvidencia').textContent = 'Hasta ' + EVIDENCIA_MAX_POR_HALLAZGO + ' fotos. Se reducen solas para no pesar.';
    pintarGaleriaHz();
  });

  /* Igual que en modalServicioPoliza: una vez generada la solicitud, la
     casilla y el texto quedan fijos para no dejarla huérfana. */
  if(cotLigada){
    $('hzCotizarChk').setAttribute('disabled', 'true');
    $('hzCotizarTexto').setAttribute('readonly', 'true');
  }
  $('hzCotizarChk').addEventListener('change', ev=>{
    $('hzCotizarZona').hidden = !ev.target.checked;
    if(ev.target.checked && !cotLigada) $('hzCotizarTexto').focus();
  });

  /* Todo lo que hace falta para validar y guardar UN hallazgo, aparte de
     cerrar el modal: lo comparten el botón normal (que sí cierra) y "Guardar
     y agregar otro" (que reinicia el formulario y se queda abierto). Devuelve
     null si la validación falló (ya avisó y enfocó el campo), o los datos del
     hallazgo guardado. */
  function intentarGuardarHallazgo(){
    const hallazgo = $('hzHallazgo').value.trim();
    if(!hallazgo){
      $('hzHallazgo').setAttribute('aria-invalid','true'); $('hzHallazgo').focus();
      aviso('Describe qué se encontró.', true); return null;
    }
    const pideCotizar = $('hzCotizarChk').checked;
    const cotizar = pideCotizar ? $('hzCotizarTexto').value.trim() : '';
    if(pideCotizar && !cotizar){
      $('hzCotizarTexto').setAttribute('aria-invalid','true'); $('hzCotizarTexto').focus();
      aviso('Escribe qué hay que cotizar, o desmarca la casilla.', true); return null;
    }

    const equipoId = $('hzEquipoId').value;
    let equipoCatalogoId = '', equipoNombre = '';
    if(equipoId === '__otro__'){
      equipoNombre = $('hzEquipoTexto').value.trim();
    }else if(equipoId){
      const eq = catalogo().find(e => e.id === equipoId);
      equipoCatalogoId = equipoId;
      equipoNombre = eq ? eq.concepto : '';
    }

    const datosHz = {
      id: hz ? hz.id : nuevoId(),
      ubicacion: $('hzUbicacion').value.trim(),
      equipoCatalogoId, equipoNombre,
      hallazgo,
      accion: $('hzAccion').value,
      prioridad: $('hzPrioridad').value,
      accionSugerida: $('hzAccionSugerida').value.trim(),
      estatus: hz ? hz.estatus : 'pendiente',
      resueltoNota: $('hzResueltoNota').value.trim(),
      evidencias: evidenciasTmp,
      cotizar,
      cotizacionId: (cotLigada && cotLigada.id) || ''
    };
    const nuevoHz = normalizarHallazgo(datosHz);

    if(hz) Object.assign(hz, nuevoHz);
    else l.hallazgos.push(nuevoHz);

    /* Ya NO se genera la cotización aquí: si hay varios hallazgos que
       cotizar en el mismo levantamiento, generarla uno por uno duplicaba
       solicitudes que debían ir juntas. La solicitud se arma después, desde
       el detalle del levantamiento, donde se puede elegir combinar o
       separar — ver el bloque "Cotizaciones por generar". */
    guardarLevantamiento(l, hz ? 'editó un hallazgo de' : 'agregó un hallazgo a',
      (nuevoHz.ubicacion || nuevoHz.equipoNombre || 'hallazgo') + (cotizar && !cotLigada ? ' · pidió cotizar: ' + cotizar : ''));
    return { nuevoHz };
  }

  /* Deja el formulario listo para el siguiente hallazgo, sin tocar los datos
     de "Ubicación" — casi siempre el que sigue es del mismo rincón del sitio
     (misma cocina, mismo cuarto de máquinas), así que dejarlo puesto ahorra
     tecleo; todo lo demás sí se limpia. */
  function limpiarFormularioHz(){
    $('hzEquipoId').value = ''; pintarEquipoTexto(); $('hzEquipoTexto').value = '';
    $('hzHallazgo').value = ''; $('hzHallazgo').removeAttribute('aria-invalid');
    $('hzAccion').value = 'correctivo';
    $('hzPrioridad').value = 'media';
    $('hzAccionSugerida').value = '';
    $('hzResueltoNota').value = '';
    evidenciasTmp = [];
    pintarGaleriaHz();
    $('hzCotizarChk').checked = false;
    $('hzCotizarZona').hidden = true;
    $('hzCotizarTexto').value = '';
    $('hzCotizarTexto').removeAttribute('aria-invalid');
    $('hzHallazgo').focus();
  }

  setTimeout(()=>{ const f = $('hzUbicacion'); if(f) f.focus(); }, 70);
  cerrarModalActual = ()=>{
    const resultado = intentarGuardarHallazgo();
    if(!resultado) return;
    cerrarModal();
    render();
    aviso(hz ? 'Hallazgo actualizado.' : 'Hallazgo agregado.');
  };

  if(!hz){
    $('hzBtnGuardarOtro').addEventListener('click', ()=>{
      const resultado = intentarGuardarHallazgo();
      if(!resultado) return;
      /* El modal se queda abierto: render() solo repinta la vista de ATRÁS
         (el detalle del levantamiento), nunca toca #modal/#modalCuerpo. */
      render();
      aviso('Hallazgo agregado (van ' + numero(l.hallazgos.length) + '). Sigue con el siguiente.');
      limpiarFormularioHz();
    });
  }
}

       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-proyectos-imagen">'

/* No hay t-info en .tarjeta (solo ok/alerta/error/neutro) — la insignia SÍ
   tiene i-info, así que el acento de la tarjeta usa este mapeo aparte en vez
   de forzar 'info' donde no existe. */
function tonoTarjetaProyectoImagen(estatus){
  const t = TONO_ESTATUS_PROYECTO_IMAGEN[estatus];
  return t === 'info' ? 'neutro' : t;
}

/* ===================== Cronograma tipo Gantt (Imagen/Aperturas) =====================
   Una remodelación o apertura no es un solo punto en el calendario: tiene
   entrada al sitio, salida/fin de obra (de ahí sale la duración) y una fecha
   de apertura que puede caer días después de que la obra termina. Un listado
   por mes (la primera versión de este cronograma) no deja ver ESO — cuánto
   dura cada obra ni qué tanto se traslapan dos proyectos. Por eso cada
   proyecto se dibuja como una barra sobre un eje de fechas continuo, al
   estilo Gantt, en vez de una columna por día (con varios meses de rango
   serían cientos de columnas): la posición y el ancho de cada barra se
   calculan en píxeles a partir de la diferencia de días, no del layout. */

/* true si el proyecto tiene AL MENOS una fecha capturada (apertura, entrada
   o salida) — sin ninguna de las tres no hay dónde dibujarlo en el eje. */
function tieneCalendarioProyectoImagen(p){
  return !!(p.fechaEntrada || p.fechaSalida || p.fechaObjetivo);
}
/* Inicio/fin a dibujar: la más temprana y la más tardía de las tres fechas
   capturadas. Con solo una fecha (p.ej. nomás la apertura, muy común al
   principio), inicio === fin y se dibuja como marcador, no como barra. */
function rangoGanttProyectoImagen(p){
  const candidatas = [p.fechaEntrada, p.fechaSalida, p.fechaObjetivo].filter(Boolean).sort();
  return { inicio: candidatas[0], fin: candidatas[candidatas.length - 1] };
}
/* Ventana visible del eje: de la fecha más temprana a la más tardía entre
   todos los proyectos (y hoy, para que la línea de "HOY" siempre quepa),
   con margen y redondeado a mes completo para que los encabezados de mes no
   salgan cortados a la mitad. */
function calcularRangoGanttProyectosImagen(lista){
  const fechas = [hoyISO()];
  lista.forEach(p=>{ const r = rangoGanttProyectoImagen(p); fechas.push(r.inicio, r.fin); });
  let minF = fechas.reduce((a,b)=> b < a ? b : a);
  let maxF = fechas.reduce((a,b)=> b > a ? b : a);
  minF = sumarDias(minF, -10);
  maxF = sumarDias(maxF, 20);
  minF = minF.slice(0,8) + '01';
  maxF = sumarMeses(maxF.slice(0,8) + '01', 1);   /* primer día del mes SIGUIENTE al último: límite exclusivo */
  return { minF, maxF };
}
/* Mismo color que ya usan las insignias de estatus (vía TONO_ESTATUS_
   PROYECTO_IMAGEN), pero como relleno sólido en vez de fondo suave + texto
   de color: una barra angosta con fondo pastel y texto oscuro no se lee. */
const RELLENO_TONO_GANTT = { info:'#103580', alerta:'#E8A33D', ok:'#3FA66B', neutro:'#8a90a3' };
function colorBarraProyectoImagen(estatus){
  return RELLENO_TONO_GANTT[TONO_ESTATUS_PROYECTO_IMAGEN[estatus]] || RELLENO_TONO_GANTT.neutro;
}
function ganttMesesHTML(minF, maxF, pxPorDia){
  let h = '<div class="gantt-mes gantt-mes-espaciador"></div>';
  let cursor = minF;
  while(cursor < maxF){
    const q = partes(cursor);
    const siguiente = sumarMeses(cursor, 1);
    const dias = diasEntre(cursor, siguiente < maxF ? siguiente : maxF);
    h += '<div class="gantt-mes" style="width:' + (dias * pxPorDia) + 'px">' + MES_CORTO[q.m-1].toUpperCase() + ' ' + q.a + '</div>';
    cursor = siguiente;
  }
  return h;
}
function filaGanttProyectoImagen(p, minF, pxPorDia){
  const r = rangoGanttProyectoImagen(p);
  const esBarra = !!(p.fechaEntrada && p.fechaSalida);
  const hoy = hoyISO();
  const atrasado = !!(p.fechaSalida && p.fechaSalida < hoy && p.estatus !== 'terminado' && p.estatus !== 'cancelado');
  const color = colorBarraProyectoImagen(p.estatus);
  const izq = diasEntre(minF, r.inicio) * pxPorDia;
  let marca = '';
  if(esBarra){
    const dias = diasEntre(p.fechaEntrada, p.fechaSalida) + 1;
    const ancho = Math.max(dias * pxPorDia, 20);
    marca += '<div class="gantt-barra' + (atrasado ? ' atrasada' : '') + '" data-proyecto-imagen="' + esc(p.id) + '" tabindex="0" role="button" '
      +   'style="left:' + izq + 'px; width:' + ancho + 'px; background:' + color + '" '
      +   'title="' + esc(p.nombreProyecto || 'Proyecto') + ' — entrada ' + fmtFecha(p.fechaEntrada) + ', salida ' + fmtFecha(p.fechaSalida) + '">'
      +   (ancho >= 40 ? dias + (dias === 1 ? ' día' : ' días') : '')
      + '</div>';
    /* La apertura puede caer días después de que termina la obra (limpieza,
       montaje final): si no coincide con la barra, se marca aparte. */
    if(p.fechaObjetivo && (p.fechaObjetivo < p.fechaEntrada || p.fechaObjetivo > p.fechaSalida)){
      const izqObj = diasEntre(minF, p.fechaObjetivo) * pxPorDia;
      marca += '<div class="gantt-marcador" data-proyecto-imagen="' + esc(p.id) + '" tabindex="0" role="button" '
        +   'style="left:' + izqObj + 'px; background:var(--navy)" title="Apertura: ' + fmtFecha(p.fechaObjetivo) + '"></div>';
    }
  }else{
    marca += '<div class="gantt-marcador" data-proyecto-imagen="' + esc(p.id) + '" tabindex="0" role="button" '
      +   'style="left:' + izq + 'px; background:' + color + '" title="' + esc(p.nombreProyecto || 'Proyecto') + ' — ' + fmtFecha(r.inicio) + '"></div>';
  }
  return '<div class="gantt-fila">'
       +   '<div class="gantt-rotulo" data-proyecto-imagen="' + esc(p.id) + '" tabindex="0" role="button">'
       +     '<div class="t-nombre" style="font-size:13px">' + esc(p.nombreProyecto || 'Proyecto') + '</div>'
       +     '<div class="pista">' + esc(p.clienteNombre || 'Prospecto') + '</div>'
       +     '<div class="pista gantt-fechas">' + esc(etiquetaFechasGanttProyecto(p)) + '</div>'
       +   '</div>'
       +   '<div class="gantt-pista">' + marca + '</div>'
       + '</div>';
}
/* Las fechas de cada proyecto (entrada, salida, apertura) SIEMPRE visibles en
   el rótulo, sin depender del title="" (que solo se ve al pasar el cursor):
   en móvil, sobre todo, nadie hace hover. */
function etiquetaFechasGanttProyecto(p){
  if(p.fechaEntrada && p.fechaSalida){
    let txt = fmtFecha(p.fechaEntrada) + ' – ' + fmtFecha(p.fechaSalida);
    if(p.fechaObjetivo && (p.fechaObjetivo < p.fechaEntrada || p.fechaObjetivo > p.fechaSalida)){
      txt += ' · Apertura ' + fmtFecha(p.fechaObjetivo);
    }
    return txt;
  }
  const partes = [];
  if(p.fechaEntrada) partes.push('Entrada ' + fmtFecha(p.fechaEntrada));
  if(p.fechaSalida) partes.push('Salida ' + fmtFecha(p.fechaSalida));
  if(p.fechaObjetivo) partes.push('Apertura ' + fmtFecha(p.fechaObjetivo));
  return partes.join(' · ');
}
function filaCronogramaProyectoSinFecha(p){
  return '<div class="cronograma-fila" data-proyecto-imagen="' + esc(p.id) + '" tabindex="0" role="button">'
       +   '<div class="cronograma-fecha">—</div>'
       +   '<div class="cronograma-info">'
       +     '<div class="t-nombre" style="font-size:13.5px">' + esc(p.nombreProyecto || 'Proyecto') + '</div>'
       +     '<div class="pista">' + esc(p.clienteNombre || 'Prospecto') + (p.sitioNombre ? ' · ' + esc(p.sitioNombre) : '') + (p.folio ? ' · ' + esc(p.folio) : '') + '</div>'
       +   '</div>'
       +   '<div class="cronograma-chips">'
       +     '<span class="insignia i-' + TONO_ESTATUS_PROYECTO_IMAGEN[p.estatus] + '">' + esc(ETIQUETA_ESTATUS_PROYECTO_IMAGEN[p.estatus]) + '</span>'
       +   '</div>'
       + '</div>';
}
function vistaCronogramaProyectosImagen(lista){
  const conCalendario = lista.filter(tieneCalendarioProyectoImagen);
  const sinCalendario = lista.filter(p => !tieneCalendarioProyectoImagen(p));

  let h = '';
  if(!conCalendario.length){
    h += '<div class="agenda-bloque a-neutro"><div class="agenda-cabeza">'
       +   '<h3>Ningún proyecto filtrado tiene fechas capturadas</h3>'
       +   '<p class="pista">Agrega fecha de apertura, entrada al sitio o salida en cada proyecto para verlo aquí.</p>'
       + '</div></div>';
  }else{
    const hoy = hoyISO();
    const atrasados = conCalendario.filter(p => p.fechaSalida && p.fechaSalida < hoy && p.estatus !== 'terminado' && p.estatus !== 'cancelado');
    if(atrasados.length){
      h += '<div class="gantt-alerta"><b>' + numero(atrasados.length) + ' ' + plural(atrasados.length,'proyecto atrasado','proyectos atrasados') + '</b>: '
         +   atrasados.map(p => esc(p.nombreProyecto || 'Proyecto')).join(', ') + '.</div>';
    }

    const { minF, maxF } = calcularRangoGanttProyectosImagen(conCalendario);
    const pxPorDia = 26;
    const anchoEje = diasEntre(minF, maxF) * pxPorDia;
    const ordenados = conCalendario.slice()
      .sort((a,b)=> rangoGanttProyectoImagen(a).inicio.localeCompare(rangoGanttProyectoImagen(b).inicio));
    const izqHoy = diasEntre(minF, hoy) * pxPorDia;

    h += '<div class="gantt-caja"><div class="gantt" style="width:' + (260 + anchoEje) + 'px">'
       +   '<div class="gantt-meses">' + ganttMesesHTML(minF, maxF, pxPorDia) + '</div>'
       +   '<div class="gantt-filas">'
       +     (hoy >= minF && hoy < maxF ? '<div class="gantt-hoy" style="left:' + (260 + izqHoy) + 'px"><span class="gantt-hoy-etq">HOY</span></div>' : '')
       +     ordenados.map(p => filaGanttProyectoImagen(p, minF, pxPorDia)).join('')
       +   '</div>'
       + '</div></div>';
  }

  if(sinCalendario.length){
    h += '<div class="agenda-bloque a-neutro" style="margin-top:16px">'
       +   '<div class="agenda-cabeza"><h3>Sin fechas capturadas'
       +     ' <span class="agenda-cuenta">' + numero(sinCalendario.length) + '</span></h3>'
       +     '<p class="pista">Captura la fecha de apertura, la entrada al sitio o la salida para verlo en el cronograma.</p></div>'
       +   sinCalendario.map(filaCronogramaProyectoSinFecha).join('')
       + '</div>';
  }
  return h;
}

        proyectos se planean contra una fecha objetivo. */

     +     '<button type="button" data-accion="vista-lista" data-campo="vistaProyectosImagen" data-modo="tabla" aria-pressed="' + vistaTabla + '" title="Ver como tabla">' + ICONO.tabla + '</button>'
     +     '<button type="button" data-accion="vista-lista" data-campo="vistaProyectosImagen" data-modo="calendario" aria-pressed="' + vistaCalendario + '" title="Ver cronograma por fecha objetivo">' + ICONO.calendario + '</button>'
     +   '</div>'
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const filtrados = lista.filter(p=>{
    if(q){
      const campos = [p.folio, p.nombreProyecto, p.sitioNombre, p.clienteNombre].join(' ').toLowerCase();
      if(!campos.includes(q)) return false;
    }
    if(ESTATUS_PROYECTO_IMAGEN.includes(estado.filtro)) return p.estatus === estado.filtro;
    return true;
  });

  if(!filtrados.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún proyecto coincide con la búsqueda o el filtro.</p></div>';
    return h;

  if(vistaCalendario){

       atrasados, programados o sin fecha, así que esto nunca vuelve ''. */
    h += vistaCronogramaProyectosImagen(filtrados);
    return h;

  const ordenados = filtrados.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha) || (b.folio||'').localeCompare(a.folio||''));

  if(vistaTabla){
    h += '<div class="rodillo"><table class="tabla"><thead><tr><th>Folio</th><th>Proyecto</th><th>Cliente</th><th>Tipo</th><th>Estatus</th><th>Inversión total</th></tr></thead><tbody>'

          + '<td>' + dineroCent(totalConceptosProyecto(p)) + '</td></tr>').join('')
      + '</tbody></table></div>';
    return h;
  }

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenados.map((p,i)=>{
    const total = totalConceptosProyecto(p);
    return '<div class="tarjeta tarjeta-clic t-' + tonoTarjetaProyectoImagen(p.estatus) + '" data-proyecto-imagen="' + esc(p.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'

         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(p.nombreProyecto || 'Proyecto') + '</div>'
         +       '<div class="t-sub">' + esc(p.clienteNombre || 'Prospecto') + (p.folio ? ' · ' + esc(p.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">'
         +     '<span class="insignia i-' + TONO_ESTATUS_PROYECTO_IMAGEN[p.estatus] + '">' + esc(ETIQUETA_ESTATUS_PROYECTO_IMAGEN[p.estatus]) + '</span>'
         +     '<span class="insignia i-neutro">' + esc(ETIQUETA_TIPO_PROYECTO_IMAGEN[p.tipo]) + '</span>'
         +   '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Inversión total</div><div class="d-valor chico">' + dineroCent(total) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Imágenes</div><div class="d-valor chico">' + numero(p.imagenes.length) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie"><span class="pista">' + esc(p.sitioNombre || 'Sin sitio') + '</span></div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

  h += '<span class="espacio"></span>';
  if(esAdmin()) h += '<button type="button" class="btn btn-peligro btn-mini" data-accion="borrar-proyecto-imagen">' + ICONO.basura + 'Eliminar</button>';
  h += '</div>';

  return h;
}

    +     '<button type="button" class="btn btn-suave btn-mini" id="piBtnAgregarImagen">' + ICONO.camara + 'Agregar imagen o PDF</button>'
