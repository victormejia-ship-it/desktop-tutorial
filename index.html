/* Misma lista de clientes de Forpass, en tabla: cada <tr> lleva el mismo
   data-cliente que ya usan las tarjetas para abrir sus sitios. */
function tablaForpass(lista){
  return '<div class="rodillo"><table class="tabla" style="min-width:760px"><thead><tr>'
       +   '<th>Cliente</th><th>Sitios</th><th>Forpass activos</th><th>Mensualidad</th><th>Estado</th>'
       + '</tr></thead><tbody>'
       + lista.map(c=>{
           const rr = resumir(sitiosDe(c.id));
           const tono = rr.atrasados ? 'error' : (rr.porPagar ? 'alerta' : (rr.forpass ? 'ok' : 'neutro'));
           const etiqueta = rr.atrasados ? rr.atrasados + ' ' + plural(rr.atrasados,'sitio atrasado','sitios atrasados')
                          : rr.porPagar  ? rr.porPagar + ' por pagar'
                          : rr.forpass   ? 'Al día'
                          : 'Sin Forpass activos';
           return '<tr class="fila-clic" data-cliente="' + esc(c.id) + '" tabindex="0" role="button">'
                +   '<td>' + esc(c.nombre) + '</td>'
                +   '<td>' + numero(rr.sitiosActivos) + ' de ' + numero(rr.sitios) + '</td>'
                +   '<td>' + numero(rr.forpass) + '</td>'
                +   '<td>' + dinero(rr.mrr) + '</td>'
                +   '<td><span class="insignia i-' + tono + '"><span class="punto p-' + tono + '"></span>' + esc(etiqueta) + '</span></td>'
                + '</tr>';
         }).join('')
       + '</tbody></table></div>';
}

function vistaClientes(){
  const r = resumir(datos.sitios);
  /* Solo los de este módulo: los que existen nada más por una póliza se quedan
     en Pólizas. Ver clientesDeForpass(). */
  const mios = clientesDeForpass();
  const soloPoliza = datos.clientes.length - mios.length;
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Clientes</h2>'
     +   '<p>' + numero(mios.length) + ' ' + plural(mios.length,'cliente','clientes')
     +   ' · ' + numero(r.sitios) + ' ' + plural(r.sitios,'sitio','sitios') + ' registrados'
     +   (soloPoliza ? ' · ' + numero(soloPoliza) + ' más solo con póliza' : '') + '</p>'
     + '</div><div class="acciones">'
     /* Respaldo/Restaurar/Excel general se movieron a la pestaña Clientes: son
        acciones de TODA la base (los cuatro módulos), no solo de Forpass, y
        vivir aquí duplicado con el módulo Clientes solo confundía. */
     /* A un Viewer no se le ofrece nada de captura: el módulo de pólizas ya
        seguía esta regla (botón si puede editar, texto si no) y Forpass se había
        quedado atrás — ofrecía lápices y «Agregar» que al picarlos contestaban
        «Tu cuenta es Viewer: no puede hacer cambios». Un callejón sin salida
        cada vez. Ver la regla de oro en CLAUDE.md. */
     +   (puedeEditar() ? '<button type="button" class="btn btn-primario" data-accion="nuevo-cliente">' + ICONO.mas + 'Agregar cliente</button>' : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), 'Suma de sitios activos (sin IVA)')
     /* Los tres de cobranza se pueden abrir; los dos primeros no, porque son
        sumas sin detalle que valga una ventana. Se ofrecen solo cuando hay algo
        que ver: un "Ver cuáles" con cero adentro también decepciona. */
     + tarjetaKpi('Sitios atrasados', numero(r.atrasados), r.mensualidadesAtrasadas + ' ' + plural(r.mensualidadesAtrasadas,'mensualidad vencida','mensualidades vencidas') + ' · ' + dinero(r.adeudo), r.atrasados ? 'k-error' : '', r.atrasados ? 'ver-atrasados' : '')
     + tarjetaKpi('Por pagar (7 días)', numero(r.porPagar), 'Mensualidad próxima a vencer', r.porPagar ? 'k-alerta' : '', r.porPagar ? 'ver-por-pagar' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Contratos que terminan en 45 días', r.porVencer ? 'k-alerta' : '', 'ver-por-vencer')
     + '</div>';

  h += avisoClaveInicial();
  h += avisoRespaldo();
  h += avisoLocal();

  if(!mios.length){
    h += puedeEditar()
      ? vistaVacia('edificio','Todavía no hay clientes','Agrega tu primer cliente y después registra los sitios con sus Forpass, mensualidad y vigencia.','nuevo-cliente','Agregar cliente')
      : vistaVacia('edificio','Todavía no hay clientes','Cuando alguien del equipo dé de alta el primer cliente, va a aparecer aquí.','','');
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaCliente" placeholder="Buscar cliente…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroCliente">'
     +     '<option value="todos">Todos los clientes</option>'
     +     '<option value="atrasados">Solo con atrasos</option>'
     +     '<option value="activos">Solo con Forpass activos</option>'
     +   '</select>'
     +   controlAlternaVista('vistaForpass')
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = mios.filter(c=>{
    const ss = sitiosDe(c.id);
    if(q){
      const enSitios = ss.some(s => s.nombre.toLowerCase().includes(q));
      if(!c.nombre.toLowerCase().includes(q) && !enSitios) return false;
    }
    const rr = resumir(ss);
    if(estado.filtro === 'atrasados' && !rr.atrasados) return false;
    if(estado.filtro === 'activos' && !rr.forpass) return false;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún cliente coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  if(estado.vistaForpass === 'tabla') return h + tablaForpass(lista);

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + lista.map((c,i)=>{
    const ss = sitiosDe(c.id);
    const rr = resumir(ss);
    const tono = rr.atrasados ? 'error' : (rr.porPagar ? 'alerta' : (rr.forpass ? 'ok' : 'neutro'));

    /* Esta bolita habla SOLO de si hay Forpass encendidos: verde si sí, gris si
       no. El estatus de pago tiene sus propias insignias más abajo; mezclarlos
       aquí hacía que un "3 Forpass activos" saliera con punto rojo. */
    let chips = '<span class="insignia ' + (rr.forpass ? 'i-ok' : 'i-neutro') + '">'
              + '<span class="punto ' + (rr.forpass ? 'p-ok' : 'p-neutro') + '"></span>'
              + numero(rr.forpass) + ' ' + plural(rr.forpass,'Forpass activo','Forpass activos') + '</span>';
    if(rr.atrasados) chips += '<span class="insignia i-error">' + rr.atrasados + ' ' + plural(rr.atrasados,'sitio atrasado','sitios atrasados') + '</span>';
    else if(rr.porPagar) chips += '<span class="insignia i-alerta">' + rr.porPagar + ' por pagar</span>';
    if(rr.porVencer) chips += '<span class="insignia i-info">' + rr.porVencer + ' por vencer</span>';
    /* Sin estas tres, un cliente con todo pausado y otro que ya terminó de pagar
       se veían igual: ambos "0 Forpass activos · $0". Son cosas opuestas. */
    if(rr.cubiertos) chips += '<span class="insignia i-info">' + rr.cubiertos + ' ' + plural(rr.cubiertos,'contrato cubierto','contratos cubiertos') + '</span>';
    if(rr.pausados) chips += '<span class="insignia i-neutro">' + rr.pausados + ' ' + plural(rr.pausados,'pausado','pausados') + '</span>';
    if(rr.bajas) chips += '<span class="insignia i-neutro">' + rr.bajas + ' de baja</span>';

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-cliente="' + esc(c.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     avatarCliente(c)
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(c.nombre) + '</div>'
         +       '<div class="t-sub">' + numero(rr.sitios) + ' ' + plural(rr.sitios,'sitio','sitios')
         +         (c.contacto ? ' · ' + esc(c.contacto) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(rr.mrr) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Sitios activos</div><div class="d-valor">' + numero(rr.sitiosActivos) + ' de ' + numero(rr.sitios) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie">'
         +     '<button type="button" class="btn btn-suave btn-mini" data-ver="' + esc(c.id) + '">Ver sitios →</button>'
         +     '<span class="espacio"></span>'
         +     (puedeEditar()
                ? '<button type="button" class="btn btn-suave btn-mini" data-editar-cliente="' + esc(c.id) + '" title="Editar cliente">' + ICONO.lapiz + '</button>'
                : '')
         /* Borrar del tablero es de Admin para arriba, decidido por Santiago el
            19-ago-2026: capturar y corregir es el trabajo del día —cualquiera con
            permiso de editar lo hace— pero eliminar un registro ya creado se lleva
            de golpe su historial y no hay deshacer. Un cliente arrastra además sus
            sitios, y con la colección compartida, su póliza de mantenimiento. */
         +     (esAdmin()
                ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-cliente="' + esc(c.id) + '" title="Eliminar cliente">' + ICONO.basura + '</button>'
                : '')
         +   '</div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* ------------------------------- Vista: sitios ------------------------------- */
function vistaCliente(){
  const c = clientePorId(estado.clienteId);
  if(!c){ estado.vista = 'clientes'; return vistaClientes(); }
  const todos = sitiosDe(c.id);
  const cotizacionesCliente = datos.cotizaciones.filter(q => q.clienteId === c.id);

  /* Los filtros deciden qué sitios entran a los indicadores y a la lista.
     Si lo elegido ya no existe, se regresa a "todos". */
  if(estado.sitioFiltro && !todos.some(s => s.id === estado.sitioFiltro)) estado.sitioFiltro = '';
  const encargados = [...new Set(todos.map(s => s.encargado.nombre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(estado.encargadoFiltro && estado.encargadoFiltro !== '__sin__' && !encargados.includes(estado.encargadoFiltro)){
    estado.encargadoFiltro = '';
  }

  let ss = todos;
  if(estado.encargadoFiltro){
    ss = ss.filter(s => estado.encargadoFiltro === '__sin__'
      ? !s.encargado.nombre
      : s.encargado.nombre === estado.encargadoFiltro);
  }
  if(estado.sitioFiltro) ss = ss.filter(s => s.id === estado.sitioFiltro);

  const r = resumir(ss);
  const rTodos = resumir(todos);
  const filtrando = !!(estado.sitioFiltro || estado.encargadoFiltro);
  let h = '';

  h += botonRegresar();

  h += '<div class="titulo-zona">'
     + '<div style="display:flex; align-items:center; gap:14px">'
     +   avatarCliente(c, 52)
     +   '<div>'
     +   '<h2>' + esc(c.nombre) + '</h2>'
     +   '<p>' + numero(rTodos.sitios) + ' ' + plural(rTodos.sitios,'sitio','sitios')
     +   ' · ' + numero(rTodos.forpass) + ' ' + plural(rTodos.forpass,'Forpass activo','Forpass activos')
     +   (c.contacto ? ' · ' + esc(c.contacto) : '') + '</p>'
     +   chipsPersonalizados('clientes', c)
     + '</div></div><div class="acciones">'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="excel-cliente">' + ICONO.excel + 'Excel de este cliente</button>'
     +   (cotizacionesCliente.length
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="ver-cotizaciones-cliente" '
            + 'title="Ver las cotizaciones de este cliente">' + ICONO.credencial + 'Cotizaciones (' + cotizacionesCliente.length + ')</button>'
          : '')
     +   (puedeEditar() ? '<button type="button" class="btn btn-primario" data-accion="nuevo-sitio">' + ICONO.mas + 'Agregar sitio</button>' : '')
     + '</div></div>';

  /* Filtros: siempre presentes en cuanto haya al menos un sitio, para que la
     vista se comporte igual en todos los clientes. */
  if(todos.length){
    const opcSitios = todos.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es')).map(s =>
      '<option value="' + esc(s.id) + '"' + (s.id === estado.sitioFiltro ? ' selected' : '') + '>'
      + esc(s.nombre) + (s.zona ? ' · ' + esc(s.zona) : '') + ' — ' + dinero(s.mensualidad) + '/mes</option>').join('');

    const sinAsignar = todos.filter(s => !s.encargado.nombre).length;
    const opcEncargados = encargados.map(n =>
      '<option value="' + esc(n) + '"' + (n === estado.encargadoFiltro ? ' selected' : '') + '>'
      + esc(n) + ' (' + todos.filter(s => s.encargado.nombre === n).length + ')</option>').join('')
      + (sinAsignar
          ? '<option value="__sin__"' + (estado.encargadoFiltro === '__sin__' ? ' selected' : '') + '>'
            + 'Sin asignar (' + sinAsignar + ')</option>'
          : '');

    h += '<div class="barra-busca">'
       +   '<label for="filtroSitio" style="font-size:12.5px; color:var(--gray); align-self:center; font-weight:600">Ver:</label>'
       +   '<select id="filtroSitio" style="flex:1; min-width:200px">'
       +     '<option value="">Todos los sitios (' + todos.length + ')</option>' + opcSitios
       +   '</select>'
       +   '<label for="filtroEncargado" style="font-size:12.5px; color:var(--gray); align-self:center; font-weight:600">A cargo de:</label>'
       +   '<select id="filtroEncargado" style="flex:1; min-width:180px">'
       +     '<option value="">Cualquiera</option>' + opcEncargados
       +   '</select>'
       +   (filtrando ? '<button type="button" class="btn btn-suave btn-mini" data-accion="limpiar-filtros">Quitar filtros</button>' : '')
       + '</div>';
  }

  const pieMrr = filtrando
    ? (ss.length === 1 ? 'Solo este sitio' : 'Solo los ' + ss.length + ' filtrados')
      + ' · ' + dinero(rTodos.mrr) + ' entre todos'
    : 'Sitios activos (sin IVA)';

  h += '<div class="kpis">'
     + tarjetaKpi('Forpass activos', numero(r.forpass), r.sitiosActivos + ' ' + plural(r.sitiosActivos,'sitio activo','sitios activos'), 'k-ok')
     + tarjetaKpi('Mensualidad total', dinero(r.mrr), pieMrr)
     + tarjetaKpi('Mensualidades vencidas', numero(r.mensualidadesAtrasadas), r.adeudo ? dinero(r.adeudo) + ' por cobrar' : 'Nada pendiente', r.mensualidadesAtrasadas ? 'k-error' : '', r.mensualidadesAtrasadas ? 'ver-atrasados-cliente' : '')
     + tarjetaKpi('Vigencias por vencer', numero(r.porVencer), 'Terminan en 45 días', r.porVencer ? 'k-alerta' : '', 'ver-por-vencer-cliente')
     + '</div>';

  if(!todos.length){
    h += puedeEditar()
      ? vistaVacia('credencial','Este cliente aún no tiene sitios','Registra un sitio (por ejemplo MXCD13) con sus Forpass, la mensualidad, la vigencia y si incluyó viáticos u onboarding.','nuevo-sitio','Agregar sitio')
      : vistaVacia('credencial','Este cliente aún no tiene sitios','Cuando alguien del equipo registre el primer kiosco, va a aparecer aquí con su mensualidad y su vigencia.','','');
    return h;
  }

  const ordenados = ss.slice().sort((a,b)=>{
    const ca = calcular(a), cb = calcular(b);
    const peso = t => t === 'error' ? 0 : t === 'alerta' ? 1 : t === 'ok' ? 2 : 3;
    return peso(ca.tono) - peso(cb.tono) || a.nombre.localeCompare(b.nombre, 'es');
  });

  h += '<div class="grid grid-sitios' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenados.map((s,i)=> tarjetaSitio(s, i)).join('') + '</div>';
  return h;
}

function tarjetaSitio(s, i){
  const c = calcular(s);
  const clasePunto = c.tono === 'error' ? 'p-error late' : c.tono === 'alerta' ? 'p-alerta' : (c.activo ? 'p-ok' : 'p-neutro');
  const claseIns = c.tono === 'error' ? 'i-error' : c.tono === 'alerta' ? 'i-alerta' : c.tono === 'ok' ? 'i-ok' : 'i-neutro';

  /* Siguiente pago: se muestra el MONTO como dato principal y la fecha abajo.
     Así el analista ve de una lo que hay que cobrar, sin cuentas mentales. */
  const iSig = s.pagos.findIndex(p => !p);
  let txtProx = 'Contrato cubierto', tonoProx = 'ok', pieProx = 'Las ' + s.meses + ' mensualidades están pagadas';
  if(c.proximo){
    txtProx = dinero(c.montos[iSig]);
    const cuando = fmtFecha(c.proximo) + ' · mensualidad ' + (iSig + 1);
    if(c.diasRest < 0){ tonoProx = 'error'; pieProx = cuando + ' · vencida hace ' + Math.abs(c.diasRest) + ' ' + plural(Math.abs(c.diasRest),'día','días'); }
    else if(c.diasRest === 0){ tonoProx = 'error'; pieProx = cuando + ' · se vence hoy'; }
    else{ tonoProx = c.diasRest <= 7 ? 'alerta' : 'ok'; pieProx = cuando + ' · faltan ' + c.diasRest + ' ' + plural(c.diasRest,'día','días'); }
  }

  const casillas = s.pagos.map((p,idx)=>{
    const cl = p ? 'pagado' : (idx < c.debidas ? 'debido' : '');
    const fecha = fmtFecha(sumarMeses(s.fechaInicio, idx));
    const detalle = 'Mensualidad ' + (idx+1) + ' · ' + fecha + ' · ' + dinero(c.montos[idx])
                  + (idx === 0 && c.extras ? ' (incluye onboarding y viáticos)' : '')
                  + (p ? ' · pagada' : ' · sin pagar');
    /* El mismo molde que las casillas de cobro de una póliza: para quien no
       captura son texto, no botones — se ven igual y dicen lo mismo en el
       globito, pero no invitan a picarlas para que las rechacen. */
    return puedeEditar()
      ? '<button type="button" class="mes ' + cl + '" data-pago="' + esc(s.id) + '" data-idx="' + idx + '" '
        + 'title="' + esc(detalle) + '" aria-label="' + esc(detalle) + '" '
        + 'aria-pressed="' + (p ? 'true' : 'false') + '">' + (idx+1) + '</button>'
      : '<span class="mes ' + cl + '" title="' + esc(detalle) + '" aria-label="' + esc(detalle) + '">' + (idx+1) + '</span>';
  }).join('');

  /* Etiqueta del encargado, asomando por el borde de arriba. Todos la ven;
     solo Owner y Admin la pueden cambiar, así que para los demás no es botón. */
  const enc = s.encargado.nombre;
  const etiquetaEnc = esAdmin()
    ? '<button type="button" class="encargado' + (enc ? '' : ' vacio') + '" data-encargado="' + esc(s.id) + '" '
      + 'title="' + (enc ? esc('A cargo de ' + enc + '. Clic para cambiar.') : 'Asignar un encargado') + '">'
      + ICONO.persona + '<span>' + esc(enc || 'Sin asignar') + '</span></button>'
    : '<div class="encargado' + (enc ? '' : ' vacio') + '" '
      + 'title="' + (enc ? esc('A cargo de ' + enc) : 'Sin encargado asignado') + '">'
      + ICONO.persona + '<span>' + esc(enc || 'Sin asignar') + '</span></div>';

  return '<div class="tarjeta t-' + c.tono + '" style="--d:' + (i*45) + 'ms">'
       +   etiquetaEnc
       +   '<div class="t-cabeza">'
       +     '<div style="flex:1; min-width:0">'
       +       '<div class="t-nombre" style="display:flex; align-items:center; gap:9px">'
       +         '<span class="punto ' + clasePunto + '"></span>' + esc(s.nombre)
       +         '<span class="t-iconos">'
       +           '<button type="button" class="icono-btn' + (s.contactos.length ? '' : ' sin-datos') + '" '
       +             'data-contactos="' + esc(s.id) + '" '
       +             'title="' + (s.contactos.length
                        ? esc('Quién manda la OC: ' + s.contactos.map(x=>x.nombre || x.correo).filter(Boolean).join(', '))
                        : 'Falta registrar quién nos manda la OC') + '" '
       +             'aria-label="Contacto de la OC en ' + esc(s.nombre) + '">' + ICONO.persona + '</button>'
       +           '<button type="button" class="icono-btn" data-plan="' + esc(s.id) + '" '
       +             'title="Ver el plan de pagos mes por mes" aria-label="Plan de pagos de ' + esc(s.nombre) + '">'
       +             '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
       +           '</button>'
       /* El puente de vuelta, solo si este kiosco tiene póliza ligada: de aquí
          se brinca a su mantenimiento y de allá se regresa. */
       +           (datos.polizas.some(q => q.sitioId === s.id)
                    ? '<button type="button" class="icono-btn" data-ir-poliza-sitio="' + esc(s.id) + '" '
                      + 'title="Ver su póliza de mantenimiento" aria-label="Póliza de ' + esc(s.nombre) + '">'
                      + ICONO.credencial + '</button>'
                    : '')
       /* Mismo puente, hacia sus cotizaciones de servicio: se consultan sin
          salir de la ficha del cliente ni tener que buscarlas por folio. */
       +           (datos.cotizaciones.some(q => q.sitioId === s.id)
                    ? '<button type="button" class="icono-btn" data-accion="ver-cotizaciones-sitio" data-sitio-nombre="' + esc(s.nombre) + '" '
                      + 'title="Ver sus cotizaciones de servicio (' + datos.cotizaciones.filter(q => q.sitioId === s.id).length + ')" '
                      + 'aria-label="Cotizaciones de ' + esc(s.nombre) + '">'
                      + ICONO.credencial + '</button>'
                    : '')
       /* Mismo puente, hacia sus reportes: un técnico que reportó una falla en
          este sitio queda a un clic, sin salir de la ficha del cliente. */
       +           (datos.reportes.some(rp => rp.sitioId === s.id)
                    ? '<button type="button" class="icono-btn" data-accion="ver-reportes-sitio" data-sitio-nombre="' + esc(s.nombre) + '" '
                      + 'title="Ver sus reportes (' + datos.reportes.filter(rp => rp.sitioId === s.id).length + ')" '
                      + 'aria-label="Reportes de ' + esc(s.nombre) + '">'
                      + ICONO.reporte + '</button>'
                    : '')
       +         '</span>'
       +       '</div>'
       +       '<div class="t-sub">'
       +         (s.zona ? '<span class="chip-zona z-' + esc(s.color) + '">' + esc(s.zona) + '</span>' : '')
       +         numero(s.modulos) + ' Forpass'
       +         (c.activo ? plural(s.modulos,' activo',' activos') : ' · ' + ETIQUETA_ESTADO[s.estado] + (c.vigente ? '' : ' · vigencia terminada'))
       +         ' · ' + ETIQUETA_TIPO[s.tipo] + '</div>'
       +     '</div>'
       +     '<span class="insignia ' + claseIns + '">' + esc(c.estatus) + '</span>'
       +   '</div>'

       +   '<div class="t-datos">'
       +     '<div class="t-dato"><div class="d-label">Siguiente pago</div><div class="d-valor ' + tonoProx + '">' + esc(txtProx) + '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">' + esc(pieProx) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Mensualidad</div><div class="d-valor">' + dinero(s.mensualidad) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Inicio</div><div class="d-valor chico">' + fmtFecha(s.fechaInicio) + '</div></div>'
       +     '<div class="t-dato"><div class="d-label">Vigencia</div><div class="d-valor chico">' + fmtFecha(c.fin)
       +       '</div><div class="d-label" style="text-transform:none; letter-spacing:0; font-weight:500; margin-top:2px">'
       +       (c.vigente ? 'Faltan ' + c.diasVigencia + ' ' + plural(c.diasVigencia,'día','días') : 'Terminó hace ' + Math.abs(c.diasVigencia) + ' ' + plural(Math.abs(c.diasVigencia),'día','días'))
       +       '</div></div>'
       +   '</div>'

       +   '<div class="progreso">'
       +     '<div class="p-cabeza"><span>Mensualidades pagadas</span><span>' + c.pagados + ' de ' + s.meses
       +       (c.atrasadas ? ' · <b style="color:#a5322e">' + c.atrasadas + ' vencida' + (c.atrasadas===1?'':'s') + '</b>' : '') + '</span></div>'
       +     '<div class="meses">' + casillas + '</div>'
       +   '</div>'

       +   (s.notas ? '<div class="t-nota">' + esc(s.notas) + '</div>' : '')
       +   chipsPersonalizados('sitios', s)

       +   '<div class="t-pie">'
       +     (c.proximo && puedeEditar() ? '<button type="button" class="btn btn-verde btn-mini" data-marcar="' + esc(s.id) + '">' + ICONO.cheque + 'Marcar pagada</button>' : '')
       +     '<span class="espacio"></span>'
       +     (puedeEditar()
              ? '<button type="button" class="btn btn-suave btn-mini" data-editar-sitio="' + esc(s.id) + '">' + ICONO.lapiz + 'Editar</button>'
              : '')
       /* Mismo criterio que el cliente: borrar un sitio se lleva su historial de
          pagos y sus OC, y eso no se deshace. */
       +     (esAdmin()
              ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-sitio="' + esc(s.id) + '" title="Eliminar sitio">' + ICONO.basura + '</button>'
              : '')
       +   '</div>'
       + '</div>';
}

/* ------------------------------ Vista: pólizas ------------------------------
   Pinta RESÚMENES y nada más. Las partidas se ven solo en el detalle: cuarenta
   pólizas de setenta y nueve renglones serían ~3,000 renglones de HTML en CADA
   render(), y render() corre completo también en el refresco de 30 s.
   --------------------------------------------------------------------------- */

/* Suma de un conjunto de pólizas, para los indicadores de arriba. Gemelo de
   resumir(), pero aparte: una póliza no tiene módulos ni mensualidad. */
function resumirPolizas(lista){
  const r = { total:lista.length, activas:0, valorActivo:0, enLaCalle:0, montoEnLaCalle:0,
              esperaLarga:0, tocanEsteMes:0, atrasados:0, cobroAtrasado:0, porVencer:0, borradores:0 };
  lista.forEach(p=>{
    const c = calcularPoliza(p);
    if(c.activa){
      r.activas++; r.valorActivo += c.precioAnual;
      r.tocanEsteMes += c.tocanEsteMes; r.atrasados += c.atrasados;
      if(c.cobrosAtrasados) r.cobroAtrasado++;
      if(c.diasVigencia >= 0 && c.diasVigencia <= 45) r.porVencer++;
    }
    if(p.estatus === 'enviada'){
      r.enLaCalle++; r.montoEnLaCalle += c.precioAnual;
      /* Más de tres semanas sin respuesta: eso es lo accionable, no el conteo. */
      if(c.diasEsperando !== null && c.diasEsperando > 21) r.esperaLarga++;
    }
    if(p.estatus === 'cotizacion') r.borradores++;
  });
  return r;
}

/* Nombre presentable de una póliza: el sitio manda porque es lo que se imprime. */
function tituloPoliza(p){
  const cli = clientePorId(p.clienteId);
  const sitio = p.sitioNombre || p.folio || 'Póliza';
  if(!cli) return sitio;
  /* La misma regla que el documento impreso: si el sitio ya trae el nombre del
     cliente adentro —«Prolec» / «Prolec Planta 1»— repetirlo es ruido. En la
     agenda se veía triple: «Prolec Planta 1 · Prolec · Prolec». Buscar por el
     nombre del cliente sigue funcionando: si el título lo omite es porque el
     sitio ya empieza con él. */
  if(llaveTexto(sitio).startsWith(llaveTexto(cli.nombre))) return sitio;
  return sitio + ' · ' + cli.nombre;
}

/* Misma lista de pólizas, en tabla: cada <tr> lleva el mismo data-poliza que
   ya usan las tarjetas para abrir el detalle. */
function tablaPolizas(lista){
  return '<div class="rodillo"><table class="tabla" style="min-width:900px"><thead><tr>'
       +   '<th>Sitio</th><th>Cliente</th><th>Folio</th><th>Estado</th><th>Cargo a</th>'
       +   '<th>Precio anual</th><th>Servicios</th>'
       + '</tr></thead><tbody>'
       + lista.map(p=>{
           const c = calcularPoliza(p);
           const cli = clientePorId(p.clienteId);
           return '<tr class="fila-clic" data-poliza="' + esc(p.id) + '" tabindex="0" role="button">'
                +   '<td>' + esc(p.sitioNombre || p.folio || 'Póliza') + '</td>'
                +   '<td>' + esc(cli ? cli.nombre : 'Sin cliente ligado') + '</td>'
                +   '<td>' + esc(p.folio || '—') + '</td>'
                +   '<td><span class="insignia i-' + c.tono + '"><span class="punto p-' + c.tono + '"></span>' + esc(c.estado) + '</span></td>'
                +   '<td>' + (p.cargoA === 'interno'
                       ? '<span class="insignia i-alerta">Interno' + (p.cargoAInterno ? ' · ' + esc(p.cargoAInterno) : '') + '</span>'
                       : '<span class="pista">Cliente</span>') + '</td>'
                +   '<td>' + dineroCent(c.precioAnual) + '</td>'
                +   '<td>' + c.hechos + ' de ' + c.programados + '</td>'
                + '</tr>';
         }).join('')
       + '</tbody></table></div>';
}

function vistaPolizas(){
  const r = resumirPolizas(datos.polizas);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Pólizas de mantenimiento</h2>'
     +   '<p>' + numero(r.total) + ' ' + plural(r.total,'póliza','pólizas')
     +   ' · ' + numero(r.activas) + ' ' + plural(r.activas,'activa','activas') + '</p>'
     + '</div><div class="acciones">'
     /* Mientras no haya pólizas, el único botón es el del estado vacío: dos
        "Nueva cotización" en la misma pantalla es preguntar lo mismo dos veces. */
     +   (datos.polizas.some(p => p.estatus === 'activa')
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="ver-agenda" '
            + 'title="Qué mantenimientos tocan, en todas las pólizas">' + ICONO.calendario + 'Agenda</button>'
          : '')
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="ver-precios">' + ICONO.credencial + 'Lista de precios</button>'
     /* Las cotizaciones viejas ya existen en JSON: se cargan, no se recapturan. */
     +   (puedeEditar()
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="importar-polizas" '
            + 'title="Cargar una cotización ya extraída de su PDF">' + ICONO.subir + 'Importar JSON</button>'
          : '')
     +   (puedeEditar()
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="importar-poliza-excel" '
            + 'title="Cargar el Excel de la póliza (hoja BASE con sus equipos y meses de servicio)">' + ICONO.excel + 'Importar desde Excel</button>'
          : '')
     +   (datos.polizas.length && puedeEditar()
          ? '<button type="button" class="btn btn-primario" data-accion="nueva-poliza">' + ICONO.mas + 'Nueva cotización</button>'
          : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Pólizas activas', numero(r.activas), dineroCent(r.valorActivo) + ' al año', r.activas ? 'k-ok' : '')
     + tarjetaKpi('En espera de confirmar', numero(r.enLaCalle),
         r.enLaCalle ? dineroCent(r.montoEnLaCalle) + ' esperando respuesta' : 'Nada enviado sin contestar',
         r.esperaLarga ? 'k-alerta' : '')
     /* Se ofrecen para abrir SOLO cuando hay algo que ver: un «Ver cuáles» con cero
        adentro decepciona, y es la misma regla que siguen los de cobranza. */
     + tarjetaKpi('Servicios este mes', numero(r.tocanEsteMes), 'Mantenimientos que tocan y siguen sin hacerse',
         r.tocanEsteMes ? 'k-alerta' : '', r.tocanEsteMes ? 'ver-agenda-pendiente' : '')
     + tarjetaKpi('Servicios atrasados', numero(r.atrasados), 'Meses ya cumplidos sin registrar',
         r.atrasados ? 'k-error' : '', r.atrasados ? 'ver-agenda-pendiente' : '')
     + '</div>';

  h += avisoLocal();

  if(!datos.polizas.length){
    h += vistaVacia('edificio', 'Todavía no hay pólizas',
          'Cotiza una póliza de mantenimiento: agrega los equipos con su cantidad, precio y cuántos servicios al año lleva cada uno.',
          'nueva-poliza', 'Nueva cotización');
    return h;
  }

  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaPoliza" placeholder="Buscar por sitio, cliente o folio…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroPoliza">'
     +     '<option value="todos">Todas</option>'
     +     '<option value="activas">Solo activas</option>'
     +     '<option value="calle">Solo en la calle</option>'
     +     '<option value="pendientes">Con servicios pendientes</option>'
     +   '</select>'
     +   controlAlternaVista('vistaPolizas')
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.polizas.filter(p=>{
    if(q && !tituloPoliza(p).toLowerCase().includes(q) && !p.folio.toLowerCase().includes(q)) return false;
    const c = calcularPoliza(p);
    if(estado.filtro === 'activas' && !c.activa) return false;
    if(estado.filtro === 'calle' && p.estatus !== 'enviada') return false;
    if(estado.filtro === 'pendientes' && !(c.tocanEsteMes || c.atrasados)) return false;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ninguna póliza coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  if(estado.vistaPolizas === 'tabla') return h + tablaPolizas(lista);

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + lista.map((p,i)=>{
    const c = calcularPoliza(p);
    const cli = clientePorId(p.clienteId);

    /* La insignia principal es el estado. Cuando hay una cuenta detrás, el número
       va DENTRO de ella: "Servicios atrasados" seguido de "8 servicios atrasados"
       es decir dos veces lo mismo, y ocupa el doble. */
    let principal = c.estado;
    if(c.estado === 'Servicios atrasados') principal = c.atrasados + ' ' + plural(c.atrasados,'servicio atrasado','servicios atrasados');
    else if(c.estado === 'Toca este mes')  principal = c.tocanEsteMes + ' ' + plural(c.tocanEsteMes,'servicio este mes','servicios este mes');

    let chips = '<span class="insignia i-' + c.tono + '">'
              + '<span class="punto p-' + c.tono + '"></span>' + esc(principal) + '</span>';

    /* Las secundarias solo agregan lo que la principal NO alcanzó a decir: el
       semáforo se queda con un motivo y los demás se perderían. */
    if(p.estatus === 'enviada' && c.diasEsperando !== null){
      chips += '<span class="insignia ' + (c.diasEsperando > 21 ? 'i-alerta' : 'i-info') + '">'
             + c.diasEsperando + ' ' + plural(c.diasEsperando,'día','días') + ' esperando</span>';
    }
    if(c.activa && c.cobrosAtrasados && c.estado !== 'Cobro atrasado') chips += '<span class="insignia i-error">Cobro atrasado</span>';
    if(c.activa && c.tocanEsteMes && c.estado !== 'Toca este mes') chips += '<span class="insignia i-alerta">' + c.tocanEsteMes + ' este mes</span>';
    if(c.huerfanos) chips += '<span class="insignia i-info">' + c.huerfanos + ' fuera de calendario</span>';
    /* Una cotización que no cuadra no se puede cerrar; si ya se mandó, peor. */
    if(!c.cerrable && (p.estatus === 'cotizacion' || p.estatus === 'enviada')) chips += '<span class="insignia i-alerta">Renglones sin cuadrar</span>';
    /* Que salte a la vista en la lista, no solo adentro del detalle: esta
       póliza no cuenta como ingreso en Resultados porque la pagamos
       nosotros. Sin chip aquí, un vistazo a la lista no lo dice. */
    if(p.cargoA === 'interno') chips += '<span class="insignia i-alerta">Interno' + (p.cargoAInterno ? ' · ' + esc(p.cargoAInterno) : '') + '</span>';

    return '<div class="tarjeta tarjeta-clic t-' + c.tono + '" data-poliza="' + esc(p.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     (cli
                 ? (puedeEditar()
                     /* El avatar es el atajo a la foto: es donde el ojo la busca. */
                     ? '<button type="button" class="avatar-btn" data-editar-cliente="' + esc(cli.id) + '" '
                       + 'data-tip="' + (cli.logo ? 'Cambiar logo' : 'Subir logo') + '">' + avatarCliente(cli) + '</button>'
                     : avatarCliente(cli))
                 : '<div class="t-avatar">' + esc(iniciales(p.sitioNombre)) + '</div>')
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(p.sitioNombre || p.folio || 'Póliza') + '</div>'
         +       '<div class="t-sub">' + esc(cli ? cli.nombre : 'Sin cliente ligado')
         +         (p.folio ? ' · ' + esc(p.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         /* Al centavo, como el detalle: la tarjeta decía $737,135 y adentro
            $737,134.80 — dos números para la misma póliza. */
         +     '<div class="t-dato"><div class="d-label">Precio anual</div><div class="d-valor">' + dineroCent(c.precioAnual) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Servicios</div><div class="d-valor">' + c.hechos + ' de ' + c.programados + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie">'
         +     '<button type="button" class="btn btn-suave btn-mini" data-ver-poliza="' + esc(p.id) + '">Ver detalle →</button>'
         +     '<button type="button" class="btn btn-suave btn-mini" data-calendario="' + esc(p.id) + '" '
         +       'title="Qué equipos se atienden cada mes">' + ICONO.calendario + '</button>'
         +     '<span class="espacio"></span>'
         /* Editar y borrar SOLO con permiso. Al Viewer no se le enseñan botones
            que el servidor le va a negar: la interfaz debe decir la verdad de lo
            que puede hacer, no ofrecerle callejones sin salida. Ver el detalle,
            el calendario y el documento sí los tiene: son lectura. */
         +     (puedeEditar()
                ? '<button type="button" class="btn btn-suave btn-mini" data-editar-poliza="' + esc(p.id) + '" title="Editar póliza">' + ICONO.lapiz + '</button>'
                : '')
         /* Borrar es de Admin SIEMPRE: la regla del servidor niega todo delete
            de pólizas a quien no lo es, sin importar el estatus. El botón se le
            ofrecía a un Analyst, la póliza desaparecía de su pantalla, y el 403
            la resucitaba al recargar. */
         +     (esAdmin()
                ? '<button type="button" class="btn btn-peligro btn-mini" data-borrar-poliza="' + esc(p.id) + '" title="Eliminar póliza">' + ICONO.basura + '</button>'
                : '')
         +   '</div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* ------------------------- Cotizaciones de servicio ------------------------- */
function botonRegresarCotizaciones(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-cotizaciones">'
       + ICONO.atras + 'Regresar a cotizaciones</button></div>';
}

/* La misma lista que las tarjetas, pero en tabla: cabe mucha más información
   por pantalla y se puede escanear de arriba a abajo. Es el mismo `data-cotizacion`
   en cada <tr> que ya usan las tarjetas, así que abre el detalle igual, con
   clic o con teclado — el delegado de eventos no distingue de dónde viene. */
function tablaCotizaciones(lista){
  return '<div class="rodillo"><table class="tabla" style="min-width:900px"><thead><tr>'
       +   '<th>Sitio</th><th>Cliente</th><th>Folio</th><th>Tipo</th><th>Estatus</th>'
       +   '<th>Fecha</th><th>Al cliente</th><th>Costo</th>'
       + '</tr></thead><tbody>'
       + lista.map(cot=>{
           const c = calcularCotizacion(cot);
           const s = sitioPorId(cot.sitioId), cli = clientePorId(cot.clienteId);
           const vencidaAbierta = c.vencida && cotizacionAbierta(cot);
           const { tonoInsignia } = tonoCotizacion(cot);
           return '<tr class="fila-clic" data-cotizacion="' + esc(cot.id) + '" tabindex="0" role="button">'
                +   '<td>' + esc(s ? s.nombre : 'Sin sitio') + '</td>'
                +   '<td>' + esc(cli ? cli.nombre : '—') + '</td>'
                +   '<td>' + esc(cot.folio || '—') + '</td>'
                +   '<td>' + esc(cot.tipoMtto || 'Sin tipo') + '</td>'
                +   '<td><span class="insignia i-' + tonoInsignia + '">' + esc(ETIQUETA_ESTATUS_COTIZACION[cot.estatus]) + '</span>'
                +     (vencidaAbierta ? ' <span class="insignia i-error">Vencida</span>' : '') + '</td>'
                +   '<td>' + fmtFecha(cot.fecha) + '</td>'
                +   '<td>' + dineroCent(c.totalCliente) + '</td>'
                +   '<td>' + dineroCent(c.totalCosto) + '</td>'
                + '</tr>';
         }).join('')
       + '</tbody></table></div>';
}

function resumirCotizaciones(lista){
  const r = { total:lista.length, montoCliente:0, borradores:0, vencidas:0 };
  lista.forEach(q=>{
    const c = calcularCotizacion(q);
    if(!ESTATUS_COTIZACION_PERDIDA.includes(q.estatus)) r.montoCliente += c.totalCliente;
    if(q.estatus === 'borrador') r.borradores++;
    if(c.vencida && cotizacionAbierta(q)) r.vencidas++;
  });
  return r;
}

/* Por encima de esto, ya no se listan las tarjetas/tabla de golpe en la vista
   "Todas" sin buscar — con las 13 etapas del tablero fusionadas aquí, una
   sola importación puede traer miles de cotizaciones, y pintarlas todas cada
   render() sería carísimo para nada (casi nunca se quieren ver TODAS a la
   vez). Se resume por etapa en su lugar; entrar a una etapa sí lista normal,
   porque ya es un subconjunto chico. */
const UMBRAL_COTIZACIONES_RESUMEN = 200;

function toneEtapaCotizacion(estatus){
  if(ETAPAS_TABLERO_COTIZACION.includes(estatus)){
    const t = TONO_ETAPA_TABLERO_COTIZACION[estatus];
    return t === 'info' ? 'neutro' : t;
  }
  if(estatus === 'borrador') return 'alerta';
  if(estatus === 'enviada') return 'alerta';
  if(estatus === 'aprobada') return 'ok';
  return 'neutro';
}
function bloqueResumenEtapaCotizacion(estatus, itemsEtapa){
  const totalEtapa = itemsEtapa.reduce((s,cot)=> s + calcularCotizacion(cot).totalCliente, 0);
  return '<button type="button" class="agenda-bloque a-' + toneEtapaCotizacion(estatus) + '" '
       +   'style="width:100%; text-align:left; cursor:pointer; border:none; display:block" '
       +   'data-accion="filtrar-cotizaciones-etapa" data-etapa="' + estatus + '">'
       +   '<div class="agenda-cabeza"><h3>' + esc(ETIQUETA_ESTATUS_COTIZACION[estatus]) + ' <span class="agenda-cuenta">' + numero(itemsEtapa.length) + '</span></h3>'
       +   '<p class="pista">' + dineroCent(totalEtapa) + ' cotizado</p></div>'
       + '</button>';
}

/* Actividad comercial por persona (campo `realizo`): quien cotiza y da
   seguimiento generó valor aunque el cliente no haya tenido presupuesto para
   aprobarlo — es un indicador de actividad, distinto del ingreso real. */
function resumenCotizacionesPorPersona(lista){
  const porPersona = new Map();
  lista.forEach(cot=>{
    const clave = cot.realizo || 'Sin asignar';
    if(!porPersona.has(clave)) porPersona.set(clave, []);
    porPersona.get(clave).push(cot);
  });
  return Array.from(porPersona.entries()).map(([persona, items])=>{
    const cotizado = items.reduce((s,cot)=> s + calcularCotizacion(cot).totalCliente, 0);
    const ganadas = items.filter(cot => ESTATUS_COTIZACION_INGRESO.includes(cot.estatus));
    const perdidas = items.filter(cot => ESTATUS_COTIZACION_PERDIDA.includes(cot.estatus));
    const ingreso = ganadas.reduce((s,cot)=> s + calcularCotizacion(cot).totalCliente, 0);
    const resueltas = ganadas.length + perdidas.length;
    return { persona, num: items.length, cotizado, ingreso, tasaConversion: resueltas ? ganadas.length / resueltas : null };
  }).sort((a,b)=> b.cotizado - a.cotizado);
}

function vistaCotizaciones(){
  const r = resumirCotizaciones(datos.cotizaciones);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Cotizaciones de servicio</h2>'
     +   '<p>' + numero(r.total) + ' ' + plural(r.total,'cotización','cotizaciones')
     +   ' · ' + dineroCent(r.montoCliente) + ' cotizado al cliente</p>'
     + '</div><div class="acciones">'
     +   (puedeEditar()
          ? '<button type="button" class="btn btn-suave" data-accion="importar-cotizaciones-excel" '
            + 'title="Sube el Excel exportado del tablero (Monday.com) con las 13 etapas">' + ICONO.excel + 'Importar desde Excel</button>'
            + '<button type="button" class="btn btn-primario" data-accion="nueva-cotizacion">' + ICONO.mas + 'Nueva cotización</button>'
          : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Cotizaciones', numero(r.total), plural(r.total,'trabajo cotizado','trabajos cotizados'))
     + tarjetaKpi('Cotizado al cliente', dineroCent(r.montoCliente), 'Sin contar rechazadas, canceladas ni expiradas')
     + tarjetaKpi('Borradores', numero(r.borradores), 'Todavía sin enviar', r.borradores ? 'k-alerta' : '')
     + tarjetaKpi('Vencidas', numero(r.vencidas), 'Pasó su vigencia sin resolver', r.vencidas ? 'k-error' : '')
     + '</div>';

  /* Ya no exige un sitio de antemano: el modal de la cotización lo da de
     alta en línea si hace falta (mismo remedio que "Cliente nuevo" en
     modalPoliza), así que este estado vacío ya no es un callejón sin salida. */
  if(!datos.cotizaciones.length){
    h += vistaVacia('credencial', 'Todavía no hay cotizaciones',
          'Cotiza un trabajo: si el cliente y el sitio no existen aún, se dan de alta ahí mismo. Agrega los conceptos con su costo y ve lo que le corresponde cobrar al cliente.',
          puedeEditar() ? 'nueva-cotizacion' : '', 'Nueva cotización');
    return h;
  }

  const porPersona = resumenCotizacionesPorPersona(datos.cotizaciones);
  if(porPersona.length > 1){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Por persona</h3>'
       +   '<p>Actividad comercial: quien cotiza y da seguimiento, gane o no el trabajo.</p></div></div>'
       +   '<div class="rodillo"><table class="tabla"><thead><tr><th>Persona</th><th>Cotizaciones</th><th>Cotizado</th><th>Ingreso</th><th>Conversión</th></tr></thead><tbody>'
       +   porPersona.map(x => '<tr>'
             + '<td>' + esc(x.persona) + '</td>'
             + '<td>' + numero(x.num) + '</td>'
             + '<td>' + dineroCent(x.cotizado) + '</td>'
             + '<td>' + dineroCent(x.ingreso) + '</td>'
             + '<td>' + (x.tasaConversion === null ? '—' : Math.round(x.tasaConversion*100) + '%') + '</td>'
             + '</tr>').join('')
       + '</tbody></table></div></div>';
  }

  const vistaTabla = estado.vistaCotizaciones === 'tabla';
  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaCotizacion" placeholder="Buscar por folio, sitio o cliente…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroCotizacion">'
     +     '<option value="todos">Todas</option>'
     +     ESTATUS_COTIZACION.map(e=>'<option value="' + e + '">' + esc(ETIQUETA_ESTATUS_COTIZACION[e]) + '</option>').join('')
     +     '<option value="vencidas">Vencidas</option>'
     +   '</select>'
     +   controlAlternaVista('vistaCotizaciones')
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.cotizaciones.filter(cot=>{
    const s = sitioPorId(cot.sitioId), cli = clientePorId(cot.clienteId);
    if(q && !((cot.folio||'').toLowerCase().includes(q)
           || (s && s.nombre.toLowerCase().includes(q))
           || (cli && cli.nombre.toLowerCase().includes(q)))) return false;
    if(estado.filtro === 'vencidas') return calcularCotizacion(cot).vencida;
    if(estado.filtro !== 'todos') return cot.estatus === estado.filtro;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ninguna cotización coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  if(estado.filtro === 'todos' && !q && lista.length > UMBRAL_COTIZACIONES_RESUMEN){
    h += '<p class="pista" style="margin:0 0 12px">Se agrupan por etapa para no cargar ' + numero(lista.length) + ' tarjetas de golpe — entra a una etapa para ver el detalle.</p>';
    const porEtapa = {};
    lista.forEach(cot => { (porEtapa[cot.estatus] = porEtapa[cot.estatus] || []).push(cot); });
    h += ESTATUS_COTIZACION.filter(e => porEtapa[e] && porEtapa[e].length).map(e => bloqueResumenEtapaCotizacion(e, porEtapa[e])).join('');
    return h;
  }

  const ordenadas = lista.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha) || b.folio.localeCompare(a.folio));

  if(vistaTabla) return h + tablaCotizaciones(ordenadas);

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenadas.map((cot,i)=>{
    const c = calcularCotizacion(cot);
    const s = sitioPorId(cot.sitioId), cli = clientePorId(cot.clienteId);
    const vencidaAbierta = c.vencida && cotizacionAbierta(cot);
    const { tono, tonoInsignia } = tonoCotizacion(cot);

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-cotizacion="' + esc(cot.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     (cli ? avatarCliente(cli) : '<div class="t-avatar">' + esc(iniciales(s ? s.nombre : cot.folio)) + '</div>')
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(s ? s.nombre : 'Sin sitio') + '</div>'
         +       '<div class="t-sub">' + esc(cli ? cli.nombre : '—') + (cot.folio ? ' · ' + esc(cot.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">'
         +     '<span class="insignia i-' + tonoInsignia + '">' + esc(ETIQUETA_ESTATUS_COTIZACION[cot.estatus]) + '</span>'
         +     (vencidaAbierta ? '<span class="insignia i-error">Vencida</span>' : '')
         +   '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Al cliente</div><div class="d-valor">' + dineroCent(c.totalCliente) + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Costo</div><div class="d-valor chico">' + dineroCent(c.totalCosto) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie"><span class="pista">' + esc(cot.tipoMtto || 'Sin tipo') + ' · ' + fmtFecha(cot.fecha) + '</span></div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* Detalle de una cotización, con el alternador Costo interno / Cotización
   cliente: son las dos caras del MISMO documento, calculadas siempre por
   calcularCotizacion() — nunca dos tablas guardadas por separado. */
function vistaCotizacion(){
  const cot = cotizacionPorId(estado.cotizacionId);
  if(!cot){ estado.vista = 'cotizaciones'; return vistaCotizaciones(); }
  const c = calcularCotizacion(cot);
  const s = sitioPorId(cot.sitioId);
  const cli = clientePorId(cot.clienteId);
  const lado = estado.ladoCotizacion === 'cliente' ? 'cliente' : 'costo';

  let h = botonRegresarCotizaciones();

  /* Si esta cotización nació de un reporte, la liga hacia atrás: se abre
     directo en su detalle, sin tener que ir a buscarlo por folio. */
  const reporteOrigen = cot.reporteOrigenId ? reportePorId(cot.reporteOrigenId) : null;
  if(reporteOrigen){
    h += '<div class="aviso" style="margin-bottom:14px">' + ICONO.reporte
       + '<div>Esta cotización viene del reporte <b>' + esc(reporteOrigen.folio || 'sin folio') + '</b>.'
       + ' <button type="button" class="btn btn-suave btn-mini" data-reporte="' + esc(reporteOrigen.id) + '" style="margin-left:8px">Ver reporte →</button></div></div>';
  }

  /* Mismo criterio que arriba, pero cuando nace de una refacción pedida al
     registrar un servicio de póliza: la liga trae también el equipo y el mes
     exactos, no solo la póliza. */
  const polizaOrigen = cot.polizaOrigenId ? polizaPorId(cot.polizaOrigenId) : null;
  if(polizaOrigen){
    const xOrigen = polizaOrigen.partidas.find(q => q.id === cot.polizaOrigenPartidaId);
    h += '<div class="aviso" style="margin-bottom:14px">' + ICONO.calendario
       + '<div>Esta cotización es una refacción pedida en la póliza <b>' + esc(polizaOrigen.sitioNombre || polizaOrigen.folio || 'sin nombre') + '</b>'
       + (xOrigen ? ', equipo <b>' + esc(xOrigen.concepto) + '</b>' : '')
       + (Number.isInteger(cot.polizaOrigenMes) ? ' · ' + esc(etiquetaMesServicio(polizaOrigen.fechaInicio, cot.polizaOrigenMes)) : '') + '.'
       + ' <button type="button" class="btn btn-suave btn-mini" data-ver-poliza="' + esc(polizaOrigen.id) + '" style="margin-left:8px">Ver póliza →</button></div></div>';
  }

  /* Mismo criterio otra vez, cuando nace de un hallazgo de un levantamiento
     de sitio. */
  const levantamientoOrigen = cot.levantamientoOrigenId ? levantamientoPorId(cot.levantamientoOrigenId) : null;
  if(levantamientoOrigen){
    const idsOrigen = cot.levantamientoOrigenHallazgoIds || [];
    const hzsOrigen = levantamientoOrigen.hallazgos.filter(x => idsOrigen.includes(x.id));
    const descHz = hzsOrigen.length === 1
      ? ' · ' + esc(hzsOrigen[0].ubicacion || hzsOrigen[0].equipoNombre || 'hallazgo')
      : (hzsOrigen.length > 1 ? ' · ' + hzsOrigen.length + ' hallazgos (' + hzsOrigen.map(x => esc(x.ubicacion || x.equipoNombre || 'hallazgo')).join(', ') + ')' : '');
    h += '<div class="aviso" style="margin-bottom:14px">' + ICONO.reporte
       + '<div>Esta cotización viene de ' + (hzsOrigen.length === 1 ? 'un hallazgo' : hzsOrigen.length + ' hallazgos')
       + ' del levantamiento <b>' + esc(levantamientoOrigen.folio || 'sin folio') + '</b>'
       + descHz + ' en '
       + esc(levantamientoOrigen.sitioNombre || 'sin sitio') + '.'
       + ' <button type="button" class="btn btn-suave btn-mini" data-levantamiento="' + esc(levantamientoOrigen.id) + '" style="margin-left:8px">Ver levantamiento →</button></div></div>';
  }

  h += '<div class="titulo-zona"><div>'
     +   '<h2>' + esc(s ? s.nombre : 'Sin sitio') + '</h2>'
     +   '<p>' + esc(cli ? cli.nombre : 'Sin cliente') + (cot.folio ? ' · ' + esc(cot.folio) : '')
     +     ' · <b>' + esc(ETIQUETA_ESTATUS_COTIZACION[cot.estatus]) + '</b>'
     +     (c.vencida && cotizacionAbierta(cot) ? ' · <b style="color:var(--error)">Vencida</b>' : '')
     +   '</p>'
     + '</div><div class="acciones">'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="vista-previa-cotizacion" '
     +     'title="Ver el documento del lado que estás viendo, sin salir del tablero">' + ICONO.credencial + 'Vista previa</button>'
     +   '<button type="button" class="btn btn-suave btn-mini" data-accion="imprimir-cotizacion" '
     +     'title="Abre el documento imprimible en una pestaña nueva">' + ICONO.imprimir + 'Imprimir</button>'
     +   (puedeEditar()
          ? '<button type="button" class="btn btn-suave btn-mini" data-accion="editar-cotizacion">' + ICONO.lapiz + 'Editar</button>'
          : '')
     +   (esAdmin()
          ? '<button type="button" class="btn btn-peligro btn-mini" data-accion="borrar-cotizacion" title="Eliminar cotización">' + ICONO.basura + '</button>'
          : '')
     + '</div></div>';

  h += '<div class="bloque"><div class="rodillo" style="overflow:visible"><div class="resumen-datos">'
     +   '<div><div class="d-label">Tipo de mantenimiento</div><div class="d-valor chico">' + esc(cot.tipoMtto || '—') + '</div></div>'
     +   '<div><div class="d-label">Cargo a</div><div class="d-valor chico">' + (cot.cargoA === 'comedor' ? 'Comedor' : 'Cliente') + '</div></div>'
     +   '<div><div class="d-label">Solicitud</div><div class="d-valor chico">' + esc(cot.solicitud) + '</div></div>'
     +   '<div><div class="d-label">Fecha</div><div class="d-valor chico">' + fmtFecha(cot.fecha) + '</div></div>'
     +   '<div><div class="d-label">Vigencia</div><div class="d-valor chico">' + cot.vigenciaDias + ' días · vence ' + fmtFecha(c.fechaVence) + '</div></div>'
     +   '<div><div class="d-label">Realizó</div><div class="d-valor chico">' + esc(cot.realizo || '—') + '</div></div>'
     +   '<div><div class="d-label">No. de reporte</div><div class="d-valor chico">' + esc(cot.noReporte || 'NA') + '</div></div>'
     +   '<div><div class="d-label">Orden de compra</div><div class="d-valor chico">' + esc(cot.ordenCompra) + '</div></div>'
     +   '<div><div class="d-label">Tipo de pago</div><div class="d-valor chico">' + esc(cot.tipoPago) + '</div></div>'
     + '</div></div></div>';

  /* Solo si trae algo del pipeline de 13 etapas — una cotización de toda la
     vida nunca llena estos campos y no hace falta enseñarle un bloque vacío. */
  if(cot.proveedor || cot.fechaLiberacion || cot.fechaProgramadaInicio || cot.fechaProgramadaFin || cot.fechaRealizado){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Datos del tablero</h3></div></div>'
       +   '<div class="resumen-datos">'
       +     (cot.proveedor ? '<div><div class="d-label">Proveedor</div><div class="d-valor chico">' + esc(cot.proveedor) + '</div></div>' : '')
       +     '<div><div class="d-label">Liberación</div><div class="d-valor chico">' + (cot.fechaLiberacion ? fmtFecha(cot.fechaLiberacion) : 'Sin definir') + '</div></div>'
       +     '<div><div class="d-label">Programada — inicio</div><div class="d-valor chico">' + (cot.fechaProgramadaInicio ? fmtFecha(cot.fechaProgramadaInicio) : 'Sin definir') + '</div></div>'
       +     '<div><div class="d-label">Programada — fin</div><div class="d-valor chico">' + (cot.fechaProgramadaFin ? fmtFecha(cot.fechaProgramadaFin) : 'Sin definir') + '</div></div>'
       +     '<div><div class="d-label">Realizado</div><div class="d-valor chico">' + (cot.fechaRealizado ? fmtFecha(cot.fechaRealizado) : 'Sin definir') + '</div></div>'
       +   '</div></div>';
  }

  h += '<div class="lado-cotizacion" role="tablist" aria-label="Lado de la cotización" style="display:flex; gap:8px; margin:16px 0">'
     +   '<button type="button" class="btn ' + (lado==='costo' ? 'btn-primario' : 'btn-suave') + ' btn-mini" data-lado-cotizacion="costo" '
     +     'aria-selected="' + (lado==='costo') + '">Costo interno</button>'
     +   '<button type="button" class="btn ' + (lado==='cliente' ? 'btn-primario' : 'btn-suave') + ' btn-mini" data-lado-cotizacion="cliente" '
     +     'aria-selected="' + (lado==='cliente') + '">Cotización cliente</button>'
     + '</div>';

  const filas = c.filas;
  h += '<div class="bloque"><div class="rodillo"><table class="tabla">'
     + '<thead><tr><th></th><th>Concepto</th><th>Cant.</th><th>U.M.</th><th>Precio</th><th>Importe</th></tr></thead><tbody>'
     + (filas.length ? filas.map(x=>{
         const precio = lado === 'costo' ? x.precioCosto : x.precioCliente;
         const importe = lado === 'costo' ? x.importeCosto : x.importeCliente;
         return '<tr>' + (x.seccion ? '<td colspan="6" style="font-weight:700; background:var(--bg)">' + esc(x.seccion) + '</td></tr><tr>' : '')
           + '<td class="pista">' + esc(x.numPart) + '</td>'
           + '<td>' + esc(x.concepto) + '</td>'
           + '<td>' + numero(x.cantidad) + '</td>'
           + '<td>' + esc(x.um || '—') + '</td>'
           + '<td>' + dineroCent(precio) + '</td>'
           + '<td>' + dineroCent(importe) + '</td>'
           + '</tr>';
       }).join('') : '<tr><td colspan="6"><span class="pista">Todavía no hay conceptos capturados.</span></td></tr>')
     + (c.incluyeInstalacion
         ? '<tr><td class="pista">' + esc(c.instalacionNumPart) + '</td><td>Instalación / mano de obra</td><td>—</td><td>SERV</td>'
           + '<td>' + dineroCent(lado === 'costo' ? c.instalacionCosto : c.instalacionCliente) + '</td>'
           + '<td>' + dineroCent(lado === 'costo' ? c.instalacionCosto : c.instalacionCliente) + '</td></tr>'
         : '')
     + '</tbody></table></div>'
     + '<div class="resumen-datos" style="max-width:280px; margin-left:auto; margin-top:12px">'
     +   '<div><div class="d-label">Subtotal</div><div class="d-valor">' + dineroCent(lado==='costo' ? c.subtotalCosto : c.subtotalCliente) + '</div></div>'
     +   '<div><div class="d-label">IVA 16%</div><div class="d-valor">' + dineroCent(lado==='costo' ? c.ivaCosto : c.ivaCliente) + '</div></div>'
     +   '<div><div class="d-label">Total</div><div class="d-valor" style="font-size:19px">' + dineroCent(lado==='costo' ? c.totalCosto : c.totalCliente) + '</div></div>'
     + '</div>'
     + '</div>';

  /* Solo del lado "Costo interno": es el respaldo de lo que cuesta, no algo
     que deba verse en el documento para el cliente. */
  if(lado === 'costo'){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Respaldo de costo</h3>'
       +   '<p>La cotización del proveedor externo que sustenta el costo interno de arriba.</p></div>'
       +   (puedeEditar()
            ? '<div class="acciones"><button type="button" class="btn btn-suave btn-mini" data-accion="subir-respaldo-costo">' + ICONO.mas + 'Agregar respaldo</button></div>'
            : '')
       + '</div>'
       +   (cot.respaldosCosto.length
            ? '<div class="galeria-evidencia">' + cot.respaldosCosto.map(r=>
                '<div class="evidencia-foto' + (r.tipo === 'pdf' ? ' respaldo-pdf' : '') + '">'
                + (r.tipo === 'pdf'
                    ? '<a href="' + esc(r.dataUrl) + '" target="_blank" rel="noopener" title="' + esc(r.nombre) + '">' + ICONO.documento + '<span>' + esc(r.nombre) + '</span></a>'
                    : '<a href="' + esc(r.dataUrl) + '" target="_blank" rel="noopener"><img src="' + esc(r.dataUrl) + '" alt="' + esc(r.nombre) + '" loading="lazy"></a>')
                + (puedeEditar()
                    ? '<button type="button" class="evidencia-quitar" data-accion="quitar-respaldo-costo" data-respaldo="' + esc(r.id) + '" title="Quitar">' + ICONO.basura + '</button>'
                    : '')
                + '</div>'
              ).join('') + '</div>'
            : '<p class="pista" style="margin:0">Todavía no hay respaldo cargado.</p>')
       +   (puedeEditar() ? '<input type="file" id="archivoRespaldoCosto" accept="image/*,application/pdf" style="display:none">' : '')
       + '</div>';
  }

  h += '<div class="bloque"><div class="pista" style="white-space:pre-wrap">' + esc(cot.tiempoEntrega) + (cot.notas ? '\n' + cot.notas : '') + '</div></div>';

  return h;
}

/* ------------------------------- Reportes (tickets) ------------------------------- */
function botonRegresarReportes(){
  return '<div style="margin-bottom:14px">'
       + '<button type="button" class="btn btn-suave btn-mini" data-accion="ir-reportes">'
       + ICONO.atras + 'Regresar a reportes</button></div>';
}

function resumirReportes(lista){
  const r = { total:lista.length, abiertos:0, enAtencion:0, urgentes:0, resueltos:0 };
  lista.forEach(rp=>{
    if(rp.estatus === 'abierto') r.abiertos++;
    if(rp.estatus === 'asignado' || rp.estatus === 'en_proceso') r.enAtencion++;
    if(rp.prioridad === 'urgente' && !['resuelto','cerrado','cancelado'].includes(rp.estatus)) r.urgentes++;
    if(rp.estatus === 'resuelto' || rp.estatus === 'cerrado') r.resueltos++;
  });
  return r;
}

function vistaReportes(){
  const r = resumirReportes(datos.reportes);
  let h = '';

  h += '<div class="titulo-zona"><div>'
     +   '<h2>Reportes</h2>'
     +   '<p>' + numero(r.total) + ' ' + plural(r.total,'reporte','reportes') + '</p>'
     + '</div><div class="acciones">'
     +   (puedeReportar()
          ? '<button type="button" class="btn btn-primario" data-accion="nuevo-reporte">' + ICONO.mas + 'Nuevo reporte</button>'
          : '')
     + '</div></div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Abiertos', numero(r.abiertos), 'Todavía sin técnico', r.abiertos ? 'k-error' : '')
     + tarjetaKpi('En atención', numero(r.enAtencion), 'Asignados o en proceso', r.enAtencion ? 'k-alerta' : '')
     + tarjetaKpi('Urgentes', numero(r.urgentes), 'Prioridad urgente sin resolver', r.urgentes ? 'k-error' : '')
     + tarjetaKpi('Resueltos', numero(r.resueltos), 'Ya atendidos', r.resueltos ? 'k-ok' : '')
     + '</div>';

  if(!datos.reportes.length){
    h += vistaVacia('reporte', 'Todavía no hay reportes',
          'Cualquiera del equipo puede levantar uno: el sitio, el equipo y una foto de evidencia bastan para arrancar.',
          puedeReportar() ? 'nuevo-reporte' : '', 'Nuevo reporte');
    return h;
  }

  const vistaTabla = estado.vistaReportes === 'tabla';
  h += '<div class="barra-busca">'
     +   '<input type="search" id="buscaReporte" placeholder="Buscar por folio, sitio, cliente o técnico…" value="' + esc(estado.busca) + '">'
     +   '<select id="filtroReporte">'
     +     '<option value="todos">Todos</option>'
     +     ESTATUS_REPORTE.map(e=>'<option value="' + e + '">' + esc(ETIQUETA_ESTATUS_REPORTE[e]) + '</option>').join('')
     +     '<option value="urgentes">Solo urgentes</option>'
     +   '</select>'
     +   controlAlternaVista('vistaReportes')
     + '</div>';

  const q = estado.busca.trim().toLowerCase();
  const lista = datos.reportes.filter(rp=>{
    if(q){
      const enTecnicos = rp.tecnicos.some(t => t.nombre.toLowerCase().includes(q));
      if(!(rp.folio||'').toLowerCase().includes(q) && !(rp.sitioNombre||'').toLowerCase().includes(q)
         && !enTecnicos){
        const cli = clientePorId(rp.clienteId);
        if(!(cli && cli.nombre.toLowerCase().includes(q))) return false;
      }
    }
    if(estado.filtro === 'urgentes') return rp.prioridad === 'urgente' && !['resuelto','cerrado','cancelado'].includes(rp.estatus);
    if(estado.filtro !== 'todos') return rp.estatus === estado.filtro;
    return true;
  });

  if(!lista.length){
    h += '<div class="vacio"><h3>Sin resultados</h3><p>Ningún reporte coincide con la búsqueda o el filtro.</p></div>';
    return h;
  }

  const ordenados = lista.slice().sort((a,b)=> b.fechaCreacion.localeCompare(a.fechaCreacion) || b.folio.localeCompare(a.folio));

  if(vistaTabla) return h + tablaReportes(ordenados);

  h += '<div class="grid' + (animarTarjetas ? '' : ' sin-entrada') + '">' + ordenados.map((rp,i)=>{
    const cli = clientePorId(rp.clienteId);
    const tono = tonoReporte(rp);
    let chips = '<span class="insignia i-' + tono + '"><span class="punto p-' + tono + '"></span>' + esc(ETIQUETA_ESTATUS_REPORTE[rp.estatus]) + '</span>';
    if(rp.prioridad === 'urgente' || rp.prioridad === 'alta'){
      chips += '<span class="insignia i-' + TONO_PRIORIDAD[rp.prioridad] + '">' + esc(ETIQUETA_PRIORIDAD[rp.prioridad]) + '</span>';
    }
    if(rp.evidencias.length) chips += '<span class="insignia i-info">' + rp.evidencias.length + ' ' + plural(rp.evidencias.length,'foto','fotos') + '</span>';

    return '<div class="tarjeta tarjeta-clic t-' + tono + '" data-reporte="' + esc(rp.id) + '" style="--d:' + (i*45) + 'ms" tabindex="0" role="button">'
         +   '<div class="t-cabeza">'
         +     (cli ? avatarCliente(cli) : '<div class="t-avatar">' + esc(iniciales(rp.sitioNombre || rp.folio)) + '</div>')
         +     '<div style="flex:1; min-width:0">'
         +       '<div class="t-nombre">' + esc(rp.sitioNombre || 'Sin sitio') + '</div>'
         +       '<div class="t-sub">' + esc(rp.titulo || rp.equipoNombre || 'Reporte') + (rp.folio ? ' · ' + esc(rp.folio) : '') + '</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="t-chips">' + chips + '</div>'
         +   '<div class="t-datos">'
         +     '<div class="t-dato"><div class="d-label">Técnico(s)</div><div class="d-valor chico">' + (rp.tecnicos.length ? esc(rp.tecnicos.map(t=>t.nombre).join(', ')) : 'Sin asignar') + '</div></div>'
         +     '<div class="t-dato"><div class="d-label">Prioridad</div><div class="d-valor">' + esc(ETIQUETA_PRIORIDAD[rp.prioridad]) + '</div></div>'
         +   '</div>'
         +   '<div class="t-pie"><span class="pista">' + fmtFecha(rp.fechaCreacion) + '</span></div>'
         + '</div>';
  }).join('') + '</div>';

  return h;
}

/* Misma lista, en tabla. */
function tablaReportes(lista){
  return '<div class="rodillo"><table class="tabla" style="min-width:860px"><thead><tr>'
       +   '<th>Folio</th><th>Sitio</th><th>Cliente</th><th>Equipo</th><th>Prioridad</th><th>Estatus</th><th>Técnico(s)</th><th>Fecha</th>'
       + '</tr></thead><tbody>'
       + lista.map(rp=>{
           const cli = clientePorId(rp.clienteId);
           const tono = tonoReporte(rp);
           return '<tr class="fila-clic" data-reporte="' + esc(rp.id) + '" tabindex="0" role="button">'
                +   '<td>' + esc(rp.folio || '—') + '</td>'
                +   '<td>' + esc(rp.sitioNombre || 'Sin sitio') + '</td>'
                +   '<td>' + esc(cli ? cli.nombre : '—') + '</td>'
                +   '<td>' + esc(rp.equipoNombre || '—') + '</td>'
                +   '<td><span class="insignia i-' + TONO_PRIORIDAD[rp.prioridad] + '">' + esc(ETIQUETA_PRIORIDAD[rp.prioridad]) + '</span></td>'
                +   '<td><span class="insignia i-' + tono + '"><span class="punto p-' + tono + '"></span>' + esc(ETIQUETA_ESTATUS_REPORTE[rp.estatus]) + '</span></td>'
                +   '<td>' + (rp.tecnicos.length ? esc(rp.tecnicos.map(t=>t.nombre).join(', ')) : '—') + '</td>'
                +   '<td>' + fmtFecha(rp.fechaCreacion) + '</td>'
                + '</tr>';
         }).join('')
       + '</tbody></table></div>';
}

/* Detalle de un reporte. */
function vistaReporte(){
  const rp = reportePorId(estado.reporteId);
  if(!rp){ estado.vista = 'reportes'; return vistaReportes(); }
  const cli = clientePorId(rp.clienteId);
  const tono = tonoReporte(rp);
  const cotizacionLigada = rp.cotizacionId ? cotizacionPorId(rp.cotizacionId) : null;
  const abierto = !['cerrado','cancelado'].includes(rp.estatus);

  let h = botonRegresarReportes();

  h += '<div class="titulo-zona"><div>'
     +   '<h2>' + esc(rp.titulo || rp.equipoNombre || 'Reporte') + '</h2>'
     +   '<p>' + esc(rp.folio || 'Sin folio') + ' · ' + esc(cli ? cli.nombre : 'Sin cliente') + '</p>'
     + '</div></div>';

  h += '<div class="t-chips" style="margin:-6px 0 16px">'
     +   '<span class="insignia i-' + tono + '"><span class="punto p-' + tono + '"></span>' + esc(ETIQUETA_ESTATUS_REPORTE[rp.estatus]) + '</span>'
     +   '<span class="insignia i-' + TONO_PRIORIDAD[rp.prioridad] + '">Prioridad ' + esc(ETIQUETA_PRIORIDAD[rp.prioridad]).toLowerCase() + '</span>'
     + '</div>';

  h += '<div class="kpis">'
     + tarjetaKpi('Sitio', esc(rp.sitioNombre || 'Sin sitio'), cli ? esc(cli.nombre) : '')
     + tarjetaKpi('Equipo', esc(rp.equipoNombre || 'Sin especificar'), '')
     + tarjetaKpi('Reportó', esc(rp.reportadoPor.nombre || 'Alguien del equipo'), fmtFecha(rp.fechaCreacion))
     + tarjetaKpi('Evidencia', numero(rp.evidencias.length), plural(rp.evidencias.length,'foto','fotos'))
     + '</div>';

  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Descripción</h3></div></div>'
     +   '<p class="pista" style="white-space:pre-wrap; margin:0">' + esc(rp.descripcion || 'Sin descripción.') + '</p>'
     + '</div>';

  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Técnicos asignados</h3>'
     +   '<p>' + (rp.tecnicos.length ? numero(rp.tecnicos.length) + ' ' + plural(rp.tecnicos.length,'persona','personas') + ' a cargo' : 'Todavía sin asignar') + '</p></div>'
     +   (puedeGestionarReporte()
          ? '<div class="acciones"><button type="button" class="btn btn-suave btn-mini" data-accion="asignar-tecnicos">' + ICONO.persona + 'Asignar</button></div>'
          : '')
     + '</div>'
     +   (rp.tecnicos.length
          ? '<div class="t-chips">' + rp.tecnicos.map(t=>'<span class="insignia i-info">' + esc(t.nombre) + '</span>').join('') + '</div>'
          : '<p class="pista" style="margin:0">Nadie asignado todavía.</p>')
     + '</div>';

  h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Evidencia</h3><p>Fotos del problema, tomadas desde el celular.</p></div>'
     +   (puedeGestionarReporte()
          ? '<div class="acciones"><button type="button" class="btn btn-suave btn-mini" data-accion="subir-evidencia">' + ICONO.camara + 'Agregar foto</button></div>'
          : '')
     + '</div>'
     +   (rp.evidencias.length
          ? '<div class="galeria-evidencia">' + rp.evidencias.map(e=>
              '<div class="evidencia-foto">'
              +   '<img src="' + esc(e.dataUrl) + '" alt="Evidencia" loading="lazy">'
              +   (puedeGestionarReporte()
                   ? '<button type="button" class="evidencia-quitar" data-accion="quitar-evidencia" data-evidencia="' + esc(e.id) + '" title="Quitar esta foto">' + ICONO.basura + '</button>'
                   : '')
              + '</div>'
            ).join('') + '</div>'
          : '<p class="pista" style="margin:0">Todavía no hay fotos.</p>')
     +   '<input type="file" id="archivoEvidencia" accept="image/*" capture="environment" multiple style="display:none">'
     + '</div>';

  /* Solo aparece una vez que existe: antes de resolverlo no hay nada que
     mostrar, y es justo lo que exige modalResolverReporte() para dejarlo
     avanzar. */
  if(rp.reporteAtencion){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Reporte de atención</h3>'
       +   '<p>Lo que encontró y lo que hizo el técnico para resolverlo.</p></div></div>'
       +   '<p class="pista" style="white-space:pre-wrap; margin:0; color:var(--ink)">' + esc(rp.reporteAtencion) + '</p>'
       + '</div>';
  }

  /* Un técnico o reportero no ve el módulo Cotizaciones (ver
     modulosPermitidos()): mostrarle este bloque sería un botón muerto que
     lo regresa a Reportes en cuanto le da clic, así que directo no se
     dibuja para esos roles. */
  if(modulosPermitidos().includes('cotizaciones')){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Cotización relacionada</h3></div></div>'
       +   (cotizacionLigada
            ? '<button type="button" class="btn btn-suave btn-mini" data-cotizacion="' + esc(cotizacionLigada.id) + '">'
              + ICONO.credencial + 'Ver cotización ' + esc(cotizacionLigada.folio || '') + ' →</button>'
            : (puedeEditar() && abierto
                ? '<button type="button" class="btn btn-suave btn-mini" data-accion="generar-cotizacion-reporte">'
                  + ICONO.mas + 'Generar cotización desde este reporte</button>'
                : '<p class="pista" style="margin:0">Este reporte no tiene ninguna cotización ligada.</p>'))
       + '</div>';
  }

  if(rp.seguimiento.length){
    h += '<div class="bloque"><div class="bloque-cabeza"><div><h3>Seguimiento</h3></div></div>'
       +   '<div class="lista-seguimiento">' + rp.seguimiento.slice().reverse().map(s=>
             '<div class="seguimiento-item"><b>' + esc(s.quien || 'Alguien del equipo') + '</b> '
             + '<span class="pista">' + esc(fechaHora(s.cuando)) + '</span><div>' + esc(s.texto) + '</div></div>'
           ).join('') + '</div>'
       + '</div>';
  }

  h += '<div class="acciones" style="flex-wrap:wrap; margin-top:8px">';
  /* Un reportero levanta el ticket y de ahí en fuera solo lo ve: ni edita, ni
     mueve su estatus. Eso lo deciden técnico o administración (ver
     puedeGestionarReporte()). */
  if(puedeGestionarReporte()) h += '<button type="button" class="btn btn-suave btn-mini" data-accion="editar-reporte">' + ICONO.lapiz + 'Editar</button>';
  if(puedeGestionarReporte()){
    if(rp.estatus === 'abierto' || rp.estatus === 'asignado'){
      h += '<button type="button" class="btn btn-suave btn-mini" data-accion="cambiar-estatus-reporte" data-estatus="en_proceso">Marcar en proceso</button>';
    }
    if(rp.estatus === 'asignado' || rp.estatus === 'en_proceso'){
      h += '<button type="button" class="btn btn-primario btn-mini" data-accion="resolver-reporte">' + ICONO.cheque + 'Marcar resuelto</button>';
    }
    if(rp.estatus === 'resuelto'){
      h += '<button type="button" class="btn btn-suave btn-mini" data-accion="cambiar-estatus-reporte" data-estatus="en_proceso">Reabrir</button>'
         + '<button type="button" class="btn btn-primario btn-mini" data-accion="cambiar-estatus-reporte" data-estatus="cerrado">Cerrar reporte</button>';
    }
    if(abierto){
      h += '<button type="button" class="btn btn-suave btn-mini" data-accion="cambiar-estatus-reporte" data-estatus="cancelado">Cancelar</button>';
    }
    /* Cerrado y cancelado también se pueden reabrir ("se puede reabrir
       después si hace falta", como avisa el propio diálogo de cancelar):
       vuelve a 'asignado' si ya tenía técnicos, o a 'abierto' si no. */
    if(!abierto){
      const destinoReabrir = rp.tecnicos.length ? 'asignado' : 'abierto';
      h += '<button type="button" class="btn btn-suave btn-mini" data-accion="cambiar-estatus-reporte" data-estatus="' + destinoReabrir + '">' + ICONO.atras + 'Reabrir</button>';
    }
  }
  h += '<span class="espacio"></span>';
  if(esAdmin()) h += '<button type="button" class="btn btn-peligro btn-mini" data-accion="borrar-reporte">' + ICONO.basura + 'Eliminar</button>';
  h += '</div>';

  return h;
}

/* ---------------------------- Modal: reporte ---------------------------- */
function modalReporte(id){
  const rp = id ? reportePorId(id) : null;
  if(!datos.clientes.length){
    aviso('Primero da de alta un cliente: el reporte cuelga de un sitio suyo.', true);
    return;
  }

  let evidenciasTmp = rp ? rp.evidencias.slice() : [];
  const clientesOrd = datos.clientes.slice().sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
  const cat = catalogo().slice().sort((a,b)=> a.concepto.localeCompare(b.concepto,'es'));

  const opc = (lista, sel, texto, valor) => lista.map(o =>
    '<option value="' + esc(valor(o)) + '"' + (valor(o) === sel ? ' selected' : '') + '>' + esc(texto(o)) + '</option>').join('');

  const equipoEsDelCatalogo = rp && rp.equipoCatalogoId;
  const cuerpo =
      '<div class="campo"><label>Cliente *</label>'
    +   '<div class="cliente-zona">'
